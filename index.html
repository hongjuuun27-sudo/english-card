/* 지금 문장을 그림(문장이 바뀔 때) */
function pcRenderUnit() {
  const U = PC.ui, u = PC.u, it = u.it;
  const line = U.line.cloneNode(false);              // 새 문장이 들어오는 애니메이션을 다시 보이게
  U.line.replaceWith(line);
  U.line = line;
  line.append(U.steps, U.who, U.en, U.gloss, U.ko, U.tips);
  practiceEl.style.setProperty("--h", hueOf(CARDS[it.ci].category));
  U.who.textContent = it.kind === "dlg" ? it.name : it.kind === "ex" ? "예문 " + it.n : "썰";
  U.who.classList.toggle("me", it.who === "me");
  U.en.innerHTML = pcSentenceHtml(u);
  U.en.classList.toggle("long", u.display.length > 60);
  U.gloss.innerHTML = u.glosses.map(g => '<span><b lang="en">' + esc(g.en) + '</b> ' + esc(g.ko) + '</span>').join("");
  U.ko.textContent = u.ko;
  U.tips.innerHTML = u.tips.length ? '<div class="pc-tips-h">발음 팁</div>' +
    u.tips.map(t => '<div class="pc-tip"><b lang="en">' + esc(t.target || "") + '</b>' + esc(t.ko || "") + '</div>').join("") : "";
  const n = u.chunks.length, steps = pcSteps(u);
  U.steps.hidden = steps < 2;
  U.steps.innerHTML = steps < 2 ? "" : u.chunks.map((c, i) => '<button class="pc-st" type="button" data-pc-step="' + i + '" tabindex="-1">' + (i + 1) + '</button>').join("") +
    '<button class="pc-st" type="button" data-pc-step="' + n + '" tabindex="-1">이어서</button>';
  U.scroll.scrollTop = 0;
}
/* 위치·강조·안내·버튼 (재생 상태가 바뀔 때마다) */
function pcPaint() {
  const U = PC.ui, u = PC.u;
  if (!PC.open || PC.screen !== "play" || !U || !u) return;
  const steps = pcSteps(u), chunkMode = steps > 1, link = PC.step === steps - 1, n = u.chunks.length;
  const s = PC.rd.state(), playing = s.active && !s.paused;
  const L = pcLabels(PC.idx);
  U.loc1.textContent = L[0];
  U.lab.textContent = L[1];
  U.stp.textContent = !chunkMode ? "" : link ? "· 이어서 말하기" : "· 청크 " + (PC.step + 1) + "/" + n;
  U.en.classList.toggle("chunking", chunkMode && !link);
  U.en.querySelectorAll(".ck").forEach(c => c.classList.toggle("on", chunkMode && !link && +c.dataset.ck === PC.step));
  U.steps.querySelectorAll(".pc-st").forEach(b => {
    const i = +b.dataset.pcStep;
    b.classList.toggle("now", i === PC.step);
    b.classList.toggle("done", i < PC.step);
  });
  U.note.textContent = PC.done ? "끝까지 다 했어요! 수고했어요" :
    playing ? "듣는 중…" : s.active ? "멈췄어요 · '한 번 더 듣기'로 다시 들어요" :
    !link ? "따라 말해 보세요" : chunkMode ? "이제 한 번에 이어서 말해 보세요" : "들은 대로 따라 말해 보세요";
  U.note.classList.toggle("go", !s.active);
  const last = PC.idx >= PC.pl.items.length - 1 && link;
  const main = PC.done ? ICON_RESTART + "<span>처음부터</span>" : last ? "<span>마치기</span>" : NEXT_HTML;
  const r = PC.opts.rate === 1 ? "1.0" : String(PC.opts.rate);
  const b = (act, html, cls, dis, label) => '<button class="btn ' + cls + '" type="button" data-pc="' + act + '"' +
    (label ? ' aria-label="' + label + '"' : "") + (dis ? " disabled" : "") + '>' + html + '</button>';
  const html = b("prev", "이전", "prev", PC.idx === 0 && PC.step === 0) +
    b("again", "한 번 더 듣기", "again") +
    b("rate", r + "x", "rate", false, "재생 속도 " + r + "배, 누르면 바뀜") +
    b("next", main, "main");
  if (U.actions._h !== html) { U.actions.innerHTML = html; U.actions._h = html; }   // 그대로면 다시 그리지 않음(누르는 중인 버튼이 바뀌지 않게)
}

/* ---- 조작 ---- */
/* 문장 k의 단계 step으로 가서 바로 재생(0~청크 n-1 = 청크, 마지막 = 문장 전체) */
function pcGo(k, step) {
  const pl = PC.pl;
  if (!pl || !pl.items[k]) return;
  if (k !== PC.idx || !PC.u) { PC.idx = k; PC.u = pcUnit(pl.items[k]); pcRenderUnit(); }
  PC.step = Math.max(0, Math.min(step || 0, pcSteps(PC.u) - 1));
  PC.done = false;
  pcSavePos();
  pcPaint();
  PC.rd.play(PC.step, 0, true);
}
function pcNext() {
  if (PC.done) { pcGo(0, 0); return; }
  const cur = PC.pl.items[PC.idx];
  if (pcIsLink() && cur && cur.kind === "dlg" && cur.n === cur.total) markCardDone(cur.ci);   // 연습: 그 카드 마지막 대사까지 이어서 말함
  if (!pcIsLink()) pcGo(PC.idx, PC.step + 1);
  else if (PC.idx < PC.pl.items.length - 1) pcGo(PC.idx + 1, 0);
  else {                                              // 마지막 문장까지 다 함 → 다음엔 처음부터
    PC.rd.stop();
    PC.done = true;
    if (!PC.quick) { PC.pos = null; savePractice(); }
    pcPaint();
  }
}
/* 이전: 앞 청크 → (첫 단계면) 앞 문장의 연결 단계 */
function pcPrev() {
  if (PC.step > 0 && !PC.done) pcGo(PC.idx, PC.step - 1);
  else if (PC.done) pcGo(PC.idx, pcSteps(PC.u) - 1);
  else if (PC.idx > 0) pcGo(PC.idx - 1, pcSteps(pcUnit(PC.pl.items[PC.idx - 1])) - 1);
}
/* 단어 탭: 청크 단계면 그 단어가 있는 청크로 가서 재생, 연결 단계면 그 단어부터 문장 끝까지 */
function pcTapWord(k) {
  const u = PC.u;
  if (!u) return;
  if (pcIsLink() && !PC.done) { PC.rd.seek(PC.step, k); return; }
  const c = u.chunks.findIndex(x => k >= x.d0 && k <= x.d1);
  pcGo(PC.idx, pcSteps(u) > 1 && c >= 0 ? c : 0);
}

/* ---- 열기 · 화면 바꾸기 · 닫기 ---- */
/* 공통: 전체 화면을 띄움(뒤의 앱·시트는 inert). origin이 있으면 닫을 때 그곳으로 돌아가 상태를 되살림 */
function pcShow(origin) {
  Player.stop();
  buzz();
  PC.open = true;
  PC.origin = origin || null;
  PC.curCi = activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : CARDS.length - 1;   // '끝' 화면이면 마지막 카드
  practiceEl.hidden = false;
  document.querySelector(".app").inert = true;
  sheet.inert = true;
  scrim.inert = true;
  document.body.classList.add("practicing");
  PC.openId = Date.now();
  try { history.pushState({ practice: PC.openId }, ""); } catch (e) {}
}
/* 시작 화면부터(끝 화면의 [연습]) */
function openPractice() {
  if (PC.open) return;
  pcShow(null);
  PC.quick = false;
  pcScreen("setup");
}
/* 바로 연습: 시작 화면 없이 run 범위로(내용·연습 방식·속도는 마지막으로 고른 값). PC.opts는 바꾸지 않음 */
function pcQuick(run, pick) {
  PC.quick = true;
  PC.pl = buildPractice(Object.assign({}, PC.opts, run), PC.curCi);
  pcScreen("play");
  PC.idx = -1;
  PC.done = false;
  pcGo(Math.max(0, PC.pl.items.findIndex(pick)), 0);
}
/* 상황 카드에서 보던 줄(모든 모드 같음) = 가장 최근에 한 일의 줄 st.focus:
   재생한 줄(스피커·단어 탭·이어 듣기 중 지나간 줄 — cardReader onItem) 또는 나타나거나 옮긴 줄(읽기 [다음]·쉐도잉 [다음]/[이전]) 중 더 나중 것.
   예) 5줄까지 나온 뒤 2줄을 다시 들었으면 2줄, 2줄을 들은 뒤 [다음]으로 6줄이 나왔으면 6줄. 아직 아무것도 안 했으면 첫 줄 */
function cardLineNow(card) {
  const st = card._st;
  return st && st.focus >= 0 ? st.focus : 0;
}
/* 카드 [연습]: 이 카드를 보던 줄부터. 카드 상태(card._st·대화 표시)는 그대로 두고, 닫을 때 멈춘 상태로 되살림 */
function practiceCard(card) {
  if (PC.open || !card._st) return;
  const st = card._st, rs = st.rd.state(), li = cardLineNow(card);
  const cont = st.mode === "listen" || isMid(st);
  const hold = cont && rs.active && !rs.single ? rs.index : st.hold;   // 이어 재생 중이었으면 돌아와서 그 줄부터 '이어 듣기'
  pcShow({ kind: "card", card, st, hold: cont ? hold : -1, scroll: card.querySelector(".body").scrollTop });
  PC.curCi = +card.dataset.i;
  pcQuick({ scope: "current" }, it => it.kind === "dlg" && it.n === li + 1);
}
/* "이 표현 연습하기"(표현 상세 = 바텀시트): 그 표현의 예문 5개 → 썰 */
function practiceExpr(id) {
  if (PC.open || !EXPR_BY_ID[id]) return;
  if (!buildPractice({ scope: "expr", xid: id }, 0).items.length) { toast("연습할 문장이 없어요"); return; }
  pcShow({ kind: "sheet", scroll: sheetBody.scrollTop });
  pcQuick({ scope: "expr", xid: id }, () => true);
}
/* 닫을 때: 연 곳의 상태를 멈춘 채로 되살림(소리는 다시 틀지 않음) */
function pcRestore(o) {
  if (o.kind === "sheet") { if (sheetOpen) sheetBody.scrollTop = o.scroll; return; }
  const card = o.card, st = card._st;
  if (st !== o.st) return;                            // 그사이 카드가 처음 상태로 바뀌었으면 그대로
  st.hold = o.hold;
  if (st.hold >= 0 && st.mode === "listen") setCur(card, st.hold);
  if (st.hold >= 0 && isMid(st)) {
    card.classList.add("sh-live");
    rowsOf(card).forEach((r, j) => { r.classList.toggle("cur", j === st.hold); r.classList.toggle("past", j < st.hold); });
  }
  renderActions(card);
  card.querySelector(".body").scrollTop = o.scroll;
}
function pcScreen(name) {
  PC.screen = name;
  pcSetupEl.hidden = name !== "setup";
  pcPlayEl.hidden = name !== "play";
  if (name === "setup") {
    PC.rd.stop();
    PC.ui = null;
    PC.u = null;
    pcPlayEl.innerHTML = "";
    pcRenderSetup();
  } else {
    pcPlayEl.innerHTML = pcPlayHtml();
    const q = s => pcPlayEl.querySelector(s);
    PC.ui = { loc1: q(".dv-loc1"), lab: q(".pc-loc2 .lab"), stp: q(".pc-loc2 .stp"), scroll: q(".pc-scroll"), line: q(".pc-line"),
      steps: q(".pc-steps"), who: q(".pc-who"), en: q(".pc-en"), gloss: q(".pc-gloss"), ko: q(".pc-ko"), tips: q(".pc-tips"),
      note: q(".pc-note"), actions: q(".pc-bottom .actions") };
  }
}
function pcStart(resume) {
  PC.pl = buildPractice(PC.opts, PC.curCi);
  if (!PC.pl.items.length) return;
  PC.quick = false;                                   // 시작 화면에서 시작 = 보통 연습(위치 저장·이어 하기)
  let k = 0, step = 0;
  if (resume) {
    k = Math.max(0, pcResumeIdx(PC.pl));
    if (PC.pos && PC.pl.items[k].key === PC.pos.key) step = PC.pos.step || 0;
  }
  pcScreen("play");
  PC.idx = -1;
  PC.done = false;
  pcGo(k, step);
}
/* 닫으면 소리 멈춤·위치 저장(바로 연습은 저장 안 함) → 바로 연습으로 열었으면 연 곳(카드·시트)으로 돌아가 상태를 되살림,
   아니면 (카드 범위면) 지금 문장의 카드가 상황 탭에 보이게 */
function pcHide() {
  if (!PC.open) return;
  const it = PC.screen === "play" && PC.pl ? PC.pl.items[PC.idx] : null;
  if (it) pcSavePos();
  PC.rd.stop();
  Player.stop();
  PC.open = false;
  pcScreen("setup");
  PC.pl = null;
  PC.quick = false;
  practiceEl.hidden = true;
  document.querySelector(".app").inert = false;
  sheet.inert = false;
  scrim.inert = false;
  document.body.classList.remove("practicing");
  const o = PC.origin;
  PC.origin = null;
  if (o) { pcRestore(o); return; }
  const cur = activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : -1;
  if (it && it.kind === "dlg" && it.ci !== cur) jumpTo(it.ci);
}
function closePractice() {
  let viaHistory = false;
  try { viaHistory = !!(history.state && history.state.practice === PC.openId); } catch (e) {}
  if (viaHistory) history.back(); else pcHide();
}
/* 안드로이드 뒤로 가기 = 연습 모드 닫기 */
window.addEventListener("popstate", () => {
  let st = null;
  try { st = history.state; } catch (e) {}
  if (PC.open && !(st && st.practice === PC.openId)) pcHide();
});
window.addEventListener("pagehide", () => { if (PC.open && PC.screen === "play") pcSavePos(); });

practiceEl.addEventListener("click", e => {
  const t = e.target;
  let el;
  if ((el = t.closest("[data-pc]"))) {
    if (el.disabled) return;
    const a = el.dataset.pc;
    buzz();
    if (a === "close") closePractice();
    else if (a === "setup") { pcSavePos(); pcScreen("setup"); }   // 연습 화면 [옵션] → 시작 화면(범위·내용·이어 하기). 바로 연습이면 위치 저장 안 함
    else if (a === "start" || a === "restart") pcStart(false);
    else if (a === "resume") pcStart(true);
    else if (a === "next") pcNext();
    else if (a === "prev") pcPrev();
    else if (a === "again") pcGo(PC.idx, PC.step);
    else if (a === "rate") { PC.opts.rate = PC.opts.rate === 1 ? 0.8 : 1; savePractice(); Player.setRate(PC.opts.rate); pcPaint(); }
    return;
  }
  if ((el = t.closest("[data-pc-step]"))) { buzz(); pcGo(PC.idx, +el.dataset.pcStep); return; }
  if ((el = t.closest(".pc-en .w"))) { buzz(); pcTapWord(+el.dataset.w); return; }
  /* 시작 화면 옵션: 바꿀 때마다 저장(다음에 그대로 보여 줌) */
  const o = PC.opts;
  if ((el = t.closest("[data-pc-scope]"))) {
    o.scope = el.dataset.pcScope;
    if (o.scope === "cat" && !o.cats.length) o.cats = [CARDS[PC.curCi].category];
  } else if ((el = t.closest("[data-pc-cat]"))) {
    const n = el.dataset.pcCat;
    o.cats = o.cats.includes(n) ? o.cats.filter(x => x !== n) : o.cats.concat([n]);
  } else if ((el = t.closest("[data-pc-cbx]"))) {
    o.content = contentToggle(o.content, +el.dataset.pcCbx);
  } else if ((el = t.closest("[data-pc-set] button"))) {
    const name = el.parentNode.dataset.pcSet, v = el.dataset.v;
    o[name] = name === "rate" ? parseFloat(v) : v;
  } else return;
  buzz();
  savePractice();
  pcRenderSetup();
});

/* ================= 웹앱 설치 (GitHub Pages 같은 https 주소에서만) ================= */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* sw.js가 없으면 설치 기능만 빠지고 앱은 그대로 동작 */ });
  });
}

/* ================= 미리 만들 음성 목록 (.claude/audio-build.ps1·검사 도구가 씀) =================
   고정 콘텐츠 전부: 대사(줄마다 나/상대) · 표현(핵심·추가)마다 표현 읽기(sayPhrase, 나) · 예문 5개(상대) · 썰 전체(나)
   · 연습 모드 soloChunks 청크(따로 만드는 음성) · 글쓰기 질문(드라이브 '내 일기', 상대). 연습 모드의 다른 청크·썰 문장은 문장·썰 음성을 잘라 씀.
   목소리·모델은 기본값(DEFAULTS) — 설정에서 목소리를 바꾸면 id가 달라져 미리 만든 음성 대신 ②~④로 감.
   cards: 카드 id 목록(없으면 전부 + 글쓰기 질문). 항목 { id, text(읽을 글 = speech), voice, who, kind, ref }, 같은 글·목소리는 하나로 */
function audioNeeded(cards) {
  const list = [], seen = new Set(), M = DEFAULTS.model;
  const sp = t => getScript(t).speech;
  const add = (kind, who, text, ref) => {
    if (!text || !String(text).trim()) return;
    const voice = who === "me" ? DEFAULTS.voiceMe : DEFAULTS.voiceThem, k = voice + "|" + text;
    if (seen.has(k)) return;
    seen.add(k);
    list.push({ id: audioId(text, voice, M), text, voice, who, kind, ref });
  };
  const solo = (pl, tag) => pl.items.forEach(it => {
    const u = pcUnit(it);
    if (u && u.chunks) u.chunks.forEach((c, n) => { if (c.solo) add("solo", u.who, sp(u.display.slice(c.s, c.e)), tag(it) + " 청크 " + (n + 1)); });
  });
  CARDS.forEach((card, ci) => {
    if (cards && !cards.includes(card.id)) return;
    const C = "카드 " + card.id;
    (card.dialogue || []).forEach((l, n) => { if (l.en) add("dlg", whoOf(l), sp(l.en), C + " 대사 " + (n + 1)); });
    EXPR_LIST.filter(it => it.ci === ci).forEach(it => {
      const x = it.ex, X = C + " " + x.phrase;
      add("phrase", "me", sayPhrase(x.phrase), X + " 표현 읽기");
      (x.examples || []).forEach((e, n) => { if (e && e.en) add("ex", "them", sp(e.en), X + " 예문 " + (n + 1)); });
      if (x.story && x.story.en) add("story", "me", sp(x.story.en), X + " 썰");
      drillsOf(it.id).forEach((d, n) => add("drill", "me", sp(d.en), X + " 말해 보기 " + (n + 1)));   // data/drills.js(내가 하는 말 — 내 목소리)
    });
    const tag = it => C + (it.kind === "dlg" ? " 대사 " + it.n : " " + it.ex.phrase + (it.kind === "ex" ? " 예문 " + it.n : " 썰 문장 " + it.n));
    const o = { cats: [], content: "story", method: "chunk", rate: 1 };
    solo(buildPractice(Object.assign({ scope: "current" }, o), ci), tag);
    EXPR_LIST.filter(it => it.ci === ci && it.kind !== "core").forEach(it => solo(buildPractice(Object.assign({ scope: "expr", xid: it.id }, o), ci), tag));
  });
  if (!cards) QUESTIONS.forEach((q, n) => { if (q && q.en) add("q", "them", sp(q.en), "글쓰기 질문 " + (n + 1)); });
  return list;
}

/* ================= 자동 점검: 주소 끝에 #check 를 붙여 열면 결과가 뜸 (규칙은 CLAUDE.md) ================= */
function sceneOf(card) {
  return card.scene || (card.category === "일상 대화" ? "free" : "task");   // task: 정해진 용건(10단어), free: 자유 대화(12단어)
}
/* 카드 데이터 검사(규칙 = CLAUDE.md '카드 만들기 — 필수 항목 체크리스트'). 앱의 진짜 함수(밑줄·청크·썰 문장 나누기)로 확인.
   issues = 고쳐야 하는 문제, warnings = 규칙 권장 사항(앱은 동작함). 글 형식: "카드 3 (id 3) 어느 항목: 무엇이 문제".
   파일 단위 검사(JS 문법·index.html/sw.js 등록·카드 파일 위치·기존 id 바뀜)는 .claude/check-cards.html이 이 함수에 더해서 함.
   카드에 새 칸이 생기면 아래 KEYS와 검사, CLAUDE.md 체크리스트를 같이 고칠 것 */
const CHECK_KEYS = {
  card: ["id", "variantOf", "category", "title", "situation", "scene", "hooks", "dialogue", "expressions", "extraExpressions"],
  hook: ["ko", "line"],
  line: ["who", "en", "ko", "chunks", "tips", "soloChunks"],
  expr: ["id", "phrase", "teaser", "forms", "meaning", "ko", "examples", "story"],
  ex: ["en", "ko", "chunks", "tips", "soloChunks"],
  story: ["en", "ko", "sentences"],
  sent: ["chunks", "ko", "tips", "soloChunks"],
  tip: ["target", "ko"]
};
function runChecks() {
  const issues = [], warnings = [];
  const stats = { cards: CARDS.length, expressions: 0, examples: 0, meTurns: 0, questions: QUESTIONS.length, pUnits: 0, pDone: 0 };   // pUnits·pDone: 연습 문장 전체·데이터 있는 것
  const ids = new Set();
  const allExprIds = new Set();
  const titles = {};
  /* 모르는 칸(오타 — 앱이 읽지 않아서 그 데이터가 빠진 것과 같음) */
  const keyCheck = (o, kind, where) => {
    if (!o || typeof o !== "object") return;
    Object.keys(o).forEach(k => { if (!CHECK_KEYS[kind].includes(k)) issues.push(where + ": 모르는 칸 \"" + k + "\" — 오타? (앱이 읽지 않음)"); });
  };
  const sentCount = t => String(t || "").split(/(?<=[.!?]["”]?)\s+(?=[A-Z“"])/).filter(s => s.trim()).length;
  const curly = (t, where) => { if (/’/.test(t || "")) warnings.push(where + ": 둥근 아포스트로피(’) — 곧은 ' 로"); };
  CARDS.forEach((c, i) => {
    const tag = c.id != null ? "카드 " + c.id : "카드 " + (i + 1) + "번째(id 없음)";   // 카드 번호 = id(다른 선택 카드가 끼어들어 화면 순서와 id가 다를 수 있음)
    keyCheck(c, "card", tag);
    if (c.id == null) issues.push(tag + ": id 없음");
    else {
      if (!Number.isInteger(c.id)) issues.push(tag + ": id는 정수여야 함 — " + JSON.stringify(c.id));
      if (ids.has(c.id)) issues.push(tag + ": id 중복");
      ids.add(c.id);
    }
    ["category", "title", "situation"].forEach(k => { if (!c[k]) issues.push(tag + ": " + k + " 없음"); });
    if (c.category && !(c.category in CATEGORY_HUE)) issues.push(tag + ": category \"" + c.category + "\"가 categories.js에 없음 (색·이모지·카테고리 고르기에 안 나옴)");
    if (c.scene != null && c.scene !== "task" && c.scene !== "free") issues.push(tag + ": scene은 \"task\" 또는 \"free\" — " + c.scene);
    /* variantOf: '다른 선택' 카드 → 원래 카드 id. 있는 카드·자기 자신 아님·원래 카드는 다른 선택 카드가 아님·같은 카테고리 */
    if (c.variantOf != null) {
      const o = CARDS.find(x => x.id === c.variantOf);
      if (!Number.isInteger(c.variantOf) || c.variantOf === c.id) issues.push(tag + ": variantOf는 원래 카드의 id(정수, 자기 자신 아님) — " + JSON.stringify(c.variantOf));
      else if (!o) issues.push(tag + ": variantOf " + c.variantOf + " — 그런 카드가 없음");
      else {
        if (o.variantOf != null) issues.push(tag + ": variantOf " + c.variantOf + " — 원래 카드도 다른 선택 카드임(원래 카드는 보통 카드로)");
        if (o.category !== c.category) issues.push(tag + ": 다른 선택 카드는 원래 카드와 같은 카테고리여야 함 — 원래 \"" + o.category + "\"");
      }
    }
    if (c.title) {
      if (titles[c.title]) warnings.push(tag + ": 제목이 카드 " + titles[c.title] + "와 같음 — " + c.title);
      titles[c.title] = i + 1;
    }
    if (c.situation && /[.!?]/.test(c.situation) && String(c.situation).split(/(?<=[.!?])\s+/).filter(Boolean).length > 3) warnings.push(tag + ": 상황 설명이 길어요(1~2문장 권장)");

        if (!/^\s*[(（][^)）]{1,24}[)）]/.test(d.ko)) warnings.push(w + ": ko 앞에 (누구에게)가 없음 — " + d.ko);
        if (/[가-힣]/.test(d.en)) issues.push(w + ": 영어에 한글 — " + d.en);
        if (d.en.trim().split(/\s+/).length > 15) warnings.push(w + ": 15단어 넘음 — " + d.en);
        if (!exprFound(it.ex, d.en)) issues.push(w + ": 표현이 문장에 안 보임(밑줄 찾기 기준) — " + d.en);
        const k = drillNorm(d.en);
        if (seen.has(k)) issues.push(w + ": 같은 표현 안에서 중복 — " + d.en);
        if (exSet.has(k)) issues.push(w + ": 예문과 같은 문장 — " + d.en);
        seen.add(k);
        curly(d.en, w);
      });
    });
  }
  return { stats, issues, warnings };
}

  setTimeout(() => {
    const r = runChecks();
    const s = r.stats;
    showSheet("자동 점검", r.issues.length ? "문제 " + r.issues.length + "개" : "이상 없음",

function showSheet(ctx, title, html, foot) {

  sheetBody.innerHTML = html;

/* 상황 카드의 밑줄·표현 칩 → 표현 상세(학습하기·연습장 포함)로 */
function openExpression(ci, ei, kind) {
  const card = CARDS[ci];
  const list = card && (kind === "extra" ? card.extraExpressions : card.expressions);
  const ex = list && list[ei];
  const id = ex && exprIdOf(card, ex, ei, kind);
  if (!id || !EXPR_BY_ID[id]) return;
  if (!sheetOpen) {
    sheetHold = { token: Player.getToken(), paused: !Player.isPaused() };
    if (sheetHold.paused) Player.pause();
  }
  openExprDetail(id, { fromCard: true });
}

/* 목록 한 줄(번호·제목·본 카드 ✓·지금 카드 강조) — 전체 목록과 카테고리 목록(태그)이 같이 씀 */
function tocItemHtml(i, cur) {
  const seen = seenSet.has(cardKey(i)), isVar = originOf(i) >= 0;   // 다른 선택 카드는 원래 카드 아래 들여쓰기 + '다른 선택' 표시
  const cls = "toc-item" + (seen ? " seen" : "") + (i === cur ? " current" : "");
  return '<li' + (isVar ? ' class="toc-var"' : "") + '><button class="' + cls + '" type="button" data-go="' + i + '"' + (i === cur ? ' aria-current="true"' : "") + '>' +
    '<span class="toc-n">' + (i + 1) + '</span><span class="toc-t">' + (isVar ? '<small class="toc-vtag">다른 선택</small>' : "") + esc(CARDS[i].title) + '</span>' +
    '<span class="toc-check"' + (seen ? ' aria-label="봤음"' : "") + '>' + (seen ? ICON_CHECK : "") + '</span></button></li>';
}
const curIdx = () => (activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : -1);
/* 전체 목록. openCat을 주면 그 카테고리를 펼친 채로(카테고리 목록의 [전체 목록 보기]), 아니면 지금 보던 카드의 카테고리를 펼침 */
function openList(openCat) {
  const cur = curIdx();
  const seenCount = CARDS.filter((c, i) => seenSet.has(cardKey(i))).length;
  const pct = CARDS.length ? Math.round(seenCount / CARDS.length * 100) : 0;
  const groups = [];
  CARDS.forEach((c, i) => {
    let g = groups.find(x => x.name === c.category);
    if (!g) { g = { name: c.category, items: [] }; groups.push(g); }
    g.items.push(i);
  });
  const listHtml = groups.map(g => {
    const seenInGroup = g.items.filter(i => seenSet.has(cardKey(i))).length;
    const open = openCat ? g.name === openCat : g.items.includes(cur);   // 지금 보던 카드의 카테고리만 펼침
    return '<section class="toc-group' + (open ? " open" : "") + '" style="--h:' + hueOf(g.name) + '">' +
      '<button class="toc-head" type="button" data-toc aria-expanded="' + open + '"><span class="toc-emoji" aria-hidden="true">' + (CATEGORY_EMOJI[g.name] || "📌") + '</span>' +
        '<h4 class="toc-cat">' + esc(g.name) + '</h4>' +
        '<span class="toc-cnt">' + seenInGroup + ' / ' + g.items.length + '</span><span class="toc-chev" aria-hidden="true">' + ICON_CHEVRON + '</span></button>' +
      '<ul class="toc">' +
      g.items.map(i => tocItemHtml(i, cur)).join("") + '</ul></section>';
  }).join("");
  const warn = storageOK ? "" :
    '<p class="note">지금 연 방식에서는 기록이 저장되지 않아서, 앱을 다시 열면 처음부터 시작해요.</p>';
  const html =
    '<div class="prog"><div class="prog-text">본 카드 <b>' + seenCount + '</b> / ' + CARDS.length + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' + warn + '</div>' +
    '<div class="btn-row"><button class="btn" type="button" id="goUnseen">안 본 카드로</button>' +
      '<button class="btn" type="button" id="goFirst">처음부터</button></div>' +
    '<div class="toc-bar"><span class="set-label">카테고리</span><button class="toc-all" type="button" data-toc-all></button></div>' +
    listHtml +
    '<div class="set-group"><div class="btn-row"><button class="btn" type="button" id="resetProgress">본 기록 지우기</button></div></div>';
  showSheet("카드 " + CARDS.length + "장", "목록", html);
  syncTocAll();
  const openEl = openCat && sheetBody.querySelector(".toc-group.open");
  const curEl = sheetBody.querySelector(".toc-group.open .toc-item.current");
  if (openEl && !curEl) sheetBody.scrollTop = Math.max(0, openEl.offsetTop - 12);
  else if (curEl) sheetBody.scrollTop = Math.max(0, curEl.offsetTop - sheetBody.clientHeight / 2);
}

          seg("fcEcho", [["0", "끄기"], ["1", "1번"], ["3", "3번"], ["5", "5번"]]) +
          '<p class="note">영어를 들은 뒤 그 문장 길이만큼 따라 말할 시간을 줘요. 3번·5번이면 \'듣기 → 따라 말하기\'를 그만큼 되풀이해요(드라이브 모드의 따라 말할 시간과 같은 방식).</p>' +
        '</div>' +
        '<div class="set-group"><span class="set-label">이어폰·차 버튼으로 넘기기</span>' +
          seg("fcRemote", [["true", "켜기"], ["false", "끄기"]]) +
          '<p class="note">블루투스 이어폰·차·잠금화면 버튼으로 복습해요. ⏭ 다음 = 알았음, ⏮ 이전 = 다시, ▶ 재생 = 카드 뒤집기(뒷면에선 다시 듣기). 잠금화면에 지금 카드 글이 보여요. 버튼이 하나뿐인 이어폰은 뒤집기만 돼요.</p>' +
        '</div>' +
      '</section>' +
      '<section class="st-sec" aria-label="글쓰기"><h3>글쓰기</h3>' +
        voiceField("voiceWrite", "일기(듣기용 본문)를 읽어 줄 목소리") +
        '<p class="note">ElevenLabs 키와 모델은 위 \'음성\' 설정을 따라요.</p>' +
      '</section>' +
      '<section class="st-sec" aria-label="기록"><h3>기록</h3>' +
        '<div class="set-group"><span class="set-label">백업</span>' +
          '<div class="btn-row"><button class="btn" type="button" id="backupAll">전체 기록 복사</button></div>' +
          '<p class="note">지금까지 쓴 모든 글과 첨삭, 표현 학습 기록·연습장을 텍스트로 복사해요. 메모 앱 등에 붙여넣어 보관하세요.</p>' +
        '</div>' +
      '</section>' +
    '</div>';
}
function openSettings(section) {
  if (stOpen) return;
  Player.stop();
  stEl.innerHTML = settingsHtml();
  stEl.hidden = false;
  stOpen = true;
  document.querySelector(".app").inert = true;
  stId = Date.now();
  try { history.pushState({ settings: stId }, ""); } catch (e) {}
  const body = stEl.querySelector(".st-body"), sec = section && stEl.querySelector({ voice: "#stVoice", review: "#stReview" }[section] || "#none");
  body.scrollTop = 0;
  if (sec) body.scrollTop = Math.max(0, sec.getBoundingClientRect().top - body.getBoundingClientRect().top - 8);
}
function stHide() {
  if (!stOpen) return;
  stOpen = false;
  Player.stop();
  if (document.activeElement && stEl.contains(document.activeElement)) document.activeElement.blur();
  stEl.hidden = true;
  stEl.innerHTML = "";
  document.querySelector(".app").inert = RV.open;     // 복습 덱 위에서 열었으면 덱은 그대로(뒤의 앱은 계속 inert)
  if (RV.open) rvRemote(true);                        // 이어폰·차 버튼 켜기/끄기를 바로 반영
  /* 바뀐 설정을 지금 탭에 반영(자동 넘김 줄, 미리 받아두기 안내 등) */
  if (currentTab === "expr") renderTeasers();
  else if (currentTab === "drive") dvRenderSetup();
  else if (currentTab === "today") renderToday();
}
function closeSettings() {
  let viaHistory = false;
  try { viaHistory = !!(history.state && history.state.settings === stId); } catch (e) {}
  if (viaHistory) history.back(); else stHide();
}
window.addEventListener("popstate", () => {
  let st = null;
  try { st = history.state; } catch (e) {}
  if (stOpen && !(st && st.settings === stId)) stHide();
});
document.addEventListener("click", e => {
  const g = e.target.closest("[data-open-settings]");
  if (g) { buzz(); openSettings(); }
});
document.querySelectorAll("[data-open-settings]").forEach(b => { if (!b.innerHTML.trim()) b.innerHTML = ICON_SLIDERS; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && stOpen) closeSettings(); });
stEl.addEventListener("click", e => {
  const t = e.target;
  let el;
  if (t.closest("[data-st-close]")) { buzz(); closeSettings(); return; }
  if ((el = t.closest(".seg button"))) {
    const name = el.parentNode.dataset.set, v = el.dataset.v;
    settings[name] = name === "speed" ? parseFloat(v) : name === "rotateSec" ? parseInt(v, 10) : name === "rotate" || name === "fcAuto" || name === "fcRemote" ? v === "true" : name === "fcEcho" ? parseInt(v, 10) : name === "textZoom" ? parseFloat(v) : v;
    saveSettings();
    el.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === el ? "true" : "false"));
    if (name === "engine") { const box = stEl.querySelector(".el-only"); if (box) box.hidden = v !== "eleven"; }
    if (name === "rotate") { const s = stEl.querySelector('[data-set="rotateSec"]'); if (s) s.classList.toggle("dv-dis", !settings.rotate); }
    if (name === "textZoom") applyTextZoom();
    buzz();
    return;
  }
  if ((el = t.closest("#testVoice"))) {
    if (Player.isPlaying(el)) { Player.stop(); return; }
    Player.play("Hi there! What can I get started for you?", "them", el);
    Player.enqueue("Can I get a medium hot americano, please?", "me", el);
    return;
  }
  if ((el = t.closest("#clearCache"))) { AudioCache.clear().then(() => toast("저장된 음성을 지웠어요")); return; }
  if ((el = t.closest("#backupAll"))) {
    saveToday();
    const text = backupText();
    if (!text) { toast("아직 저장된 기록이 없어요"); return; }
    copyText(text).then(ok => toast(ok ? "전체 기록을 복사했어요" : "복사하지 못했어요"));
  }
});
stEl.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "setKey") { settings.apiKey = t.value.trim(); saveSettings(); }
  else if (t.dataset.voiceCustom) {
    const v = t.value.trim();
    settings[t.dataset.voiceCustom] = v || DEFAULTS[t.dataset.voiceCustom];
    saveSettings();
  }
});
stEl.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "setModel") { settings.model = t.value; saveSettings(); }
  else if (t.dataset.voice) {
    const name = t.dataset.voice;
    const custom = stEl.querySelector('[data-voice-custom="' + name + '"]');
    if (t.value === "custom") {
      custom.hidden = false;
      custom.focus();
      if (custom.value.trim()) { settings[name] = custom.value.trim(); saveSettings(); }
    } else {
      custom.hidden = true;
      settings[name] = t.value;
      saveSettings();
    }
  }
});


/* 시트 안 클릭: 예문·썰 듣기 + 목록(설정은 2026-10-05부터 전체 화면 #settings) */
sheetBody.addEventListener("click", e => {
  const t = e.target;
  let el;
  const sec = t.closest(".rd");
  if (sec) {                                                    // 예문·썰(인터랙티브 스크립트)
    const rd = sheetReader(sec);
    if ((el = t.closest("[data-rd-play]"))) {
      buzz();
      const s = rd.state();
      if (s.active && !s.single) rd.toggle(); else rd.play(0, 0, false);
      return;
    }
    if ((el = t.closest("[data-rd-one]"))) {
      const i = +el.dataset.rdOne, s = rd.state();
      if (s.active && s.single && s.index === i) Player.stop(); else rd.play(i, 0, true);
      return;
    }
    if ((el = t.closest(".w"))) {
      rd.seek(Array.from(sec.querySelectorAll(".sc")).indexOf(el.closest(".sc")), +el.dataset.w);
      return;
    }
  }
  if ((el = t.closest("[data-toc]"))) { const g = el.closest(".toc-group"); setTocOpen(g, !g.classList.contains("open")); syncTocAll(); buzz(); return; }
  if ((el = t.closest("[data-toc-all]"))) {
    const groups = Array.from(sheetBody.querySelectorAll(".toc-group")), open = !groups.every(g => g.classList.contains("open"));
    groups.forEach(g => setTocOpen(g, open));
    syncTocAll();
    buzz();
    return;
  }
  if ((el = t.closest("[data-go]"))) { goFromList(+el.dataset.go); return; }
  if ((el = t.closest("#goFirst"))) { goFromList(0); return; }
  if ((el = t.closest("#goUnseen"))) {
    const cur = activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : -1;
    let idx = -1;
    for (let k = 1; k <= CARDS.length && idx < 0; k++) {
      const i = (cur + k + CARDS.length) % CARDS.length;
      if (!seenSet.has(cardKey(i))) idx = i;
    }
    if (idx < 0) { toast("모든 카드를 다 봤어요!"); return; }
    goFromList(idx);
    return;
  }
  if ((el = t.closest("#resetProgress"))) {
    seenSet.clear();
    progress.at = {};
    saveProgress();
    openList();
    toast("본 기록을 지웠어요");
    return;
  }
});


function hideSheet() {
  if (!sheetOpen) return;
  sheetOpen = false;
  const hold = sheetHold;
  sheetHold = null;
  if (hold && hold.token === Player.getToken()) { if (hold.paused) Player.resume(); }
  else Player.stop();
  if (document.activeElement && sheet.contains(document.activeElement)) document.activeElement.blur();
  sheet.classList.remove("on", "dragging");
  sheet.style.transform = "";
  scrim.classList.remove("on");
  sheet.setAttribute("aria-hidden", "true");
  flushNote();
  if (currentTab === "expr") renderExprTab(); else updateBadges();
  if (currentTab === "today") renderToday();
}

/* 닫기 버튼·바깥 탭: 히스토리를 되돌려서 안드로이드 뒤로 가기와 같은 흐름으로 닫음 */
function closeSheet() {
  if (!sheetOpen) return;
  let viaHistory = false;
  try { viaHistory = !!(history.state && history.state.sheet); } catch (e) {}
  if (viaHistory) history.back();
  else hideSheet();
}

/* 시트 위에 연 연습 모드를 뒤로 가기로 닫으면 시트의 히스토리 항목({ sheet })으로 돌아옴 → 시트는 그대로 둠 */
window.addEventListener("popstate", () => {
  let st = null;
  try { st = history.state; } catch (e) {}
  if (sheetOpen && st && st.sheet) return;
  hideSheet();
});
scrim.addEventListener("click", closeSheet);
sheetFoot.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { closeSheet(); return; }
  const fl = e.target.closest("[data-full-list]");
  if (fl) { buzz(); openList(fl.dataset.fullList); return; }   // 카테고리 목록 → 전체 목록(그 카테고리 펼침, 시트는 그대로 바뀜)
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !PC.open) closeSheet(); });

/* 손잡이 부분을 아래로 끌어서 닫기 */
let dragY0 = null, dragDy = 0;
sheetHead.addEventListener("touchstart", e => {
  dragY0 = e.touches[0].clientY; dragDy = 0;
  sheet.classList.add("dragging");
}, { passive: true });
sheetHead.addEventListener("touchmove", e => {
  if (dragY0 === null) return;
  dragDy = Math.max(0, e.touches[0].clientY - dragY0);
  sheet.style.transform = "translateY(" + dragDy + "px)";
}, { passive: true });
sheetHead.addEventListener("touchend", () => {
  if (dragY0 === null) return;
  dragY0 = null;
  sheet.classList.remove("dragging");
  if (dragDy > 90) closeSheet();
  else sheet.style.transform = "";
});

/* ---------- 시작: 스크립트를 끝까지 읽었으니(드라이브 상태 D 등) 오늘 탭을 그림 ---------- */
todayReady = true;
renderToday();
updateBadges();
</script>
</body>
