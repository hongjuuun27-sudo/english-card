    if (el.disabled) return;
    const a = el.dataset.dv;
    buzz();
    if (a === "close") closeDrive();
    else if (a === "start" || a === "restart") dvStart(false);
    else if (a === "resume") dvStart(true);
    else if (a === "toggle") dvToggle();
    else if (a === "prev") dvStep(-1);
    else if (a === "next") dvStep(1);
    else if (a === "block") dvNextBlock();
    else if (a === "pre-count") dvPreCount();
    else if (a === "pre-run") dvPreRun();
    else if (a === "pre-stop") { D.pre.cancel = true; dvPaintPre(); }
    else if (a === "pre-cancel") { D.pre = { state: "idle" }; dvPaintPre(); }
    return;
  }
  /* 시작 화면 옵션: 바꿀 때마다 저장(다음에 그대로 보여 줌) */
  const o = D.opts;
  if ((el = t.closest("[data-dv-scope]"))) {
    o.scope = el.dataset.dvScope;
    if (o.scope === "cat" && !o.cats.length && activeCard && activeCard.dataset.i != null) o.cats = [CARDS[+activeCard.dataset.i].category];
  } else if ((el = t.closest("[data-dv-cat]"))) {
    const n = el.dataset.dvCat;
    o.cats = o.cats.includes(n) ? o.cats.filter(x => x !== n) : o.cats.concat([n]);
  } else if ((el = t.closest("[data-dv-set] button"))) {
    const name = el.parentNode.dataset.dvSet, v = el.dataset.v;
    o[name] = name === "rate" ? parseFloat(v) : name === "shadow" ? v === "true" : v;
  } else return;
  buzz();
  saveDrive();
  if (D.pre.state !== "running") D.pre = { state: "idle" };
  dvRenderSetup();
});

/* 화면이 꺼지거나 다른 앱으로 가면: ElevenLabs 음성은 계속 재생(잠금화면에서도 들을 수 있게),
   내장 음성은 백그라운드에서 끊기므로 그 문장에서 멈춰 기다림. 돌아오면 화면 꺼짐 방지를 다시 켬 */
document.addEventListener("visibilitychange", () => {
  if (!D.open || D.screen !== "play") return;
  if (document.visibilityState === "hidden") {
    const s = D.rd.state();
    if (s.active && !s.paused && (Player.current() === "speech" || !dvElevenOK())) dvInterrupt();
    dvSavePos();
  } else {
    dvLock(true);
    dvPaintCtl();
  }
});
window.addEventListener("pagehide", () => { if (D.open) dvSavePos(); });

/* ================= 연습 모드: 청크 · 연음 · 발음 (한 문장씩 말하기 연습) =================
   시작 화면(옵션 — 드라이브 모드 시작 화면과 같은 틀·CSS) → 연습 화면(한 문장씩). 시작 화면은 끝 화면의 [연습]·연습 화면 [옵션]으로.
   바로 연습(PC.quick, 시작 화면 없음): 상황 카드 위쪽 [연습] = 이 카드를 보던 줄부터 / 표현 시트·복습의 "이 표현 연습하기" = 예문 5개 → 썰.
     위치(pos)를 저장하지 않고(시작 화면의 '이어 하기'를 안 덮어씀), 닫으면 연 곳(PC.origin)으로 돌아가 보던 상태를 멈춘 채로 되살림.
   재생 목록(buildPractice): 대화 줄(dlg) · 예문(ex) · 썰 문장(story)을 차례로.
     카드 범위(지금 보던 카드 / 전체 / 카테고리): 카드마다 대화 → (예문까지) 핵심 표현마다 예문 5개 → (썰까지) 표현마다 예문 뒤에 썰 문장들
     표현 범위(학습 중 / 오늘 복습 — 드라이브와 같은 driveExprs 순서): 표현마다 예문 5개 → 썰 문장들
   한 문장 = 청크 단계(청크 하나씩 듣고 따라 말하기: 다음·이전·한 번 더) → 연결 단계(문장 전체를 한 번에) → [다음]으로 다음 문장.
     청크가 하나뿐이거나 연습 방식이 '전체 문장만'이면 바로 연결 단계. 속도는 연습 모드 전용(시작 화면·연습 화면 공통, 저장).
   데이터: 대사 줄·예문 = { chunks, tips, soloChunks? } / 썰 = story.sentences: [{ chunks, ko, tips, soloChunks? }]
     chunks: " / " = 끊어 읽는 곳, "‿" = 소리가 이어지는 곳(단어 사이 공백 대신). 괄호 속 한국어 뜻은 넣지 않음(화면에서 문장 아래 따로 보여 줌)
     썰 sentences의 chunks에서 표시를 빼고 공백 하나로 이으면 썰 영어(괄호 속 한국어를 뺀 것)와 똑같아야 함 → 그게 문장 나누기
   소리(새 음성을 만들지 않음): 대사·예문은 그 문장 음성, 썰 문장은 썰 전체 음성(표현 시트·드라이브와 같은 캐시)의 그 문장 구간.
     청크·썰 문장은 Player 구간 재생 ②(재생 전에 소리를 실제로 잘라 냄 — 'Player' 참고). soloChunks로 표시한 청크만 그 청크 글을 따로 요청.
   화면 단어 ↔ 음성 단어: 화면 글(괄호 속 한국어를 뺀 문장)의 j번째 단어 = 음성 글의 (a0 + j)번째 단어
   위치: 문장·단계가 바뀔 때마다, 닫을 때, pagehide에 저장. 끝까지 다 하면 위치를 지움 */
const PRACTICE_KEY = "engcards.practice.v1";
const PC_SCOPES = { current: "지금 보던 카드", all: "전체 카드", cat: "카테고리 선택", learning: "학습 중인 표현만", due: "오늘 복습할 표현만" };
const PC_CONTENT = { dialogue: "대화문만", examples: "예문까지", story: "썰까지", exOnly: "예문만", storyOnly: "썰만" };   // 뜻은 CONTENT_ROWS(드라이브 모드 부분)
const PC_DEFAULT = { scope: "current", cats: [], content: "dialogue", method: "chunk", rate: 1 };

/* 저장: { opts: 시작 화면 옵션, pos: 마지막 위치 { scope, cats, cid(지금 보던 카드 범위일 때 그 카드), key(문장), step, block, bcid, bi, label } } */
function loadPractice() {
  try {
    const s = JSON.parse(localStorage.getItem(PRACTICE_KEY) || "null");
    if (s && typeof s === "object") {
      const o = Object.assign({}, PC_DEFAULT, s.opts && typeof s.opts === "object" ? s.opts : {});
      if (!PC_SCOPES[o.scope]) o.scope = "current";
      if (!PC_CONTENT[o.content]) o.content = "dialogue";
      o.method = o.method === "whole" ? "whole" : "chunk";
      o.cats = Array.isArray(o.cats) ? o.cats.filter(c => typeof c === "string") : [];
      o.rate = o.rate === 0.8 ? 0.8 : 1;
      return { opts: o, pos: s.pos && typeof s.pos === "object" && s.pos.key ? s.pos : null };
    }
  } catch (e) {}
  return { opts: Object.assign({}, PC_DEFAULT), pos: null };
}
const PC = Object.assign(loadPractice(), {
  open: false, screen: "setup", openId: 0, curCi: 0,   // curCi: 연 순간에 보고 있던 카드('지금 보던 카드' 범위)
  quick: false, origin: null,                          // quick: 바로 연습(카드 [연습]·"이 표현 연습하기") — 위치(pos)를 저장하지 않음
                                                       // origin: 바로 연습을 연 곳 { kind: "card", card, st, hold, scroll } | { kind: "sheet", scroll } → 닫으면 거기로
  pl: null, idx: -1, step: 0, done: false,            // 재생 목록 · 지금 문장 번호 · 단계 · 끝까지 다 했는지
  u: null, ui: null                                    // 지금 문장의 연습 정보(pcUnit) · 연습 화면 요소
});
function savePractice() {
  try { localStorage.setItem(PRACTICE_KEY, JSON.stringify({ opts: PC.opts, pos: PC.pos })); } catch (e) {}
}
const practiceEl = document.getElementById("practice");
const pcSetupEl = document.getElementById("pcSetup");
const pcPlayEl = document.getElementById("pcPlay");

/* chunks 글 → { text: 슬래시·연음 표시를 뺀 글(원문과 같아야 함), parts: [{ s, e }](text 안 청크 위치), links: [연음 공백 위치] } */
function parseChunks(src) {
  const parts = [], links = [];
  let text = "";
  String(src).trim().split(/\s+\/\s+/).forEach((p, n) => {
    if (n) text += " ";
    const s = text.length;
    for (let i = 0; i < p.length; i++) {
      if (p[i] === "‿") { links.push(text.length); text += " "; }
      else text += p[i];
    }
    parts.push({ s, e: text.length });
  });
  return { text, parts, links };
}
/* 괄호 속 한국어 뜻을 뺀 글(연습 화면에 보이는 글·chunks와 비교하는 기준) */
const stripGloss = t => String(t || "").replace(GLOSS_RE, "");

/* 썰 → 연습 문장들 [{ text: 화면 글, data: sentences[i] 또는 null, a0, a1: 썰 음성 안 단어 번호 }]
   sentences가 썰 영어와 맞으면 그대로, 없거나 안 맞으면 문장 부호로 나눔(연습 데이터 없음 — 문장 전체로 연습) */
const STORY_SENTS = new WeakMap();
function storySents(story) {
  if (STORY_SENTS.has(story)) return STORY_SENTS.get(story);
  const G = stripGloss(story.en), gsc = getScript(G);
  let list = null;
  if (Array.isArray(story.sentences) && story.sentences.length) {
    const texts = story.sentences.map(s => (s && typeof s.chunks === "string" ? parseChunks(s.chunks).text : ""));
    if (texts.join(" ") === G) list = texts.map((text, i) => ({ text, data: story.sentences[i] }));
  }
  if (!list) list = G.split(/(?<=[.!?]["”]?)\s+(?=[A-Z“"])/).filter(t => t.trim()).map(text => ({ text, data: null }));
  let pos = 0;
  list.forEach(s => {
    const at = G.indexOf(s.text, pos), st = at < 0 ? pos : at;
    pos = st + s.text.length;
    s.a0 = -1; s.a1 = -1;
    for (let i = st; i < pos; i++) { const w = gsc.wAt[i]; if (w >= 0) { if (s.a0 < 0) s.a0 = w; s.a1 = w; } }
  });
  const out = list.filter(s => s.a0 >= 0);
  STORY_SENTS.set(story, out);
  return out;
}
/* 음성 글에서 a0~a1 단어 구간 안의 괄호 속 한국어 뜻 → [{ en: 바로 앞 단어, ko: 뜻 }] */
function glossesIn(text, a0, a1) {
  const sc = getScript(text), out = [];
  const re = new RegExp(GLOSS_RE.source, "g");
  let m;
  while ((m = re.exec(text))) {
    let j = m.index - 1;
    while (j >= 0 && /\s/.test(text[j])) j--;
    const k = j >= 0 ? sc.wAt[j] : -1;
    if (k < a0 || k > a1) continue;
    const w = sc.words[k];
    const en = w.pieces.map(p => text.slice(p[0], p[1])).join("").replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, "");
    out.push({ en, ko: m[0].trim().replace(/^\(|\)$/g, "") });
  }
  return out;
}

/* ---- 재생 목록 → { items: [문장], blocks: [카드 또는 표현], exprScope }
   문장 { kind: dlg|ex|story, ci, block, n, total, who, key, line(dlg) | ex·xid + x(ex) / si(story) } */
function buildPractice(o, curCi) {
  const items = [], blocks = [];
  const exprScope = o.scope === "learning" || o.scope === "due" || o.scope === "expr";   // expr: 표현 하나(o.xid — "이 표현 연습하기")
  const addBlock = (b, fill) => {                     // 문장이 하나라도 있을 때만 블록으로
    const start = items.length;
    fill(blocks.length);
    if (items.length > start) blocks.push(Object.assign(b, { start }));
  };
  const exprItems = (bi, it, withEx, withStory) => {
    const ex = it.ex, base = { block: bi, ci: it.ci, xid: it.id, ex };
    if (withEx) (ex.examples || []).forEach((x, n, arr) => { if (x && x.en) items.push(Object.assign({ kind: "ex", x, n: n + 1, total: arr.length, who: "them" }, base)); });
    if (withStory && ex.story && ex.story.en) storySents(ex.story).forEach((s, n, arr) => items.push(Object.assign({ kind: "story", si: n, n: n + 1, total: arr.length, who: "me" }, base)));
  };
  if (exprScope) {
    (o.scope === "expr" ? [EXPR_BY_ID[o.xid]].filter(Boolean) : driveExprs(o)).forEach(it => addBlock({ kind: "expr", ci: it.ci, xid: it.id, key: "x" + it.id }, bi => exprItems(bi, it, true, true)));
  } else {
    CARDS.forEach((card, ci) => {
      if (o.scope === "current" && ci !== curCi) return;
      if (o.scope === "cat" && !o.cats.includes(card.category)) return;
      addBlock({ kind: "card", ci, cid: card.id, key: "c" + card.id }, bi => {
        const d = card.dialogue || [];
        if (hasDlg(o.content)) d.forEach((line, n) => { if (line.en) items.push({ kind: "dlg", line, who: whoOf(line), name: whoLabel(line.who), block: bi, ci, n: n + 1, total: d.length }); });
        if (o.content !== "dialogue") EXPR_LIST.filter(it => it.ci === ci && it.kind === "core").forEach(it => exprItems(bi, it, hasEx(o.content), hasStory(o.content)));
      });
    });
  }
  items.forEach(it => { it.key = blocks[it.block].key + "/" + it.kind + "/" + (it.xid || "") + "/" + it.n; });
  return { items, blocks, exprScope };
}

/* 문장 하나의 연습 정보 { it, audio(음성 글), display(화면 글), asc·dsc(각 글의 getScript), a0, a1, has(연습 데이터 있음),
   chunks: [{ s, e(화면 글 위치), d0, d1(화면 단어 번호), solo }], links, tips, ko, glosses, who } */
function pcUnit(it) {
  let audio, display, data, a0 = 0, a1 = null, ko = "";
  if (it.kind === "dlg") { audio = it.line.en; display = stripGloss(audio); data = it.line; ko = it.line.ko; }
  else if (it.kind === "ex") { audio = it.x.en; display = stripGloss(audio); data = it.x; ko = it.x.ko; }
  else {
    const s = storySents(it.ex.story)[it.si];
    audio = it.ex.story.en; display = s.text; data = s.data; a0 = s.a0; a1 = s.a1; ko = data ? data.ko : "";
  }
  const asc = getScript(audio), dsc = getScript(display);
  if (a1 == null) a1 = asc.words.length - 1;
  const pc = data && typeof data.chunks === "string" ? parseChunks(data.chunks) : null;
  const has = !!pc && pc.text === display;
  const parts = has ? pc.parts : [{ s: 0, e: display.length }];
  const solo = has && Array.isArray(data.soloChunks) && parts.length > 1 ? data.soloChunks : [];
  const chunks = [];
  parts.forEach((p, n) => {
    let d0 = -1, d1 = -1;
    for (let i = p.s; i < p.e; i++) if (dsc.wAt[i] >= 0) { if (d0 < 0) d0 = dsc.wAt[i]; d1 = dsc.wAt[i]; }
    if (d0 >= 0) chunks.push({ s: p.s, e: p.e, d0, d1, solo: solo.includes(n + 1) });
  });
  return { it, audio, display, asc, dsc, a0, a1, has, chunks, links: has ? pc.links : [],
    tips: has && Array.isArray(data.tips) ? data.tips : [], ko: ko || "", glosses: glossesIn(audio, a0, a1), who: it.who };
}
/* 단계 수: 청크 n개 + 연결 단계 1개. 청크가 하나뿐이거나 '전체 문장만'이면 연결 단계만 */
const pcSteps = u => (PC.opts.method === "chunk" && u.chunks.length > 1 ? u.chunks.length + 1 : 1);
const pcIsLink = () => !!PC.u && PC.step === pcSteps(PC.u) - 1;

/* 문장: 인터랙티브 스크립트(scriptHtml)로 그리고, 청크마다 .ck로 감싸 사이에 슬래시, 연음 자리는 .lk */
function pcSentenceHtml(u) {
  const last = u.chunks.length - 1;
  const ranges = u.chunks.map((c, n) => ({
    s: c.s, e: c.e, open: '<span class="ck" data-ck="' + n + '">',
    close: '</span>' + (n < last ? '<span class="ck-sep" aria-hidden="true">/</span>' : "")
  }));
  return scriptHtml(u.display, ranges, { links: new Set(u.links) });
}

/* 재생기: 지금 문장의 항목 = [청크 1…n, 문장 전체] (청크 단계가 없으면 [문장 전체]). 단계 번호 = 항목 번호 */
PC.rd = createReader({
  items: () => {
    const u = PC.u, el = PC.ui && PC.ui.en.querySelector(".sc");
    if (!u || !el) return [];
    const base = { el, who: u.who, script: u.asc };
    const whole = u.a0 === 0 && u.a1 === u.asc.words.length - 1;        // 음성 전체가 이 문장(대사·예문) → 원래 mp3 그대로
    const link = whole ? base : Object.assign({ from: u.a0, to: u.a1, offset: -u.a0 }, base);
    if (pcSteps(u) === 1) return [link];
    return u.chunks.map(c => (c.solo ?
      { el, who: u.who, script: getScript(u.display.slice(c.s, c.e)), offset: c.d0 } :
      Object.assign({}, base, { from: u.a0 + c.d0, to: u.a0 + c.d1, offset: -u.a0 }))).concat([link]);
  },
  rate: () => PC.opts.rate,
  onEnd: () => pcPaint(),
  onChange: () => pcPaint()
});
Player.onChange(() => { if (PC.open) pcPaint(); });

/* 지금 위치 [위 줄, 아래 줄] 예) "카페에서 주문하기 · 1/2" / "대화 2/6", "Can I get ~? · 예문 3/5", "Can I get ~? · 썰 · 문장 2/4" */
function pcLabels(k) {
  const pl = PC.pl, it = pl.items[k], card = CARDS[it.ci], B = pl.blocks.length, pos = (it.block + 1) + "/" + B;
  const ph = it.ex ? it.ex.phrase : "";
  return [
    pl.exprScope && B > 1 ? "표현 " + pos + " · " + card.title : card.title + (B > 1 ? " · " + pos : ""),
    it.kind === "dlg" ? "대화 " + it.n + "/" + it.total :
      it.kind === "ex" ? ph + " · 예문 " + it.n + "/" + it.total : ph + " · 썰 · 문장 " + it.n + "/" + it.total
  ];
}

/* ---- 위치 기억 ---- */
function pcSavePos() {
  const pl = PC.pl, it = pl && pl.items[PC.idx];
  if (!it || PC.done || PC.quick) return;             // 바로 연습은 시작 화면의 '이어 하기' 위치를 건드리지 않음
  PC.pos = {
    scope: PC.opts.scope, cats: catsKey(PC.opts.cats), cid: PC.opts.scope === "current" ? CARDS[PC.curCi].id : null,
    key: it.key, step: PC.step, block: pl.blocks[it.block].key, bcid: CARDS[it.ci].id, bi: it.block, label: pcLabels(PC.idx).join(" · ")
  };
  savePractice();
}
/* 저장된 위치 → 이 재생 목록의 문장 번호. 같은 문장 → 그 카드(표현)의 처음 → 가장 가까운 카드의 처음. 이어 할 수 없으면 -1 */
function pcResumeIdx(pl) {
  const p = PC.pos;
  if (!p || !pl.items.length || p.scope !== PC.opts.scope) return -1;
  if (p.scope === "cat" && p.cats !== catsKey(PC.opts.cats)) return -1;
  if (p.scope === "current" && p.cid !== CARDS[PC.curCi].id) return -1;
  const k = pl.items.findIndex(it => it.key === p.key);
  if (k >= 0) return k;
  const b = pl.blocks.find(bl => bl.key === p.block);
  if (b) return b.start;
  if (!pl.exprScope && p.bcid != null) return (pl.blocks.find(bl => bl.cid > p.bcid) || pl.blocks[pl.blocks.length - 1]).start;
  return pl.blocks[Math.max(0, Math.min(p.bi || 0, pl.blocks.length - 1))].start;
}

/* ---- 시작 화면 (드라이브 모드 시작 화면과 같은 틀·CSS) ---- */
function pcSetupHtml() {
  const o = PC.opts, pl = buildPractice(o, PC.curCi), exprScope = pl.exprScope;
  const nLearn = EXPR_LIST.filter(it => statusOf(it.id) === "learning").length;
  const nDue = dueList().length;
  const cats = (window.CATEGORY_DATA || []).map(c => c.name).filter(n => CARDS.some(c => c.category === n));
  const opt = (v, sub, wide) => '<button class="dv-opt' + (wide ? " wide" : "") + '" type="button" data-pc-scope="' + v + '" aria-pressed="' + (o.scope === v) + '"><b>' + PC_SCOPES[v] + '</b><small>' + esc(sub) + '</small></button>';
  const seg = (name, list, cls) => '<div class="seg' + (cls ? " " + cls : "") + '" data-pc-set="' + name + '">' +
    list.map(x => '<button type="button" data-v="' + x[0] + '" aria-pressed="' + (String(o[name]) === String(x[0])) + '">' + x[1] + '</button>').join("") + '</div>';
  const contentNote = { dialogue: "대화문만 연습해요.", examples: "대화 → 핵심 표현마다 예문 5개", story: "대화 → 핵심 표현마다 예문 5개 → 썰",
    exOnly: "대화 없이 핵심 표현마다 예문 5개", storyOnly: "대화 없이 핵심 표현마다 썰" };
  const resumeK = pcResumeIdx(pl);
  let words = 0, noData = 0;
  pl.items.forEach(it => {
    const u = pcUnit(it);
    words += u.a1 - u.a0 + 1;
    if (!u.has) noData++;
  });
  const per = o.method === "chunk" ? 4 : 2;                                   // 듣기 + 따라 말하기(청크 단계면 한 번 더)
  const mins = Math.max(1, Math.round((words * 0.4 * per / o.rate + pl.items.length * 2) / 60));
  const empty = o.scope === "cat" && !o.cats.length ? "카테고리를 하나 이상 골라 주세요" :
    o.scope === "learning" ? "학습 중인 표현이 없어요 · 표현 탭에서 '학습하기'를 시작해 보세요" :
    o.scope === "due" ? "오늘 복습할 표현이 없어요" : "연습할 문장이 없어요";
  const unit = exprScope ? "표현 " + pl.blocks.length + "개" : "카드 " + pl.blocks.length + "장";
  return '<header class="dv-head">' +
      '<button class="dv-x" type="button" data-pc="close" aria-label="닫기">' + ICON_X + '</button>' +
      '<h2 class="dv-title">연습 모드</h2>' +
    '</header>' +
    '<div class="dv-sbody">' +
      '<p class="dv-lead">한 문장씩 청크(끊어 읽는 덩어리)·연음·발음을 듣고 소리 내어 따라 말해요.</p>' +
      '<div class="set-group"><span class="set-label">범위</span><div class="dv-scope">' +
        opt("current", CARDS[PC.curCi].title, true) +
        opt("all", "카드 " + CARDS.length + "장") +
        opt("cat", o.scope === "cat" && o.cats.length ? o.cats.length + "개 고름" : "골라서 연습") +
        opt("learning", nLearn + "개") +
        opt("due", nDue + "개") +
      '</div>' +
      (o.scope === "cat" ? '<div class="dv-cats">' + cats.map(n =>
        '<button class="dv-cat" type="button" data-pc-cat="' + esc(n) + '" aria-pressed="' + o.cats.includes(n) + '">' +
          (CATEGORY_EMOJI[n] || "") + " " + esc(n) + " " + CARDS.filter(c => c.category === n).length + '</button>').join("") + '</div>' : "") +
      '</div>' +
      '<div class="set-group' + (exprScope ? " dv-dis" : "") + '"><span class="set-label">내용</span>' +
        seg("content", CONTENT_ROWS[0]) + seg("content", CONTENT_ROWS[1], "seg2") +
        '<p class="note">' + (exprScope ? "표현 범위는 표현마다 예문 5개 → 썰 순서로 연습해요." : contentNote[o.content]) + '</p>' +
      '</div>' +
      '<div class="set-group"><span class="set-label">연습 방식</span>' +
        seg("method", [["chunk", "청크 단계 포함"], ["whole", "전체 문장만"]]) +
        '<p class="note">' + (o.method === "chunk" ?
          "청크를 하나씩 듣고 따라 말한 다음, 문장 전체를 한 번에 이어서 말해요." :
          "청크 단계 없이 문장 전체를 듣고 한 번에 따라 말해요.") + '</p>' +
      '</div>' +
      '<div class="set-group"><span class="set-label">속도</span>' + seg("rate", [["0.8", "0.8x"], ["1", "1.0x"]]) + '</div>' +
    '</div>' +
    '<footer class="dv-sfoot">' +
      '<div class="dv-sum">' + (pl.items.length ? unit + " · 문장 " + pl.items.length + "개 · 약 " + mins + "분" +
        (noData ? "<br>청크·발음 팁이 아직 없는 " + noData + "문장은 문장 전체로 연습해요" : "") : esc(empty)) + '</div>' +
      '<div class="dv-go">' + (resumeK >= 0 ?
        '<button class="btn" type="button" data-pc="restart">처음부터</button>' +
        '<button class="btn main" type="button" data-pc="resume"><span>이어 하기</span><small>' + esc(PC.pos.label || "") + '</small></button>' :
        '<button class="btn main" type="button" data-pc="start"' + (pl.items.length ? "" : " disabled") + '><span>시작</span></button>') +
      '</div>' +
    '</footer>';
}
function pcRenderSetup() {
  const body = pcSetupEl.querySelector(".dv-sbody");
  const y = body ? body.scrollTop : 0;
  pcSetupEl.innerHTML = pcSetupHtml();
  pcSetupEl.querySelector(".dv-sbody").scrollTop = y;
}

/* ---- 연습 화면 ---- */
function pcPlayHtml() {
  return '<header class="dv-ptop">' +
      '<button class="dv-x" type="button" data-pc="close" aria-label="연습 모드 나가기">' + ICON_X + '</button>' +
      '<div class="dv-loc"><div class="dv-loc1"></div><div class="dv-loc2 pc-loc2"><span class="lab"></span><span class="stp"></span></div></div>' +
      '<button class="pc-opt" type="button" data-pc="setup" aria-label="연습 옵션 (범위·내용·이어 하기)">' + ICON_SLIDERS + '</button>' +
    '</header>' +
    '<div class="pc-scroll"><div class="pc-inner"><div class="pc-line">' +
      '<div class="pc-steps" aria-hidden="true"></div>' +
      '<div class="pc-who"></div>' +
      '<div class="pc-en" lang="en"></div>' +
      '<div class="pc-gloss"></div>' +
      '<div class="pc-ko"></div>' +
      '<div class="pc-tips"></div>' +
    '</div></div></div>' +
    '<div class="pc-note" aria-live="polite"></div>' +
    '<div class="pc-bottom"><div class="actions"></div></div>';
}
/* 지금 문장을 그림(문장이 바뀔 때) */
function pcRenderUnit() {
  const U = PC.ui, u = PC.u, it = u.it;
  const line = U.line.cloneNode(false);              // 새 문장이 들어오는 애니메이션을 다시 보이게
  U.line.replaceWith(line);
  U.line = line;
  line.append(U.steps, U.who, U.en, U.gloss, U.ko, U.tips);
  practiceEl.style.setProperty("--h", hueOf(CARDS[it.ci].category));
  U.who.textContent = it.kind === "dlg" ? it.name : it.kind === "ex" ? "예문 " + it.n : "썰";
  U.who.classList.toggle("me", it.who === "me");
  U.en.innerHTML = pcSentenceHtml(u);
  U.en.classList.toggle("long", u.display.length > 60);
  U.gloss.innerHTML = u.glosses.map(g => '<span><b lang="en">' + esc(g.en) + '</b> ' + esc(g.ko) + '</span>').join("");
  U.ko.textContent = u.ko;
  U.tips.innerHTML = u.tips.length ? '<div class="pc-tips-h">발음 팁</div>' +
    u.tips.map(t => '<div class="pc-tip"><b lang="en">' + esc(t.target || "") + '</b>' + esc(t.ko || "") + '</div>').join("") : "";
  const n = u.chunks.length, steps = pcSteps(u);
  U.steps.hidden = steps < 2;
  U.steps.innerHTML = steps < 2 ? "" : u.chunks.map((c, i) => '<button class="pc-st" type="button" data-pc-step="' + i + '" tabindex="-1">' + (i + 1) + '</button>').join("") +
    '<button class="pc-st" type="button" data-pc-step="' + n + '" tabindex="-1">이어서</button>';
  U.scroll.scrollTop = 0;
}
/* 위치·강조·안내·버튼 (재생 상태가 바뀔 때마다) */
function pcPaint() {
  const U = PC.ui, u = PC.u;
  if (!PC.open || PC.screen !== "play" || !U || !u) return;
  const steps = pcSteps(u), chunkMode = steps > 1, link = PC.step === steps - 1, n = u.chunks.length;
  const s = PC.rd.state(), playing = s.active && !s.paused;
  const L = pcLabels(PC.idx);
  U.loc1.textContent = L[0];
  U.lab.textContent = L[1];
  U.stp.textContent = !chunkMode ? "" : link ? "· 이어서 말하기" : "· 청크 " + (PC.step + 1) + "/" + n;
  U.en.classList.toggle("chunking", chunkMode && !link);
  U.en.querySelectorAll(".ck").forEach(c => c.classList.toggle("on", chunkMode && !link && +c.dataset.ck === PC.step));
  U.steps.querySelectorAll(".pc-st").forEach(b => {
    const i = +b.dataset.pcStep;
    b.classList.toggle("now", i === PC.step);
    b.classList.toggle("done", i < PC.step);
  });
  U.note.textContent = PC.done ? "끝까지 다 했어요! 수고했어요" :
    playing ? "듣는 중…" : s.active ? "멈췄어요 · '한 번 더 듣기'로 다시 들어요" :
    !link ? "따라 말해 보세요" : chunkMode ? "이제 한 번에 이어서 말해 보세요" : "들은 대로 따라 말해 보세요";
  U.note.classList.toggle("go", !s.active);
  const last = PC.idx >= PC.pl.items.length - 1 && link;
  const main = PC.done ? ICON_RESTART + "<span>처음부터</span>" : last ? "<span>마치기</span>" : NEXT_HTML;
  const r = PC.opts.rate === 1 ? "1.0" : String(PC.opts.rate);
  const b = (act, html, cls, dis, label) => '<button class="btn ' + cls + '" type="button" data-pc="' + act + '"' +
    (label ? ' aria-label="' + label + '"' : "") + (dis ? " disabled" : "") + '>' + html + '</button>';
  const html = b("prev", "이전", "prev", PC.idx === 0 && PC.step === 0) +
    b("again", "한 번 더 듣기", "again") +
    b("rate", r + "x", "rate", false, "재생 속도 " + r + "배, 누르면 바뀜") +
    b("next", main, "main");
  if (U.actions._h !== html) { U.actions.innerHTML = html; U.actions._h = html; }   // 그대로면 다시 그리지 않음(누르는 중인 버튼이 바뀌지 않게)
}

/* ---- 조작 ---- */
/* 문장 k의 단계 step으로 가서 바로 재생(0~청크 n-1 = 청크, 마지막 = 문장 전체) */
function pcGo(k, step) {
  const pl = PC.pl;
  if (!pl || !pl.items[k]) return;
  if (k !== PC.idx || !PC.u) { PC.idx = k; PC.u = pcUnit(pl.items[k]); pcRenderUnit(); }
  PC.step = Math.max(0, Math.min(step || 0, pcSteps(PC.u) - 1));
  PC.done = false;
  pcSavePos();
  pcPaint();
  PC.rd.play(PC.step, 0, true);
}
function pcNext() {
  if (PC.done) { pcGo(0, 0); return; }
  if (!pcIsLink()) pcGo(PC.idx, PC.step + 1);
  else if (PC.idx < PC.pl.items.length - 1) pcGo(PC.idx + 1, 0);
  else {                                              // 마지막 문장까지 다 함 → 다음엔 처음부터
    PC.rd.stop();
    PC.done = true;
    if (!PC.quick) { PC.pos = null; savePractice(); }
    pcPaint();
  }
}
/* 이전: 앞 청크 → (첫 단계면) 앞 문장의 연결 단계 */
function pcPrev() {
  if (PC.step > 0 && !PC.done) pcGo(PC.idx, PC.step - 1);
  else if (PC.done) pcGo(PC.idx, pcSteps(PC.u) - 1);
  else if (PC.idx > 0) pcGo(PC.idx - 1, pcSteps(pcUnit(PC.pl.items[PC.idx - 1])) - 1);
}
/* 단어 탭: 청크 단계면 그 단어가 있는 청크로 가서 재생, 연결 단계면 그 단어부터 문장 끝까지 */
function pcTapWord(k) {
  const u = PC.u;
  if (!u) return;
  if (pcIsLink() && !PC.done) { PC.rd.seek(PC.step, k); return; }
  const c = u.chunks.findIndex(x => k >= x.d0 && k <= x.d1);
  pcGo(PC.idx, pcSteps(u) > 1 && c >= 0 ? c : 0);
}

/* ---- 열기 · 화면 바꾸기 · 닫기 ---- */
/* 공통: 전체 화면을 띄움(뒤의 앱·시트는 inert). origin이 있으면 닫을 때 그곳으로 돌아가 상태를 되살림 */
function pcShow(origin) {
  Player.stop();
  buzz();
  PC.open = true;
  PC.origin = origin || null;
  PC.curCi = activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : CARDS.length - 1;   // '끝' 화면이면 마지막 카드
  practiceEl.hidden = false;
  document.querySelector(".app").inert = true;
  sheet.inert = true;
  scrim.inert = true;
  document.body.classList.add("practicing");
  PC.openId = Date.now();
  try { history.pushState({ practice: PC.openId }, ""); } catch (e) {}
}
/* 시작 화면부터(끝 화면의 [연습]) */
function openPractice() {
  if (PC.open) return;
  pcShow(null);
  PC.quick = false;
  pcScreen("setup");
}
/* 바로 연습: 시작 화면 없이 run 범위로(내용·연습 방식·속도는 마지막으로 고른 값). PC.opts는 바꾸지 않음 */
function pcQuick(run, pick) {
  PC.quick = true;
  PC.pl = buildPractice(Object.assign({}, PC.opts, run), PC.curCi);
  pcScreen("play");
  PC.idx = -1;
  PC.done = false;
  pcGo(Math.max(0, PC.pl.items.findIndex(pick)), 0);
}
/* 상황 카드에서 보던 줄(모든 모드 같음) = 가장 최근에 한 일의 줄 st.focus:
   재생한 줄(스피커·단어 탭·이어 듣기 중 지나간 줄 — cardReader onItem) 또는 나타나거나 옮긴 줄(읽기 [다음]·쉐도잉 [다음]/[이전]) 중 더 나중 것.
   예) 5줄까지 나온 뒤 2줄을 다시 들었으면 2줄, 2줄을 들은 뒤 [다음]으로 6줄이 나왔으면 6줄. 아직 아무것도 안 했으면 첫 줄 */
function cardLineNow(card) {
  const st = card._st;
  return st && st.focus >= 0 ? st.focus : 0;
}
/* 카드 [연습]: 이 카드를 보던 줄부터. 카드 상태(card._st·대화 표시)는 그대로 두고, 닫을 때 멈춘 상태로 되살림 */
function practiceCard(card) {
  if (PC.open || !card._st) return;
  const st = card._st, rs = st.rd.state(), li = cardLineNow(card);
  const cont = st.mode === "listen" || isMid(st);
  const hold = cont && rs.active && !rs.single ? rs.index : st.hold;   // 이어 재생 중이었으면 돌아와서 그 줄부터 '이어 듣기'
  pcShow({ kind: "card", card, st, hold: cont ? hold : -1, scroll: card.querySelector(".body").scrollTop });
  PC.curCi = +card.dataset.i;
  pcQuick({ scope: "current" }, it => it.kind === "dlg" && it.n === li + 1);
}
/* "이 표현 연습하기"(표현 상세·복습 화면 = 바텀시트): 그 표현의 예문 5개 → 썰 */
function practiceExpr(id) {
  if (PC.open || !EXPR_BY_ID[id]) return;
  if (!buildPractice({ scope: "expr", xid: id }, 0).items.length) { toast("연습할 문장이 없어요"); return; }
  pcShow({ kind: "sheet", scroll: sheetBody.scrollTop });
  pcQuick({ scope: "expr", xid: id }, () => true);
}
/* 닫을 때: 연 곳의 상태를 멈춘 채로 되살림(소리는 다시 틀지 않음) */
function pcRestore(o) {
  if (o.kind === "sheet") { if (sheetOpen) sheetBody.scrollTop = o.scroll; return; }
  const card = o.card, st = card._st;
  if (st !== o.st) return;                            // 그사이 카드가 처음 상태로 바뀌었으면 그대로
  st.hold = o.hold;
  if (st.hold >= 0 && st.mode === "listen") setCur(card, st.hold);
  if (st.hold >= 0 && isMid(st)) {
    card.classList.add("sh-live");
    rowsOf(card).forEach((r, j) => { r.classList.toggle("cur", j === st.hold); r.classList.toggle("past", j < st.hold); });
  }
  renderActions(card);
  card.querySelector(".body").scrollTop = o.scroll;
}
function pcScreen(name) {
  PC.screen = name;
  pcSetupEl.hidden = name !== "setup";
  pcPlayEl.hidden = name !== "play";
  if (name === "setup") {
    PC.rd.stop();
    PC.ui = null;
    PC.u = null;
    pcPlayEl.innerHTML = "";
    pcRenderSetup();
  } else {
    pcPlayEl.innerHTML = pcPlayHtml();
    const q = s => pcPlayEl.querySelector(s);
    PC.ui = { loc1: q(".dv-loc1"), lab: q(".pc-loc2 .lab"), stp: q(".pc-loc2 .stp"), scroll: q(".pc-scroll"), line: q(".pc-line"),
      steps: q(".pc-steps"), who: q(".pc-who"), en: q(".pc-en"), gloss: q(".pc-gloss"), ko: q(".pc-ko"), tips: q(".pc-tips"),
      note: q(".pc-note"), actions: q(".pc-bottom .actions") };
  }
}
function pcStart(resume) {
  PC.pl = buildPractice(PC.opts, PC.curCi);
  if (!PC.pl.items.length) return;
  PC.quick = false;                                   // 시작 화면에서 시작 = 보통 연습(위치 저장·이어 하기)
  let k = 0, step = 0;
  if (resume) {
    k = Math.max(0, pcResumeIdx(PC.pl));
    if (PC.pos && PC.pl.items[k].key === PC.pos.key) step = PC.pos.step || 0;
  }
  pcScreen("play");
  PC.idx = -1;
  PC.done = false;
  pcGo(k, step);
}
/* 닫으면 소리 멈춤·위치 저장(바로 연습은 저장 안 함) → 바로 연습으로 열었으면 연 곳(카드·시트)으로 돌아가 상태를 되살림,
   아니면 (카드 범위면) 지금 문장의 카드가 상황 탭에 보이게 */
function pcHide() {
  if (!PC.open) return;
  const it = PC.screen === "play" && PC.pl ? PC.pl.items[PC.idx] : null;
  if (it) pcSavePos();
  PC.rd.stop();
  Player.stop();
  PC.open = false;
  pcScreen("setup");
  PC.pl = null;
  PC.quick = false;
  practiceEl.hidden = true;
  document.querySelector(".app").inert = false;
  sheet.inert = false;
  scrim.inert = false;
  document.body.classList.remove("practicing");
  const o = PC.origin;
  PC.origin = null;
  if (o) { pcRestore(o); return; }
  const cur = activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : -1;
  if (it && it.kind === "dlg" && it.ci !== cur) jumpTo(it.ci);
}
function closePractice() {
  let viaHistory = false;
  try { viaHistory = !!(history.state && history.state.practice === PC.openId); } catch (e) {}
  if (viaHistory) history.back(); else pcHide();
}
/* 안드로이드 뒤로 가기 = 연습 모드 닫기 */
window.addEventListener("popstate", () => {
  let st = null;
  try { st = history.state; } catch (e) {}
  if (PC.open && !(st && st.practice === PC.openId)) pcHide();
});
window.addEventListener("pagehide", () => { if (PC.open && PC.screen === "play") pcSavePos(); });

practiceEl.addEventListener("click", e => {
  const t = e.target;
  let el;
  if ((el = t.closest("[data-pc]"))) {
    if (el.disabled) return;
    const a = el.dataset.pc;
    buzz();
    if (a === "close") closePractice();
    else if (a === "setup") { pcSavePos(); pcScreen("setup"); }   // 연습 화면 [옵션] → 시작 화면(범위·내용·이어 하기). 바로 연습이면 위치 저장 안 함
    else if (a === "start" || a === "restart") pcStart(false);
    else if (a === "resume") pcStart(true);
    else if (a === "next") pcNext();
    else if (a === "prev") pcPrev();
    else if (a === "again") pcGo(PC.idx, PC.step);
    else if (a === "rate") { PC.opts.rate = PC.opts.rate === 1 ? 0.8 : 1; savePractice(); Player.setRate(PC.opts.rate); pcPaint(); }
    return;
  }
  if ((el = t.closest("[data-pc-step]"))) { buzz(); pcGo(PC.idx, +el.dataset.pcStep); return; }
  if ((el = t.closest(".pc-en .w"))) { buzz(); pcTapWord(+el.dataset.w); return; }
  /* 시작 화면 옵션: 바꿀 때마다 저장(다음에 그대로 보여 줌) */
  const o = PC.opts;
  if ((el = t.closest("[data-pc-scope]"))) {
    o.scope = el.dataset.pcScope;
    if (o.scope === "cat" && !o.cats.length) o.cats = [CARDS[PC.curCi].category];
  } else if ((el = t.closest("[data-pc-cat]"))) {
    const n = el.dataset.pcCat;
    o.cats = o.cats.includes(n) ? o.cats.filter(x => x !== n) : o.cats.concat([n]);
  } else if ((el = t.closest("[data-pc-set] button"))) {
    const name = el.parentNode.dataset.pcSet, v = el.dataset.v;
    o[name] = name === "rate" ? parseFloat(v) : v;
  } else return;
  buzz();
  savePractice();
  pcRenderSetup();
});

/* ================= 웹앱 설치 (GitHub Pages 같은 https 주소에서만) ================= */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* sw.js가 없으면 설치 기능만 빠지고 앱은 그대로 동작 */ });
  });
}

/* ================= 자동 점검: 주소 끝에 #check 를 붙여 열면 결과가 뜸 (규칙은 CLAUDE.md) ================= */
function sceneOf(card) {
  return card.scene || (card.category === "일상 대화" ? "free" : "task");   // task: 정해진 용건(10단어), free: 자유 대화(12단어)
}
/* 카드 데이터 검사(규칙 = CLAUDE.md '카드 만들기 — 필수 항목 체크리스트'). 앱의 진짜 함수(밑줄·청크·썰 문장 나누기)로 확인.
   issues = 고쳐야 하는 문제, warnings = 규칙 권장 사항(앱은 동작함). 글 형식: "카드 3 (id 3) 어느 항목: 무엇이 문제".
   파일 단위 검사(JS 문법·index.html/sw.js 등록·카드 파일 위치·기존 id 바뀜)는 .claude/check-cards.html이 이 함수에 더해서 함.
   카드에 새 칸이 생기면 아래 KEYS와 검사, CLAUDE.md 체크리스트를 같이 고칠 것 */
const CHECK_KEYS = {
  card: ["id", "category", "title", "situation", "scene", "hooks", "dialogue", "expressions", "extraExpressions"],
  hook: ["ko", "line"],
  line: ["who", "en", "ko", "chunks", "tips", "soloChunks"],
  expr: ["id", "phrase", "forms", "meaning", "ko", "examples", "story"],
  ex: ["en", "ko", "chunks", "tips", "soloChunks"],
  story: ["en", "ko", "sentences"],
  sent: ["chunks", "ko", "tips", "soloChunks"],
  tip: ["target", "ko"]
};
function runChecks() {
  const issues = [], warnings = [];
  const stats = { cards: CARDS.length, expressions: 0, examples: 0, meTurns: 0, questions: QUESTIONS.length, pUnits: 0, pDone: 0 };   // pUnits·pDone: 연습 문장 전체·데이터 있는 것
  const ids = new Set();
  const allExprIds = new Set();
  const titles = {};
  /* 모르는 칸(오타 — 앱이 읽지 않아서 그 데이터가 빠진 것과 같음) */
  const keyCheck = (o, kind, where) => {
    if (!o || typeof o !== "object") return;
    Object.keys(o).forEach(k => { if (!CHECK_KEYS[kind].includes(k)) issues.push(where + ": 모르는 칸 \"" + k + "\" — 오타? (앱이 읽지 않음)"); });
  };
  const sentCount = t => String(t || "").split(/(?<=[.!?]["”]?)\s+(?=[A-Z“"])/).filter(s => s.trim()).length;
  const curly = (t, where) => { if (/’/.test(t || "")) warnings.push(where + ": 둥근 아포스트로피(’) — 곧은 ' 로"); };
  CARDS.forEach((c, i) => {
    const tag = "카드 " + (i + 1) + (c.id != null ? " (id " + c.id + ")" : "");
    keyCheck(c, "card", tag);
    if (c.id == null) issues.push(tag + ": id 없음");
    else {
      if (!Number.isInteger(c.id)) issues.push(tag + ": id는 정수여야 함 — " + JSON.stringify(c.id));
      if (ids.has(c.id)) issues.push(tag + ": id 중복");
      ids.add(c.id);
    }
    ["category", "title", "situation"].forEach(k => { if (!c[k]) issues.push(tag + ": " + k + " 없음"); });
    if (c.category && !(c.category in CATEGORY_HUE)) issues.push(tag + ": category \"" + c.category + "\"가 categories.js에 없음 (색·이모지·카테고리 고르기에 안 나옴)");
    if (c.scene != null && c.scene !== "task" && c.scene !== "free") issues.push(tag + ": scene은 \"task\" 또는 \"free\" — " + c.scene);
    if (c.title) {
      if (titles[c.title]) warnings.push(tag + ": 제목이 카드 " + titles[c.title] + "와 같음 — " + c.title);
      titles[c.title] = i + 1;
    }
    if (c.situation && /[.!?]/.test(c.situation) && String(c.situation).split(/(?<=[.!?])\s+/).filter(Boolean).length > 3) warnings.push(tag + ": 상황 설명이 길어요(1~2문장 권장)");
    if (c.dialogue != null && !Array.isArray(c.dialogue)) issues.push(tag + ": dialogue는 목록이어야 함");
    const d = Array.isArray(c.dialogue) ? c.dialogue : [];
    /* hooks: 홈 '오늘의 질문' 1~3개 { ko: 질문, line: 내(me) 대사 줄 번호(1부터) }. 한 줄에 질문 하나(질문 기록 key = 카드id:line) */
    if (!Array.isArray(c.hooks) || !c.hooks.length) issues.push(tag + ": hooks(홈 '오늘의 질문') 없음 — 1~3개");
    else {
      if (c.hooks.length > 3) issues.push(tag + ": hooks " + c.hooks.length + "개 (1~3개)");
      const hookLines = new Set();
      c.hooks.forEach((h, k) => {
        const lt = tag + " 질문 " + (k + 1);
        keyCheck(h, "hook", lt);
        if (!h || typeof h.ko !== "string" || !h.ko.trim()) issues.push(lt + ": ko(질문 문장) 없음");
        else {
          if (/[A-Za-z]{2,}/.test(h.ko)) warnings.push(lt + ": 질문에 영어가 섞임(정답 영어는 넣지 않기) — " + h.ko);
          if (!/[?？]$/.test(h.ko.trim())) warnings.push(lt + ": 질문은 물음표로 끝내기 — " + h.ko);
        }
        if (!h || !Number.isInteger(h.line) || h.line < 1 || h.line > d.length) issues.push(lt + ": line은 대사 줄 번호(1~" + d.length + ")여야 함 — " + JSON.stringify(h && h.line));
        else {
          if (!d[h.line - 1] || d[h.line - 1].who !== "me") issues.push(lt + ": line " + h.line + "은 내(me) 대사가 아님");
          if (hookLines.has(h.line)) issues.push(lt + ": 같은 줄(" + h.line + ")에 질문이 둘");
          hookLines.add(h.line);
        }
      });
    }
    d.forEach((x, li) => {
      keyCheck(x, "line", tag + " 대사 " + (li + 1));
      if (!x || typeof x.who !== "string" || !x.who) issues.push(tag + " 대사 " + (li + 1) + ": who(화자) 없음");
      curly(x && x.en, tag + " 대사 " + (li + 1));
    });
    if (d.length < 4 || d.length > 10) issues.push(tag + ": 대화 " + d.length + "줄 (4~10줄)");
    const me = d.filter(x => x.who === "me");
    if (me.length < 2) issues.push(tag + ": me 턴 " + me.length + "개 (2턴 이상)");
    /* 상대 화자: 카드마다 한 명, WHO_LABEL에 있는 이름(듣기 모드 이름표·대화 화자 표시에 쓰임) */
    const them = Array.from(new Set(d.filter(x => x.who !== "me").map(x => x.who)));
    if (them.length !== 1) issues.push(tag + ": 상대 화자 " + them.length + "명 — " + them.join(", ") + " (카드마다 한 명)");
    them.filter(w => !WHO_LABEL[w]).forEach(w => issues.push(tag + ": 화자 \"" + w + "\"가 WHO_LABEL에 없음 (이름표가 '상대'로 나옴)"));
    const limit = sceneOf(c) === "free" ? 12 : 10;
    d.forEach(x => { if (!x.en || !x.ko) issues.push(tag + ": 대사 en/ko 누락 — " + (x.en || x.ko || "")); });
    me.forEach(x => {
      stats.meTurns++;
      const w = String(x.en || "").split(/\s+/).filter(Boolean).length;
      if (w > limit) issues.push(tag + ": me " + w + "단어 (상한 " + limit + ") — " + x.en);
    });
    /* 연습 모드 데이터(대화 줄·예문·썰 문장 공통): chunks의 슬래시·연음 표시를 빼고 이으면 원문과 정확히 같음(괄호 속 한국어는 뺀 기준),
       청크 하나 6단어까지, 팁 0~2개(target이 문장에 있음), soloChunks는 청크 번호. 없는 문장은 카드마다 개수로 */
    const miss = { dlg: 0, ex: 0, story: 0 };
    const unitCheck = (lt, display, x) => {
      stats.pUnits++;
      if (!x || !x.chunks) return false;
      stats.pDone++;
      if (typeof x.chunks !== "string") { issues.push(lt + ": chunks는 글(문자열)이어야 함"); return true; }
      const pc = parseChunks(x.chunks);
      if (display != null && pc.text !== display) issues.push(lt + ": 슬래시·연음 표시를 빼고 이으면 원문과 다름 — \"" + pc.text + "\" / 원문 \"" + display + "\"");
      pc.parts.forEach(p => {
        const nw = pc.text.slice(p.s, p.e).split(/\s+/).filter(w => /[A-Za-z0-9]/.test(w)).length;   // 단어 = 글자·숫자가 있는 덩어리("…"는 안 셈, getScript와 같은 기준)
        if (!nw) issues.push(lt + ": 빈 청크 — " + x.chunks);
        else if (nw > 6) issues.push(lt + ": 청크 하나가 " + nw + "단어 (보통 2~5단어, 6단어까지) — " + x.chunks);
      });
      if (pc.links.length > 3) warnings.push(lt + ": 연음 표시(‿) " + pc.links.length + "곳 — 문장마다 0~3곳 권장");
      /* 말줄임표·대시 바로 옆 슬래시: 음성(TTS)이 긴 쉼으로 읽는데 그 근처 단어 시간이 밀려서, 잘라 쓰면 옆 청크의 단어가 섞임
         (2026-10-03 카드 8 "You got it. … / Alright, here we are!" — 앞 청크가 Alright까지 읽음) → 두 청크 모두 soloChunks로 */
      const solo = Array.isArray(x.soloChunks) ? x.soloChunks : [];
      pc.parts.forEach((p, k) => {
        const q = pc.parts[k + 1];
        if (!q) return;
        const L = pc.text.slice(p.s, p.e), R = pc.text.slice(q.s, q.e);
        if ((/(…|—|–|\.\.\.)["”’]?\s*$/.test(L) || /^\s*["“]?(…|—|–|\.\.\.)/.test(R)) && !(solo.includes(k + 1) && solo.includes(k + 2)))
          issues.push(lt + ": 청크 " + (k + 1) + "·" + (k + 2) + " 경계가 말줄임표·대시 바로 옆 — 잘라 쓰면 옆 단어가 섞임(두 청크 모두 soloChunks에 넣기, 또는 슬래시를 옮기기)");
      });
      const tips = x.tips == null ? [] : x.tips;
      if (!Array.isArray(tips) || tips.length > 2) issues.push(lt + ": 발음 팁은 0~2개 목록");
      else tips.forEach(tp => {
        keyCheck(tp, "tip", lt + " 발음 팁");
        if (!tp || !tp.target || !tp.ko) { issues.push(lt + ": 발음 팁 target/ko 누락"); return; }
        if (pc.text.toLowerCase().indexOf(String(tp.target).toLowerCase()) < 0) issues.push(lt + ": 발음 팁 대상 \"" + tp.target + "\"이 문장에 없음");
      });
      if (x.soloChunks != null && !(Array.isArray(x.soloChunks) && pc.parts.length > 1 &&
          x.soloChunks.every(k => Number.isInteger(k) && k >= 1 && k <= pc.parts.length))) {
        issues.push(lt + ": soloChunks는 청크 번호(1~" + pc.parts.length + ") 목록이어야 함");
      }
      return true;
    };
    d.forEach((x, li) => { if (!unitCheck(tag + " 대사 " + (li + 1), stripGloss(x.en), x)) miss.dlg++; });
    const ex = c.expressions || [];
    if (ex.length < 2 || ex.length > 5) issues.push(tag + ": 표현 " + ex.length + "개 (2~5개)");
    if (!Array.isArray(c.extraExpressions)) issues.push(tag + ": extraExpressions 칸 없음 (비어 있어도 [] 로)");

    /* 밑줄 시뮬레이션: 화면과 똑같은 규칙으로 어떤 표현이 실제로 밑줄이 생기는지 */
    const usedSim = new Set();
    d.forEach(x => findRanges(x.en || "", c, i, usedSim).forEach(r => usedSim.add(r.ei)));

    const checkExpr = (e, kind, idx) => {
      stats.expressions++;
      const p = "\"" + e.phrase + "\"";
      const want = kind === "core" ? "e" : "x";
      keyCheck(e, "expr", tag + " " + p);
      if (e.phrase != null && typeof e.phrase !== "string") issues.push(tag + " " + p + ": phrase는 글(문자열)이어야 함");
      if (e.forms != null && !(Array.isArray(e.forms) && e.forms.every(f => typeof f === "string" && f))) issues.push(tag + " " + p + ": forms는 글 목록이어야 함");
      if (e.examples != null && !Array.isArray(e.examples)) issues.push(tag + " " + p + ": examples는 목록이어야 함");
      /* 목록·복습에 보이는 짧은 뜻(shortMeaning): meaning이 없으면 ko 맨 앞 '…' 안 글자 */
      if (e.ko && !e.meaning && !/'[^']{1,40}'/.test(e.ko)) warnings.push(tag + " " + p + ": ko에 '짧은 뜻'(작은따옴표)이 없음 — 목록·복습의 짧은 뜻이 \"" + shortMeaning(e) + "\"로 보임");
      if (!e.id) issues.push(tag + " " + p + ": 표현 id 없음");
      else {
        if (allExprIds.has(e.id)) issues.push(tag + " " + p + ": 표현 id 중복 — " + e.id);
        allExprIds.add(e.id);
        if (!new RegExp("^c" + c.id + "-" + want + "\\d+$").test(e.id)) issues.push(tag + " " + p + ": 표현 id 형식 (c" + c.id + "-" + want + "숫자) — " + e.id);
      }
      if (!e.phrase || !e.ko) issues.push(tag + ": 표현 phrase/ko 누락");
      if (kind === "core") {
        const k = normPhrase(e.phrase);
        if (EXPR_OWNER[k] !== i) issues.push(tag + " " + p + ": 앞 카드(" + (EXPR_OWNER[k] + 1) + "번)와 같은 표현이라 밑줄이 안 생김");
        else if (!usedSim.has(idx)) issues.push(tag + " " + p + ": 대화에 없거나, 다른 밑줄과 겹치거나 붙어 있어서 밑줄이 안 생김");
      }
      const n = (e.examples || []).length;
      stats.examples += n;
      if (n !== 5) issues.push(tag + " " + p + ": 예문 " + n + "개 (정확히 5개)");
      const exSeen = new Set();
      (e.examples || []).forEach((x, n) => {
        const lt = tag + " " + p + " 예문 " + (n + 1);
        keyCheck(x, "ex", lt);
        if (!x || !x.en || !x.ko) { issues.push(lt + ": en/ko 누락"); return; }
        if (exSeen.has(x.en)) issues.push(lt + ": 앞 예문과 같은 문장");
        exSeen.add(x.en);
        if (!exprFound(e, x.en)) warnings.push(lt + ": 예문에 표현이 안 보임(활용형이면 forms에) — " + x.en);
        if (/[가-힣]/.test(x.en)) warnings.push(lt + ": 예문 영어에 한글(괄호 뜻은 쓰지 않는 게 원칙)");
        if (sentCount(x.en) > 2) warnings.push(lt + ": 예문은 한 번에 하는 말(짧은 문장 1~2개) — " + x.en);
        curly(x.en, lt);
      });
      (e.examples || []).forEach((x, n) => { if (x && x.en && !unitCheck(tag + " " + p + " 예문 " + (n + 1), stripGloss(x.en), x)) miss.ex++; });
      if (!e.story || !e.story.en || !e.story.ko) { issues.push(tag + " " + p + ": 썰 누락"); return; }
      /* 썰 연습 문장(story.sentences): 이으면 썰 영어(괄호 속 한국어를 뺀 것)와 같음, 문장마다 chunks·ko */
      const st = e.story, G = stripGloss(st.en);
      keyCheck(st, "story", tag + " " + p + " 썰");
      curly(st.en, tag + " " + p + " 썰");
      if (/"/.test(st.en)) warnings.push(tag + " " + p + " 썰: 인용은 둥근 따옴표 “ ” 로");
      if (!Array.isArray(st.sentences) || !st.sentences.length) { miss.story++; stats.pUnits += storySents(st).length; }
      else {
        const texts = st.sentences.map(s => (s && typeof s.chunks === "string" ? parseChunks(s.chunks).text : ""));
        if (texts.join(" ") !== G) issues.push(tag + " " + p + ": 썰 sentences의 chunks를 이으면 썰 영어(괄호 속 한국어 뺀 것)와 다름 — \"" + texts.join(" ") + "\"");
        if (getScript(st.en).words.length !== getScript(G).words.length) issues.push(tag + " " + p + ": 썰의 괄호 속 한국어 때문에 단어 수가 달라짐(괄호 앞뒤 공백 확인)");
        st.sentences.forEach((s, n) => {
          const lt = tag + " " + p + " 썰 문장 " + (n + 1);
          keyCheck(s, "sent", lt);
          if (!unitCheck(lt, null, s)) issues.push(lt + ": chunks 없음");
          if (!s || !s.ko) issues.push(lt + ": ko(한글 해석) 없음");
        });
      }
      if (!exprFound(e, e.story.en)) issues.push(tag + " " + p + ": 썰에 표현이 없음");
      if (/[가-힣]/.test(e.story.en)) issues.push(tag + " " + p + ": 썰 영어에 한글이 섞임");
      const sents = e.story.en.split(/(?<=[.!?]["”]?)\s+(?=[A-Z“"])/).length;
      if (sents < 3 || sents > 5) issues.push(tag + " " + p + ": 썰 " + sents + "문장 (3~4문장 권장)");
    };
    ex.forEach((e, idx) => checkExpr(e, "core", idx));
    (c.extraExpressions || []).forEach((e, idx) => checkExpr(e, "extra", idx));
    const missTxt = [miss.dlg ? "대사 " + miss.dlg + "줄" : "", miss.ex ? "예문 " + miss.ex + "개" : "", miss.story ? "썰 " + miss.story + "편" : ""].filter(Boolean);
    if (missTxt.length) issues.push(tag + ": 연습 데이터 없음 — " + missTxt.join(" · "));
  });
  const qSeen = new Set();
  QUESTIONS.forEach((q, i) => {
    if (!q.en || !q.ko) issues.push("질문 " + (i + 1) + ": en/ko 누락");
    const k = String(q.en || "").toLowerCase();
    if (qSeen.has(k)) issues.push("질문 " + (i + 1) + ": 중복 — " + q.en);
    qSeen.add(k);
  });
  if (QUESTIONS.length < 60) issues.push("질문 " + QUESTIONS.length + "개 (60개 이상 권장)");
  /* 카드 id는 1부터 빈칸 없이 이어지는 게 원칙(카드를 지웠으면 빈칸이 정상일 수 있음) */
  const nums = Array.from(ids).filter(Number.isInteger).sort((a, b) => a - b);
  nums.forEach((n, k) => { const want = k ? nums[k - 1] + 1 : 1; if (n !== want) warnings.push("카드 id: " + want + (n - 1 > want ? "~" + (n - 1) : "") + "번이 비어 있음 (새 카드는 가장 큰 id 다음 번호로)"); });
  return { stats, issues, warnings };
}
window.runChecks = runChecks;
if (location.hash === "#check") {
  setTimeout(() => {
    const r = runChecks();
    const s = r.stats;
    showSheet("자동 점검", r.issues.length ? "문제 " + r.issues.length + "개" : "이상 없음",
      '<p class="note">카드 ' + s.cards + '장 · 표현 ' + s.expressions + '개 · 예문 ' + s.examples + '개 · me 턴 ' + s.meTurns + '개 · 질문 ' + s.questions + '개 · 연습 데이터 ' + s.pDone + ' / ' + s.pUnits + '문장(대사·예문·썰)</p>' +
      (r.issues.length ? '<ul class="note">' + r.issues.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : "") +
      (r.warnings.length ? '<p class="note">권장 사항(앱은 동작함) ' + r.warnings.length + '개</p><ul class="note">' + r.warnings.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : ""));
  }, 300);
}

/* ---------- 바텀시트 ---------- */
let sheetOpen = false;
/* 상황 카드의 밑줄에서 연 시트: 재생 중이던 소리를 일시정지해 두었다가, 닫을 때 이어서 재생.
   { token: 연 순간의 Player 토큰, paused: 이 시트가 멈췄는지 }. 시트 안에서 다른 소리를 틀면 토큰이 바뀌어 이어 재생 안 함 */
let sheetHold = null;

const SHEET_FOOT_DEFAULT = '<button class="btn sheet-close" type="button" data-close>닫기</button>';
/* foot: 시트 맨 아래 버튼 줄(엄지 위치). 없으면 '닫기' */
function showSheet(ctx, title, html, foot) {
  if (!sheetHold || sheetHold.token !== Player.getToken()) Player.stop();
  sheetCtx.textContent = ctx;
  sheetTitle.textContent = title;
  sheetBody.innerHTML = html;
  sheetFoot.innerHTML = foot || SHEET_FOOT_DEFAULT;
  sheetBody.scrollTop = 0;
  sheet.style.transform = "";
  sheet.classList.add("on");
  scrim.classList.add("on");
  sheet.setAttribute("aria-hidden", "false");
  if (!sheetOpen) {
    sheetOpen = true;
    try { history.pushState({ sheet: true }, ""); } catch (e) {}
  }
}

/* 예문 5개 / 썰 — 상황 카드 시트, 표현 상세, 복습 화면이 같이 씀 */
/* .rd 묶음 하나(예문 5개 / 썰)를 재생기 하나로 읽음(인터랙티브 스크립트): 단어 탭 → 그 단어부터, 전체 듣기·일시정지·이어 듣기.
   data-who = 목소리(예문은 상대, 썰은 나), data-tap = 재생 중이 아닐 때 단어를 탭하면 그 문장만(one) / 끝까지(all) */
function rdPlayBtn(label) {
  return '<button class="pill rd-play" type="button" data-rd-play data-label="' + esc(label) + '">' + ICON_PLAY + '<span>' + esc(label) + '</span></button>';
}
function examplesHtml(ex) {
  const items = (ex.examples || []).map((x, i) =>
    '<li><div class="ex-en">' + scriptHtml(x.en, markRanges(x.en, ex)) + '</div><div class="ex-ko">' + esc(x.ko) + '</div>' +
    '<button class="spk" type="button" aria-label="예문 듣기" data-rd-one="' + i + '">' + ICON_SPEAKER + '</button></li>'
  ).join("");
  return '<section class="rd" data-who="them" data-tap="one"><div class="sec-row"><h4 class="sec-h">예문</h4>' + rdPlayBtn("예문 전체 듣기") + '</div>' +
    '<ol class="ex">' + items + '</ol></section>';
}
function storyHtml(ex) {
  if (!ex.story) return "";
  return '<section class="rd" data-who="me" data-tap="all"><div class="sec-row"><h4 class="sec-h">이 표현으로 썰 풀기</h4>' + rdPlayBtn("듣기") + '</div>' +
    '<div class="story"><p class="story-en">' + scriptHtml(ex.story.en, markRanges(ex.story.en, ex)) + '</p>' +
    '<p class="story-ko">' + esc(ex.story.ko) + '</p></div></section>';
}
function sheetReader(sec) {
  if (!sec._rd) {
    sec._rd = createReader({
      items: () => Array.from(sec.querySelectorAll(".sc")).map(el => {
        const li = el.closest("li");
        return { el, who: sec.dataset.who, btn: li ? li.querySelector(".spk") : sec.querySelector("[data-rd-play]") };
      }),
      rate: () => settings.speed,
      gap: 600,
      tapSingle: sec.dataset.tap !== "all",
      onChange: () => syncRdBtn(sec)
    });
  }
  return sec._rd;
}
/* 전체 듣기 버튼 모양: ▶ (이름) / ⏸ 일시정지 / ▶ 이어 듣기 */
function syncRdBtn(sec) {
  const b = sec.querySelector("[data-rd-play]");
  if (!b) return;
  const s = sec._rd ? sec._rd.state() : { active: false };
  const live = s.active && !s.single;
  b.classList.toggle("on", live);
  b.innerHTML = !live ? ICON_PLAY + "<span>" + esc(b.dataset.label) + "</span>" :
    s.paused ? ICON_PLAY + "<span>이어 듣기</span>" : ICON_PAUSE + "<span>일시정지</span>";
}
Player.onChange(() => { if (sheetOpen) sheetBody.querySelectorAll(".rd").forEach(syncRdBtn); });

/* 상황 카드의 밑줄·표현 칩 → 표현 상세(학습하기·연습장 포함)로 */
function openExpression(ci, ei, kind) {
  const card = CARDS[ci];
  const list = card && (kind === "extra" ? card.extraExpressions : card.expressions);
  const ex = list && list[ei];
  const id = ex && exprIdOf(card, ex, ei, kind);
  if (!id || !EXPR_BY_ID[id]) return;
  if (!sheetOpen) {
    sheetHold = { token: Player.getToken(), paused: !Player.isPaused() };
    if (sheetHold.paused) Player.pause();
  }
  openExprDetail(id, { fromCard: true });
}

/* 목록 한 줄(번호·제목·본 카드 ✓·지금 카드 강조) — 전체 목록과 카테고리 목록(태그)이 같이 씀 */
function tocItemHtml(i, cur) {
  const seen = seenSet.has(cardKey(i));
  const cls = "toc-item" + (seen ? " seen" : "") + (i === cur ? " current" : "");
  return '<li><button class="' + cls + '" type="button" data-go="' + i + '"' + (i === cur ? ' aria-current="true"' : "") + '>' +
    '<span class="toc-n">' + (i + 1) + '</span><span class="toc-t">' + esc(CARDS[i].title) + '</span>' +
    '<span class="toc-check"' + (seen ? ' aria-label="봤음"' : "") + '>' + (seen ? ICON_CHECK : "") + '</span></button></li>';
}
const curIdx = () => (activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : -1);
/* 전체 목록. openCat을 주면 그 카테고리를 펼친 채로(카테고리 목록의 [전체 목록 보기]), 아니면 지금 보던 카드의 카테고리를 펼침 */
function openList(openCat) {
  const cur = curIdx();
  const seenCount = CARDS.filter((c, i) => seenSet.has(cardKey(i))).length;
  const pct = CARDS.length ? Math.round(seenCount / CARDS.length * 100) : 0;
  const groups = [];
  CARDS.forEach((c, i) => {
    let g = groups.find(x => x.name === c.category);
    if (!g) { g = { name: c.category, items: [] }; groups.push(g); }
    g.items.push(i);
  });
  const listHtml = groups.map(g => {
    const seenInGroup = g.items.filter(i => seenSet.has(cardKey(i))).length;
    const open = openCat ? g.name === openCat : g.items.includes(cur);   // 지금 보던 카드의 카테고리만 펼침
    return '<section class="toc-group' + (open ? " open" : "") + '" style="--h:' + hueOf(g.name) + '">' +
      '<button class="toc-head" type="button" data-toc aria-expanded="' + open + '"><span class="toc-emoji" aria-hidden="true">' + (CATEGORY_EMOJI[g.name] || "📌") + '</span>' +
        '<h4 class="toc-cat">' + esc(g.name) + '</h4>' +
        '<span class="toc-cnt">' + seenInGroup + ' / ' + g.items.length + '</span><span class="toc-chev" aria-hidden="true">' + ICON_CHEVRON + '</span></button>' +
      '<ul class="toc">' +
      g.items.map(i => tocItemHtml(i, cur)).join("") + '</ul></section>';
  }).join("");
  const warn = storageOK ? "" :
    '<p class="note">지금 연 방식에서는 기록이 저장되지 않아서, 앱을 다시 열면 처음부터 시작해요.</p>';
  const html =
    '<div class="prog"><div class="prog-text">본 카드 <b>' + seenCount + '</b> / ' + CARDS.length + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' + warn + '</div>' +
    '<div class="btn-row"><button class="btn" type="button" id="goUnseen">안 본 카드로</button>' +
      '<button class="btn" type="button" id="goFirst">처음부터</button></div>' +
    '<div class="toc-bar"><span class="set-label">카테고리</span><button class="toc-all" type="button" data-toc-all></button></div>' +
    listHtml +
    '<div class="set-group"><div class="btn-row"><button class="btn" type="button" id="resetProgress">본 기록 지우기</button></div></div>';
  showSheet("카드 " + CARDS.length + "장", "목록", html);
  syncTocAll();
  const openEl = openCat && sheetBody.querySelector(".toc-group.open");
  const curEl = sheetBody.querySelector(".toc-group.open .toc-item.current");
  if (openEl && !curEl) sheetBody.scrollTop = Math.max(0, openEl.offsetTop - 12);
  else if (curEl) sheetBody.scrollTop = Math.max(0, curEl.offsetTop - sheetBody.clientHeight / 2);
}
/* 카드 왼쪽 위 카테고리 태그 → 그 카테고리의 상황만(목록과 같은 모양). 맨 아래 [전체 목록 보기] → 전체 목록(그 카테고리 펼침) */
function openCatList(cat) {
  const cur = curIdx();
  const items = CARDS.map((c, i) => i).filter(i => CARDS[i].category === cat);
  const seen = items.filter(i => seenSet.has(cardKey(i))).length;
  showSheet((CATEGORY_EMOJI[cat] || "") + " 카테고리 · " + seen + " / " + items.length + "장 봄", cat,
    '<div class="cat-list" style="--h:' + hueOf(cat) + '"><ul class="toc">' + items.map(i => tocItemHtml(i, cur)).join("") + '</ul></div>',
    '<div class="btn-row"><button class="btn" type="button" data-full-list="' + esc(cat) + '">전체 목록 보기</button>' +
      '<button class="btn sheet-close" type="button" data-close>닫기</button></div>');
}
/* 목록의 카테고리 펼치기·접기: 머리 하나(data-toc) / 전체(data-toc-all — 하나라도 접혀 있으면 [전체 펼치기], 다 펼쳐져 있으면 [전체 접기]) */
function syncTocAll() {
  const b = sheetBody.querySelector("[data-toc-all]");
  if (!b) return;
  const groups = Array.from(sheetBody.querySelectorAll(".toc-group"));
  b.textContent = groups.every(g => g.classList.contains("open")) ? "전체 접기" : "전체 펼치기";
}
function setTocOpen(g, open) {
  g.classList.toggle("open", open);
  g.querySelector("[data-toc]").setAttribute("aria-expanded", String(open));
}

function goFromList(idx) {
  closeSheet();
  setTimeout(() => jumpTo(idx), 0);
}

function voiceOptions(selected) {
  const known = EL_VOICES.some(v => v.id === selected);
  return EL_VOICES.map(v => '<option value="' + v.id + '"' + (v.id === selected ? " selected" : "") + '>' + esc(v.name) + '</option>').join("") +
    '<option value="custom"' + (known ? "" : " selected") + '>직접 입력 (voice ID)</option>';
}

function voiceField(name, label) {
  const known = EL_VOICES.some(v => v.id === settings[name]);
  return '<div class="set-group"><label class="set-label" for="sel-' + name + '">' + label + '</label>' +
    '<select class="field" id="sel-' + name + '" data-voice="' + name + '">' + voiceOptions(settings[name]) + '</select>' +
    '<input class="field" type="text" id="cus-' + name + '" data-voice-custom="' + name + '" placeholder="voice ID 붙여넣기" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + (known ? "" : esc(settings[name])) + '"' + (known ? " hidden" : "") + '>' +
  '</div>';
}

function keyField(note) {
  return '<div class="set-group"><label class="set-label" for="setKey">ElevenLabs API 키</label>' +
    '<input class="field" id="setKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk_로 시작하는 키" value="' + esc(settings.apiKey) + '">' +
    '<p class="note">' + note + '</p>' +
  '</div>';
}

function openSettings() {
  const seg = (name, opts) => '<div class="seg" data-set="' + name + '">' +
    opts.map(o => '<button type="button" data-v="' + o[0] + '" aria-pressed="' + (String(settings[name]) === String(o[0])) + '">' + o[1] + '</button>').join("") +
  '</div>';
  const html =
    '<div class="set-group"><span class="set-label">음성 엔진</span>' +
      seg("engine", [["device", "폰 기본 음성"], ["eleven", "ElevenLabs"]]) +
      '<p class="note">폰 기본 음성은 무료이고 바로 쓸 수 있어요. ElevenLabs는 훨씬 자연스럽지만 API 키가 필요하고 크레딧이 들어요.</p>' +
    '</div>' +
    '<div class="el-only"' + (settings.engine === "eleven" ? "" : " hidden") + '>' +
      keyField("키는 이 폰의 이 브라우저 안에만 저장돼요. 글쓰기 탭과 같은 키를 써요. ElevenLabs에서 Text to Speech 권한만 켜고 크레딧 한도를 정해 둔 키를 쓰는 걸 추천해요. 한 번 들은 문장은 폰에 저장돼서 다시 들을 땐 크레딧이 들지 않아요.") +
      '<div class="set-group"><label class="set-label" for="setModel">모델</label>' +
        '<select class="field" id="setModel">' + EL_MODELS.map(m => '<option value="' + m.id + '"' + (m.id === settings.model ? " selected" : "") + '>' + esc(m.name) + '</option>').join("") + '</select>' +
      '</div>' +
      voiceField("voiceThem", "상대 목소리 (직원·친구 등, 예문)") +
      voiceField("voiceMe", "내 목소리 (내 대사, 썰)") +
    '</div>' +
    '<div class="set-group"><span class="set-label">속도 (읽기 모드 · 예문 · 썰)</span>' +
      seg("speed", [["0.85", "천천히"], ["1", "보통"]]) +
      '<p class="note">듣기·쉐도잉 모드 속도는 카드 아래 0.8x / 1.0x 버튼으로 따로 정해요.</p>' +
    '</div>' +
    '<div class="set-group"><div class="btn-row">' +
      '<button class="btn" type="button" id="testVoice">목소리 들어보기</button>' +
      '<button class="btn" type="button" id="clearCache">저장된 음성 지우기</button>' +
    '</div></div>';
  showSheet("설정", "음성", html);
}

/* 시트 안 클릭: 듣기 버튼 + 설정 컨트롤 */
sheetBody.addEventListener("click", e => {
  const t = e.target;
  let el;
  const sec = t.closest(".rd");
  if (sec) {                                                    // 예문·썰(인터랙티브 스크립트)
    const rd = sheetReader(sec);
    if ((el = t.closest("[data-rd-play]"))) {
      buzz();
      const s = rd.state();
      if (s.active && !s.single) rd.toggle(); else rd.play(0, 0, false);
      return;
    }
    if ((el = t.closest("[data-rd-one]"))) {
      const i = +el.dataset.rdOne, s = rd.state();
      if (s.active && s.single && s.index === i) Player.stop(); else rd.play(i, 0, true);
      return;
    }
    if ((el = t.closest(".w"))) {
      rd.seek(Array.from(sec.querySelectorAll(".sc")).indexOf(el.closest(".sc")), +el.dataset.w);
      return;
    }
  }
  if ((el = t.closest("[data-toc]"))) { const g = el.closest(".toc-group"); setTocOpen(g, !g.classList.contains("open")); syncTocAll(); buzz(); return; }
  if ((el = t.closest("[data-toc-all]"))) {
    const groups = Array.from(sheetBody.querySelectorAll(".toc-group")), open = !groups.every(g => g.classList.contains("open"));
    groups.forEach(g => setTocOpen(g, open));
    syncTocAll();
    buzz();
    return;
  }
  if ((el = t.closest("[data-go]"))) { goFromList(+el.dataset.go); return; }
  if ((el = t.closest("#goFirst"))) { goFromList(0); return; }
  if ((el = t.closest("#backupAll"))) {
    saveToday();
    const text = backupText();
    if (!text) { toast("아직 저장된 기록이 없어요"); return; }
    copyText(text).then(ok => toast(ok ? "전체 기록을 복사했어요" : "복사하지 못했어요"));
    return;
  }
  if ((el = t.closest("#goUnseen"))) {
    const cur = activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : -1;
    let idx = -1;
    for (let k = 1; k <= CARDS.length && idx < 0; k++) {
      const i = (cur + k + CARDS.length) % CARDS.length;
      if (!seenSet.has(cardKey(i))) idx = i;
    }
    if (idx < 0) { toast("모든 카드를 다 봤어요!"); return; }
    goFromList(idx);
    return;
  }
  if ((el = t.closest("#resetProgress"))) {
    seenSet.clear();
    progress.at = {};
    if (activeCard && activeCard.dataset.i != null) seenSet.add(cardKey(+activeCard.dataset.i));
    saveProgress();
    openList();
    toast("본 기록을 지웠어요");
    return;
  }
  if ((el = t.closest(".seg button"))) {
    const name = el.parentNode.dataset.set;
    const v = el.dataset.v;
    settings[name] = name === "speed" ? parseFloat(v) : v;
    saveSettings();
    el.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === el ? "true" : "false"));
    if (name === "engine") {
      const box = sheetBody.querySelector(".el-only");
      if (box) box.hidden = v !== "eleven";
    }
    buzz();
    return;
  }
  if ((el = t.closest("#testVoice"))) {
    if (Player.isPlaying(el)) { Player.stop(); return; }
    Player.play("Hi there! What can I get started for you?", "them", el);
    Player.enqueue("Can I get a medium hot americano, please?", "me", el);
    return;
  }
  if ((el = t.closest("#clearCache"))) {
    AudioCache.clear().then(() => toast("저장된 음성을 지웠어요"));
  }
});

sheetBody.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "setKey") { settings.apiKey = t.value.trim(); saveSettings(); }
  else if (t.dataset.voiceCustom) {
    const v = t.value.trim();
    settings[t.dataset.voiceCustom] = v || DEFAULTS[t.dataset.voiceCustom];
    saveSettings();
  }
});
sheetBody.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "setModel") { settings.model = t.value; saveSettings(); }
  else if (t.dataset.voice) {
    const name = t.dataset.voice;
    const custom = sheetBody.querySelector('[data-voice-custom="' + name + '"]');
    if (t.value === "custom") {
      custom.hidden = false;
      custom.focus();
      if (custom.value.trim()) { settings[name] = custom.value.trim(); saveSettings(); }
    } else {
      custom.hidden = true;
      settings[name] = t.value;
      saveSettings();
    }
  }
});

function hideSheet() {
  if (!sheetOpen) return;
  sheetOpen = false;
  const hold = sheetHold;
  sheetHold = null;
  if (hold && hold.token === Player.getToken()) { if (hold.paused) Player.resume(); }
  else Player.stop();
  if (document.activeElement && sheet.contains(document.activeElement)) document.activeElement.blur();
  sheet.classList.remove("on", "dragging");
  sheet.style.transform = "";
  scrim.classList.remove("on");
  sheet.setAttribute("aria-hidden", "true");
  flushNote();
  reviewQueue = [];
  if (currentTab === "expr") renderExprTab(); else updateExprBadge();
}

/* 닫기 버튼·바깥 탭: 히스토리를 되돌려서 안드로이드 뒤로 가기와 같은 흐름으로 닫음 */
function closeSheet() {
  if (!sheetOpen) return;
  let viaHistory = false;
  try { viaHistory = !!(history.state && history.state.sheet); } catch (e) {}
  if (viaHistory) history.back();
  else hideSheet();
}

/* 시트 위에 연 연습 모드를 뒤로 가기로 닫으면 시트의 히스토리 항목({ sheet })으로 돌아옴 → 시트는 그대로 둠 */
window.addEventListener("popstate", () => {
  let st = null;
  try { st = history.state; } catch (e) {}
  if (sheetOpen && st && st.sheet) return;
  hideSheet();
});
scrim.addEventListener("click", closeSheet);
sheetFoot.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { closeSheet(); return; }
  const fl = e.target.closest("[data-full-list]");
  if (fl) { buzz(); openList(fl.dataset.fullList); return; }   // 카테고리 목록 → 전체 목록(그 카테고리 펼침, 시트는 그대로 바뀜)
  const g = e.target.closest("[data-grade]");
  if (g) { gradeCurrentReview(g.dataset.grade === "1"); return; }
  if (e.target.closest("[data-reveal]")) revealReview();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !PC.open) closeSheet(); });

/* 손잡이 부분을 아래로 끌어서 닫기 */
let dragY0 = null, dragDy = 0;
sheetHead.addEventListener("touchstart", e => {
  dragY0 = e.touches[0].clientY; dragDy = 0;
  sheet.classList.add("dragging");
}, { passive: true });
sheetHead.addEventListener("touchmove", e => {
  if (dragY0 === null) return;
  dragDy = Math.max(0, e.touches[0].clientY - dragY0);
  sheet.style.transform = "translateY(" + dragDy + "px)";
}, { passive: true });
sheetHead.addEventListener("touchend", () => {
  if (dragY0 === null) return;
  dragY0 = null;
  sheet.classList.remove("dragging");
  if (dragDy > 90) closeSheet();
  else sheet.style.transform = "";
});

/* ---------- 시작: 스크립트를 끝까지 읽었으니 홈의 오늘의 질문을 고르고 그림(앱을 켤 때마다 새 질문) ---------- */
homeReady = true;
homeHook = pickHook();
renderHome();
</script>
