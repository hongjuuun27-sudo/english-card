<!-- 화면과 동작만 담은 파일. 카드는 data/cards/ 폴더, 질문은 data/questions.js에 추가하세요 (규칙은 CLAUDE.md) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>한 장 영어</title>
<!-- 웹앱 설치용(같은 폴더에 manifest·아이콘·sw.js가 있을 때만 동작, 없어도 앱은 정상 동작) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    color-scheme: dark;
    --bg:#121417;
    --bg-2:#1A1D21;
    --bg-3:#23272D;
    --text:#ECE9E4;
    --text-2:#C9CBCF;
    --muted:#A1A7B0;
    --faint:#8C939C;      /* 회색 글자(대비 5.9:1 — 2026-10-05 예전 #6E747D 3.9:1) */
    --line:rgba(255,255,255,.08);
    --bubble:#1F2328;
    --bubble-text:#E9E7E3;
    --accent:#86C2AC;
    --accent-soft:rgba(134,194,172,.11);
    --accent-line:rgba(134,194,172,.42);
    --mark:rgba(134,194,172,.26);
    --me:#2D5C4F;
    --me-text:#F0F7F3;
    --sheet:#1A1D21;
    --scrim:rgba(0,0,0,.58);
    --shadow:0 -12px 40px rgba(0,0,0,.45);
    --toast:#2B3036;
    --tag-l:74%;
    --tag-a:.15;
    --glow-a:.10;
    --pad:20px;
    --tabbar-h:58px;
    --modebar-h:46px;
    --on-accent:#10201B;
    --again:#E8A57A;      /* 복습 '다시'(배경 대비 7:1 이상) */
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme: light;
      --bg:#F5F3EE;
      --bg-2:#ECE9E2;
      --bg-3:#F0EDE6;
      --text:#1F2226;
      --text-2:#3B3F45;
      --muted:#5E646C;
      --faint:#5F646B;    /* 회색 글자(대비 5.4:1 — 2026-10-05 예전 #979DA5 2.5:1) */
      --line:rgba(0,0,0,.08);
      --bubble:#FFFFFF;
      --bubble-text:#24272B;
      --accent:#256A55;   /* 2026-10-06 #2C7A63 → 회색 칸(--bg-2·accent-soft) 위 글자 대비 4.25 → 5.3:1 */
      --accent-soft:rgba(37,106,85,.07);
      --accent-line:rgba(37,106,85,.36);
      --mark:rgba(37,106,85,.16);
      --me:#256A55;
      --me-text:#FFFFFF;
      --sheet:#FBFAF7;
      --scrim:rgba(20,22,25,.34);
      --shadow:0 -12px 40px rgba(0,0,0,.12);
      --toast:#2B3036;
      --tag-l:28%;        /* 카테고리 색 글자(2026-10-06 34% → 28%: 연한 카테고리 배경 위 대비 3.9 → 4.5:1 이상) */
      --tag-a:.12;
      --glow-a:.09;
      --on-accent:#FFFFFF;
      --again:#9A4A15;    /* 복습 '다시'(배경 대비 5:1 이상) */
    }
  }
  @media (max-width:370px){ :root{ --pad:18px; } }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background:var(--bg); color:var(--text);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:17px; line-height:1.55;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    word-break:keep-all; overflow-wrap:break-word;
  }
  button{
    font:inherit; color:inherit; background:none; border:0; padding:0; margin:0;
    cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  button:focus{ outline:none; }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  svg{ display:block; }

  /* ---------- 앱 틀: 화면 + 하단 탭 바 ---------- */
  .app{
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
  }
  .views{ position:relative; flex:1; min-height:0; }
  .view{ position:absolute; inset:0; }
  .view.off{ visibility:hidden; pointer-events:none; }   /* display:none이 아니라서 스크롤 위치·입력 내용이 그대로 남음 */
  .tabbar{
    position:relative; z-index:15;
    flex:none; display:flex;
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
    padding:0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background:var(--bg);
    border-top:1px solid var(--line);
  }
  /* 탭 5개 [오늘 | 상황 | 표현 | 글쓰기 | 드라이브]. 선택된 탭 = 아이콘 뒤 알약 모양 배경 + 진한 글자(색만으로 구분하지 않게) */
  .tab{
    flex:1; min-width:0; min-height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    font-size:12px; font-weight:600; color:var(--faint);
    transition:color .2s ease;
  }
  .tab svg{ width:23px; height:23px; }
  .tab-ico{ position:relative; z-index:0; display:block; width:23px; height:23px; }
  .tab-ico::before{
    content:""; position:absolute; z-index:-1; top:-4px; bottom:-4px; left:-17px; right:-17px; border-radius:999px;
    background:var(--accent); opacity:0; transform:scaleX(.6); transition:opacity .2s ease, transform .2s ease;
  }
  .tab[aria-selected="true"]{ color:var(--text); font-weight:750; }
  .tab[aria-selected="true"] .tab-ico{ color:var(--accent); }
  .tab[aria-selected="true"] .tab-ico::before{ opacity:.2; transform:none; }
  .tab:active svg{ transform:scale(.92); }
  body.typing .tabbar{ display:none; }   /* 키보드가 올라와 있을 땐 입력칸을 넓게 */

  /* ---------- 피드 ---------- */
  .feed{
    overflow-y:auto; overflow-x:hidden;
    scroll-snap-type:y mandatory;
    overscroll-behavior-y:none;
    scrollbar-width:none;
  }
  .feed::-webkit-scrollbar{ display:none; }

  .card{
    --h:160;
    position:relative;
    height:100%;
    scroll-snap-align:start; scroll-snap-stop:always;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:55%;
    background:radial-gradient(120% 70% at 50% -15%, hsl(var(--h) 55% 50% / var(--glow-a)), transparent 62%);
    pointer-events:none;
  }

  .top{
    position:relative;
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) max(var(--pad), env(safe-area-inset-right)) 8px max(var(--pad), env(safe-area-inset-left));
  }
  .tag{
    flex:none; white-space:nowrap;
    font-size:13.5px; font-weight:600; letter-spacing:.01em;
    padding:6px 11px; border-radius:999px;
    color:hsl(var(--h) 52% var(--tag-l));
    background:hsl(var(--h) 50% 55% / var(--tag-a));
  }
  .top .tag{ height:34px; display:flex; align-items:center; }   /* 위쪽 줄(2026-10-06 정리): 카테고리·연습 알약 둘 다 34px·13.5px, 목록·설정은 44px 누르는 자리 */
  .tag-btn{ gap:2px; padding:0 8px 0 12px; }   /* 누르면 그 카테고리 상황 목록(작은 아래 화살표로 눌리는 요소임을 보여 줌) */
  .tag-btn svg{ width:13px; height:13px; opacity:.8; }
  .tag-btn:active{ transform:scale(.96); }
  .top-r{ display:flex; align-items:center; gap:2px; }   /* [연습] 8px [목록 n/32] [설정] */
  .jump{
    display:flex; align-items:center; gap:4px;
    height:44px; padding:0 6px; border-radius:999px; white-space:nowrap;
    font-size:14px; color:var(--faint); font-variant-numeric:tabular-nums;
  }
  .jump:active{ background:var(--line); }
  .jump svg{ width:17px; height:17px; }
  .gear{
    width:44px; height:44px; margin-right:-12px;
    flex:none;
    display:grid; place-items:center; border-radius:50%;
    color:var(--faint);
  }
  .gear:active{ background:var(--line); }
  .gear svg{ width:21px; height:21px; }

  .body{
    position:relative;
    flex:1; min-height:0;
    overflow-y:auto; overflow-x:hidden;
    overscroll-behavior-y:auto;
    padding:0 max(var(--pad), env(safe-area-inset-right)) 0 max(var(--pad), env(safe-area-inset-left));
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 22px), transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 22px), transparent 100%);
  }
  .body::-webkit-scrollbar{ display:none; }
  .inner{
    min-height:100%;
    display:flex; flex-direction:column; justify-content:flex-start;
    padding:22px 0 30px;
  }

  .title{ margin:0; font-size:24px; line-height:1.3; font-weight:700; letter-spacing:-.015em; }
  .situation{ margin:10px 0 0; font-size:17px; line-height:1.6; color:var(--text-2); }
  /* '다른 선택' 링크(원래 카드 → 다른 선택 / 다른 선택 → 원래). 글자 링크처럼 보이되 손가락으로 누르기 쉽게 높이 확보 */
  .var-link{ display:inline-flex; align-items:center; gap:4px; max-width:100%; margin:8px 0 0; padding:8px 12px 8px 12px; min-height:40px;
    border:1px solid var(--accent-line); border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:14.5px; font-weight:650; text-align:left; }
  .var-link span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .var-link svg{ flex:none; width:15px; height:15px; transform:rotate(-90deg); }
  .var-link.back svg{ transform:rotate(90deg); }
  .var-link:active{ transform:scale(.97); }

  /* ---------- 대화: 한 줄 = renderLine() (세 모드 공통) ----------
     줄에서 무엇을 보일지는 클래스로 정함: 카드 m-read/m-listen/m-shadow·masked, 줄 off/kq-on/cur/past/playing */
  .mnote{ margin:18px 0 0; font-size:14.5px; line-height:1.6; color:var(--faint); }
  .mnote:empty{ display:none; }
  .chat{ display:flex; flex-direction:column; gap:10px; margin-top:28px; -webkit-user-select:none; user-select:none; }
  .mnote:not(:empty) ~ .chat{ margin-top:18px; }
  .row{ display:flex; flex-direction:column; max-width:88%; }
  .row.them{ align-self:flex-start; align-items:flex-start; }
  .row.me{ align-self:flex-end; align-items:flex-end; }
  .row.off{ display:none; }
  .row.pop{ animation:popIn .38s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes popIn{ from{ opacity:0; transform:translateY(10px) scale(.98); } to{ opacity:1; transform:none; } }
  .who{ display:none; font-size:13px; color:var(--faint); margin:0 8px 5px; }
  .row.first-them .who{ display:block; }
  .line{ display:flex; align-items:center; gap:8px; }
  .row.me .line{ flex-direction:row-reverse; }

  .bubble{
    display:block; text-align:left;
    font-size:17.5px; line-height:1.45;
    padding:11px 15px; border-radius:20px;
    border:1.5px solid transparent;
    transition:background-color .3s ease, border-color .3s ease, box-shadow .3s ease, opacity .3s ease, transform .12s ease;
  }
  .row.them .bubble{ background:var(--bubble); color:var(--bubble-text); border-bottom-left-radius:6px; }
  .row.me .bubble{ background:var(--me); color:var(--me-text); border-bottom-right-radius:6px; }
  @media (prefers-color-scheme: light){
    .row.them .bubble{ box-shadow:0 1px 2px rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.04); }
  }
  .bubble .en{ display:block; }
  .bubble .kq{ display:none; }
  .m-read .row.me .bubble, .m-listen:not(.masked) .bubble{ cursor:pointer; }
  .m-read .row.me .bubble:active, .m-listen:not(.masked) .bubble:active{ transform:scale(.98); }

  .ko{ font-size:15px; line-height:1.5; color:var(--muted); margin:5px 8px 0; }
  .row.me .ko{ text-align:right; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  /* 읽기: 아직 확인 안 한 내 대사는 한글만, 탭할 때마다 영어 ↔ 한글 */
  .row.me.kq-on .bubble{ background:var(--accent-soft); border-color:var(--accent-line); border-style:dashed; color:var(--text); }
  .row.them.kq-on .bubble{ border-color:var(--line); border-style:dashed; }   /* 읽기 어려움: 아직 확인 안 한 상대 대사 */
  .row.kq-on .en, .row.kq-on .ko{ display:none; }
  .row.kq-on .kq{ display:block; font-size:16.5px; line-height:1.5; animation:fadeIn .25s ease both; }
  .m-read .row.me:not(.kq-on) .en, .m-read.rhard .row.them:not(.kq-on) .en{ animation:fadeIn .25s ease both; }
  .hint{ display:none; font-size:12.5px; color:var(--faint); margin:6px 8px 0; }
  .m-read .row.me.kq-on .hint, .m-read.rhard .row.them.kq-on .hint{ display:block; }
  .m-read.rhard .row.me .hint{ display:none; }   /* 어려움은 첫 상대 대사에만 안내 */
  body.hinted .m-read .row .hint{ display:none; }
  .m-read.rhard .row.them .bubble{ cursor:pointer; }
  .m-read.rhard .row.them .bubble:active{ transform:scale(.98); }

  /* 쉐도잉·듣기: 지금 줄 강조, 지나간 줄은 흐리게 */
  .row.cur .bubble, .row.playing .bubble{ box-shadow:0 0 0 2.5px var(--accent); }
  .row > *{ transition:opacity .3s ease; }
  .row.past > *{ opacity:.42; }   /* 줄 자체는 popIn 애니메이션이 opacity를 잡고 있어서 안쪽을 흐리게 */

  /* 쉐도잉 쉬움 / 중간 / 어려움 선택 (쉐도잉 모드에서만, 카드 위쪽) */
  .sh-seg{ width:264px; max-width:100%; margin-top:16px; }
  .card:not(.m-shadow) .sh-seg, .card:not(.m-read) .rl-seg{ display:none; }   /* 쉐도잉 난이도는 쉐도잉에서만, 읽기 난이도(보통/어려움)는 읽기에서만 */
  .rl-seg{ width:176px; max-width:100%; margin-top:16px; }
  .rl-seg button{ height:34px; font-size:14.5px; }   /* 읽기·듣기에서는 숨김 (아래 .seg{display:flex}보다 우선하도록 선택자를 구체적으로) */
  .sh-seg button{ height:34px; font-size:14.5px; }
  /* 어려움: 아이콘(.masked) 아래에 지금 줄만 '정답 보기'(.peek) */
  .sh-blind.peek .chat{ display:flex; margin-top:6px; }
  .sh-blind.peek .duo{ flex:none; min-height:0; padding-bottom:0; }
  /* 중간: 지금 줄을 크게, 아직 안 나온 줄은 조금 흐리게 */
  .sh-mid .row .bubble{ transition:font-size .2s ease, background-color .3s ease, border-color .3s ease, box-shadow .3s ease, transform .12s ease; }
  .sh-mid .row.cur .bubble{ font-size:20.5px; }
  .sh-mid.sh-live .row:not(.cur):not(.past) > *{ opacity:.62; }

  /* 듣기: 정답 확인 전에는 대화 대신 두 사람 아이콘(왼쪽 상대, 오른쪽 나). 말하는 쪽은 진한 테두리 + 은은하게 퍼짐, 안 말하는 쪽은 흐리게
     카드 클래스: masked(정답 확인 전) · talk-them / talk-me(지금 말하는 쪽) · lpaused(일시정지) */
  .duo{ display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:22px; min-height:250px; padding:20px 0 6px; }
  .masked .chat{ display:none; }
  .masked .duo{ display:flex; }
  .duo-people{ display:flex; gap:48px; }
  .person{
    display:flex; flex-direction:column; align-items:center; gap:11px;
    --c:hsl(var(--h) 52% var(--tag-l)); --g:hsl(var(--h) 50% 55% / .3);
    transition:opacity .35s ease;
  }
  .person.me{ --c:var(--accent); --g:var(--accent-line); }
  .avatar{
    position:relative; width:88px; height:88px; border-radius:50%;
    display:grid; place-items:center;
    color:var(--c); background:var(--bg-2); border:2px solid var(--line);
    transition:border-color .3s ease, box-shadow .4s ease, transform .3s ease;
  }
  .avatar svg{ width:52px; height:52px; }
  .avatar::after{ content:""; position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--c); opacity:0; pointer-events:none; }
  .pname{ font-size:15px; font-weight:600; color:var(--text-2); transition:color .3s ease; }
  .duo-n{ font-size:13.5px; color:var(--faint); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .talk-them .person.me, .talk-me .person.them{ opacity:.35; }
  .talk-them .person.them .avatar, .talk-me .person.me .avatar{ border:3px solid var(--c); box-shadow:0 0 26px 6px var(--g); transform:scale(1.04); }
  .talk-them .person.them .avatar::after, .talk-me .person.me .avatar::after{ animation:ripple 1.6s ease-out infinite; }
  .talk-them .person.them .pname, .talk-me .person.me .pname{ color:var(--c); }
  .lpaused .avatar::after{ animation:none !important; opacity:0; }
  @keyframes ripple{ from{ opacity:.55; transform:scale(1); } to{ opacity:0; transform:scale(1.42); } }

  .spk{
    flex:none;
    width:36px; height:36px; border-radius:50%;
    display:grid; place-items:center;
    color:var(--accent); background:var(--accent-soft);
    transition:transform .2s ease;
  }
  .spk svg{ width:18px; height:18px; }
  .spk:active{ transform:scale(.92); }
  .spk.playing svg{ animation:pulse 1s ease-in-out infinite; }
  .card:not(.m-read) .row .spk{ display:none; }   /* 줄마다 스피커는 읽기 모드에만 */
  .m-read .row.kq-on .spk{ display:none; }     /* 읽기 모드: 영어가 보이는 줄에만 (한글인 줄은 탭해서 영어로 바뀌었을 때) */
  .m-read .row.me:not(.kq-on) .spk{ animation:fadeIn .25s ease both; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .typing .dots{ display:flex; gap:5px; padding:16px 17px; }
  .typing .dots i{ width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1s infinite ease-in-out; }
  .typing .dots i:nth-child(2){ animation-delay:.15s; }
  .typing .dots i:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; transform:translateY(0); } 40%{ opacity:.85; transform:translateY(-3px); } }

  /* ---------- 대사 속 표현: 핵심(밑줄) · 추가(연한 점선). 누르면 설명 바텀시트 ---------- */
  .xp{
    text-decoration:underline;
    text-decoration-color:var(--accent);
    text-decoration-thickness:2px;
    text-underline-offset:4px;
    border-radius:4px;
    cursor:pointer;
    transition:background-color .15s ease;
  }
  .xp:active{ background:var(--accent-soft); }
  .xp-x{ text-decoration-style:dotted; text-decoration-color:var(--muted); text-decoration-thickness:1.5px; }
  .row.me .xp{ text-decoration-color:rgba(255,255,255,.75); }
  .row.me .xp-x{ text-decoration-color:rgba(255,255,255,.55); }
  .row.me .xp:active{ background:rgba(255,255,255,.14); }
  /* 듣기·쉐도잉: 밑줄을 그리지 않음(같은 HTML, 표시만 끔). 단어는 '그 위치부터 재생'으로만 동작 */
  .m-listen .xp, .m-shadow .xp{ text-decoration:none; cursor:inherit; }
  .m-listen .xp:active, .m-shadow .xp:active{ background:none; }
  .xp-ko{ margin:12px 0 4px; font-size:16.5px; line-height:1.65; color:var(--text-2); }

  /* ---------- 인터랙티브 스크립트: 노래방 자막처럼 채워지는 강조 (대화문·예문·썰 공통) ----------
     .sc(문장) > .w(단어). 재생을 시작하면 .sc.reading → 문장 전체가 흐려지고(35%),
     읽은 단어(.past)와 지금 단어(.now)는 선명하고 진하게 채워져 그대로 유지. 끝까지 읽으면 .filled(전부 진하게) → 잠시 뒤 평소 표시.
     진하게는 밝기 + text-shadow로만(글자 굵기를 바꾸지 않아서 단어 폭·줄바꿈이 그대로).
     단어 신호가 없으면 .sc.lineonly(흐리게 하지 않고 문장 전체를 은은한 배경으로) */
  .sc .w, .sc .gloss{ transition:opacity .22s ease, text-shadow .22s ease; }
  .sc.reading .w, .sc.reading .gloss{ opacity:.35; }
  .sc.reading .w.past, .sc.reading .w.now, .sc.reading.filled .w{ opacity:1; text-shadow:.3px 0 currentColor, -.3px 0 currentColor; }
  .sc.reading.lineonly .w, .sc.reading.lineonly .gloss{ opacity:1; }
  .sc.reading.lineonly{ background:var(--mark); box-shadow:0 0 0 2px var(--mark); border-radius:4px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .row.me .sc.reading.lineonly{ background:rgba(255,255,255,.16); box-shadow:0 0 0 2px rgba(255,255,255,.16); }
  .gloss{ color:var(--muted); font-size:.9em; }
  .sheet .sc .w, .m-shadow .sc .w, .m-listen:not(.masked) .sc .w{ cursor:pointer; }
  .row.playing .spk svg{ animation:pulse 1s ease-in-out infinite; }
  .rd-play.on{ color:var(--on-accent); background:var(--accent); }

  /* ---------- 하단 버튼: 모드마다 다르지만 주요 버튼은 항상 오른쪽 넓은 자리 ---------- */
  .bottom{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:10px max(var(--pad), env(safe-area-inset-right)) calc(8px + var(--modebar-h)) max(var(--pad), env(safe-area-inset-left));   /* 아래 여백: 모드 선택 줄만큼 (제스처 바는 탭 바가 맡음) */
  }
  .actions{ display:flex; gap:8px; width:100%; }
  .btn{
    height:54px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:17px; font-weight:600;
    background:var(--bg-2); color:var(--text);
    border:1px solid var(--line);
    transition:transform .12s ease, background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn:active{ transform:scale(.98); }
  .actions .btn{ flex:none; min-width:0; gap:6px; padding:0 13px; font-size:15.5px; white-space:nowrap; }
  .actions .btn svg{ width:19px; height:19px; flex:none; }
  .actions .main{ flex:1; padding:0 10px; font-size:16.5px; color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .actions .ico-btn{ width:46px; padding:0; color:var(--muted); }
  .actions .rate{ width:54px; padding:0; color:var(--accent); font-variant-numeric:tabular-nums; }
  .actions .on{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .actions .btn:disabled{ opacity:.38; cursor:default; transform:none; }
  .actions .prev{ width:52px; padding:0; }
  .actions .again{ width:76px; padding:0 6px; font-size:14.5px; line-height:1.25; white-space:normal; text-align:center; }   /* 두 줄로 접어 '다음' 자리를 넓게 */
  .actions .restart{ flex:1; }
  /* 쉐도잉 어려움: 버튼 5개 [이전] [한 번 더 듣기] [정답 보기] [속도] [다음] — 360px에서도 [다음]이 가장 넓게 */
  .actions.five{ gap:6px; }
  .actions.five .prev{ width:46px; }
  .actions.five .again{ width:62px; padding:0 4px; font-size:13.5px; }
  .actions.five .peek{ width:56px; padding:0 4px; font-size:13.5px; line-height:1.25; white-space:normal; text-align:center; }
  .actions.five .rate{ width:48px; }
  .swipe-hint{ font-size:12.5px; color:var(--faint); }

  /* ---------- 모드 선택: 탭 바 바로 위, 상황 탭에서만 ---------- */
  .modebar{
    position:absolute; left:0; right:0; bottom:0; z-index:5;
    height:var(--modebar-h);
    display:none; align-items:center; justify-content:center;
    padding:0 max(var(--pad), env(safe-area-inset-right)) 6px max(var(--pad), env(safe-area-inset-left));
    background:var(--bg);
  }
  body.tab-cards .modebar{ display:flex; }
  .mode-seg{ width:100%; max-width:360px; }
  .modebar .mode-seg button{ height:32px; font-size:14.5px; }

  /* ---------- 마지막 카드 ---------- */
  .end .inner{ align-items:center; justify-content:center; text-align:center; }
  .end-emoji{ font-size:44px; line-height:1; margin-bottom:18px; }
  .end-title{ margin:0; font-size:34px; font-weight:750; letter-spacing:-.02em; }
  .end-sub{ margin:12px 0 0; font-size:17px; line-height:1.65; color:var(--text-2); }

  /* ---------- 바텀시트 ---------- */
  .scrim{
    position:fixed; inset:0; z-index:20;
    background:var(--scrim);
    opacity:0; pointer-events:none;
    transition:opacity .28s ease;
    touch-action:none;
  }
  .scrim.on{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:21;
    max-height:88vh; max-height:88dvh;
    display:flex; flex-direction:column;
    background:var(--sheet);
    border-radius:24px 24px 0 0;
    box-shadow:var(--shadow);
    transform:translateY(105%);
    visibility:hidden;
    transition:transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s linear .32s;
  }
  .sheet.on{
    transform:translateY(0); visibility:visible;
    transition:transform .36s cubic-bezier(.2,.8,.2,1), visibility 0s;
  }
  .sheet.dragging{ transition:none; }
  .sheet-head{
    flex:none; touch-action:none;
    padding:10px max(var(--pad), env(safe-area-inset-right)) 14px max(var(--pad), env(safe-area-inset-left));
    border-bottom:1px solid var(--line);
  }
  .handle{ width:40px; height:5px; border-radius:3px; background:var(--faint); opacity:.5; margin:0 auto 14px; }
  .sheet-ctx{ font-size:13px; color:var(--faint); }
  .sheet-title{ margin:4px 0 0; font-size:24px; line-height:1.3; font-weight:700; color:var(--accent); letter-spacing:-.01em; }
  .sheet-body{
    flex:1; min-height:0; overflow-y:auto;
    overscroll-behavior:contain;
    padding:6px max(var(--pad), env(safe-area-inset-right)) 8px max(var(--pad), env(safe-area-inset-left));
  }
  .sec-h{
    margin:20px 0 6px;
    font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--faint);
  }
  .sec-row{ display:flex; align-items:center; justify-content:space-between; margin:20px 0 6px; }
  .sec-row .sec-h{ margin:0; }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    height:36px; padding:0 14px 0 11px; border-radius:999px;
    font-size:14.5px; font-weight:600;
    color:var(--accent); background:var(--accent-soft);
  }
  .pill svg{ width:17px; height:17px; }
  .pill.playing svg{ animation:pulse 1s ease-in-out infinite; }
  .pill:active{ transform:scale(.96); }
  .ex{ list-style:none; margin:0; padding:0; counter-reset:ex; }
  .ex li{
    counter-increment:ex;
    position:relative; padding:12px 44px 12px 30px;
    border-bottom:1px solid var(--line);
  }
  .ex li:last-child{ border-bottom:0; }
  .ex li::before{
    content:counter(ex);
    position:absolute; left:0; top:14px;
    width:20px; height:20px; border-radius:50%;
    font-size:12px; font-weight:600; line-height:20px; text-align:center;
    color:var(--accent); background:var(--accent-soft);
  }
  .ex .spk{ position:absolute; right:0; top:10px; width:34px; height:34px; }
  .ex-en{ font-size:17px; line-height:1.5; }
  .ex-ko{ margin-top:3px; font-size:16px; line-height:1.55; color:var(--muted); }
  /* 표현 상세 '직접 말해 보기' 10문장(접어 둠): 한국어 위, 영어 아래 */
  .dr-sec{ margin-top:22px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .dr-sec > summary{ list-style:none; cursor:pointer; min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:16px; font-weight:700; }
  .dr-sec > summary::-webkit-details-marker{ display:none; }
  .dr-sec > summary small{ margin-left:4px; font-size:13px; font-weight:600; color:var(--muted); }
  .dr-sec[open] > summary .h-chev{ transform:rotate(180deg); }
  .dr-sec .sec-row{ margin-top:6px; }
  .dr-sec .sec-row .sec-h{ visibility:hidden; }
  .dr-ko{ font-size:15px; line-height:1.55; color:var(--muted); margin-bottom:3px; }
  mark{
    color:inherit; font-weight:650;
    background:linear-gradient(transparent 58%, var(--mark) 58%);
    border-radius:2px; padding:0 1px;
  }
  .story{
    margin-top:6px; padding:16px 16px 14px;
    border-radius:18px; background:var(--bg-3);
  }
  .story-en{ margin:0; font-size:17.5px; line-height:1.7; }
  .story-ko{ margin:12px 0 0; padding-top:12px; border-top:1px solid var(--line); font-size:16px; line-height:1.65; color:var(--muted); }
  .sheet-foot{
    flex:none;
    padding:10px max(var(--pad), env(safe-area-inset-right)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(var(--pad), env(safe-area-inset-left));
    border-top:1px solid var(--line);
  }
  .sheet-close{ width:100%; }

  /* ---------- 설정 ---------- */
  .set-group{ padding:16px 0; border-bottom:1px solid var(--line); }
  .set-group:last-child{ border-bottom:0; }
  .set-label{ display:block; font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--faint); margin-bottom:9px; }
  .seg{ display:flex; gap:3px; padding:3px; border-radius:13px; background:var(--bg-2); border:1px solid var(--line); }
  .seg button{ flex:1; height:42px; border-radius:10px; font-size:15.5px; color:var(--muted); }
  .seg button[aria-pressed="true"]{ background:var(--bubble); color:var(--text); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .field{
    display:block; width:100%; height:48px; padding:0 14px;
    border-radius:12px; border:1px solid var(--line);
    background:var(--bg-2); color:var(--text);
    font:inherit; font-size:16px;
  }
  .field:focus{ outline:2px solid var(--accent-line); outline-offset:0; }
  .field + .field{ margin-top:8px; }
  .note{ margin:9px 2px 0; font-size:14px; line-height:1.6; color:var(--muted); }
  .el-only[hidden]{ display:none; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn-row .btn{ flex:1; height:46px; font-size:15.5px; min-width:140px; }

  /* ---------- 목록 ---------- */
  .prog{ padding:14px 0 16px; }
  .prog-text{ font-size:15.5px; color:var(--text-2); margin-bottom:9px; }
  .prog-text b{ color:var(--accent); }
  .bar{ height:6px; border-radius:3px; background:var(--bg-3); overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:3px; background:var(--accent); }
  /* 카테고리는 접어서(.toc-group) 보여 주고, 지금 보던 카드의 카테고리만 펼침(.open). 머리를 누르면 펼치기·접기, 위쪽 [전체 펼치기 / 전체 접기] */
  .toc-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:22px; }
  .toc-bar .set-label{ margin:0; }
  .toc-all{ height:34px; padding:0 14px; border-radius:999px; font-size:14px; font-weight:600; color:var(--accent); background:var(--accent-soft); }
  .toc-group{ margin-top:6px; border-bottom:1px solid var(--line); }
  .toc-head{ width:100%; display:flex; align-items:center; gap:11px; padding:10px 2px; text-align:left; }
  .toc-chev{ flex:none; width:22px; height:22px; color:var(--faint); transition:transform .2s ease; }
  .toc-chev svg{ width:22px; height:22px; }
  .toc-group.open .toc-chev{ transform:rotate(180deg); }
  .toc-group:not(.open) .toc{ display:none; }
  .toc-group.open .toc{ margin-bottom:12px; }
  .toc-emoji{
    flex:none; width:36px; height:36px; border-radius:11px;
    display:grid; place-items:center; font-size:19px; line-height:1;
    background:hsl(var(--h) 50% 55% / var(--tag-a));
  }
  .toc-cat{
    margin:0; flex:1;
    font-size:20px; font-weight:750; letter-spacing:-.015em;
    color:hsl(var(--h) 52% var(--tag-l));
  }
  .toc-cnt{ font-size:13.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .toc{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .toc-item{
    position:relative;
    width:100%; display:flex; align-items:center; gap:12px;
    padding:12px 12px 12px 14px; border-radius:12px;
    text-align:left; font-size:16.5px; line-height:1.4;
  }
  .toc-item:active{ background:var(--line); }
  .toc-n{
    flex:none; width:28px; height:28px; border-radius:50%;
    display:grid; place-items:center;
    font-size:13px; font-weight:600; color:var(--muted); background:var(--bg-2);
  }
  .toc-t{ flex:1; min-width:0; }
  .toc-var{ padding-left:22px; position:relative; }               /* 다른 선택 카드: 원래 카드 아래 들여쓰기 */
  .toc-var::before{ content:""; position:absolute; left:26px; top:6px; width:10px; height:22px; border-left:1.5px solid var(--line); border-bottom:1.5px solid var(--line); border-bottom-left-radius:6px; }
  .toc-var .toc-n{ width:24px; height:24px; font-size:12px; }
  .toc-vtag{ display:block; font-size:12px; font-weight:600; color:var(--accent); line-height:1.3; }
  .toc-check{
    flex:none; width:24px; height:24px; border-radius:50%;
    display:grid; place-items:center;
    border:1.5px solid var(--line);
  }
  .toc-check svg{ width:14px; height:14px; }
  .toc-item.seen .toc-check{ background:var(--accent); border-color:transparent; color:var(--on-accent); }
  .toc-item.current{ background:var(--accent-soft); }
  .toc-item.current::before{
    content:""; position:absolute; left:0; top:9px; bottom:9px;
    width:3.5px; border-radius:2px; background:var(--accent);
  }
  .toc-item.current .toc-t{ font-weight:650; }
  .toc-item.current .toc-n{ color:var(--accent); background:var(--bg-2); }

  /* ---------- 하단 탭 배지 ---------- */
  .badge{
    position:absolute; top:-5px; left:15px;
    min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    font-size:11px; font-weight:700; line-height:18px; text-align:center;
    color:#fff; background:#E5484D;
    box-shadow:0 0 0 2px var(--bg);
  }
  .badge[hidden]{ display:none; }
  .badge.dot{ top:-3px; left:18px; min-width:0; width:9px; height:9px; padding:0; }   /* 글쓰기: 오늘 안 썼으면 점 */

  /* ---------- 표현 탭 ---------- */
  /* ---------- 오늘 탭(대시보드): ① 지금 할 일(유일한 큰 버튼) ② 오늘 진행 ③ 최근 7일 ④ 표현 실력 ⑤ 이어 듣기(드라이브를 멈췄을 때만) ----------
     누를 수 있는 것만 버튼 모양, 상태 표시(②·③)는 테두리 없는 아이콘과 숫자. 완료는 색 + 체크 아이콘 + 숫자. 저절로 바뀌는 것 없음 */
  .today{
    overflow-y:auto; overflow-x:hidden; overscroll-behavior-y:contain;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) max(var(--pad), env(safe-area-inset-right)) 36px max(var(--pad), env(safe-area-inset-left));
  }
  .td-now{
    margin-top:18px; padding:18px 18px 16px; border-radius:22px;
    background:radial-gradient(120% 120% at 100% 0%, var(--accent-soft), transparent 70%), var(--bg-2);
    border:1.5px solid var(--accent-line);
  }
  .td-now.hook{ background:hsl(var(--h) 50% 55% / var(--tag-a)); border-color:hsl(var(--h) 52% var(--tag-l) / .4); }
  .td-label{ font-size:13px; font-weight:700; letter-spacing:.04em; color:var(--accent); }
  .td-now.hook .td-label{ color:hsl(var(--h) 52% var(--tag-l)); }
  .td-title{ margin:8px 0 0; font-size:23px; line-height:1.38; font-weight:750; letter-spacing:-.02em; color:var(--text); word-break:keep-all; }
  .td-now.hook .td-title{ font-size:24px; }
  .td-sub{ margin:6px 0 0; font-size:14.5px; line-height:1.55; color:var(--muted); }
  .td-go{ width:100%; margin-top:16px; color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .td-go.sub{ color:var(--text); background:var(--bg); border-color:var(--line); }
  .td-sec{ margin-top:30px; }
  .td-h{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .td-h h3{ margin:0; font-size:16px; font-weight:750; color:var(--text); }
  .td-h small{ font-size:13.5px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
  /* ② 오늘 진행: 4칸(복습 · 새 표현 · 상황 카드 · 일기) */
  .td-prog{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin:0; padding:0; list-style:none; }
  .td-prog li{ display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; }
  .td-dot{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--line); color:var(--on-accent); }
  .td-dot svg{ width:17px; height:17px; }
  .td-prog .done .td-dot, .td-week .on .td-dot{ background:var(--accent); border-color:transparent; }
  .td-num{ font-size:16px; font-weight:750; font-variant-numeric:tabular-nums; color:var(--text); }
  .td-prog .done .td-num{ color:var(--accent); }
  .td-cap{ font-size:12.5px; color:var(--muted); }
  /* ③ 최근 7일 */
  .td-week{ display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; margin:0; padding:0; list-style:none; }
  .td-week li{ display:flex; justify-content:center; }
  .td-wd{ width:100%; max-width:52px; min-height:60px; padding:4px 0; border-radius:14px; display:flex; flex-direction:column; align-items:center; gap:5px; border:1.5px solid transparent; }
  .td-wd.sel{ border-color:var(--accent-line); background:var(--accent-soft); }   /* 고른 날(테두리 + 배경 — 색만이 아니라 모양도) */
  .td-week .td-dot{ width:32px; height:32px; }
  .td-week .is-today:not(.on) .td-dot{ border-color:var(--accent); }
  .td-week .is-today .td-cap{ font-weight:750; color:var(--text); }
  .td-day{ margin:10px 2px 0; font-size:14.5px; line-height:1.5; color:var(--text-2); }
  .td-day b{ font-weight:700; color:var(--text); }
  .td-wnote{ margin:4px 2px 0; font-size:12.5px; line-height:1.5; color:var(--faint); }
  /* ④ 표현 실력: 막대(익힘 · 학습 중 · 미학습) + 누르면 그 필터로 표현 탭 */
  .td-bar{ display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--bg-3); }
  .td-bar i{ display:block; height:100%; }
  .td-bar .m{ background:var(--accent); }
  .td-bar .l{ background:color-mix(in srgb, var(--accent) 45%, transparent); }
  .td-legend{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:10px; }
  .td-lg{
    min-height:48px; display:flex; align-items:center; gap:7px; padding:0 8px 0 10px; border-radius:14px; text-align:left;
    background:var(--bg-2); border:1px solid var(--line); font-size:13.5px; color:var(--text-2);
  }
  .td-lg:active{ transform:scale(.97); }
  .td-lg i{ flex:none; width:10px; height:10px; border-radius:3px; }
  .td-lg .m{ background:var(--accent); }
  .td-lg .l{ background:color-mix(in srgb, var(--accent) 45%, transparent); }
  .td-lg .n{ background:var(--bg-3); border:1px solid var(--faint); }
  .td-lg span{ flex:1; min-width:0; line-height:1.3; }
  .td-lg b{ display:block; font-size:16px; font-weight:750; color:var(--text); font-variant-numeric:tabular-nums; }
  .td-lg svg{ flex:none; width:15px; height:15px; color:var(--faint); }
  /* ⑤ 이어 듣기(드라이브를 중간에 멈췄을 때만) */
  .td-resume{ display:flex; align-items:center; gap:12px; padding:14px 14px 14px 16px; border-radius:18px; background:var(--bg-2); border:1px solid var(--line); }
  .td-resume > svg{ flex:none; width:26px; height:26px; color:var(--accent); }
  .td-rtext{ flex:1; min-width:0; }
  .td-rtext b{ display:block; font-size:15.5px; font-weight:700; color:var(--text); }
  .td-rtext small{ display:block; margin-top:2px; font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .td-rgo{ flex:none; min-height:44px; padding:0 16px; border-radius:999px; font-size:15px; font-weight:700; color:var(--accent); border:1.5px solid var(--accent); }
  .td-rgo:active{ transform:scale(.97); }
  /* 질문 카드에서 열린 내 대사 줄: 잠깐 강조(답을 떠올린 뒤 탭해서 영어로 확인) */
  .row.hook-hi .bubble{ animation:hookHi 1.1s ease 2; }
  @keyframes hookHi{ 0%,100%{ box-shadow:0 0 0 0 transparent; } 40%{ box-shadow:0 0 0 4px var(--accent); } }

  .xview{
    overflow-y:auto; overflow-x:hidden;
    overscroll-behavior-y:contain;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) max(var(--pad), env(safe-area-inset-right)) 40px max(var(--pad), env(safe-area-inset-left));
  }
  .rv-card{
    margin-top:18px; padding:16px 16px 14px; border-radius:20px;
    background:radial-gradient(120% 120% at 100% 0%, var(--accent-soft), transparent 70%), var(--bg-2);
    border:1px solid var(--line);
  }
  .rv-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .rv-title{ font-size:13px; font-weight:700; letter-spacing:.06em; color:var(--accent); }
  .rv-picks{ font-size:13px; color:var(--muted); }
  .rv-picks b{ color:var(--accent); }
  .rv-empty{ margin:10px 0 2px; font-size:15px; line-height:1.6; color:var(--text-2); }
  .rv-count{ margin-top:10px; font-size:18px; font-weight:650; }
  .rv-count b{ color:var(--accent); font-size:22px; }
  .rv-list{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .rv-item{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:12px; background:var(--bg); border:1px solid var(--line); text-align:left;
  }
  .rv-mean{ font-size:15.5px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rv-due{ flex:none; font-size:12.5px; color:var(--faint); }
  .rv-more{ margin:8px 2px 0; font-size:13px; color:var(--faint); }
  .rv-start{ width:100%; margin-top:12px; color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .rv-free{ width:100%; height:48px; margin-top:8px; font-size:15.5px; color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .rv-free-note{ margin:6px 2px 0; font-size:13px; text-align:center; color:var(--faint); }

  /* 궁금증 카드 3개: 문구(teaser) → 누르면 뒤집혀 정답 표현 + 짧은 뜻 + [자세히 보기] */
  .x-teasers{ margin-top:22px; }
  .xt-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .xt-title{ margin:0; font-size:17px; font-weight:700; color:var(--text); }
  .xt-more{ flex:none; height:34px; padding:0 14px; border-radius:999px; font-size:14px; font-weight:600; color:var(--accent); background:var(--accent-soft); }
  .xt-list{ display:flex; flex-direction:column; gap:10px; }
  .xt-card{
    display:block; width:100%; text-align:left; padding:15px 16px; border-radius:18px;
    background:hsl(var(--h) 50% 55% / var(--tag-a)); border:1.5px solid hsl(var(--h) 52% var(--tag-l) / .3);
    transition:transform .12s ease; cursor:pointer; -webkit-user-select:none; user-select:none;
  }
  .xt-card:active:not(:has(.xt-detail:active)){ transform:scale(.985); }
  .xt-card:focus{ outline:none; }
  .xt-card:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .xt-q{ display:block; font-size:17px; line-height:1.45; font-weight:650; color:var(--text); word-break:keep-all; }
  .xt-tap{ display:block; margin-top:8px; font-size:13px; font-weight:600; color:hsl(var(--h) 52% var(--tag-l)); }
  .xt-card.open .xt-tap{ display:none; }
  .xt-a{ display:none; margin-top:10px; padding-top:10px; border-top:1px dashed hsl(var(--h) 52% var(--tag-l) / .45); animation:fadeIn .3s ease both; }
  .xt-card.open .xt-a{ display:block; }
  .xt-phrase{ display:block; font-size:20px; font-weight:700; color:var(--accent); }
  .xt-mean{ display:block; margin-top:2px; font-size:14.5px; color:var(--text-2); }
  .xt-detail{
    display:inline-flex; align-items:center; gap:2px; height:36px; margin-top:10px; padding:0 10px 0 14px; border-radius:999px;
    font-size:14px; font-weight:650; color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent-line);
  }
  .xt-detail svg{ width:15px; height:15px; }
  .xt-detail:active{ transform:scale(.97); }
  /* 질문 카드 자동 넘김(홈·표현 탭 공통): 카드 아래 얇은 막대 = 다음 질문까지 남은 시간, 넘어갈 때 살짝 사라졌다 떠오름 */
  /* 자동 넘김 줄: [일시정지/재생 버튼] 막대 + 상태 라벨("8초 후 다른 3개" / "일시정지됨" / "정답을 보는 동안 멈춤"). 설정 › 자동 넘김에서 끄면 줄 전체가 없음 */
  .qa-row{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .qa-pause{ flex:none; width:44px; height:44px; margin-left:-6px; border-radius:50%; display:grid; place-items:center; color:var(--accent); }
  .qa-pause svg{ width:20px; height:20px; padding:6px; box-sizing:content-box; border-radius:50%; border:1.5px solid var(--accent-line); }
  .qa-pause:active{ transform:scale(.94); }
  .qa-main{ flex:1; min-width:0; }
  .qa-label{ display:block; margin-top:5px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .qa-track{ height:3px; border-radius:2px; background:var(--line); overflow:hidden; }
  .qa-track i{ display:block; height:100%; border-radius:2px; background:var(--qa-c, var(--accent)); opacity:.75; transform-origin:left center; transition:transform .2s linear; }
  .qa-out{ opacity:0 !important; transform:translateY(-6px) !important; transition:opacity .18s ease, transform .18s ease !important; }
  .qa-in{ animation:qaIn .34s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes qaIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  /* 표현 목록: 카테고리 접기(머리를 누르면 펼치기·접기, 위쪽 [전체 펼치기/접기]). 검색 중엔 모두 펼침 */
  .x-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:22px; }
  .x-bar .set-label{ margin:0; }
  .toc-group:not(.open) .x-items{ display:none; }
  .toc-group.open .x-items{ margin-bottom:12px; }
  .x-tools{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }
  .x-search{ height:46px; }
  .x-filter button{ font-size:14px; height:38px; }
  .x-items{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .x-item{
    width:100%; display:flex; align-items:center; gap:12px; text-align:left;
    padding:12px 12px 12px 14px; border-radius:14px;
    background:var(--bg-2); border:1px solid var(--line);
  }
  .x-item:active{ transform:scale(.99); }
  .x-item.extra{ border-style:dashed; background:transparent; }
  .x-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .x-phrase{ font-size:17px; font-weight:650; color:var(--accent); }
  .x-item.extra .x-phrase{ color:var(--text-2); }
  .x-mean{ font-size:15px; color:var(--text-2); }
  .x-src{ font-size:12.5px; color:var(--faint); }
  .x-tag{ display:inline-block; margin-right:6px; padding:0 6px; border-radius:6px; font-size:11.5px; font-weight:600; border:1px dashed var(--faint); }
  .x-extra-note{ margin:6px 0 0; font-size:13px; color:var(--faint); }

  .st{
    flex:none; display:inline-flex; align-items:center; gap:4px;
    height:26px; padding:0 10px; border-radius:999px;
    font-size:12.5px; font-weight:600; white-space:nowrap;
  }
  .st svg{ width:12px; height:12px; }
  .st-new{ color:var(--faint); border:1px solid var(--line); }
  .st-learning{ color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent-line); }
  .st-mastered{ color:var(--on-accent); background:var(--accent); }

  /* 상세: 학습하기 / 연습장 */
  .study-box{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:16px 0 4px; padding:12px 14px; border-radius:16px; background:var(--bg-2); }
  .study-box.col{ flex-direction:column; align-items:stretch; gap:0; }
  .study-box .note{ margin-top:8px; }
  .study-due{ flex:1; font-size:14px; color:var(--text-2); }
  .study-stop{ font-size:13.5px; font-weight:600; color:var(--muted); padding:6px 10px; border-radius:999px; border:1px solid var(--line); }
  .study-start{ width:100%; color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .study-start:disabled{ color:var(--muted); background:var(--bg-3); }
  .practice{ margin-top:26px; padding-top:6px; border-top:1px solid var(--line); }
  .practice .w-copy{ margin-top:8px; }
  .practice .w-label{ margin-top:18px; }
  /* 연습장: 정리하기 미리보기 · 문장 카드(앞 = (누구에게) 한국어, 펼치면 고친 영어·내 답·팁) · 메모 */
  .dp-box{ margin-top:10px; padding:12px 14px; border-radius:14px; background:var(--accent-soft); border:1px solid var(--accent-line); }
  .dp-msg{ margin:0; font-size:15.5px; font-weight:700; color:var(--accent); }
  .dp-box .note{ margin-top:4px; }
  .dp-list{ margin:10px 0 0; padding-left:20px; max-height:240px; overflow-y:auto; font-size:13.5px; line-height:1.5; }
  .dp-list li{ margin-bottom:6px; }
  .dp-ko{ display:block; color:var(--text-2); }
  .dp-en{ display:block; color:var(--text); font-weight:600; }
  .dp-box .btn-row{ margin-top:10px; }
  .dp-save{ color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .dc-h{ margin-top:22px; }
  .dc-add{ width:100%; height:44px; margin-top:8px; border-radius:14px; border:1.5px dashed var(--line); font-size:15px; font-weight:600; color:var(--accent); }
  .dg{ margin-top:16px; }
  .dg-head{ display:flex; justify-content:space-between; gap:10px; margin:0 2px 6px; font-size:13px; font-weight:600; color:var(--muted); }
  .dc{ margin-top:6px; border-radius:14px; background:var(--bg-2); border:1px solid var(--line); overflow:hidden; }
  .dc-front{ width:100%; display:flex; align-items:flex-start; gap:8px; padding:12px 12px 12px 14px; text-align:left; }
  .dc-ko{ flex:1; min-width:0; font-size:15.5px; line-height:1.5; color:var(--text); }
  .dc-who{ display:inline-block; margin-right:6px; padding:0 7px; border-radius:6px; font-size:12px; font-weight:600; line-height:20px; vertical-align:1px; color:var(--muted); background:var(--bg-3); }
  .dc-ok{ flex:none; margin-top:2px; padding:0 7px; border-radius:999px; font-size:11.5px; font-weight:700; line-height:20px; color:var(--accent); background:var(--accent-soft); }
  .dc-chev{ flex:none; margin-top:2px; color:var(--faint); transition:transform .2s ease; }
  .dc-chev svg{ width:18px; height:18px; }
  .dc.open .dc-chev{ transform:rotate(180deg); }
  .dc-body{ display:none; padding:0 14px 12px; border-top:1px dashed var(--line); animation:fadeIn .25s ease both; }
  .dc.open .dc-body{ display:block; }
  .dc-ul{ list-style:none; margin:0; padding:0; }
  .dc-ul li{ display:flex; align-items:flex-start; gap:8px; padding-top:10px; }
  .dc-en{ flex:1; min-width:0; font-size:17.5px; line-height:1.5; font-weight:600; }
  .dc-me, .dc-tip{ margin:8px 0 0; font-size:14px; line-height:1.55; }
  .dc-me{ color:var(--faint); }
  .dc-x{ color:var(--text-2); background:none; text-decoration:line-through; text-decoration-color:color-mix(in srgb, #e5484d 70%, transparent); text-decoration-thickness:1.5px; }
  .dc-tip{ color:var(--text-2); }
  .dc-lab{ display:inline-block; margin-right:6px; font-size:11.5px; font-weight:700; color:var(--muted); }
  .dc-act{ display:flex; justify-content:flex-end; gap:6px; margin-top:10px; }
  .dc-act button{ height:32px; padding:0 12px; border-radius:999px; font-size:13px; font-weight:600; color:var(--muted); border:1px solid var(--line); }
  .dc-act button.danger{ color:#fff; background:#C62A2F; border-color:transparent; }   /* 2026-10-06 #e5484d 3.9:1 → 5.6:1 */
  .dc-act button.pri{ color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .dc-form{ padding:12px 14px; }
  .dc-f{ display:block; margin-top:8px; }
  .dc-f:first-child{ margin-top:0; }
  .dc-f span{ display:block; margin-bottom:4px; font-size:12.5px; font-weight:600; color:var(--muted); }
  .dc-in{ width:100%; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:15px; line-height:1.45; resize:vertical; }
  .dc-in:focus{ outline:2px solid var(--accent-line); outline-offset:0; }
  .dg-memo{ margin-top:6px; border-radius:12px; border:1px dashed var(--line); }
  .dg-memo > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; padding:9px 12px; font-size:13.5px; font-weight:600; color:var(--muted); }
  .dg-memo > summary::-webkit-details-marker{ display:none; }
  .dg-memo .h-chev svg{ width:16px; height:16px; }
  .dg-memo[open] .h-chev{ transform:rotate(180deg); }
  .dg-mtext{ padding:0 12px 10px; font-size:14px; line-height:1.6; color:var(--text-2); white-space:pre-wrap; word-break:break-word; }
  .dg-memo .dc-act{ margin:0 12px 10px; }
  .note-past{ margin-top:14px; }
  .note-past details{ border-bottom:1px solid var(--line); }
  .note-past summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:12px 2px; }
  .note-past summary::-webkit-details-marker{ display:none; }
  .note-past details[open] .h-chev{ transform:rotate(180deg); }
  .note-past .h-text{ margin-bottom:12px; }
  .go-card{ width:100%; margin-top:26px; }
  /* "이 표현 연습하기"(표현 상세): 시작 화면 없이 연습 모드로 */
  .pc-expr{ width:100%; margin-top:14px; gap:8px; color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  .pc-expr svg{ width:19px; height:19px; flex:none; }
  .pc-expr small{ font-size:12.5px; font-weight:500; color:var(--muted); }

  /* ---------- 복습 덱(플래시카드, 2026-10-06) — 전체 화면 #review ----------
     위 = ✕ + "복습" + 진행 "12 / 30" + 설정 아이콘, 진행 막대 / 가운데 = 카드 한 장(앞면 한국어 → 탭하면 뒷면 영어) /
     아래(엄지 자리) = [↶ 되돌리기] [뒤집기] 또는 [↶] [다시] [알았음]. 뒷면에서 오른쪽으로 밀기 = 알았음, 왼쪽 = 다시 */
  .fc-mode{ position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; background:var(--bg); color:var(--text); }
  .fc-mode[hidden]{ display:none; }
  body.reviewing .toast{ bottom:calc(env(safe-area-inset-bottom, 0px) + 120px); }
  .fc-count{ margin-left:auto; margin-right:2px; font-size:15px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
  .fc-count b{ color:var(--text); }
  .fc-gear{ flex:none; width:44px; height:44px; margin:0 -8px 0 auto; border-radius:50%; display:grid; place-items:center; color:var(--muted); }
  .fc-gear svg{ width:21px; height:21px; }
  .fc-gear:active{ background:var(--line); }
  .fc-bar{ flex:none; height:4px; margin:4px max(var(--pad), env(safe-area-inset-right)) 0 max(var(--pad), env(safe-area-inset-left)); border-radius:2px; background:var(--bg-3); overflow:hidden; }
  .fc-bar i{ display:block; height:100%; width:100%; background:var(--accent); transform-origin:left; transition:transform .3s ease; }
  .fc-stage{
    flex:1; min-height:0; display:flex; flex-direction:column;
    padding:14px max(var(--pad), env(safe-area-inset-right)) 6px max(var(--pad), env(safe-area-inset-left));
  }
  .fc-card{
    position:relative; flex:1; min-height:0; display:flex; flex-direction:column;
    border-radius:24px; background:var(--bg-2); border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    touch-action:pan-y; cursor:pointer;
    animation:dvIn .3s cubic-bezier(.2,.8,.2,1) both;
  }
  .fc-card.dragging{ transition:none; animation:none; cursor:grabbing; }
  .fc-card.snap{ transition:transform .22s ease; }
  .fc-card.fly{ transition:transform .22s ease-in, opacity .22s ease-in; opacity:0; animation:none; }
  .fc-card, .fc-card *{ touch-action:pan-y; }   /* 카드 안 어디서든 가로 움직임은 앱이(밀기), 세로는 스크롤 — 안쪽 .fc-face가 스크롤 영역이라 여기까지 막아야 함 */
  .fc-face{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; display:flex; flex-direction:column; padding:18px 20px 20px; }
  .fc-face::-webkit-scrollbar{ display:none; }
  .fc-face[hidden]{ display:none; }
  .fc-back{ animation:fcFlip .28s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fcFlip{ from{ opacity:0; transform:perspective(900px) rotateY(-70deg); } to{ opacity:1; transform:none; } }

  .ck{

/* ================= 데이터 받기 ================= */
/* 카드는 파일 순서와 상관없이 id 순서로 보여 줌 */
/* 카드 순서: id 순서. 단 '다른 선택' 카드(variantOf = 원래 카드 id)는 원래 카드 바로 뒤에(같은 원래 카드의 다른 선택끼리는 id 순).
   id는 그대로라 본 카드·이어 보기·학습 기록은 영향 없음. 피드·목록·카테고리 목록·드라이브·연습 모두 이 순서를 씀 */
const CARDS = (() => {
  const byId = (window.CARD_DATA || []).slice().sort((a, b) => a.id - b.id);
  const ids = new Set(byId.map(c => c.id));
  const isVar = c => c.variantOf != null && c.variantOf !== c.id && ids.has(c.variantOf);
  const kids = {};
  byId.forEach(c => { if (isVar(c)) (kids[c.variantOf] = kids[c.variantOf] || []).push(c); });
  const out = [], done = new Set();
  const put = c => { if (done.has(c)) return; done.add(c); out.push(c); (kids[c.id] || []).forEach(put); };
  byId.forEach(c => { if (!isVar(c)) put(c); });
  byId.forEach(put);                                        // 잘못 이어진 것(서로를 가리킴 등)도 빠지지 않게 — 검사 도구가 문제로 잡음
  return out;
})();
const CARD_INDEX_BY_ID = {};
CARDS.forEach((c, i) => { CARD_INDEX_BY_ID[c.id] = i; });
/* 이 카드의 다른 선택 카드들(CARDS 번호) / 원래 카드(CARDS 번호, 없으면 -1) */
const variantsOf = ci => CARDS.map((c, i) => i).filter(i => CARDS[i].variantOf === CARDS[ci].id && i !== ci);
const originOf = ci => { const o = CARDS[ci].variantOf; return o != null && o in CARD_INDEX_BY_ID && CARD_INDEX_BY_ID[o] !== ci ? CARD_INDEX_BY_ID[o] : -1; };
const QUESTIONS = window.QUESTION_DATA || [];
const CATEGORY_HUE = {};
const CATEGORY_EMOJI = {};

  fcRemote: true,                        // 복습 덱: 이어폰·차(블루투스)·잠금화면 버튼 — ⏭ 알았음 · ⏮ 다시 · ▶ 뒤집기
  fcEcho: 0,                             // 복습 덱: 따라 말하기 0(끄기) / 1 / 3 / 5번 — 듣기 → 문장 길이만큼 따라 말할 시간
  textZoom: 1                            // 글자 크기(2026-10-06, 드라이브 재생 화면·상황 카드 쉐도잉): 1 기본 / 1.25 크게 / 1.5 더 크게 / 1.8 아주 크게
};
const TEXT_ZOOMS = [1, 1.25, 1.5, 1.8];
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
    const merged = Object.assign({}, DEFAULTS, s && typeof s === "object" ? s : {});
    if (!EL_MODELS.some(m => m.id === merged.model)) merged.model = DEFAULTS.model;
    if (merged.drillRate !== 0.8) merged.drillRate = 1;
    merged.rotate = merged.rotate !== false;
    if (![5, 10, 20].includes(merged.rotateSec)) merged.rotateSec = 10;
    merged.fcAuto = merged.fcAuto !== false;

    if (![0, 1, 3, 5].includes(merged.fcEcho)) merged.fcEcho = 0;

    return merged;

}

const settings = loadSettings();
/* 글자 크기: CSS 변수 --tz → 드라이브 재생 화면 문장(.dv-line)·쉐도잉 모드 대화(.m-shadow .chat)에 zoom(글자·말풍선·줄바꿈이 같이 커짐) */

/* ---------- 앱의 '지금'과 '오늘' (하루는 자정 기준 — 폰 현지 시각) ----------
   모든 '오늘' 계산(복습 날짜·하루 새 표현 3개·글쓰기 오늘의 질문·"오늘 작성"·오늘 탭 집계·연속 학습일)은 dateKey()(= 오늘 날짜 "YYYY-MM-DD") 하나로.
   테스트용: 주소에 ?debugDate=2026-10-20 (그 날 낮 12시) 또는 ?debugDate=2026-10-20T23:59 (시각까지) — 그 시각에서 시작해 실제 시간만큼 흘러감.
   화면에는 안 보임. 예) 23:59로 열고 1~2분 기다리면 날짜가 바뀜 */
const DEBUG_T0 = (() => {
  try {
    const v = new URLSearchParams(location.search).get("debugDate") || "";
    const m = /^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/.exec(v.trim());
    if (!m) return null;
    const t = new Date(+m[1], +m[2] - 1, +m[3], m[4] != null ? +m[4] : 12, m[5] != null ? +m[5] : 0, m[6] != null ? +m[6] : 0);
    return isNaN(t) ? null : { at: t.getTime(), real: Date.now() };
  } catch (e) { return null; }
})();
function appNow() { return DEBUG_T0 ? new Date(DEBUG_T0.at + (Date.now() - DEBUG_T0.real)) : new Date(); }

/* ---------- 날짜별 학습 기록(오늘 탭 '오늘 진행'·최근 7일·연속 학습일, 2026-10-05) ----------
   engcards.days.v1 { v: 1, days: { "YYYY-MM-DD": { c: [그날 본 상황 카드 id], r: 복습한 수, n: 새로 고른 표현 수, w: 1(일기 씀) } }, filled: 1 }
   학습한 날 = c·r·n·w 중 하나라도 있는 날. 예전 기록(복습 history·picks·startedOn·일기·카드 본 시각)에서 복원할 수 있는 건 앱을 열 때 채움(fillDays) */
const DAYS_KEY = "engcards.days.v1";
const dayLog = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(DAYS_KEY) || "null");
    if (s && typeof s === "object" && s.days && typeof s.days === "object") return s;
  } catch (e) {}
  return { v: 1, days: {} };
})();
function saveDays() { try { localStorage.setItem(DAYS_KEY, JSON.stringify(dayLog)); } catch (e) {} }
function dayRec(d) {
  const r = dayLog.days[d] = dayLog.days[d] && typeof dayLog.days[d] === "object" ? dayLog.days[d] : {};
  if (!Array.isArray(r.c)) r.c = [];
  return r;
}
/* kind: "w" 일기 / "r" 복습 1개 / "n" 새 표현(add = +1 또는 -1 — 오늘 고른 걸 오늘 중단하면 -1) */
function logDay(d, kind, add) {
  const r = dayRec(d);
  if (kind === "w") { if (r.w) return; r.w = 1; }
  else r[kind] = Math.max(0, (r[kind] || 0) + (add == null ? 1 : add));
  saveDays();
}
/* 상황 카드를 '봤음'(2026-10-06 사용자 요청 — 예전엔 화면에 나오기만 해도 셈): 대화를 끝까지 했을 때만.
   읽기 = 마지막 줄이 나옴·[전체 보기] / 듣기 = 대화 전체를 끝까지 들음·[정답 확인] / 쉐도잉 쉬움·어려움 = 마지막 줄까지 / 중간 = 끝까지 들음 /
   연습 모드 = 그 카드의 마지막 대사 줄을 이어서 말하기까지 하고 [다음]. → 오늘 본 상황 카드(engcards.days.v1의 c) + 목록의 본 카드 ✓(seenSet) 둘 다 */
function markCardDone(ci) {
  const c = CARDS[ci];
  if (!c) return;
  const key = cardKey(ci), r = dayRec(dateKey()), fresh = !r.c.includes(c.id);
  seenSet.add(key);
  progress.at[key] = Date.now();

  if (!fresh) return;

  if (typeof renderToday === "function" && currentTab === "today") renderToday();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function hueOf(category) {
  if (category in CATEGORY_HUE) return CATEGORY_HUE[category];
  let h = 0;
  for (const ch of String(category)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}

/* 예문·썰에서 표현 부분을 형광펜으로 (밑줄과 같은 규칙으로 찾음) → 겹치지 않는 범위 [{ s, e, open, close }] */
function markRanges(text, ex) {
  const found = [];
  exprSources(ex).forEach(src => {
    const re = new RegExp(src, "gi");
    let m;
    while ((m = re.exec(text))) {
      if (!m[0].length) { re.lastIndex++; continue; }
      found.push([m.index, m.index + m[0].length]);
    }
  });
  found.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
  const out = [];
  let pos = 0;
  found.forEach(r => {
    if (r[0] < pos) return;
    out.push({ s: r[0], e: r[1], open: "<mark>", close: "</mark>" });
    pos = r[1];
  });
  return out;
}
/* 재생하지 않는 글(복습 답의 대사)용: 형광펜만 */
function decorate(text, ex) {
  let html = "", pos = 0;
  markRanges(text, ex).forEach(r => {
    html += esc(text.slice(pos, r.s)) + "<mark>" + esc(text.slice(r.s, r.e)) + "</mark>";
    pos = r.e;
  });
  return html + esc(text.slice(pos));
}

/* ---------- 핵심 표현 찾기: phrase의 ~ 자리는 아무 단어, forms는 활용형(예: stayed in) ---------- */
function patternSource(p) {
  const parts = String(p).split("~")
    .map(s => s.trim().replace(/^[\s,.!?]+|[\s,.!?]+$/g, ""))
    .filter(Boolean);
  if (!parts.length) return null;
  let src = parts.map(reEsc).join(".{1,40}?");
  if (/^\w/.test(parts[0])) src = "\\b" + src;
  if (/\w$/.test(parts[parts.length - 1])) src += "\\b";
  return src;
}
function exprSources(e) {
  return [e.phrase].concat(e.forms || []).map(patternSource).filter(Boolean);
}
function exprFound(e, text) {
  return exprSources(e).some(src => new RegExp(src, "i").test(text));
}
/* 대사 안의 핵심 표현에 밑줄(누르면 예문·썰) */
/* 밑줄 규칙
   ① 한 카드 안에서 같은 표현은 처음 나온 대사에만 밑줄 (used: 이 카드에서 이미 그은 표현 번호)
   ② 앱 전체에서 같은 표현은 처음 나온 카드(id 순)에서만 밑줄 (EXPR_OWNER)
   ③ 한 대사 안에서 밑줄끼리 겹치거나 붙어 있으면 뒤의 것은 긋지 않음 */
function normPhrase(p) {
  return String(p).toLowerCase().replace(/[~.,!?'’]/g, "").replace(/\s+/g, " ").trim();
}
const EXPR_OWNER = {};
CARDS.map((c, ci) => ci).sort((a, b) => CARDS[a].id - CARDS[b].id).forEach(ci => (CARDS[ci].expressions || []).forEach(e => {   // id가 작은 카드가 주인(다른 선택 카드가 앞에 끼어들어도)
  const k = normPhrase(e.phrase);
  if (!(k in EXPR_OWNER)) EXPR_OWNER[k] = ci;
}));

function findRanges(text, card, ci, used) {
  const found = [];
  (card.expressions || []).forEach((e, ei) => {
    if (used && used.has(ei)) return;
    if (EXPR_OWNER[normPhrase(e.phrase)] !== ci) return;
    let best = null;
    exprSources(e).forEach(src => {
      const m = new RegExp(src, "i").exec(text);
      if (m && m[0].length && (!best || m.index < best.s)) best = { s: m.index, e: m.index + m[0].length, ei };
    });
    if (best) found.push(best);
  });
  found.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const out = [];
  let pos = 0;
  found.forEach(r => {
    if (r.s < pos) return;                                              // 겹침
    if (out.length && /^[\s,.!?'"“”’-]*$/.test(text.slice(pos, r.s))) return;   // 바로 붙어 있음
    out.push(r);
    pos = r.e;
  });
  return out;
}

/* 추가 표현(extraExpressions): 핵심 밑줄과 겹치지 않는 자리에, 카드 안에서 처음 나온 곳에만 연한 점선 밑줄 */
function extraRanges(text, card, taken, usedX) {
  const out = [];
  (card.extraExpressions || []).forEach((e, ei) => {
    if (usedX.has(ei)) return;
    for (const src of exprSources(e)) {
      const m = new RegExp(src, "i").exec(text);
      if (!m || !m[0].length) continue;
      const r = { s: m.index, e: m.index + m[0].length, ei, kind: "extra" };
      if (taken.concat(out).some(x => r.s < x.e && x.s < r.e)) continue;
      out.push(r);
      usedX.add(ei);
      break;
    }
  });
  return out;
}

/* ================= 인터랙티브 스크립트 ① 글 준비·그리기 (대화문·예문·썰 공통) =================
   getScript(text) → 문장 하나의 정보(같은 글은 한 번만 만듦, SCRIPTS[id]에 보관)
     { id, text: 화면에 보이는 글, speech: 음성으로 보낼 글(괄호 속 한국어 뜻 "(어색한)"은 뺌),
       words: [{ pieces: [[화면 시작, 끝]...], ss, se: speech 안의 시작·끝 }], wordAt(speech 위치) → 단어 번호 }
   scriptHtml(text, ranges) → <span class="sc" data-sc="id"> 안에 단어마다 <span class="w" data-w="번호">.
     밑줄·형광펜(ranges: [{ s, e, open, close }])은 단어 span 바깥에 씌움. 괄호 속 한국어는 <span class="gloss">(단어 아님)
     opts.links: 연음 표시할 공백 위치(Set) → <span class="lk">(줄바꿈 안 되는 공백 + 아래 작은 호, 연습 모드). 화면 표시만 바뀌고 읽을 글은 그대로 */
const SCRIPTS = [];
const SCRIPT_BY_TEXT = new Map();
const GLOSS_RE = /\s*\([^()]*[가-힣ㄱ-ㅎㅏ-ㅣ][^()]*\)/g;

function getScript(text) {
  text = String(text || "");
  if (SCRIPT_BY_TEXT.has(text)) return SCRIPT_BY_TEXT.get(text);
  const n = text.length;
  const gloss = new Uint8Array(n);
  GLOSS_RE.lastIndex = 0;
  let m;
  while ((m = GLOSS_RE.exec(text))) for (let i = m.index; i < m.index + m[0].length; i++) gloss[i] = 1;
  /* 화면 글자 → 읽을 글 위치 (괄호 속 한국어는 -1) */
  const d2s = new Int32Array(n);
  let speech = "";
  for (let i = 0; i < n; i++) {
    if (gloss[i]) { d2s[i] = -1; continue; }
    d2s[i] = speech.length;
    speech += text[i];
  }
  /* 단어 = 공백·괄호 뜻으로 끊긴 글자 덩어리. 글자·숫자가 없는 덩어리(“, — 등)는 앞 단어에 붙임 */
  const toks = [];
  let cur = null;
  for (let i = 0; i < n; i++) {
    if (gloss[i] || /\s/.test(text[i])) { cur = null; continue; }
    if (cur) cur.e = i + 1;
    else { cur = { s: i, e: i + 1 }; toks.push(cur); }
  }
  const words = [];
  let lead = [];                                     // 맨 앞의 글자 없는 덩어리는 다음 단어에 붙임
  toks.forEach(t => {
    const p = [t.s, t.e];
    if (/[A-Za-z0-9]/.test(text.slice(t.s, t.e))) { words.push({ pieces: lead.concat([p]) }); lead = []; }
    else if (words.length) words[words.length - 1].pieces.push(p);
    else lead.push(p);
  });
  if (lead.length) words.push({ pieces: lead });
  const wAt = new Int32Array(n).fill(-1);
  const sp2w = new Int32Array(speech.length).fill(-1);
  words.forEach((w, k) => {
    w.pieces.forEach(p => { for (let i = p[0]; i < p[1]; i++) { wAt[i] = k; if (d2s[i] >= 0) sp2w[d2s[i]] = k; } });
    w.ss = d2s[w.pieces[0][0]];
    w.se = d2s[w.pieces[w.pieces.length - 1][1] - 1] + 1;
  });
  for (let i = 1; i < sp2w.length; i++) if (sp2w[i] < 0) sp2w[i] = sp2w[i - 1];   // 공백은 앞 단어로
  const sc = {
    id: SCRIPTS.length, text, speech, words, wAt, gloss,
    wordAt: i => (i >= 0 && i < sp2w.length ? Math.max(0, sp2w[i]) : (i >= sp2w.length ? words.length - 1 : 0))
  };
  SCRIPTS.push(sc);
  SCRIPT_BY_TEXT.set(text, sc);
  return sc;
}

function scriptHtml(text, ranges, opts) {
  const sc = getScript(text);
  const t = sc.text, n = t.length;
  const links = opts && opts.links;
  const list = (ranges || []).slice().sort((a, b) => a.s - b.s);
  const rAt = new Int32Array(n).fill(-1);
  list.forEach((r, ri) => { for (let i = r.s; i < r.e && i < n; i++) if (rAt[i] < 0) rAt[i] = ri; });
  let html = '<span class="sc" data-sc="' + sc.id + '">';
  let curR = -1, curW = -1, curG = 0;
  const closeIn = () => { if (curW >= 0 || curG) html += "</span>"; curW = -1; curG = 0; };
  for (let i = 0; i < n; i++) {
    const r = rAt[i], w = sc.wAt[i], g = sc.gloss[i];
    if (r !== curR) {
      closeIn();
      if (curR >= 0) html += list[curR].close;
      if (r >= 0) html += list[r].open;
      curR = r;
    }
    if (w !== curW || g !== curG) {
      closeIn();
      if (g) { html += '<span class="gloss">'; curG = 1; }
      else if (w >= 0) { html += '<span class="w" data-w="' + w + '">'; curW = w; }
    }
    html += links && links.has(i) ? '<span class="lk">&nbsp;</span>' : esc(t[i]);
  }
  closeIn();
  if (curR >= 0) html += list[curR].close;
  return html + "</span>";
}

/* 대사의 밑줄 범위 → scriptHtml용 */
function xpRanges(ranges, ci) {
  return ranges.map(r => ({
    s: r.s, e: r.e, close: "</span>",
    open: '<span class="xp' + (r.kind === "extra" ? " xp-x" : "") + '" data-c="' + ci + '" data-e="' + r.ei + '" data-k="' + (r.kind || "core") + '">'
  }));
}

/* used / usedX: 이 카드에서 이미 밑줄 그은 핵심 / 추가 표현 번호 */
function markExpressions(text, card, ci, used, usedX) {
  const core = findRanges(text, card, ci, used);
  core.forEach(r => used.add(r.ei));
  return scriptHtml(text, xpRanges(core.concat(extraRanges(text, card, core, usedX)), ci));
}

/* ---------- 대사 한 줄 그리기 (세 모드 공통. 나중에 드라이브 모드·인터랙티브 스크립트도 이걸 씀) ----------

/* 카드 하나의 대화 전체 (밑줄 규칙 때문에 위에서부터 차례로 그림). 모드와 상관없이 같은 HTML */
