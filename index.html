<!-- 화면과 동작만 담은 파일. 카드는 data/cards/ 폴더, 질문은 data/questions.js에 추가하세요 (규칙은 CLAUDE.md) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>한 장 영어</title>
<!-- 웹앱 설치용(같은 폴더에 manifest·아이콘·sw.js가 있을 때만 동작, 없어도 앱은 정상 동작) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    color-scheme: dark;
    --bg:#121417;
    --bg-2:#1A1D21;
    --bg-3:#23272D;
    --text:#ECE9E4;
    --text-2:#C9CBCF;
    --muted:#A1A7B0;
    --faint:#6E747D;
    --line:rgba(255,255,255,.08);
    --bubble:#1F2328;
    --bubble-text:#E9E7E3;
    --accent:#86C2AC;
    --accent-soft:rgba(134,194,172,.11);
    --accent-line:rgba(134,194,172,.42);
    --mark:rgba(134,194,172,.26);
    --me:#2D5C4F;
    --me-text:#F0F7F3;
    --sheet:#1A1D21;
    --scrim:rgba(0,0,0,.58);
    --shadow:0 -12px 40px rgba(0,0,0,.45);
    --toast:#2B3036;
    --tag-l:74%;
    --tag-a:.15;
    --glow-a:.10;
    --pad:20px;
    --tabbar-h:58px;
    --modebar-h:46px;
    --on-accent:#10201B;
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme: light;
      --bg:#F5F3EE;
      --bg-2:#ECE9E2;
      --bg-3:#F0EDE6;
      --text:#1F2226;
      --text-2:#3B3F45;
      --muted:#5E646C;
      --faint:#979DA5;
      --line:rgba(0,0,0,.08);
      --bubble:#FFFFFF;
      --bubble-text:#24272B;
      --accent:#2C7A63;
      --accent-soft:rgba(44,122,99,.07);
      --accent-line:rgba(44,122,99,.36);
      --mark:rgba(44,122,99,.16);
      --me:#2C7A63;
      --me-text:#FFFFFF;
      --sheet:#FBFAF7;
      --scrim:rgba(20,22,25,.34);
      --shadow:0 -12px 40px rgba(0,0,0,.12);
      --toast:#2B3036;
      --tag-l:34%;
      --tag-a:.12;
      --glow-a:.09;
      --on-accent:#FFFFFF;
    }
  }
  @media (max-width:370px){ :root{ --pad:18px; } }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background:var(--bg); color:var(--text);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:17px; line-height:1.55;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    word-break:keep-all; overflow-wrap:break-word;
  }
  button{
    font:inherit; color:inherit; background:none; border:0; padding:0; margin:0;
    cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  button:focus{ outline:none; }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  svg{ display:block; }

  /* ---------- 앱 틀: 화면 + 하단 탭 바 ---------- */
  .app{
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
  }
  .views{ position:relative; flex:1; min-height:0; }
  .view{ position:absolute; inset:0; }
  .view.off{ visibility:hidden; pointer-events:none; }   /* display:none이 아니라서 스크롤 위치·입력 내용이 그대로 남음 */
  .tabbar{
    position:relative; z-index:15;
    flex:none; display:flex;
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
    padding:0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background:var(--bg);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:12.5px; font-weight:600; color:var(--faint);
    transition:color .2s ease;
  }
  .tab svg{ width:23px; height:23px; }
  .tab[aria-selected="true"]{ color:var(--accent); }
  .tab:active svg{ transform:scale(.92); }
  body.typing .tabbar{ display:none; }   /* 키보드가 올라와 있을 땐 입력칸을 넓게 */

  /* ---------- 피드 ---------- */
  .feed{
    overflow-y:auto; overflow-x:hidden;
    scroll-snap-type:y mandatory;
    overscroll-behavior-y:none;
    scrollbar-width:none;
  }
  .feed::-webkit-scrollbar{ display:none; }

  .card{
    --h:160;
    position:relative;
    height:100%;
    scroll-snap-align:start; scroll-snap-stop:always;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:55%;
    background:radial-gradient(120% 70% at 50% -15%, hsl(var(--h) 55% 50% / var(--glow-a)), transparent 62%);
    pointer-events:none;
  }

  .top{
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) max(var(--pad), env(safe-area-inset-right)) 8px max(var(--pad), env(safe-area-inset-left));
  }
  .tag{
    font-size:13.5px; font-weight:600; letter-spacing:.01em;
    padding:6px 12px; border-radius:999px;
    color:hsl(var(--h) 52% var(--tag-l));
    background:hsl(var(--h) 50% 55% / var(--tag-a));
  }
  .top-r{ display:flex; align-items:center; gap:2px; }
  .jump{
    display:flex; align-items:center; gap:6px;
    height:36px; padding:0 10px; border-radius:999px;
    font-size:14px; color:var(--faint); font-variant-numeric:tabular-nums; letter-spacing:.02em;
  }
  .jump:active{ background:var(--line); }
  .jump svg{ width:17px; height:17px; }
  .gear{
    width:40px; height:40px; margin-right:-10px;
    display:grid; place-items:center; border-radius:50%;
    color:var(--faint);
  }
  .gear:active{ background:var(--line); }
  .gear svg{ width:21px; height:21px; }

  .body{
    position:relative;
    flex:1; min-height:0;
    overflow-y:auto; overflow-x:hidden;
    overscroll-behavior-y:auto;
    padding:0 max(var(--pad), env(safe-area-inset-right)) 0 max(var(--pad), env(safe-area-inset-left));
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 22px), transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 22px), transparent 100%);
  }
  .body::-webkit-scrollbar{ display:none; }
  .inner{
    min-height:100%;
    display:flex; flex-direction:column; justify-content:flex-start;
    padding:22px 0 30px;
  }

  .title{ margin:0; font-size:24px; line-height:1.3; font-weight:700; letter-spacing:-.015em; }
  .situation{ margin:10px 0 0; font-size:17px; line-height:1.6; color:var(--text-2); }

  /* ---------- 대화: 한 줄 = renderLine() (세 모드 공통) ----------
     줄에서 무엇을 보일지는 클래스로 정함: 카드 m-read/m-listen/m-shadow·masked, 줄 off/kq-on/cur/past/playing */
  .mnote{ margin:18px 0 0; font-size:14.5px; line-height:1.6; color:var(--faint); }
  .mnote:empty{ display:none; }
  .chat{ display:flex; flex-direction:column; gap:10px; margin-top:28px; -webkit-user-select:none; user-select:none; }
  .mnote:not(:empty) ~ .chat{ margin-top:18px; }
  .row{ display:flex; flex-direction:column; max-width:88%; }
  .row.them{ align-self:flex-start; align-items:flex-start; }
  .row.me{ align-self:flex-end; align-items:flex-end; }
  .row.off{ display:none; }
  .row.pop{ animation:popIn .38s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes popIn{ from{ opacity:0; transform:translateY(10px) scale(.98); } to{ opacity:1; transform:none; } }
  .who{ display:none; font-size:13px; color:var(--faint); margin:0 8px 5px; }
  .row.first-them .who{ display:block; }
  .line{ display:flex; align-items:center; gap:8px; }
  .row.me .line{ flex-direction:row-reverse; }

  .bubble{
    display:block; text-align:left;
    font-size:17.5px; line-height:1.45;
    padding:11px 15px; border-radius:20px;
    border:1.5px solid transparent;
    transition:background-color .3s ease, border-color .3s ease, box-shadow .3s ease, opacity .3s ease, transform .12s ease;
  }
  .row.them .bubble{ background:var(--bubble); color:var(--bubble-text); border-bottom-left-radius:6px; }
  .row.me .bubble{ background:var(--me); color:var(--me-text); border-bottom-right-radius:6px; }
  @media (prefers-color-scheme: light){
    .row.them .bubble{ box-shadow:0 1px 2px rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.04); }
  }
  .bubble .en{ display:block; }
  .bubble .kq{ display:none; }
  .m-read .row.me .bubble, .m-listen:not(.masked) .bubble{ cursor:pointer; }
  .m-read .row.me .bubble:active, .m-listen:not(.masked) .bubble:active{ transform:scale(.98); }

  .ko{ font-size:15px; line-height:1.5; color:var(--muted); margin:5px 8px 0; }
  .row.me .ko{ text-align:right; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  /* 읽기: 아직 확인 안 한 내 대사는 한글만, 탭할 때마다 영어 ↔ 한글 */
  .row.me.kq-on .bubble{ background:var(--accent-soft); border-color:var(--accent-line); border-style:dashed; color:var(--text); }
  .row.me.kq-on .en, .row.me.kq-on .ko{ display:none; }
  .row.me.kq-on .kq{ display:block; font-size:16.5px; line-height:1.5; animation:fadeIn .25s ease both; }
  .m-read .row.me:not(.kq-on) .en{ animation:fadeIn .25s ease both; }
  .hint{ display:none; font-size:12.5px; color:var(--faint); margin:6px 8px 0; }
  .m-read .row.me.kq-on .hint{ display:block; }
  body.hinted .m-read .row.me .hint{ display:none; }

  /* 쉐도잉·듣기: 지금 줄 강조, 지나간 줄은 흐리게 */
  .row.cur .bubble, .row.playing .bubble{ box-shadow:0 0 0 2.5px var(--accent); }
  .row > *{ transition:opacity .3s ease; }
  .row.past > *{ opacity:.42; }   /* 줄 자체는 popIn 애니메이션이 opacity를 잡고 있어서 안쪽을 흐리게 */

  /* 듣기: 정답 확인 전에는 대화 대신 두 사람 아이콘(왼쪽 상대, 오른쪽 나). 말하는 쪽은 진한 테두리 + 은은하게 퍼짐, 안 말하는 쪽은 흐리게
     카드 클래스: masked(정답 확인 전) · talk-them / talk-me(지금 말하는 쪽) · lpaused(일시정지) */
  .duo{ display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:22px; min-height:250px; padding:20px 0 6px; }
  .masked .chat{ display:none; }
  .masked .duo{ display:flex; }
  .duo-people{ display:flex; gap:48px; }
  .person{
    display:flex; flex-direction:column; align-items:center; gap:11px;
    --c:hsl(var(--h) 52% var(--tag-l)); --g:hsl(var(--h) 50% 55% / .3);
    transition:opacity .35s ease;
  }
  .person.me{ --c:var(--accent); --g:var(--accent-line); }
  .avatar{
    position:relative; width:88px; height:88px; border-radius:50%;
    display:grid; place-items:center;
    color:var(--c); background:var(--bg-2); border:2px solid var(--line);
    transition:border-color .3s ease, box-shadow .4s ease, transform .3s ease;
  }
  .avatar svg{ width:52px; height:52px; }
  .avatar::after{ content:""; position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--c); opacity:0; pointer-events:none; }
  .pname{ font-size:15px; font-weight:600; color:var(--text-2); transition:color .3s ease; }
  .duo-n{ font-size:13.5px; color:var(--faint); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .talk-them .person.me, .talk-me .person.them{ opacity:.35; }
  .talk-them .person.them .avatar, .talk-me .person.me .avatar{ border:3px solid var(--c); box-shadow:0 0 26px 6px var(--g); transform:scale(1.04); }
  .talk-them .person.them .avatar::after, .talk-me .person.me .avatar::after{ animation:ripple 1.6s ease-out infinite; }
  .talk-them .person.them .pname, .talk-me .person.me .pname{ color:var(--c); }
  .lpaused .avatar::after{ animation:none !important; opacity:0; }
  @keyframes ripple{ from{ opacity:.55; transform:scale(1); } to{ opacity:0; transform:scale(1.42); } }

  .spk{
    flex:none;
    width:36px; height:36px; border-radius:50%;
    display:grid; place-items:center;
    color:var(--accent); background:var(--accent-soft);
    transition:transform .2s ease;
  }
  .spk svg{ width:18px; height:18px; }
  .spk:active{ transform:scale(.92); }
  .spk.playing svg{ animation:pulse 1s ease-in-out infinite; }
  .card:not(.m-read) .row .spk{ display:none; }   /* 줄마다 스피커는 읽기 모드에만 */
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .typing .dots{ display:flex; gap:5px; padding:16px 17px; }
  .typing .dots i{ width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1s infinite ease-in-out; }
  .typing .dots i:nth-child(2){ animation-delay:.15s; }
  .typing .dots i:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; transform:translateY(0); } 40%{ opacity:.85; transform:translateY(-3px); } }

  /* ---------- 대사 속 표현: 핵심(밑줄) · 추가(연한 점선). 누르면 설명 바텀시트 ---------- */
  .xp{
    text-decoration:underline;
    text-decoration-color:var(--accent);
    text-decoration-thickness:2px;
    text-underline-offset:4px;
    border-radius:4px;
    cursor:pointer;
    transition:background-color .15s ease;
  }
  .xp:active{ background:var(--accent-soft); }
  .xp-x{ text-decoration-style:dotted; text-decoration-color:var(--muted); text-decoration-thickness:1.5px; }
  .row.me .xp{ text-decoration-color:rgba(255,255,255,.75); }
  .row.me .xp-x{ text-decoration-color:rgba(255,255,255,.55); }
  .row.me .xp:active{ background:rgba(255,255,255,.14); }
  .xp-ko{ margin:12px 0 4px; font-size:16.5px; line-height:1.65; color:var(--text-2); }

  /* ---------- 하단 버튼: 모드마다 다르지만 주요 버튼은 항상 오른쪽 넓은 자리 ---------- */
  .bottom{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:10px max(var(--pad), env(safe-area-inset-right)) calc(8px + var(--modebar-h)) max(var(--pad), env(safe-area-inset-left));   /* 아래 여백: 모드 선택 줄만큼 (제스처 바는 탭 바가 맡음) */
  }
  .actions{ display:flex; gap:8px; width:100%; }
  .btn{
    height:54px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:17px; font-weight:600;
    background:var(--bg-2); color:var(--text);
    border:1px solid var(--line);
    transition:transform .12s ease, background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn:active{ transform:scale(.98); }
  .actions .btn{ flex:none; min-width:0; gap:6px; padding:0 13px; font-size:15.5px; white-space:nowrap; }
  .actions .btn svg{ width:19px; height:19px; flex:none; }
  .actions .main{ flex:1; padding:0 10px; font-size:16.5px; color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .actions .ico-btn{ width:46px; padding:0; color:var(--muted); }
  .actions .rate{ width:54px; padding:0; color:var(--accent); font-variant-numeric:tabular-nums; }
  .actions .on{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .actions .restart{ flex:1; }
  .swipe-hint{ font-size:12.5px; color:var(--faint); }

  /* ---------- 모드 선택: 탭 바 바로 위, 상황 탭에서만 ---------- */
  .modebar{
    position:absolute; left:0; right:0; bottom:0; z-index:5;
    height:var(--modebar-h);
    display:none; align-items:center; justify-content:center;
    padding:0 max(var(--pad), env(safe-area-inset-right)) 6px max(var(--pad), env(safe-area-inset-left));
    background:var(--bg);
  }
  body.tab-cards .modebar{ display:flex; }
  .mode-seg{ width:100%; max-width:360px; }
  .modebar .mode-seg button{ height:32px; font-size:14.5px; }

  /* ---------- 마지막 카드 ---------- */
  .end .inner{ align-items:center; justify-content:center; text-align:center; }
  .end-emoji{ font-size:44px; line-height:1; margin-bottom:18px; }
  .end-title{ margin:0; font-size:34px; font-weight:750; letter-spacing:-.02em; }
  .end-sub{ margin:12px 0 0; font-size:17px; line-height:1.65; color:var(--text-2); }

  /* ---------- 바텀시트 ---------- */
  .scrim{
    position:fixed; inset:0; z-index:20;
    background:var(--scrim);
    opacity:0; pointer-events:none;
    transition:opacity .28s ease;
    touch-action:none;
  }
  .scrim.on{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:21;
    max-height:88vh; max-height:88dvh;
    display:flex; flex-direction:column;
    background:var(--sheet);
    border-radius:24px 24px 0 0;
    box-shadow:var(--shadow);
    transform:translateY(105%);
    visibility:hidden;
    transition:transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s linear .32s;
  }
  .sheet.on{
    transform:translateY(0); visibility:visible;
    transition:transform .36s cubic-bezier(.2,.8,.2,1), visibility 0s;
  }
  .sheet.dragging{ transition:none; }
  .sheet-head{
    flex:none; touch-action:none;
    padding:10px max(var(--pad), env(safe-area-inset-right)) 14px max(var(--pad), env(safe-area-inset-left));
    border-bottom:1px solid var(--line);
  }
  .handle{ width:40px; height:5px; border-radius:3px; background:var(--faint); opacity:.5; margin:0 auto 14px; }
  .sheet-ctx{ font-size:13px; color:var(--faint); }
  .sheet-title{ margin:4px 0 0; font-size:24px; line-height:1.3; font-weight:700; color:var(--accent); letter-spacing:-.01em; }
  .sheet-body{
    flex:1; min-height:0; overflow-y:auto;
    overscroll-behavior:contain;
    padding:6px max(var(--pad), env(safe-area-inset-right)) 8px max(var(--pad), env(safe-area-inset-left));
  }
  .sec-h{
    margin:20px 0 6px;
    font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--faint);
  }
  .sec-row{ display:flex; align-items:center; justify-content:space-between; margin:20px 0 6px; }
  .sec-row .sec-h{ margin:0; }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    height:36px; padding:0 14px 0 11px; border-radius:999px;
    font-size:14.5px; font-weight:600;
    color:var(--accent); background:var(--accent-soft);
  }
  .pill svg{ width:17px; height:17px; }
  .pill.playing svg{ animation:pulse 1s ease-in-out infinite; }
  .pill:active{ transform:scale(.96); }
  .ex{ list-style:none; margin:0; padding:0; counter-reset:ex; }
  .ex li{
    counter-increment:ex;
    position:relative; padding:12px 44px 12px 30px;
    border-bottom:1px solid var(--line);
  }
  .ex li:last-child{ border-bottom:0; }
  .ex li::before{
    content:counter(ex);
    position:absolute; left:0; top:14px;
    width:20px; height:20px; border-radius:50%;
    font-size:12px; font-weight:600; line-height:20px; text-align:center;
    color:var(--accent); background:var(--accent-soft);
  }

const ICON_CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

const ICON_SLIDERS ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>';

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function hueOf(category) {
  if (category in CATEGORY_HUE) return CATEGORY_HUE[category];
  let h = 0;
  for (const ch of String(category)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}

/* 예문·썰에서 표현 부분을 형광펜으로 (밑줄과 같은 규칙으로 찾음) */
function decorate(text, ex) {
  const ranges = [];
  exprSources(ex).forEach(src => {
    const re = new RegExp(src, "gi");
    let m;
    while ((m = re.exec(text))) {
      if (!m[0].length) { re.lastIndex++; continue; }
      ranges.push([m.index, m.index + m[0].length]);
    }
  });
  ranges.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
  let html = "", pos = 0;
  ranges.forEach(r => {
    if (r[0] < pos) return;
    html += esc(text.slice(pos, r[0])) + "<mark>" + esc(text.slice(r[0], r[1])) + "</mark>";
    pos = r[1];
  });
  return html + esc(text.slice(pos));
}

function buzz() {
  try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) { /* 지원 안 하면 무시 */ }
}

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2800);
}

function spkAttrs(text, who) {
  return ' data-say="' + esc(text) + '" data-who="' + who + '"';
}

/* ---------- 핵심 표현 찾기: phrase의 ~ 자리는 아무 단어, forms는 활용형(예: stayed in) ---------- */
function patternSource(p) {
  const parts = String(p).split("~")
    .map(s => s.trim().replace(/^[\s,.!?]+|[\s,.!?]+$/g, ""))
    .filter(Boolean);
  if (!parts.length) return null;
  let src = parts.map(reEsc).join(".{1,40}?");
  if (/^\w/.test(parts[0])) src = "\\b" + src;
  if (/\w$/.test(parts[parts.length - 1])) src += "\\b";
  return src;
}
function exprSources(e) {
  return [e.phrase].concat(e.forms || []).map(patternSource).filter(Boolean);
}
function exprFound(e, text) {
  return exprSources(e).some(src => new RegExp(src, "i").test(text));
}
/* 대사 안의 핵심 표현에 밑줄(누르면 예문·썰) */
/* 밑줄 규칙
   ① 한 카드 안에서 같은 표현은 처음 나온 대사에만 밑줄 (used: 이 카드에서 이미 그은 표현 번호)
   ② 앱 전체에서 같은 표현은 처음 나온 카드(id 순)에서만 밑줄 (EXPR_OWNER)
   ③ 한 대사 안에서 밑줄끼리 겹치거나 붙어 있으면 뒤의 것은 긋지 않음 */
function normPhrase(p) {
  return String(p).toLowerCase().replace(/[~.,!?'’]/g, "").replace(/\s+/g, " ").trim();
}
const EXPR_OWNER = {};
CARDS.forEach((c, ci) => (c.expressions || []).forEach(e => {
  const k = normPhrase(e.phrase);
  if (!(k in EXPR_OWNER)) EXPR_OWNER[k] = ci;
}));

function findRanges(text, card, ci, used) {
  const found = [];
  (card.expressions || []).forEach((e, ei) => {
    if (used && used.has(ei)) return;
    if (EXPR_OWNER[normPhrase(e.phrase)] !== ci) return;
    let best = null;
    exprSources(e).forEach(src => {
      const m = new RegExp(src, "i").exec(text);
      if (m && m[0].length && (!best || m.index < best.s)) best = { s: m.index, e: m.index + m[0].length, ei };
    });
    if (best) found.push(best);
  });
  found.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const out = [];
  let pos = 0;
  found.forEach(r => {
    if (r.s < pos) return;                                              // 겹침
    if (out.length && /^[\s,.!?'"“”’-]*$/.test(text.slice(pos, r.s))) return;   // 바로 붙어 있음
    out.push(r);
    pos = r.e;
  });
  return out;
}

/* 추가 표현(extraExpressions): 핵심 밑줄과 겹치지 않는 자리에, 카드 안에서 처음 나온 곳에만 연한 점선 밑줄 */
function extraRanges(text, card, taken, usedX) {
  const out = [];
  (card.extraExpressions || []).forEach((e, ei) => {
    if (usedX.has(ei)) return;
    for (const src of exprSources(e)) {
      const m = new RegExp(src, "i").exec(text);
      if (!m || !m[0].length) continue;
      const r = { s: m.index, e: m.index + m[0].length, ei, kind: "extra" };
      if (taken.concat(out).some(x => r.s < x.e && x.s < r.e)) continue;
      out.push(r);
      usedX.add(ei);
      break;
    }
  });
  return out;
}

/* 글자 + 밑줄 범위 → HTML.
   다음 단계(인터랙티브 스크립트: 읽는 단어 강조, 단어를 누르면 그 위치부터 재생)에서 단어 단위 span을 여기서 붙일 예정 */
function richText(text, ranges, ci) {
  let html = "", pos = 0;
  ranges.slice().sort((a, b) => a.s - b.s).forEach(r => {
    html += esc(text.slice(pos, r.s)) +
      '<span class="xp' + (r.kind === "extra" ? " xp-x" : "") + '" data-c="' + ci + '" data-e="' + r.ei + '" data-k="' + (r.kind || "core") + '">' +
      esc(text.slice(r.s, r.e)) + '</span>';
    pos = r.e;
  });
  return html + esc(text.slice(pos));
}

/* used / usedX: 이 카드에서 이미 밑줄 그은 핵심 / 추가 표현 번호 */
function markExpressions(text, card, ci, used, usedX) {
  const core = findRanges(text, card, ci, used);
  core.forEach(r => used.add(r.ei));
  return richText(text, core.concat(extraRanges(text, card, core, usedX)), ci);
}

/* ---------- 대사 한 줄 그리기 (세 모드 공통. 나중에 드라이브 모드·인터랙티브 스크립트도 이걸 씀) ----------
   말풍선 안: .en(영어 + 밑줄) / .kq(읽기 모드에서 아직 확인 안 한 내 대사의 한글)
   말풍선 아래: .ko(작은 한글 해석). 무엇을 보일지는 CSS 클래스가 정하므로, 모드가 바뀌어도 이 HTML은 그대로 */
function whoLabel(who) {
  return who === "me" ? "나" : (WHO_LABEL[who] || "상대");
}
function renderLine(line, li, enHtml, flags) {
  const me = line.who === "me";
  return '<div class="row ' + (me ? "me" : "them") + (flags.firstThem ? " first-them" : "") + '" data-l="' + li + '">' +
    '<span class="who">' + esc(whoLabel(line.who)) + '</span>' +
    '<div class="line">' +
      '<div class="bubble">' +
        '<span class="en" lang="en">' + enHtml + '</span>' +
        (me ? '<span class="kq">' + esc(line.ko || "") + '</span>' : "") +
      '</div>' +
      '<button class="spk" type="button" aria-label="이 줄 듣기"' + spkAttrs(line.en, me ? "me" : "them") + '>' + ICON_SPEAKER + '</button>' +
    '</div>' +
    (line.ko ? '<div class="ko">' + esc(line.ko) + '</div>' : "") +
    (flags.hint ? '<div class="hint">탭하면 영어로 바뀌어요</div>' : "") +
  '</div>';
}

/* 카드 하나의 대화 전체 (밑줄 규칙 때문에 위에서부터 차례로 그림). 모드와 상관없이 같은 HTML */
function chatHtml(card, ci) {
  const used = new Set(), usedX = new Set();
  let firstThem = true, firstMe = true;
  return (card.dialogue || []).map((line, li) => {
    const me = line.who === "me";
    const flags = { firstThem: !me && firstThem, hint: me && firstMe };
    if (me) firstMe = false; else firstThem = false;
    return renderLine(line, li, markExpressions(line.en || "", card, ci, used, usedX), flags);
  }).join("");
}
const CHAT_HTML = CARDS.map(chatHtml);

/* 카드의 상대 화자(카드마다 한 명) 이름표: WHO_LABEL에서. 없으면 "상대" */
function counterpartLabel(card) {
  const line = (card.dialogue || []).find(l => l.who !== "me");
  return whoLabel(line ? line.who : "");
}

/* ---------- 듣기 모드의 두 사람 아이콘 (정답 확인 전에만 보임) ---------- */
const ICON_PERSON = '<svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><circle cx="24" cy="17" r="8.5"/><path d="M8.5 40.5c1.4-8.6 7.6-13.5 15.5-13.5s14.1 4.9 15.5 13.5z"/></svg>';
function duoHtml(card) {
  const person = (cls, name) =>
    '<div class="person ' + cls + '"><span class="avatar">' + ICON_PERSON + '</span><span class="pname">' + esc(name) + '</span></div>';
  return '<div class="duo"><div class="duo-people">' + person("them", counterpartLabel(card)) + person("me", "나") + '</div>' +
    '<div class="duo-n" aria-live="polite"></div></div>';
}

/* ---------- 카드 틀: 대화(.chat)와 버튼(.actions)은 모드에 맞춰 resetCard()가 채움 ---------- */
function renderCard(card, i) {
  const swipe = i === 0 ? '<div class="swipe-hint">밑줄 친 표현을 누르면 예문·썰 · 위로 넘기면 다음 상황</div>' : "";
  return '<section class="card" style="--h:' + hueOf(card.category) + '" data-i="' + i + '">' +
    '<header class="top"><span class="tag">' + esc(card.category) + '</span>' +
      '<span class="top-r"><button class="jump" type="button" aria-label="카드 목록">' + (i + 1) + ' / ' + CARDS.length + ICON_LIST + '</button>' +
      '<button class="gear" type="button" aria-label="음성 설정">' + ICON_SLIDERS + '</button></span></header>' +
    '<div class="body"><div class="inner">' +
      '<h2 class="title">' + esc(card.title) + '</h2>' +
      '<p class="situation">' + esc(card.situation) + '</p>' +
      '<p class="mnote"></p>' +
      duoHtml(card) +
      '<div class="chat"></div>' +
    '</div></div>' +
    '<footer class="bottom"><div class="actions"></div>' + swipe + '</footer>' +
  '</section>';
}

function renderEnd() {
  return '<section class="card end" style="--h:150">' +
    '<header class="top"><span class="tag">끝</span>' +
      '<span class="top-r"><button class="jump" type="button" aria-label="카드 목록">목록' + ICON_LIST + '</button>' +
      '<button class="gear" type="button" aria-label="음성 설정">' + ICON_SLIDERS + '</button></span></header>' +
    '<div class="body"><div class="inner">' +
      '<div class="end-emoji" aria-hidden="true">🎉</div>' +
      '<h2 class="end-title">여기까지!</h2>' +
      '<p class="end-sub">오늘 ' + CARDS.length + '개 상황을 다 봤어요.<br>입에 붙은 표현 하나만 들고 가요.</p>' +
    '</div></div>' +
    '<footer class="bottom"><div class="actions"><button class="btn restart" type="button">처음부터 다시 보기</button></div></footer>' +
  '</section>';
}

feed.innerHTML = CARDS.map(renderCard).join("") + renderEnd();

/* ---------- 음성 캐시 (한 번 만든 ElevenLabs 음성은 폰에 저장해서 재사용) ---------- */
const AudioCache = (() => {
  const mem = new Map();
  let dbp = null;
  function db() {
    if (!dbp) {
      dbp = new Promise(res => {
        try {
          const r = indexedDB.open("engcards-tts", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("audio");
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(null);
        } catch (e) { res(null); }
      });
    }
    return dbp;
  }
  async function get(k) {
    if (mem.has(k)) return mem.get(k);
    const d = await db();
    if (!d) return null;
    return new Promise(res => {
      try {
        const q = d.transaction("audio").objectStore("audio").get(k);
        q.onsuccess = () => { const b = q.result || null; if (b) mem.set(k, b); res(b); };
        q.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  async function put(k, blob) {
    mem.set(k, blob);
    const d = await db();
    if (!d) return;
    try { d.transaction("audio", "readwrite").objectStore("audio").put(blob, k); } catch (e) {}
  }
  async function clear() {
    mem.clear();
    const d = await db();
    if (!d) return;
    try { d.transaction("audio", "readwrite").objectStore("audio").clear(); } catch (e) {}
  }
  return { get, put, clear };
})();

/* ---------- 음성 재생 ---------- */
const Player = (() => {
  const audio = new Audio();
  let token = 0;
  let currentBtn = null;
  let queue = Promise.resolve();
  let deviceVoice = null;
  let warnedNoKey = false;

  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      const us = vs.filter(v => /en[-_]US/i.test(v.lang));
      deviceVoice = us.find(v => /google|samsung/i.test(v.name)) || us[0] || vs.find(v => /^en/i.test(v.lang)) || null;
    } catch (e) { deviceVoice = null; }
  }
  try {
    if ("speechSynthesis" in window) {
      pickVoice();
      speechSynthesis.addEventListener("voiceschanged", pickVoice);
    }
  } catch (e) {}

  function mark(btn, on) { if (btn) btn.classList.toggle("playing", on); }

  /* 재생 / 일시정지 / 정지가 바뀔 때 알림 (듣기 모드 버튼 모양 등) */
  const subs = [];
  function onChange(fn) { subs.push(fn); }
  function emit() { subs.forEach(fn => { try { fn(); } catch (e) {} }); }

  /* 일시정지 상태: 재생 중이던 줄을 멈춰 두고, resume()에서 이어서(내장 음성은 그 줄 처음부터) 재생 */
  let paused = false;
  let resumeFn = null;
  let audioCtl = null;    // 지금 재생 중인 mp3 { finish }
  let speechCtl = null;   // 지금 읽는 중인 내장 음성 { halt, restart, finish }

  function stop() {
    token++;
    paused = false;
    resumeFn = null;
    try { audio.pause(); } catch (e) {}
    if (audioCtl) audioCtl.finish();
    if (speechCtl) { speechCtl.halt(); speechCtl.finish(); }
    mark(currentBtn, false);
    currentBtn = null;
    queue = Promise.resolve();
    emit();
  }

  function pause() {
    if (paused) return;
    paused = true;
    if (audioCtl && !audio.paused) {
      try { audio.pause(); } catch (e) {}
      const ctl = audioCtl;
      resumeFn = () => { const p = audio.play(); if (p && p.catch) p.catch(ctl.finish); };
    } else if (speechCtl) {
      speechCtl.halt();
      resumeFn = speechCtl.restart;
    }
    emit();
  }

  function resume() {
    if (!paused) return;
    paused = false;
    const f = resumeFn;
    resumeFn = null;
    if (f) f();
    emit();
  }

  /* 재생 중인 mp3 속도를 바로 바꿈 (내장 음성은 다음 줄부터) */
  function setRate(rate) {
    if (!audioCtl) return;
    try { audio.defaultPlaybackRate = rate; audio.playbackRate = rate; } catch (e) {}
  }

  function playBlob(blob, rate) {
    return new Promise(res => {
      const url = URL.createObjectURL(blob);
      let finished = false;
      const ctl = {
        finish() {
          if (finished) return;
          finished = true;
          audio.onended = audio.onerror = null;
          if (audioCtl === ctl) audioCtl = null;
          URL.revokeObjectURL(url);
          res();
        }
      };
      audioCtl = ctl;
      audio.onended = ctl.finish; audio.onerror = ctl.finish;
      audio.src = url;
      try { audio.preservesPitch = true; audio.defaultPlaybackRate = rate; audio.playbackRate = rate; } catch (e) {}
      const start = () => { const p = audio.play(); if (p && p.catch) p.catch(() => { if (!paused) ctl.finish(); }); };
      if (paused) resumeFn = start;
      else start();
    });
  }

  /* 긴 글은 안드로이드 내장 음성이 중간에 끊길 수 있어서 문장 단위로 나눠 읽음 */
  function speakDevice(text, who, rate) {
    return new Promise(res => {
      if (!("speechSynthesis" in window)) { toast("이 브라우저는 음성 재생을 지원하지 않아요"); return res(); }
      let finished = false, gen = 0, timer = null;
      const chunks = text.length < 220 ? [text] : (text.match(/[^.!?\n]+(?:[.!?]+["”’)]*|$)/g) || [text]);
      const parts = chunks.map(s => s.trim()).filter(Boolean);
      const ctl = {
        finish() {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          if (speechCtl === ctl) speechCtl = null;
          res();
        },
        halt() {
          gen++;
          clearTimeout(timer);
          try { speechSynthesis.cancel(); } catch (e) {}
        },
        restart() {
          if (finished) return;
          const my = ++gen;
          clearTimeout(timer);
          try {
            if (!deviceVoice) pickVoice();
            parts.forEach((p, idx) => {
              const u = new SpeechSynthesisUtterance(p);
              u.lang = "en-US";
              if (deviceVoice) u.voice = deviceVoice;
              u.rate = rate;
              u.pitch = who === "me" ? 0.92 : 1.08;
              if (idx === parts.length - 1) u.onend = u.onerror = () => { if (my === gen) ctl.finish(); };
              speechSynthesis.speak(u);
            });
            timer = setTimeout(() => { if (my === gen) ctl.finish(); }, 4000 + text.length * 110 / rate);   // 일부 안드로이드에서 onend가 안 오는 경우 대비
          } catch (e) { ctl.finish(); }
        }
      };
      if (!parts.length) return ctl.finish();
      speechCtl = ctl;
      if (paused) resumeFn = ctl.restart;
      else ctl.restart();
    });
  }

  async function getEleven(text, voice) {
    const key = [settings.model, voice, text].join("|");
    const cached = await AudioCache.get(key);
    if (cached) return cached;
    /* 속도는 재생할 때 조절함 (v4는 API 속도 설정을 지원하지 않음) */
    const vs = { stability: 0.5, similarity_boost: 0.75 };
    let res;
    try {
      res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + encodeURIComponent(voice) + "?output_format=mp3_44100_128", {
        method: "POST",
        headers: { "xi-api-key": settings.apiKey, "Content-Type": "application/json", "Accept": "audio/mpeg" },
        body: JSON.stringify({ text: text, model_id: settings.model, voice_settings: vs })
      });
    } catch (e) {
      throw new Error("ElevenLabs에 연결하지 못했어요");
    }
    if (!res.ok) {
      let code = "", msg = "";
      try { const j = await res.json(); code = (j.detail && (j.detail.status || j.detail.code)) || ""; msg = (j.detail && j.detail.message) || ""; } catch (e) {}
      if (res.status === 401 && /quota/i.test(code + msg)) throw new Error("ElevenLabs 크레딧이 부족해요");
      if (res.status === 401) throw new Error("API 키를 확인해 주세요");
      if (/voice/i.test(code + msg)) throw new Error("목소리 ID를 확인해 주세요");
      throw new Error("ElevenLabs 오류 (" + res.status + ")");
    }
    const blob = await res.blob();
    AudioCache.put(key, blob);
    return blob;
  }

  /* opts: { engine: "eleven" | "device", voice: voice ID, rate: 재생 속도 } — 없으면 표현 탭 설정을 따름 */
  async function run(text, who, btn, t, opts) {
    opts = opts || {};
    const engine = opts.engine || settings.engine;
    const voice = opts.voice || (who === "me" ? settings.voiceMe : settings.voiceThem);
    const rate = opts.rate || settings.speed;
    currentBtn = btn;
    mark(btn, true);
    try {
      if (engine === "eleven") {
        if (!settings.apiKey) {
          if (!warnedNoKey) { toast("API 키가 없어서 폰 기본 음성으로 읽어요"); warnedNoKey = true; }
        } else {
          try {
            const blob = await getEleven(text, voice);
            if (t !== token) return;
            await playBlob(blob, rate);
            return;
          } catch (err) {
            if (t !== token) return;
            toast(err.message + " · 폰 기본 음성으로 읽어요");
          }
        }
      }
      if (t !== token) return;
      await speakDevice(text, who, rate);
    } finally {
      if (t === token) { mark(btn, false); currentBtn = null; }
    }
  }

  /* 지금 재생 중인 걸 끊고 바로 재생 */
  function play(text, who, btn, opts) {
    stop();
    const t = token;
    queue = run(text, who, btn, t, opts);
    return queue;
  }
  /* 지금 재생이 끝나면 이어서 재생 */
  function enqueue(text, who, btn, opts) {
    const t = token;
    queue = queue.then(() => (t === token ? run(text, who, btn, t, opts) : undefined));
    return queue;
  }
  function isPlaying(btn) { return btn && btn.classList.contains("playing"); }
  function getToken() { return token; }
  function isPaused() { return paused; }

  return { play, enqueue, stop, pause, resume, setRate, isPaused, isPlaying, getToken, onChange };
})();

function sayFromButton(btn) {
  if (Player.isPlaying(btn)) { Player.stop(); return; }
  Player.play(btn.dataset.say, btn.dataset.who, btn);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 여러 줄 이어 재생 (듣기 모드 전체 재생. 나중에 드라이브 모드도 이걸로 카드를 이어 붙일 예정) ----------
   items: [{ text, who, el }] · hooks: { from, gap(ms), rate(), onLine(i), onEnd(끝까지 들었는지) }
   일시정지·이어 듣기는 Player.pause()/resume()을 그대로 씀 → 바텀시트를 열 때 멈추는 것과도 맞물림.
   Player.stop()(카드 넘김·모드 바꿈·다른 소리 재생)이 오면 바로 끝남 */
function playSequence(items, hooks) {
  hooks = hooks || {};
  Player.stop();
  const t0 = Player.getToken();
  const seq = { alive: () => Player.getToken() === t0 };
  (async () => {
    let complete = false;
    try {
      for (let i = hooks.from || 0; i < items.length; i++) {
        while (Player.isPaused() && seq.alive()) await sleep(120);
        if (!seq.alive()) return;
        if (hooks.onLine) hooks.onLine(i);
        const it = items[i];
        await Player.enqueue(it.text, it.who, it.el, { rate: hooks.rate ? hooks.rate() : undefined });
        if (!seq.alive()) return;
        if (i < items.length - 1) await sleep(hooks.gap == null ? 350 : hooks.gap);
      }
      complete = seq.alive();
    } finally {
      if (hooks.onEnd) hooks.onEnd(complete);
    }
  })();
  return seq;
}

/* 그 줄이 화면 안에 보이게 스크롤. center면 지금 줄을 화면 위쪽 1/3쯤으로 (쉐도잉에서 따라 내려감) */
function follow(card, el, center) {
  const body = card.querySelector(".body");
  const r = el.getBoundingClientRect();
  const b = body.getBoundingClientRect();
  let top = null;
  if (center) top = body.scrollTop + (r.top - b.top) - b.height * 0.3;
  else if (r.bottom > b.bottom - 24) top = body.scrollTop + r.bottom - (b.bottom - 24);
  else if (r.top < b.top + 14) top = body.scrollTop + r.top - b.top - 14;
  if (top !== null) body.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}

/* ================= 상황 카드: 모드 3개 (읽기 / 듣기 / 쉐도잉) =================
   모드는 모든 카드 공통. 탭 바 위에서 고르고, 다시 열어도 유지(engcards.mode.v1).
   카드 하나의 진행 상태는 card._st에 모아 둠. 카드를 넘기거나 모드를 바꾸면 resetCard()로 처음 상태가 됨
   (예약된 '입력 중…' 취소 → 대화 다시 그리기 → 버튼 다시 그리기). 소리는 부르는 쪽에서 Player.stop() */
const MODE_KEY = "engcards.mode.v1";
const MODES = { read: "읽기", listen: "듣기", shadow: "쉐도잉" };
let mode = (() => {
  try { const m = localStorage.getItem(MODE_KEY); return m && MODES[m] ? m : "read"; } catch (e) { return "read"; }
})();

const rowsOf = card => Array.from(card.querySelectorAll(".chat > .row:not(.typing)"));
const lineOf = (card, li) => CARDS[+card.dataset.i].dialogue[li];
const whoOf = line => (line.who === "me" ? "me" : "them");

function resetCard(card) {
  if (card.dataset.i == null) return;
  const old = card._st;
  if (old && old.timer) clearTimeout(old.timer);
  /* read: shown(보이는 줄 수)·full(전체 보기) / listen: revealed(정답 확인)·seq(이어 재생) / shadow: idx(지금 줄) */
  const st = card._st = { mode, shown: 0, full: false, revealed: false, seq: null, idx: -1, timer: null };
  card.classList.remove("m-read", "m-listen", "m-shadow", "masked", "lpaused");
  card.classList.add("m-" + mode);
  card.querySelector(".chat").innerHTML = CHAT_HTML[+card.dataset.i];
  setCur(card, -1);
  const rows = rowsOf(card);
  if (mode === "read") {
    rows.forEach((r, i) => {
      r.classList.toggle("off", i > 0);
      if (r.classList.contains("me")) r.classList.add("kq-on");
    });
    st.shown = 1;
  } else if (mode === "listen") {
    card.classList.add("masked");
  } else {
    rows.forEach(r => r.classList.add("off"));
  }
  card.querySelector(".body").scrollTop = 0;
  renderActions(card);
}

/* 지금 카드를 처음부터 (소리도 멈춤) */
function restartCard(card) {
  Player.stop();
  resetCard(card);
}

/* ---------- 하단 버튼: 주요 버튼(.main)은 세 모드 모두 오른쪽 넓은 자리 ---------- */
function actBtn(act, html, cls, label) {
  return '<button class="btn' + (cls ? " " + cls : "") + '" type="button" data-act="' + act + '"' +
    (label ? ' aria-label="' + label + '"' : "") + '>' + html + '</button>';
}
function rateBtn() {
  const r = settings.drillRate === 1 ? "1.0" : String(settings.drillRate);
  return actBtn("rate", r + "x", "rate", "재생 속도 " + r + "배, 누르면 바뀜");
}
const NEXT_HTML = "<span>다음</span>" + ICON_ARROW;
const AGAIN_HTML = ICON_RESTART + "<span>처음부터</span>";

function renderActions(card) {
  const st = card._st;
  if (!st) return;
  const n = rowsOf(card).length;
  let html = "", note = "";
  if (st.mode === "read") {
    const end = st.shown >= n && !st.timer;
    html = actBtn("all", st.full ? "접기" : "전체 보기", st.full ? "on" : "") +
      actBtn("next", end ? AGAIN_HTML : NEXT_HTML, "main");
  } else if (st.mode === "listen") {
    const live = st.seq && st.seq.alive();
    card.classList.toggle("lpaused", !!live && Player.isPaused());   // 일시정지 중엔 아이콘 퍼짐 효과 멈춤
    const main = !live ? ICON_PLAY + "<span>재생</span>" :
      Player.isPaused() ? ICON_PLAY + "<span>이어 듣기</span>" : ICON_PAUSE + "<span>일시정지</span>";
    html = actBtn("replay", ICON_RESTART, "ico-btn", "처음부터 다시 듣기") + rateBtn() +
      actBtn("answer", st.revealed ? "가리기" : "정답 확인", st.revealed ? "on" : "") +
      actBtn("play", main, "main");
    if (!st.revealed) note = "▶ 재생을 누르면 대화 전체를 글자 없이 들려줘요. 다 듣고 '정답 확인'.";
  } else if (st.idx < 0) {
    html = actBtn("start", ICON_PLAY + "<span>시작</span>", "main");
    note = "한 줄씩 들려줘요. 듣고 나서 소리 내어 따라 말해 보세요.";
  } else {
    html = rateBtn() + actBtn("again", ICON_SPEAKER + "<span>한 번 더 듣기</span>") +
      actBtn("next", st.idx >= n - 1 ? AGAIN_HTML : NEXT_HTML, "main");
  }
  card.querySelector(".actions").innerHTML = html;
  card.querySelector(".mnote").textContent = note;
}

function onAct(card, act) {
  const st = card && card._st;
  if (!st) return;
  buzz();
  if (act === "rate") { toggleRate(card); return; }
  if (st.mode === "read") {
    if (act === "next") readNext(card);
    else if (act === "all") { if (st.full) restartCard(card); else readAll(card); }
  } else if (st.mode === "listen") {
    if (act === "play") listenPlay(card);
    else if (act === "replay") listenStart(card);
    else if (act === "answer") listenReveal(card, !st.revealed);
  } else {
    if (act === "start") shadowGo(card, 0);
    else if (act === "next") shadowGo(card, st.idx >= rowsOf(card).length - 1 ? 0 : st.idx + 1);
    else if (act === "again") shadowSay(card);
  }
}

/* 말풍선 탭: 읽기 모드의 내 대사는 한글 ↔ 영어, 듣기 모드(정답 확인 후)는 그 줄만 듣기 */
function onBubble(card, row) {
  const st = card && card._st;
  if (!st || !row || row.classList.contains("typing")) return;
  if (st.mode === "read" && row.classList.contains("me")) {
    row.classList.toggle("kq-on");
    document.body.classList.add("hinted");
    buzz();
  } else if (st.mode === "listen" && st.revealed) {
    const line = lineOf(card, +row.dataset.l);
    Player.play(line.en, whoOf(line), row, { rate: settings.drillRate });
  }
}

/* 듣기·쉐도잉 공통 속도(0.8x / 1.0x). 재생 중인 소리에도 바로 적용 */
function toggleRate(card) {
  settings.drillRate = settings.drillRate === 1 ? 0.8 : 1;
  saveSettings();
  Player.setRate(settings.drillRate);
  renderActions(card);
}

/* ---------- 읽기: 떠올리고 확인하기 ---------- */
function showRow(card, row) {
  row.classList.remove("off");
  row.classList.add("pop");
  follow(card, row);
}
function readNext(card) {
  const st = card._st;
  const rows = rowsOf(card);
  if (st.timer) {                                   // '입력 중…'이면 기다리지 않고 바로 보여 줌
    clearTimeout(st.timer);
    st.timer = null;
    card.querySelectorAll(".typing").forEach(x => x.remove());
    showRow(card, rows[st.shown++]);
    renderActions(card);
    return;
  }
  if (st.shown >= rows.length) { restartCard(card); return; }
  const row = rows[st.shown];
  if (row.classList.contains("them")) {
    const typing = document.createElement("div");
    typing.className = "row them typing pop";
    typing.innerHTML = '<div class="bubble dots" aria-label="입력 중"><i></i><i></i><i></i></div>';
    row.parentNode.insertBefore(typing, row);
    follow(card, typing);
    st.timer = setTimeout(() => {
      if (card._st !== st) return;
      st.timer = null;
      typing.remove();
      showRow(card, rows[st.shown++]);
      renderActions(card);
    }, 850);
  } else {
    showRow(card, rows[st.shown++]);
  }
  renderActions(card);
}
function readAll(card) {
  const st = card._st;
  clearTimeout(st.timer);
  st.timer = null;
  card.querySelectorAll(".typing").forEach(x => x.remove());
  const rows = rowsOf(card);
  rows.forEach(r => {
    if (r.classList.contains("off")) { r.classList.remove("off"); r.classList.add("pop"); }
    r.classList.remove("kq-on");
  });
  st.shown = rows.length;
  st.full = true;
  renderActions(card);
}

/* ---------- 듣기: 글자 없이 듣기 ---------- */
/* 지금 줄(i, 없으면 -1): 대화의 줄 강조 + 두 사람 아이콘 중 말하는 쪽 + "3 / 6" */
function setCur(card, i) {
  const rows = rowsOf(card);
  rows.forEach((r, j) => r.classList.toggle("cur", j === i));
  const line = i >= 0 ? lineOf(card, i) : null;
  card.classList.toggle("talk-them", !!line && line.who !== "me");
  card.classList.toggle("talk-me", !!line && line.who === "me");
  card.querySelector(".duo-n").textContent = line ? (i + 1) + " / " + rows.length : "대사 " + rows.length + "줄";
}
function listenStart(card) {
  const st = card._st;
  const rows = rowsOf(card);
  const items = rows.map((r, i) => { const l = lineOf(card, i); return { text: l.en, who: whoOf(l), el: r }; });
  card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });   // 처음부터: 제목·상황이 보이는 위치에서 시작
  const seq = playSequence(items, {
    rate: () => settings.drillRate,
    onLine: i => {
      if (card._st !== st) return;
      setCur(card, i);
      if (i > 0 && !card.classList.contains("masked")) follow(card, rows[i]);   // 아이콘 화면에서는 스크롤할 줄이 없음
    },
    onEnd: () => {
      if (card._st !== st || st.seq !== seq) return;
      st.seq = null;
      setCur(card, -1);
      renderActions(card);
    }
  });
  st.seq = seq;
  renderActions(card);
}
function listenPlay(card) {
  const st = card._st;
  if (st.seq && st.seq.alive()) {                   // 재생 중이면 일시정지, 일시정지면 이어 듣기 (버튼은 Player.onChange가 다시 그림)
    if (Player.isPaused()) Player.resume(); else Player.pause();
    return;
  }
  listenStart(card);
}
function listenReveal(card, on) {
  card._st.revealed = on;
  card.classList.toggle("masked", !on);
  renderActions(card);
}

/* ---------- 쉐도잉: 한 줄씩 듣고 따라 말하기 ---------- */
function shadowGo(card, i) {
  const st = card._st;
  const rows = rowsOf(card);
  st.idx = i;
  rows.forEach((r, j) => {
    if (j === i && r.classList.contains("off")) r.classList.add("pop");
    r.classList.toggle("off", j > i);
    r.classList.toggle("past", j < i);
    r.classList.toggle("cur", j === i);
  });
  if (i === 0) card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });
  else follow(card, rows[i], true);
  shadowSay(card);
  renderActions(card);
}
function shadowSay(card) {
  const st = card._st;
  const row = rowsOf(card)[st.idx];
  if (!row) return;
  const line = lineOf(card, st.idx);
  Player.play(line.en, whoOf(line), row, { rate: settings.drillRate });
}

const DIARY_KEY = "engcards.diary.v1";
function loadDiary() {

/* 하루 기록 = { items: [ { q:{en,ko}, text, fix, updated } ] } (최대 3편). 예전 형식({q,text,fix})은 자동으로 바꿔 읽음 */
const MAX_WRITES = 3;
function normEntry(e) {
  if (!e || typeof e !== "object") return null;
  const raw = Array.isArray(e.items) ? e.items : [e];
  const items = raw.filter(x => x && typeof x === "object")
    .map(x => ({ q: x.q && x.q.en ? { en: x.q.en, ko: x.q.ko || "" } : null, text: x.text || "", fix: x.fix || "", updated: x.updated || 0 }));
  return items.length ? { items: items.slice(0, MAX_WRITES) } : null;
}
Object.keys(diary.entries).forEach(k => {
  const n = normEntry(diary.entries[k]);
  if (n) diary.entries[k] = n; else delete diary.entries[k];
});
const hasContent = it => !!(it && ((it.text || "").trim() || (it.fix || "").trim()));

const pad2 = n => String(n).padStart(2, "0");
function dateKey(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function dayNumber(key) {
  const p = key.split("-").map(Number);
  return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000);
}
/* 오늘 고를 수 있는 질문 5개: 날짜마다 정해진 순서에서, 다른 날 이미 답한 질문은 건너뜀.
   (같은 날엔 항상 같은 5개. 다 답하면 처음부터 다시 돌아옴) */
function candidatesFor(key) {
  const L = QUESTIONS.length;
  if (!L) return [];
  const start = ((dayNumber(key) * 5) % L + L) % L;
  const order = [];
  for (let i = 0; i < L; i++) order.push(QUESTIONS[(start + i) % L]);
  const used = new Set();
  Object.keys(diary.entries).forEach(k => {
    if (k === key) return;
    diary.entries[k].items.forEach(it => { if (it.q && hasContent(it)) used.add(it.q.en); });
  });
  const fresh = order.filter(q => !used.has(q.en));
  const pool = fresh.length >= 5 ? fresh : fresh.concat(order.filter(q => used.has(q.en)));
  return pool.slice(0, 5);
}
function koDate(key, withDay) {
  const p = key.split("-").map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  const year = p[0] !== new Date().getFullYear() ? p[0] + "년 " : "";
  return year + p[1] + "월 " + p[2] + "일" + (withDay ? " " + "일월화수목금토"[d.getDay()] + "요일" : "");
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;left:0;opacity:0;";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

      const notes = Object.keys(s.notes || {}).sort().map(d => "· " + d + "\n" + s.notes[d].trim()).join("\n\n");
      out.push("[" + id + "] " + (it ? it.ex.phrase + " (" + shortMeaning(it.ex) + ")" : "") +
        "\n상태: " + st + " · 시작: " + (s.startedOn || "-") + " · 단계: " + (s.step || 0) + "/" + INTERVALS.length +
        (s.due ? " · 다음 복습: " + s.due : "") + (s.masteredOn ? " · 익힘: " + s.masteredOn : "") +
        (notes ? "\n\n연습장:\n" + notes : ""));
    });
  }
  return out.join("\n\n----------\n\n");
}

/* ================= 표현 탭: 모음 · 학습 · 연습장 · 복습 =================
   표현 목록은 카드 데이터에서 자동으로 모음(따로 복사해서 관리하지 않음).
   학습 기록은 표현 id 기준으로 저장 → 문구를 고쳐도 기록이 유지됨 */
const STUDY_KEY = "engcards.study.v1";
const DAILY_PICKS = 3;                       // 하루에 새로 고를 수 있는 표현 수
const INTERVALS = [1, 3, 7, 14, 30];         // 복습 간격(일). 30일 복습까지 통과하면 '익힘'

/* 테스트용: 주소에 ?debugDate=2026-10-20 을 붙이면 그 날짜로 계산 (화면에는 안 보임) */
const DEBUG_DATE = (() => {
  try {
    const v = new URLSearchParams(location.search).get("debugDate");
    return /^\d{4}-\d{2}-\d{2}$/.test(v || "") ? v : null;
  } catch (e) { return null; }
})();
function studyToday() { return DEBUG_DATE || dateKey(); }
function addDays(key, n) {
  const p = key.split("-").map(Number);
  return dateKey(new Date(p[0], p[1] - 1, p[2] + n));
}

function exprIdOf(card, ex, ei, kind) {
  return ex.id || ("c" + card.id + "-" + (kind === "extra" ? "x" : "e") + (ei + 1));
}
/* 짧은 한국어 뜻: meaning 필드 → 설명의 첫 '…' → 설명 첫 문장 */
function shortMeaning(ex) {
  if (ex.meaning) return ex.meaning;
  const m = /'([^']{1,40})'/.exec(ex.ko || "");
  if (m) return m[1];
  return String(ex.ko || "").split(/[.!?]/)[0].slice(0, 30);
}

/* 카드 데이터 → 표현 목록 (카테고리 순 → 카드 id 순 → 핵심 다음 추가 표현) */
const EXPR_LIST = [];
const EXPR_BY_ID = {};
(function buildExprList() {
  const catOrder = (window.CATEGORY_DATA || []).map(c => c.name);
  const rank = name => { const i = catOrder.indexOf(name); return i < 0 ? 999 : i; };
  CARDS.map((c, ci) => ci)
    .sort((a, b) => rank(CARDS[a].category) - rank(CARDS[b].category) || CARDS[a].id - CARDS[b].id)
    .forEach(ci => {
      const card = CARDS[ci];
      const add = (ex, ei, kind) => {
        const id = exprIdOf(card, ex, ei, kind);
        if (EXPR_BY_ID[id]) return;
        const item = { id, ex, ci, ei, kind, card };
        EXPR_LIST.push(item);
        EXPR_BY_ID[id] = item;
      };
      (card.expressions || []).forEach((ex, ei) => { if (EXPR_OWNER[normPhrase(ex.phrase)] === ci) add(ex, ei, "core"); });
      (card.extraExpressions || []).forEach((ex, ei) => add(ex, ei, "extra"));
    });
})();

/* 학습 기록: { items: { 표현id: { status, startedOn, step, due, history:[{date, ok}], notes:{ 날짜: 글 } } }, picks: { 날짜: [표현id] } } */
const study = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(STUDY_KEY) || "null");
    if (s && typeof s === "object") return { items: s.items && typeof s.items === "object" ? s.items : {}, picks: s.picks && typeof s.picks === "object" ? s.picks : {} };
  } catch (e) {}
  return { items: {}, picks: {} };
})();
function saveStudy() {
  try { localStorage.setItem(STUDY_KEY, JSON.stringify(study)); return true; } catch (e) { return false; }
}
/* 화면용 상태: new(미학습·중단) / learning(학습 중) / mastered(익힘) */
function statusOf(id) {
  const s = study.items[id];
  if (!s || s.status === "stopped") return "new";
  return s.status === "mastered" ? "mastered" : "learning";
}
const STATUS_LABEL = { new: "미학습", learning: "학습 중", mastered: "익힘" };
function picksToday() { return (study.picks[studyToday()] || []).length; }

function startLearning(id) {
  const t = studyToday();
  if (picksToday() >= DAILY_PICKS) return false;
  const s = study.items[id] || {};
  s.status = "learning";
  s.startedOn = t;
  s.step = 0;
  s.due = addDays(t, INTERVALS[0]);
  s.history = s.history || [];
  s.notes = s.notes || {};
  study.items[id] = s;
  const list = study.picks[t] = study.picks[t] || [];
  if (!list.includes(id)) list.push(id);
  saveStudy();
  return true;
}
function stopLearning(id) {
  const s = study.items[id];
  if (!s) return;
  s.status = "stopped";     // 연습장 기록(notes)은 그대로 남김
  delete s.due;
  saveStudy();
}
/* 오늘 복습할 표현: 날짜가 지난(밀린) 것까지 모두, 오래된 것부터 */
function dueList() {
  const t = studyToday();
  return Object.keys(study.items)
    .filter(id => EXPR_BY_ID[id] && study.items[id].status === "learning" && study.items[id].due && study.items[id].due <= t)
    .sort((a, b) => study.items[a].due.localeCompare(study.items[b].due) || a.localeCompare(b));
}
/* 기억남 → 다음 간격, 헷갈림 → 처음(1일 뒤)부터 */
function grade(id, remembered) {
  const s = study.items[id];
  if (!s) return;
  const t = studyToday();
  s.history = s.history || [];
  s.history.push({ date: t, ok: remembered, step: s.step || 0 });
  if (remembered) {
    s.step = (s.step || 0) + 1;
    if (s.step >= INTERVALS.length) { s.status = "mastered"; s.masteredOn = t; delete s.due; }
    else s.due = addDays(t, INTERVALS[s.step]);
  } else {
    s.step = 0;
    s.due = addDays(t, INTERVALS[0]);
  }
  saveStudy();
}
function dueText(id) {
  const s = study.items[id];
  if (!s || !s.due) return "";
  const d = dayNumber(s.due) - dayNumber(studyToday());
  if (d < 0) return (-d) + "일 밀림";
  if (d === 0) return "오늘 복습";
  return koDate(s.due) + " 복습 (" + d + "일 뒤)";
}
function updateExprBadge() {
  const n = dueList().length;
  const b = document.getElementById("exprBadge");
  b.hidden = n === 0;
  b.textContent = n > 99 ? "99+" : String(n);
  document.getElementById("tabExpr").setAttribute("aria-label", "표현" + (n ? ", 복습 " + n + "개" : ""));
}

/* 표현이 나온 대사(복습 힌트·상세에서 씀) */
function sourceLine(item) {
  const d = item.card.dialogue || [];
  return d.find(x => exprFound(item.ex, x.en || "")) || null;
}

function renderExprList() {
  const q = X.search.value.trim().toLowerCase();
  const match = it => {
    if (xFilter !== "all" && statusOf(it.id) !== xFilter) return false;
    if (!q) return true;
    const hay = [it.ex.phrase, it.ex.ko, shortMeaning(it.ex), it.card.title, it.ex.meaning || ""].join(" ").toLowerCase();
    return hay.includes(q);
  };
  const groups = [];
  EXPR_LIST.forEach(it => {
    if (!match(it)) return;
    let g = groups.find(x => x.name === it.card.category);
    if (!g) { g = { name: it.card.category, items: [] }; groups.push(g); }
    g.items.push(it);
  });
  if (!groups.length) {
    X.list.innerHTML = '<p class="w-empty">' + (q ? "검색 결과가 없어요." : "해당하는 표현이 없어요.") + '</p>';
    return;

    '<section class="toc-group" style="--h:' + hueOf(g.name) + '">' +

          statusPill(statusOf(it.id)) +

    '</section>').join("");
}

function pastNotesHtml(id, exceptToday) {

/* ================= 자동 점검: 주소 끝에 #check 를 붙여 열면 결과가 뜸 (규칙은 CLAUDE.md) ================= */
function sceneOf(card) {
  return card.scene || (card.category === "일상 대화" ? "free" : "task");   // task: 정해진 용건(10단어), free: 자유 대화(12단어)
}
function runChecks() {
  const issues = [];
  const stats = { cards: CARDS.length, expressions: 0, examples: 0, meTurns: 0, questions: QUESTIONS.length };
  const ids = new Set();
  const allExprIds = new Set();
  let prevId = -Infinity;
  CARDS.forEach((c, i) => {
    const tag = "카드 " + (i + 1) + (c.id != null ? " (id " + c.id + ")" : "");
    if (c.id == null) issues.push(tag + ": id 없음");
    else {
      if (ids.has(c.id)) issues.push(tag + ": id 중복");
      if (typeof c.id === "number" && c.id <= prevId) issues.push(tag + ": id가 앞 카드보다 작음");
      ids.add(c.id);
      if (typeof c.id === "number") prevId = c.id;
    }
    ["category", "title", "situation"].forEach(k => { if (!c[k]) issues.push(tag + ": " + k + " 없음"); });
    const d = c.dialogue || [];
    if (d.length < 4 || d.length > 10) issues.push(tag + ": 대화 " + d.length + "줄 (4~10줄)");
    const me = d.filter(x => x.who === "me");
    if (me.length < 2) issues.push(tag + ": me 턴 " + me.length + "개 (2턴 이상)");
    /* 상대 화자: 카드마다 한 명, WHO_LABEL에 있는 이름(듣기 모드 이름표·대화 화자 표시에 쓰임) */
    const them = Array.from(new Set(d.filter(x => x.who !== "me").map(x => x.who)));
    if (them.length !== 1) issues.push(tag + ": 상대 화자 " + them.length + "명 — " + them.join(", ") + " (카드마다 한 명)");
    them.filter(w => !WHO_LABEL[w]).forEach(w => issues.push(tag + ": 화자 \"" + w + "\"가 WHO_LABEL에 없음 (이름표가 '상대'로 나옴)"));
    const limit = sceneOf(c) === "free" ? 12 : 10;
    d.forEach(x => { if (!x.en || !x.ko) issues.push(tag + ": 대사 en/ko 누락 — " + (x.en || x.ko || "")); });
    me.forEach(x => {
      stats.meTurns++;
      const w = String(x.en || "").split(/\s+/).filter(Boolean).length;
      if (w > limit) issues.push(tag + ": me " + w + "단어 (상한 " + limit + ") — " + x.en);
    });
    const ex = c.expressions || [];
    if (ex.length < 2 || ex.length > 5) issues.push(tag + ": 표현 " + ex.length + "개 (2~5개)");
    if (!Array.isArray(c.extraExpressions)) issues.push(tag + ": extraExpressions 칸 없음 (비어 있어도 [] 로)");

    /* 밑줄 시뮬레이션: 화면과 똑같은 규칙으로 어떤 표현이 실제로 밑줄이 생기는지 */
    const usedSim = new Set();
    d.forEach(x => findRanges(x.en || "", c, i, usedSim).forEach(r => usedSim.add(r.ei)));

    const checkExpr = (e, kind, idx) => {
      stats.expressions++;
      const p = "\"" + e.phrase + "\"";
      const want = kind === "core" ? "e" : "x";
      if (!e.id) issues.push(tag + " " + p + ": 표현 id 없음");
      else {
        if (allExprIds.has(e.id)) issues.push(tag + " " + p + ": 표현 id 중복 — " + e.id);
        allExprIds.add(e.id);
        if (!new RegExp("^c" + c.id + "-" + want + "\\d+$").test(e.id)) issues.push(tag + " " + p + ": 표현 id 형식 (c" + c.id + "-" + want + "숫자) — " + e.id);
      }
      if (!e.phrase || !e.ko) issues.push(tag + ": 표현 phrase/ko 누락");
      if (kind === "core") {
        const k = normPhrase(e.phrase);
        if (EXPR_OWNER[k] !== i) issues.push(tag + " " + p + ": 앞 카드(" + (EXPR_OWNER[k] + 1) + "번)와 같은 표현이라 밑줄이 안 생김");
        else if (!usedSim.has(idx)) issues.push(tag + " " + p + ": 대화에 없거나, 다른 밑줄과 겹치거나 붙어 있어서 밑줄이 안 생김");
      }
      const n = (e.examples || []).length;
      stats.examples += n;
      if (n !== 5) issues.push(tag + " " + p + ": 예문 " + n + "개 (정확히 5개)");
      (e.examples || []).forEach(x => { if (!x.en || !x.ko) issues.push(tag + " " + p + ": 예문 en/ko 누락"); });
      if (!e.story || !e.story.en || !e.story.ko) { issues.push(tag + " " + p + ": 썰 누락"); return; }
      if (!exprFound(e, e.story.en)) issues.push(tag + " " + p + ": 썰에 표현이 없음");
      if (/[가-힣]/.test(e.story.en)) issues.push(tag + " " + p + ": 썰 영어에 한글이 섞임");
      const sents = e.story.en.split(/(?<=[.!?]["”]?)\s+(?=[A-Z“"])/).length;
      if (sents < 3 || sents > 5) issues.push(tag + " " + p + ": 썰 " + sents + "문장 (3~4문장 권장)");
    };
    ex.forEach((e, idx) => checkExpr(e, "core", idx));
    (c.extraExpressions || []).forEach((e, idx) => checkExpr(e, "extra", idx));
  });
  const qSeen = new Set();
  QUESTIONS.forEach((q, i) => {
    if (!q.en || !q.ko) issues.push("질문 " + (i + 1) + ": en/ko 누락");
    const k = String(q.en || "").toLowerCase();
    if (qSeen.has(k)) issues.push("질문 " + (i + 1) + ": 중복 — " + q.en);
    qSeen.add(k);
  });
  if (QUESTIONS.length < 60) issues.push("질문 " + QUESTIONS.length + "개 (60개 이상 권장)");
  return { stats, issues };
}
window.runChecks = runChecks;
if (location.hash === "#check") {
  setTimeout(() => {
    const r = runChecks();
    const s = r.stats;
    showSheet("자동 점검", r.issues.length ? "문제 " + r.issues.length + "개" : "이상 없음",
      '<p class="note">카드 ' + s.cards + '장 · 표현 ' + s.expressions + '개 · 예문 ' + s.examples + '개 · me 턴 ' + s.meTurns + '개 · 질문 ' + s.questions + '개</p>' +
      (r.issues.length ? '<ul class="note">' + r.issues.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : ""));
  }, 300);
}

/* foot: 시트 맨 아래 버튼 줄(엄지 위치). 없으면 '닫기' */

function examplesHtml(ex) {

/* 상황 카드의 밑줄·표현 칩 → 표현 상세(학습하기·연습장 포함)로 */
function openExpression(ci, ei, kind) {
  const card = CARDS[ci];
  const list = card && (kind === "extra" ? card.extraExpressions : card.expressions);
  const ex = list && list[ei];
  const id = ex && exprIdOf(card, ex, ei, kind);
  if (!id || !EXPR_BY_ID[id]) return;
  if (!sheetOpen) {
    sheetHold = { token: Player.getToken(), paused: !Player.isPaused() };
    if (sheetHold.paused) Player.pause();
  }
  openExprDetail(id, { fromCard: true });
}

function openList() {
  const cur = activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : -1;
  const seenCount = CARDS.filter((c, i) => seenSet.has(cardKey(i))).length;
  const pct = CARDS.length ? Math.round(seenCount / CARDS.length * 100) : 0;
  const groups = [];
  CARDS.forEach((c, i) => {
    let g = groups.find(x => x.name === c.category);
    if (!g) { g = { name: c.category, items: [] }; groups.push(g); }
    g.items.push(i);
  });
  const listHtml = groups.map(g => {
    const seenInGroup = g.items.filter(i => seenSet.has(cardKey(i))).length;
    return '<section class="toc-group" style="--h:' + hueOf(g.name) + '">' +
      '<div class="toc-head"><span class="toc-emoji" aria-hidden="true">' + (CATEGORY_EMOJI[g.name] || "📌") + '</span>' +
        '<h4 class="toc-cat">' + esc(g.name) + '</h4>' +
        '<span class="toc-cnt">' + seenInGroup + ' / ' + g.items.length + '</span></div>' +
      '<ul class="toc">' +
      g.items.map(i => {
        const seen = seenSet.has(cardKey(i));
        const cls = "toc-item" + (seen ? " seen" : "") + (i === cur ? " current" : "");
        return '<li><button class="' + cls + '" type="button" data-go="' + i + '"' + (i === cur ? ' aria-current="true"' : "") + '>' +
          '<span class="toc-n">' + (i + 1) + '</span><span class="toc-t">' + esc(CARDS[i].title) + '</span>' +
          '<span class="toc-check"' + (seen ? ' aria-label="봤음"' : "") + '>' + (seen ? ICON_CHECK : "") + '</span></button></li>';
      }).join("") + '</ul></section>';
  }).join("");
  const warn = storageOK ? "" :
    '<p class="note">지금 연 방식에서는 기록이 저장되지 않아서, 앱을 다시 열면 처음부터 시작해요.</p>';
  const html =
    '<div class="prog"><div class="prog-text">본 카드 <b>' + seenCount + '</b> / ' + CARDS.length + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' + warn + '</div>' +
    '<div class="btn-row"><button class="btn" type="button" id="goUnseen">안 본 카드로</button>' +
      '<button class="btn" type="button" id="goFirst">처음부터</button></div>' +
    listHtml +
    '<div class="set-group"><div class="btn-row"><button class="btn" type="button" id="resetProgress">본 기록 지우기</button></div></div>';
  showSheet("카드 " + CARDS.length + "장", "목록", html);
  const curEl = sheetBody.querySelector(".toc-item.current");
  if (curEl) sheetBody.scrollTop = Math.max(0, curEl.offsetTop - sheetBody.clientHeight / 2);
}

function goFromList(idx) {
  closeSheet();
  setTimeout(() => jumpTo(idx), 0);
}

function voiceOptions(selected) {
  const known = EL_VOICES.some(v => v.id === selected);
  return EL_VOICES.map(v => '<option value="' + v.id + '"' + (v.id === selected ? " selected" : "") + '>' + esc(v.name) + '</option>').join("") +
    '<option value="custom"' + (known ? "" : " selected") + '>직접 입력 (voice ID)</option>';
}

function voiceField(name, label) {
  const known = EL_VOICES.some(v => v.id === settings[name]);
  return '<div class="set-group"><label class="set-label" for="sel-' + name + '">' + label + '</label>' +
    '<select class="field" id="sel-' + name + '" data-voice="' + name + '">' + voiceOptions(settings[name]) + '</select>' +
    '<input class="field" type="text" id="cus-' + name + '" data-voice-custom="' + name + '" placeholder="voice ID 붙여넣기" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + (known ? "" : esc(settings[name])) + '"' + (known ? " hidden" : "") + '>' +
  '</div>';
}

function keyField(note) {
  return '<div class="set-group"><label class="set-label" for="setKey">ElevenLabs API 키</label>' +
    '<input class="field" id="setKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk_로 시작하는 키" value="' + esc(settings.apiKey) + '">' +
    '<p class="note">' + note + '</p>' +
  '</div>';
}

function openSettings() {
  const seg = (name, opts) => '<div class="seg" data-set="' + name + '">' +
    opts.map(o => '<button type="button" data-v="' + o[0] + '" aria-pressed="' + (String(settings[name]) === String(o[0])) + '">' + o[1] + '</button>').join("") +
  '</div>';
  const html =
    '<div class="set-group"><span class="set-label">음성 엔진</span>' +
      seg("engine", [["device", "폰 기본 음성"], ["eleven", "ElevenLabs"]]) +
      '<p class="note">폰 기본 음성은 무료이고 바로 쓸 수 있어요. ElevenLabs는 훨씬 자연스럽지만 API 키가 필요하고 크레딧이 들어요.</p>' +
    '</div>' +
    '<div class="el-only"' + (settings.engine === "eleven" ? "" : " hidden") + '>' +
      keyField("키는 이 폰의 이 브라우저 안에만 저장돼요. 글쓰기 탭과 같은 키를 써요. ElevenLabs에서 Text to Speech 권한만 켜고 크레딧 한도를 정해 둔 키를 쓰는 걸 추천해요. 한 번 들은 문장은 폰에 저장돼서 다시 들을 땐 크레딧이 들지 않아요.") +
      '<div class="set-group"><label class="set-label" for="setModel">모델</label>' +
        '<select class="field" id="setModel">' + EL_MODELS.map(m => '<option value="' + m.id + '"' + (m.id === settings.model ? " selected" : "") + '>' + esc(m.name) + '</option>').join("") + '</select>' +
      '</div>' +
      voiceField("voiceThem", "상대 목소리 (직원·친구 등, 예문)") +
      voiceField("voiceMe", "내 목소리 (내 대사, 썰)") +
    '</div>' +
    '<div class="set-group"><span class="set-label">속도 (읽기 모드 · 예문 · 썰)</span>' +
      seg("speed", [["0.85", "천천히"], ["1", "보통"]]) +
      '<p class="note">듣기·쉐도잉 모드 속도는 카드 아래 0.8x / 1.0x 버튼으로 따로 정해요.</p>' +
    '</div>' +
    '<div class="set-group"><div class="btn-row">' +
      '<button class="btn" type="button" id="testVoice">목소리 들어보기</button>' +
      '<button class="btn" type="button" id="clearCache">저장된 음성 지우기</button>' +
    '</div></div>';
  showSheet("설정", "음성", html);
}

/* 시트 안 클릭: 듣기 버튼 + 설정 컨트롤 */
sheetBody.addEventListener("click", e => {
  const t = e.target;
  let el;
  if ((el = t.closest(".spk, .spk-pill"))) { sayFromButton(el); return; }
  if ((el = t.closest("[data-go]"))) { goFromList(+el.dataset.go); return; }
  if ((el = t.closest("#goFirst"))) { goFromList(0); return; }
  if ((el = t.closest("#backupAll"))) {
    saveToday();
    const text = backupText();
    if (!text) { toast("아직 저장된 기록이 없어요"); return; }
    copyText(text).then(ok => toast(ok ? "전체 기록을 복사했어요" : "복사하지 못했어요"));
    return;
  }
  if ((el = t.closest("#goUnseen"))) {
    const cur = activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : -1;
    let idx = -1;
    for (let k = 1; k <= CARDS.length && idx < 0; k++) {
      const i = (cur + k + CARDS.length) % CARDS.length;
      if (!seenSet.has(cardKey(i))) idx = i;
    }
    if (idx < 0) { toast("모든 카드를 다 봤어요!"); return; }
    goFromList(idx);
    return;
  }
  if ((el = t.closest("#resetProgress"))) {
    seenSet.clear();
    if (activeCard && activeCard.dataset.i != null) seenSet.add(cardKey(+activeCard.dataset.i));
    saveProgress();
    openList();
    toast("본 기록을 지웠어요");
    return;
  }
  if ((el = t.closest(".seg button"))) {
    const name = el.parentNode.dataset.set;
    const v = el.dataset.v;
    settings[name] = name === "speed" ? parseFloat(v) : v;
    saveSettings();
    el.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === el ? "true" : "false"));
    if (name === "engine") {
      const box = sheetBody.querySelector(".el-only");
      if (box) box.hidden = v !== "eleven";
    }
    buzz();
    return;
  }
  if ((el = t.closest("#testVoice"))) {
    if (Player.isPlaying(el)) { Player.stop(); return; }
    Player.play("Hi there! What can I get started for you?", "them", el);
    Player.enqueue("Can I get a medium hot americano, please?", "me", el);
    return;
  }
  if ((el = t.closest("#clearCache"))) {
    AudioCache.clear().then(() => toast("저장된 음성을 지웠어요"));
  }
});

sheetBody.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "setKey") { settings.apiKey = t.value.trim(); saveSettings(); }
  else if (t.dataset.voiceCustom) {
    const v = t.value.trim();
    settings[t.dataset.voiceCustom] = v || DEFAULTS[t.dataset.voiceCustom];
    saveSettings();
  }
});
sheetBody.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "setModel") { settings.model = t.value; saveSettings(); }
  else if (t.dataset.voice) {
    const name = t.dataset.voice;
    const custom = sheetBody.querySelector('[data-voice-custom="' + name + '"]');
    if (t.value === "custom") {
      custom.hidden = false;
      custom.focus();
      if (custom.value.trim()) { settings[name] = custom.value.trim(); saveSettings(); }
    } else {
      custom.hidden = true;
      settings[name] = t.value;
      saveSettings();
    }
  }
});

function hideSheet() {
  if (!sheetOpen) return;
  sheetOpen = false;
  const hold = sheetHold;
  sheetHold = null;
  if (hold && hold.token === Player.getToken()) { if (hold.paused) Player.resume(); }
  else Player.stop();
  if (document.activeElement && sheet.contains(document.activeElement)) document.activeElement.blur();
  sheet.classList.remove("on", "dragging");
  sheet.style.transform = "";
  scrim.classList.remove("on");
  sheet.setAttribute("aria-hidden", "true");
  flushNote();
  reviewQueue = [];
  if (currentTab === "expr") renderExprTab(); else updateExprBadge();
}

/* 닫기 버튼·바깥 탭: 히스토리를 되돌려서 안드로이드 뒤로 가기와 같은 흐름으로 닫음 */
function closeSheet() {
  if (!sheetOpen) return;
  let viaHistory = false;
  try { viaHistory = !!(history.state && history.state.sheet); } catch (e) {}
  if (viaHistory) history.back();
  else hideSheet();
}

window.addEventListener("popstate", hideSheet);
scrim.addEventListener("click", closeSheet);
sheetFoot.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { closeSheet(); return; }
  const g = e.target.closest("[data-grade]");
  if (g) { gradeCurrentReview(g.dataset.grade === "1"); return; }
  if (e.target.closest("[data-reveal]")) revealReview();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* 손잡이 부분을 아래로 끌어서 닫기 */
let dragY0 = null, dragDy = 0;
sheetHead.addEventListener("touchstart", e => {
  dragY0 = e.touches[0].clientY; dragDy = 0;
  sheet.classList.add("dragging");
}, { passive: true });
sheetHead.addEventListener("touchmove", e => {
  if (dragY0 === null) return;
  dragDy = Math.max(0, e.touches[0].clientY - dragY0);
  sheet.style.transform = "translateY(" + dragDy + "px)";
}, { passive: true });
sheetHead.addEventListener("touchend", () => {
  if (dragY0 === null) return;
  dragY0 = null;
  sheet.classList.remove("dragging");
  if (dragDy > 90) closeSheet();
  else sheet.style.transform = "";
});
</script>
</body>
