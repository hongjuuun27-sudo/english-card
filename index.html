/* ---------- 음성 캐시 (한 번 만든 ElevenLabs 음성은 폰에 저장해서 재사용) ---------- */
const AudioCache = (() => {
  const mem = new Map();
  let dbp = null;
  function db() {
    if (!dbp) {
      dbp = new Promise(res => {
        try {
          const r = indexedDB.open("engcards-tts", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("audio");
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(null);
        } catch (e) { res(null); }
      });
    }
    return dbp;
  }
  async function get(k) {
    if (mem.has(k)) return mem.get(k);
    const d = await db();
    if (!d) return null;
    return new Promise(res => {
      try {
        const q = d.transaction("audio").objectStore("audio").get(k);
        q.onsuccess = () => { const b = q.result || null; if (b) mem.set(k, b); res(b); };
        q.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  async function put(k, blob) {
    mem.set(k, blob);
    const d = await db();
    if (!d) return;
    try { d.transaction("audio", "readwrite").objectStore("audio").put(blob, k); } catch (e) {}
  }
  async function clear() {
    mem.clear();
    const d = await db();
    if (!d) return;
    try { d.transaction("audio", "readwrite").objectStore("audio").clear(); } catch (e) {}
  }
  /* 타임스탬프까지 있는 새 형식으로 저장돼 있는지만 확인 (메모리에 올려 두지 않음 — 드라이브 모드 '미리 받아두기' 개수 세기용) */
  async function has(k) {
    const m = mem.get(k);
    if (m) return m.audio instanceof Blob;
    const d = await db();
    if (!d) return false;
    return new Promise(res => {
      try {
        const q = d.transaction("audio").objectStore("audio").get(k);
        q.onsuccess = () => res(!!(q.result && q.result.audio instanceof Blob));
        q.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  }
  return { get, put, clear, has };
})();

/* ---------- 미리 만든 음성 (저장소 audio 폴더 — 키 없이도 카드 음성이 ElevenLabs 목소리로 나오게) ----------
   .claude/audio-build.ps1이 카드·표현·질문 같은 고정 콘텐츠를 미리 만들어 audio/{id}.mp3 + audio/manifest.json으로 둠.
   id = audioId(읽을 글, 목소리, 모델) — 글·목소리·모델·설정·형식 중 하나라도 바뀌면 다른 id(= 새 파일). 만드는 쪽도 이 함수를 그대로 씀.
   manifest.clips[id] = 단어마다 [시작, 끝](1/100초)을 이어 붙인 배열(타임스탬프를 못 맞춘 문장은 null → 줄 강조).
   재생 순서(Player.run): ① 여기 → ② 폰에 저장된 음성(AudioCache) → ③ 키가 있으면 ElevenLabs로 만들기 → ④ 폰 내장 음성.
   일기·연습장 같은 개인 콘텐츠는 목록에 없으니 자연히 ③ → ④ */
const PREBUILT = { fmt: "mp3_44100_64", vs: "0.5|0.75" };   // 만들 때 쓴 출력 형식·voice_settings(앱의 requestEleven과 같음)
function audioId(text, voice, model) {
  const s = ["v1", model, voice, PREBUILT.vs, PREBUILT.fmt, text].join("|");
  const h = seed => {                                           // cyrb53(53비트) — 씨앗 두 개를 이어 붙여 겹칠 일이 사실상 없게
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(14, "0");
  };
  return h(1) + h(2);
}
const Prebuilt = (() => {
  let man = null;
  const ready = fetch("audio/manifest.json", { cache: "no-cache" })
    .then(r => (r.ok ? r.json() : null))
    .then(j => { man = j && j.clips && typeof j.clips === "object" ? j : null; })
    .catch(() => {});
  const clips = new Map();                                      // id → Promise<{ audio, align }> (최근 것만 남김)
  function idOf(text, voice) {
    if (!man || !text) return null;
    const id = audioId(text, voice, settings.model);
    return Object.prototype.hasOwnProperty.call(man.clips, id) ? id : null;
  }
  /* 단어 시간 → 앱의 wordTimes가 읽는 alignment 모양(글자마다 그 단어의 시작·끝) */
  function alignOf(text, t) {
    if (!Array.isArray(t)) return null;
    const words = getScript(text).words, n = text.length;
    const st = new Array(n).fill(null), en = new Array(n).fill(null);
    words.forEach((w, k) => { if (t[2 * k + 1] == null) return; for (let i = w.ss; i < w.se; i++) { st[i] = t[2 * k] / 100; en[i] = t[2 * k + 1] / 100; } });
    let last = 0;
    for (let i = 0; i < n; i++) { if (st[i] == null) { st[i] = en[i] = last; } else last = en[i]; }
    return { characters: text.split(""), character_start_times_seconds: st, character_end_times_seconds: en };
  }
  async function get(text, voice) {
    await ready;
    const id = idOf(text, voice);
    if (!id) return null;
    if (!clips.has(id)) {
      const p = fetch("audio/" + id + ".mp3")
        .then(r => { if (!r.ok) throw new Error("음성 파일 없음"); return r.blob(); })
        .then(b => ({ audio: b, align: alignOf(text, man.clips[id]) }));
      p.catch(() => clips.delete(id));                          // 못 받았으면 다음엔 다시(이번엔 ②~④로)
      clips.set(id, p);
      if (clips.size > 60) clips.delete(clips.keys().next().value);
    }
    return clips.get(id).catch(() => null);
  }
  return { ready, has: (text, voice) => !!idOf(text, voice), get, count: () => (man ? Object.keys(man.clips).length : 0) };   // count: 앱에 들어 있는 음성 수(설정 안내 문구)
})();

/* ---------- 음성 재생 ---------- */
const Player = (() => {
  const audio = new Audio();
  let token = 0;
  let currentBtn = null;
  let queue = Promise.resolve();
  let deviceVoice = null;
  let warnedNoKey = false;

  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      const us = vs.filter(v => /en[-_]US/i.test(v.lang));
      deviceVoice = us.find(v => /google|samsung/i.test(v.name)) || us[0] || vs.find(v => /^en/i.test(v.lang)) || null;
    } catch (e) { deviceVoice = null; }
  }
  try {
    if ("speechSynthesis" in window) {
      pickVoice();
      speechSynthesis.addEventListener("voiceschanged", pickVoice);
    }
  } catch (e) {}

  function mark(btn, on) { if (btn) btn.classList.toggle("playing", on); }

  /* 재생 / 일시정지 / 정지가 바뀔 때 알림 (듣기 모드 버튼 모양 등) */
  const subs = [];
  function onChange(fn) { subs.push(fn); }
  function emit() { subs.forEach(fn => { try { fn(); } catch (e) {} }); }

  /* 일시정지 상태: 재생 중이던 줄을 멈춰 두고, resume()에서 이어서(내장 음성은 그 줄 처음부터) 재생 */
  let paused = false;
  let resumeFn = null;
  let audioCtl = null;    // 지금 재생 중인 mp3 { finish }
  let speechCtl = null;   // 지금 읽는 중인 내장 음성 { halt, restart, finish }
  let lastLen = 0;        // 바로 앞 문장을 끝까지 읽는 데 걸린 시간(초, 재생 속도 반영) — 드라이브 모드 '따라 말할 시간'
  let selfPause = false;  // 앱이 직접 audio.pause()를 부른 것(아래 'pause' 이벤트에서 끊김과 구분)

  function quietPause() {
    try { if (!audio.paused) { selfPause = true; audio.pause(); } } catch (e) {}
  }

  /* 앱이 멈춘 게 아닌데 소리가 끊김(전화·다른 앱 소리·백그라운드에서 재생 거부): 일시정지 상태로 바꾸고 알림.
     이어 듣기를 누르면 그 자리부터. 드라이브 모드는 onInterrupt를 받아 '그 문장 처음에서 일시정지'로 바꿈 */
  const intSubs = [];
  function onInterrupt(fn) { intSubs.push(fn); }
  function interrupted() {
    if (!paused) {
      paused = true;
      const ctl = audioCtl;
      resumeFn = ctl ? () => { const p = audio.play(); if (p && p.catch) p.catch(ctl.finish); } : (speechCtl ? speechCtl.restart : null);
      if (speechCtl) speechCtl.halt();
    }
    intSubs.forEach(fn => { try { fn(); } catch (e) {} });
    emit();
  }
  audio.addEventListener("pause", () => {
    if (selfPause) { selfPause = false; return; }
    if (audioCtl && !paused && !audio.ended) interrupted();
  });

  function stop() {
    token++;
    paused = false;
    resumeFn = null;
    quietPause();
    if (audioCtl) audioCtl.finish();
    if (speechCtl) { speechCtl.halt(); speechCtl.finish(); }
    mark(currentBtn, false);
    currentBtn = null;
    queue = Promise.resolve();
    emit();
  }

  function pause() {
    if (paused) return;
    paused = true;
    if (audioCtl && !audio.paused) {
      quietPause();
      const ctl = audioCtl;
      resumeFn = () => { const p = audio.play(); if (p && p.catch) p.catch(ctl.finish); };
    } else if (speechCtl) {
      speechCtl.halt();
      resumeFn = speechCtl.restart;
    }
    emit();
  }

  function resume() {
    if (!paused) return;
    paused = false;
    const f = resumeFn;
    resumeFn = null;
    if (f) f();
    emit();
  }

  /* 재생 중인 mp3 속도를 바로 바꿈 (내장 음성은 다음 줄부터) */
  function setRate(rate) {
    if (!audioCtl) return;
    try { audio.defaultPlaybackRate = rate; audio.playbackRate = rate; } catch (e) {}
  }

  /* 지금 시간(초)에 읽는 단어: 시작 시간이 t 이하인 마지막 단어. 재생 위치(currentTime) 기준이라 0.8x·1.0x 모두 맞음 */
  function wordAtTime(times, t) {
    let lo = 0, hi = times.length - 1, k = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (times[mid].s <= t + 0.03) { k = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return k;
  }

  /* mp3 재생. o: { sc, times(단어별 {s,e} 초), track, startAt(초), startFrac(타이밍이 없을 때 0~1 비율),
       endAt(초) / endFrac(비율): 여기서 멈춤(구간 재생), fade(초): 구간 시작·끝에서 소리를 부드럽게 키우고 줄임, wordFrom·wordTo: 이 범위 밖 단어는 강조 안 함 }
     track이 있으면 start("word"|"line") → word(k)… → (run이) end()
     페이드는 audio 요소의 volume으로만 함(음성은 Web Audio를 거치지 않는다는 원칙 그대로) */
  function playBlob(blob, rate, o) {
    o = o || {};
    return new Promise(res => {
      const url = URL.createObjectURL(blob);
      let finished = false, raf = 0, last = -2;
      let segA = o.startAt || 0, segB = o.endAt || 0;     // 구간(초). 비율로 받으면 길이를 안 뒤(loadedmetadata) 정함
      let endTimer = 0;
      /* 구간 끝: 멈추고 이 문장은 끝난 것으로 */
      const segEnd = () => {
        lastLen = Math.max(0, segB - segA) / (audio.playbackRate || rate);
        quietPause();
        ctl.finish();
      };
      /* 구간 끝 예약(화면 갱신이 느려져도 끝을 넘지 않게): 재생 시작·이어 듣기·속도 바뀜마다 남은 시간으로 다시 맞춤 */
      const armEnd = () => {
        clearTimeout(endTimer);
        if (finished || !segB || audio.paused) return;
        const ms = (segB - audio.currentTime) / (audio.playbackRate || rate) * 1000;
        endTimer = setTimeout(() => {
          if (finished) return;
          if (audio.currentTime >= segB - 0.015) segEnd(); else armEnd();
        }, Math.max(0, ms));
      };
      const tick = () => {
        if (finished) return;
        if (o.fade || segB) {
          const tm = audio.currentTime;
          if (segB && tm >= segB) { segEnd(); return; }
          if (o.fade) {
            const v = Math.min(1, (tm - segA) / o.fade, segB ? (segB - tm) / o.fade : 1);
            try { audio.volume = Math.max(0, Math.min(1, v)); } catch (e) {}
          }
        }
        if (o.times && o.track && !audio.paused && audio.readyState >= 2) {
          const k = wordAtTime(o.times, audio.currentTime);
          const kk = o.wordTo != null ? Math.min(k, o.wordTo) : k;      // 구간 재생: 앞뒤 여유 동안 구간 밖 단어는 칠하지 않음
          if (kk >= (o.wordFrom || 0) && kk !== last) { last = kk; o.track.word(kk); }
        }
        raf = requestAnimationFrame(tick);
      };
      const ctl = {
        sc: o.sc, times: o.times,
        finish() {
          if (finished) return;
          finished = true;
          cancelAnimationFrame(raf);
          clearTimeout(endTimer);
          audio.onended = audio.onerror = audio.onloadedmetadata = audio.onplaying = audio.onratechange = null;
          if (o.fade) try { audio.volume = 1; } catch (e) {}
          if (audioCtl === ctl) audioCtl = null;
          URL.revokeObjectURL(url);
          res();
        }
      };
      audioCtl = ctl;
      audio.onended = () => {
        if (isFinite(audio.duration)) lastLen = Math.max(0, audio.duration - (o.startAt || 0)) / (audio.playbackRate || rate);
        ctl.finish();
      };
      audio.onerror = ctl.finish;
      if (segB || o.endFrac) audio.onplaying = audio.onratechange = armEnd;
      if (o.startAt || o.startFrac || o.endFrac) {
        audio.onloadedmetadata = () => {
          audio.onloadedmetadata = null;
          const dur = isFinite(audio.duration) ? audio.duration : 0;
          const pad = o.fade ? SEG_PAD : 0;                 // 구간 재생은 비율로 잘라도 앞뒤 여유
          if (!o.startAt && o.startFrac && dur) segA = Math.max(0, dur * o.startFrac - pad);
          if (!o.endAt && o.endFrac && dur) segB = Math.min(dur, dur * o.endFrac + pad);
          if (segA > 0) try { audio.currentTime = segA; } catch (e) {}
        };
      }
      selfPause = false;                    // 새 글을 불러오면 앞에서 미뤄 둔 'pause' 이벤트는 브라우저가 버림
      audio.src = url;
      try { audio.volume = o.fade ? 0 : 1; } catch (e) {}   // 페이드는 0에서 시작(구간 앞으로 옮기기 전 소리도 안 나게)
      try { audio.preservesPitch = true; audio.defaultPlaybackRate = rate; audio.playbackRate = rate; } catch (e) {}
      if (o.track) o.track.start(o.times ? "word" : "line");
      /* 브라우저가 재생을 거부하면(백그라운드 등) 건너뛰지 않고 끊김으로 처리 → 일시정지 상태에서 기다림 */
      const start = () => {
        const p = audio.play();
        if (p && p.catch) p.catch(err => {
          if (paused) return;
          if (audioCtl === ctl && err && err.name === "NotAllowedError") interrupted();
          else ctl.finish();
        });
      };
      if (paused) resumeFn = start;
      else start();
      raf = requestAnimationFrame(tick);
    });
  }

  /* 내장 음성. 긴 글은 안드로이드에서 중간에 끊길 수 있어서 문장 단위로 나눠 읽음.
     o: { sc, track, offset(읽을 글 안에서 이 text가 시작하는 위치) }. 단어 신호(boundary)가 오면 그때부터 단어 강조, 안 오면 줄 강조 그대로 */
  function speakDevice(text, who, rate, o) {
    o = o || {};
    return new Promise(res => {
      if (!("speechSynthesis" in window)) { toast("이 브라우저는 음성 재생을 지원하지 않아요"); return res(); }
      let finished = false, gen = 0, timer = null, t0 = 0;
      const parts = [];
      if (text.length < 220) { if (text.trim()) parts.push({ t: text, at: 0 }); }
      else {
        const re = /[^.!?\n]+(?:[.!?]+["”’)]*|$)/g;
        let m;
        while ((m = re.exec(text)) && m[0]) {
          const lead = m[0].length - m[0].replace(/^\s+/, "").length;
          if (m[0].trim()) parts.push({ t: m[0].trim(), at: m.index + lead });
        }
      }
      const ctl = {
        finish() {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          if (speechCtl === ctl) speechCtl = null;
          res();
        },
        halt() {
          gen++;
          clearTimeout(timer);
          try { speechSynthesis.cancel(); } catch (e) {}
        },
        restart() {
          if (finished) return;
          const my = ++gen;
          clearTimeout(timer);
          t0 = Date.now();
          try {
            if (!deviceVoice) pickVoice();
            parts.forEach((p, idx) => {
              const u = new SpeechSynthesisUtterance(p.t);
              u.lang = "en-US";
              if (deviceVoice) u.voice = deviceVoice;
              u.rate = rate;
              u.pitch = who === "me" ? 0.92 : 1.08;
              if (o.track && o.sc) {
                u.onboundary = e => {
                  if (my !== gen || (e.name && e.name !== "word")) return;
                  o.track.word(o.sc.wordAt((o.offset || 0) + p.at + e.charIndex));
                };
              }
              if (idx === parts.length - 1) {
                u.onend = () => { if (my === gen) { lastLen = (Date.now() - t0) / 1000; ctl.finish(); } };
                u.onerror = () => { if (my === gen) ctl.finish(); };
              }
              speechSynthesis.speak(u);
            });
            timer = setTimeout(() => { if (my === gen) ctl.finish(); }, 4000 + text.length * 110 / rate);   // 일부 안드로이드에서 onend가 안 오는 경우 대비
          } catch (e) { ctl.finish(); }
        }
      };
      if (!parts.length) return ctl.finish();
      speechCtl = ctl;
      if (o.track) o.track.start("line");
      if (paused) resumeFn = ctl.restart;
      else ctl.restart();
    });
  }

  /* ElevenLabs: 오디오 + 문자별 타임스탬프(/with-timestamps)를 함께 받아 AudioCache에 { audio, align }로 저장.
     예전 캐시(타임스탬프 없는 Blob)는 그 문장을 다음에 재생할 때 한 번만 새로 받아 교체(미리 한꺼번에 다시 받지 않음) */
  const clipKey = (text, voice) => [settings.model, voice, text].join("|");
  const inflight = new Map();          // 같은 문장을 동시에 두 번 요청하지 않게(재생 + 드라이브 모드 미리 만들기)
  async function getEleven(text, voice) {
    const key = clipKey(text, voice);
    const cached = await AudioCache.get(key);
    if (cached && cached.audio instanceof Blob) return cached;
    if (inflight.has(key)) return inflight.get(key);
    const p = requestEleven(text, voice, key);
    inflight.set(key, p);
    p.then(() => inflight.delete(key), () => inflight.delete(key));
    return p;
  }
  async function requestEleven(text, voice, key) {
    /* 속도는 재생할 때 조절함 (v4는 API 속도 설정을 지원하지 않음) */
    const vs = { stability: 0.5, similarity_boost: 0.75 };
    let res;
    try {
      res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + encodeURIComponent(voice) + "/with-timestamps?output_format=mp3_44100_128", {
        method: "POST",
        headers: { "xi-api-key": settings.apiKey, "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ text: text, model_id: settings.model, voice_settings: vs })
      });
    } catch (e) {
      throw new Error("ElevenLabs에 연결하지 못했어요");
    }
    if (!res.ok) {
      let code = "", msg = "";
      try { const j = await res.json(); code = (j.detail && (j.detail.status || j.detail.code)) || ""; msg = (j.detail && j.detail.message) || ""; } catch (e) {}
      if (res.status === 401 && /quota/i.test(code + msg)) throw new Error("ElevenLabs 크레딧이 부족해요");
      if (res.status === 401) throw new Error("API 키를 확인해 주세요");
      if (/voice/i.test(code + msg)) throw new Error("목소리 ID를 확인해 주세요");
      throw new Error("ElevenLabs 오류 (" + res.status + ")");
    }
    let j;
    try { j = await res.json(); } catch (e) { throw new Error("ElevenLabs 응답을 읽지 못했어요"); }
    if (!j || !j.audio_base64) throw new Error("ElevenLabs 응답에 음성이 없어요");
    const bin = atob(j.audio_base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const clip = { audio: new Blob([bytes], { type: "audio/mpeg" }), align: j.alignment || null };
    AudioCache.put(key, clip);
    return clip;
  }

  /* 구간 재생 ①(대신 쓰는 방식 — 기본은 아래 ② 잘라 낸 소리): 문장 전체 음성을 재생하다가 from~to 단어 구간에서 멈춤.
     앞뒤로 SEG_PAD만큼 여유를 두되 옆 단어 소리는 넘지 않고, 시작·끝은 SEG_FADE 동안 볼륨을 올리고 내림.
     폰의 소리 출력 지연만큼 늦게 적용되는 한계가 있어서 ②를 못 쓸 때(타임스탬프 없음·mp3 풀기 실패)만 씀 */
  const SEG_PAD = 0.1, SEG_FADE = 0.04;
  function segWindow(times, from, to) {
    const a0 = times[from].s, b0 = times[to].e;
    const prevE = from > 0 ? times[from - 1].e : 0;
    const nextS = to < times.length - 1 ? times[to + 1].s : Infinity;
    return { a: Math.max(0, a0 - SEG_PAD, Math.min(prevE, a0)), b: Math.min(b0 + SEG_PAD, Math.max(nextS, b0)) };
  }

  /* ---- 구간 재생 ② 실제로 잘라 낸 소리 (연습 모드 청크의 기본 방식) ----
     재생 중에 멈추고(pause) 볼륨을 줄이는 ①방식은 폰의 소리 출력 지연(블루투스는 더 큼)만큼 늦게 적용돼서
     끝에 다음 단어 앞소리가 새어 나오고 시작은 잘렸음(2026-10-03 폰에서 확인). 그래서 재생 전에 소리 자체를 잘라 둠:
     문장 mp3를 OfflineAudioContext(44.1kHz)로 PCM으로 풀기만 하고(분석·자르기용, 소리를 내지 않고 출력 장치도 열지 않음),
     단어 경계 근처에서 실제로 소리가 끊긴 곳(쉼)을 찾아 자르고 짧은 페이드를 넣어 같은 44.1kHz·16비트 WAV로 만든 뒤
     상황 카드와 같은 audio 요소로 재생. 쉼이 없는 경계(이어 말하는 곳)는 소리가 가장 작은 지점에서 자름 → 그래도 어색하면 soloChunks */
  const HOP = 0.005;                        // 소리 크기를 재는 간격(초)
  const pcmOf = new WeakMap();              // mp3 Blob → Promise<{ rate, data(모노 Float32Array), env(HOP마다 크기), thr(쉼 기준) }>
  const cutOf = new WeakMap();              // mp3 Blob → Map("from-to" → Promise<{ blob, at }>)
  function decodePcm(blob) {
    if (!pcmOf.has(blob)) {
      pcmOf.set(blob, (async () => {
        const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        const buf = await new OAC(1, 1, 44100).decodeAudioData(await blob.arrayBuffer());
        const n = buf.length, rate = buf.sampleRate, nc = buf.numberOfChannels, data = new Float32Array(n);
        for (let c = 0; c < nc; c++) { const ch = buf.getChannelData(c); for (let i = 0; i < n; i++) data[i] += ch[i] / nc; }
        const hop = Math.max(1, Math.round(rate * HOP)), env = new Float32Array(Math.ceil(n / hop));
        let peak = 0;
        for (let h = 0; h < env.length; h++) {                 // h*HOP초를 가운데로 10ms 창의 RMS
          let s = 0, m = 0;
          for (let i = Math.max(0, h * hop - hop); i < Math.min(n, h * hop + hop); i++) { s += data[i] * data[i]; m++; }
          env[h] = m ? Math.sqrt(s / m) : 0;
          if (env[h] > peak) peak = env[h];
        }
        return { rate, data, env, thr: Math.max(peak * 0.015, 1e-4) };  // 가장 큰 소리의 약 -36dB 아래 = 쉼(f·h·th 같은 약한 첫소리는 쉼으로 안 봄)
      })());
    }
    return pcmOf.get(blob);
  }
  /* 단어 p와 p+1 사이에서 자를 곳 → { endL: 앞 청크 끝, startR: 뒤 청크 시작 }(초) */
  function cutPoint(P, times, p) {
    const A = times[p], B = times[p + 1], E = P.env, thr = P.thr;
    const lo = Math.max((A.s + A.e) / 2, Math.min(A.e, B.s) - 0.15);       // 정렬 시간이 조금 어긋나도 찾게 앞뒤로 넉넉히(단어 가운데는 안 넘음)
    const hi = Math.min((B.s + B.e) / 2, Math.max(A.e, B.s) + 0.15);
    const h0 = Math.max(0, Math.floor(lo / HOP)), h1 = Math.min(E.length - 1, Math.ceil(hi / HOP));
    let best = null;                                                         // 가장 긴 쉼
    for (let h = h0; h <= h1; h++) {
      if (E[h] >= thr) continue;
      let k = h;
      while (k + 1 <= h1 && E[k + 1] < thr) k++;
      if (!best || k - h > best[1] - best[0]) best = [h, k];
      h = k;
    }
    if (best && (best[1] - best[0]) * HOP >= 0.03) {
      const sA = best[0] * HOP, sB = best[1] * HOP;
      if (sB - sA < 0.08) { const mid = (sA + sB) / 2; return { endL: mid, startR: mid }; }
      return { endL: Math.min(sA + 0.1, sB - 0.03), startR: Math.max(sA + 0.02, sB - 0.06) };   // 앞 단어 끝 울림은 남기고, 뒤 단어 약한 첫소리(h·f)도 담음
    }
    let m = h0;                                                              // 쉼이 없음(이어 말함): 소리가 가장 작은 곳
    for (let h = h0; h <= h1; h++) if (E[h] < E[m]) m = h;
    return { endL: m * HOP, startR: m * HOP };
  }
  /* PCM 구간 → 16비트 WAV(같은 샘플레이트). 시작·끝 페이드(초) */
  function wavOf(P, a, b, fin, fout) {
    const s0 = Math.max(0, Math.round(a * P.rate)), s1 = Math.min(P.data.length, Math.round(b * P.rate)), n = Math.max(1, s1 - s0);
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, P.rate, true); v.setUint32(28, P.rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, n * 2, true);
    const fi = Math.max(1, Math.round(fin * P.rate)), fo = Math.max(1, Math.round(fout * P.rate));
    for (let i = 0; i < n; i++) {
      let x = s0 + i < P.data.length ? P.data[s0 + i] : 0;
      if (i < fi) x *= i / fi;
      if (n - 1 - i < fo) x *= (n - 1 - i) / fo;
      x = Math.max(-1, Math.min(1, x));
      v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
    }
    return new Blob([buf], { type: "audio/wav" });
  }
  /* 문장 mp3에서 from~to 단어 구간을 잘라 낸 WAV → { blob, times: 잘라 낸 소리 기준 단어 시간 }. 같은 구간은 한 번만 만듦.
     타임스탬프가 실제 소리와 통째로 조금 밀려 있을 수 있어서(mp3 앞 여백 등), 첫소리 위치와 첫 단어 시작을 비교해 그만큼 보정한 뒤 경계를 찾음 */
  function cutClip(mp3, times, from, to) {
    if (!cutOf.has(mp3)) cutOf.set(mp3, new Map());
    const m = cutOf.get(mp3), key = from + "-" + to;
    if (!m.has(key)) {
      const p = decodePcm(mp3).then(P => {
        const E = P.env, dur = P.data.length / P.rate;
        let on = 0; while (on < E.length - 1 && E[on] < P.thr) on++;               // 첫소리
        let off = E.length - 1; while (off > 0 && E[off] < P.thr) off--;           // 끝소리
        const shift = Math.max(-0.15, Math.min(0.15, times[0].s - on * HOP));      // 타임스탬프 밀림(+면 늦음)
        const ts = times.map(x => ({ s: x.s - shift, e: x.e - shift }));
        const a = from > 0 ? cutPoint(P, ts, from - 1).startR : Math.max(0, on * HOP - 0.06);        // 문장 처음: 첫소리 조금 앞부터
        const b = to < ts.length - 1 ? cutPoint(P, ts, to).endL : Math.min(dur, off * HOP + 0.15);   // 문장 끝: 끝소리 울림까지
        if (b - a < 0.05) throw new Error("구간이 너무 짧음");
        return { blob: wavOf(P, a, b, 0.012, 0.03), times: ts.map(x => ({ s: x.s - a, e: x.e - a })) };
      });
      p.catch(() => m.delete(key));          // 실패하면 다음엔 다시 시도(이번엔 ①방식으로)
      m.set(key, p);
    }
    return m.get(key);
  }

  /* opts: { engine: "eleven" | "device", voice, rate, script: getScript() 결과, from: 시작 단어, to: 끝 단어(있으면 구간 재생), track: 강조 받는 쪽 }
     engine·voice·rate가 없으면 표현 탭 설정. script가 있으면 괄호 속 한국어를 뺀 글(speech)을 읽고, from 단어부터 시작 */
  async function run(text, who, btn, t, opts) {
    opts = opts || {};
    const engine = opts.engine || settings.engine;
    const voice = opts.voice || (who === "me" ? settings.voiceMe : settings.voiceThem);
    const rate = opts.rate || settings.speed;
    const sc = opts.script && opts.script.words.length ? opts.script : null;
    const say = sc ? sc.speech : text;
    const from = sc ? Math.max(0, Math.min(opts.from || 0, sc.words.length - 1)) : 0;
    const to = sc && opts.to != null ? Math.max(from, Math.min(opts.to, sc.words.length - 1)) : -1;
    const track = opts.track || null;
    let complete = false;                              // 끊기지 않고 끝까지 읽었는지 (강조를 다 채운 채로 잠시 둘지)
    lastLen = 0;
    currentBtn = btn;
    mark(btn, true);
    /* mp3(+타임스탬프) 하나를 재생: 미리 만든 음성·저장된 음성·새로 만든 음성 공통 */
    const playClip = async clip => {
      const times = sc ? wordTimes(sc, clip.align) : null;
      if (to >= 0 && times) {                      // 구간 재생 ②: 잘라 낸 소리(못 만들면 아래 ①방식)
        const cut = await cutClip(clip.audio, times, from, to).catch(() => null);
        if (t !== token) return;
        if (cut) {
          await playBlob(cut.blob, rate, { sc, track, wordFrom: from, wordTo: to, times: cut.times });
          complete = t === token;
          return;
        }
      }
      const seg = to >= 0 && times ? segWindow(times, from, to) : null;   // 구간 재생 ①: 재생 중에 멈춤(타임스탬프가 없거나 풀기 실패 때만)
      await playBlob(clip.audio, rate, {
        sc, times, track,
        startAt: seg ? seg.a : from && times ? Math.max(0, times[from].s - 0.02) : 0,
        startFrac: from && !times ? sc.words[from].ss / say.length : 0,
        endAt: seg ? seg.b : 0,
        endFrac: to >= 0 && !times ? sc.words[to].se / say.length : 0,   // 단어 시간이 없으면 글자 비율로 어림
        fade: to >= 0 ? SEG_FADE : 0,
        wordFrom: to >= 0 ? from : 0,
        wordTo: to >= 0 ? to : null
      });
      complete = t === token;
    };
    try {
      /* ① 미리 만든 음성(저장소) — 엔진·키 설정과 상관없이 먼저. 없거나 못 받으면 아래로 */
      const pre = await Prebuilt.get(say, voice);
      if (t !== token) return;
      if (pre) {
        try { await playClip(pre); return; } catch (e) { if (t !== token) return; }
      }
      if (engine === "eleven") {
        if (!settings.apiKey) {
          if (!warnedNoKey) { toast("API 키가 없어서 폰 기본 음성으로 읽어요"); warnedNoKey = true; }
        } else {
          try {
            const clip = await getEleven(say, voice);     // ② 저장된 음성 → ③ 새로 만들기
            if (t !== token) return;
            await playClip(clip);
            return;
          } catch (err) {
            if (t !== token) return;
            toast(err.message + " · 폰 기본 음성으로 읽어요");
          }
        }
      }
      if (t !== token) return;
      const off = from ? sc.words[from].ss : 0;          // 내장 음성은 그 단어부터 끝까지 읽음(구간이면 to 단어까지만)
      await speakDevice(to >= 0 ? say.slice(off, sc.words[to].se) : say.slice(off), who, rate, { sc, track, offset: off });
      complete = t === token;
    } finally {
      if (track) track.end(complete);
      if (t === token) { mark(btn, false); currentBtn = null; }
    }
  }

  /* 재생 중인 mp3 안에서 그 단어 위치로 바로 이동(같은 문장일 때만). 못 하면 false → 부르는 쪽이 처음부터 다시 재생 */
  function seekWord(sc, k) {
    const c = audioCtl;
    if (paused || !c || c.sc !== sc || !c.times || !c.times[k]) return false;
    try { audio.currentTime = Math.max(0, c.times[k].s - 0.02); } catch (e) { return false; }
    return true;
  }

  /* 지금 재생 중인 걸 끊고 바로 재생 */
  function play(text, who, btn, opts) {
    stop();
    const t = token;
    queue = run(text, who, btn, t, opts);
    return queue;
  }
  /* 지금 재생이 끝나면 이어서 재생 */
  function enqueue(text, who, btn, opts) {
    const t = token;
    queue = queue.then(() => (t === token ? run(text, who, btn, t, opts) : undefined));
    return queue;
  }
  function isPlaying(btn) { return btn && btn.classList.contains("playing"); }
  function getToken() { return token; }
  function isPaused() { return paused; }
  /* 지금 소리를 내는 쪽: "audio"(ElevenLabs mp3) / "speech"(내장 음성) / null(문장 사이) */
  function current() { return audioCtl ? "audio" : speechCtl ? "speech" : null; }
  /* 드라이브 모드 미리 받아두기: 폰에 저장돼 있는지 / 만들어서 저장(같은 캐시·같은 키). 미리 만든 음성(Prebuilt)은 따로 셈 */
  function isCached(text, voice) { return AudioCache.has(clipKey(text, voice)); }
  function fetchClip(text, voice) { return getEleven(text, voice); }
  /* 다음 문장 미리 준비: 미리 만든 음성이면 그 파일을 받아 두고(키 필요 없음), 아니면 키가 있을 때만 ElevenLabs로 */
  async function warmClip(text, voice, eleven) {
    if (await Prebuilt.get(text, voice)) return;
    if (eleven) await getEleven(text, voice);
  }

  return { play, enqueue, stop, pause, resume, setRate, seekWord, isPaused, isPlaying, getToken, onChange,
    onInterrupt, current, lastLength: () => lastLen, isCached, fetchClip, warmClip };
})();

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= 인터랙티브 스크립트 ② 타이밍 · 강조 · 재생기 ================= */

/* ElevenLabs 문자별 시간(alignment) → 단어별 { s, e }(초). 글자를 차례로 맞춰 보고, 단어의 20% 넘게 못 맞추면 null(줄 강조로) */
function wordTimes(sc, align) {
  if (!align || !Array.isArray(align.characters)) return null;
  const ch = align.characters, st = align.character_start_times_seconds || [], en = align.character_end_times_seconds || [];
  const sp = sc.speech, S = new Array(sp.length), E = new Array(sp.length);
  let j = 0;
  for (let i = 0; i < sp.length && j < ch.length; i++) {
    let f = -1;
    for (let d = 0; d <= 3 && j + d < ch.length; d++) if (ch[j + d] === sp[i]) { f = j + d; break; }
    if (f < 0) continue;
    S[i] = st[f]; E[i] = en[f]; j = f + 1;
  }
  let miss = 0;
  const times = sc.words.map(w => {
    let s = null, e = null;
    for (let i = w.ss; i < w.se; i++) if (S[i] != null) { if (s == null) s = S[i]; e = E[i]; }
    if (s == null) { miss++; return null; }
    return { s, e };
  });
  if (!times.length || miss > times.length * 0.2) return null;
  for (let k = 0; k < times.length; k++) if (!times[k]) { const p = k ? times[k - 1].e : 0; times[k] = { s: p, e: p }; }
  return times;
}

/* 한 문장(.sc 요소)의 강조. 재생 한 번마다 새로 만들고, 같은 요소를 다음 재생이 이어받으면 앞의 것은 아무것도 안 함.
   end(complete): 끝까지 읽었으면 전체를 채운 채로 잠시(FILL_HOLD) 두었다가 평소 표시로, 중간에 끊겼으면 바로 평소 표시로 */
const FILL_HOLD = 900;
/* off: 읽는 글의 단어 k를 el의 k + off번째 단어로 칠함(연습 모드에서 청크만 따로 만든 음성을 문장 안 그 자리에 강조) */
function makeTrack(el, onWord, off) {
  off = off || 0;
  const clear = () => {
    el._trk = null;
    el.classList.remove("reading", "lineonly", "filled");
    paintWord(el, -1);
  };
  const trk = {
    start(mode) {
      if (!el) return;
      el._trk = trk;
      el.classList.remove("filled");
      el.classList.add("reading");
      el.classList.toggle("lineonly", mode === "line");     // 단어 신호가 없으면 문장 전체를 강조
      paintWord(el, -1);
    },
    word(k) {
      if (!el || el._trk !== trk) return;
      k += off;
      el.classList.remove("lineonly");
      paintWord(el, k);
      if (onWord) onWord(k);
    },
    end(complete) {
      if (!el || el._trk !== trk) return;
      if (!complete || el.classList.contains("lineonly")) { clear(); return; }
      el.classList.add("filled");
      setTimeout(() => { if (el._trk === trk) clear(); }, FILL_HOLD);
    }
  };
  return trk;
}
/* 읽은 단어(past)·지금 단어(now)는 채워짐, 그 뒤 단어는 흐린 채로. 앞쪽 단어로 이동하면 그 뒤가 다시 흐려짐 */
function paintWord(el, k) {
  if (el._k === k) return;
  el._k = k;
  let now = null;
  el.querySelectorAll(".w").forEach(w => {
    const n = +w.dataset.w;
    w.classList.toggle("now", n === k);
    w.classList.toggle("past", k >= 0 && n < k);
    if (n === k && !now) now = w;
  });
  if (now) keepInView(now);
}
/* 강조된 단어가 화면(시트 본문·카드 본문) 밖으로 나가려 하면 부드럽게 따라 스크롤 */
function keepInView(w) {
  const box = w.closest(".sheet-body, .body, .dv-scroll, .pc-scroll");
  if (!box || !w.getClientRects().length) return;
  const r = w.getBoundingClientRect(), b = box.getBoundingClientRect();
  if (r.top < b.top + 12 || r.bottom > b.bottom - 48) {
    box.scrollTo({ top: Math.max(0, box.scrollTop + r.top - b.top - b.height * 0.35), behavior: "smooth" });
  }
}

/* ---------- 문장 목록 재생기 (예문 5개·썰·카드 대화·드라이브 모드 공통) ----------
   createReader({ items: () => [{ el: .sc 요소, who: "me"|"them", btn?, voice?, from?, to?, script?, offset? }], rate: () => 속도,
     (from·to: 그 문장의 from~to 단어 구간만 재생 — 연습 모드 청크 / script·offset: el 대신 다른 글(따로 만든 청크 음성)을 읽고 강조는 el의 offset번째 단어부터)
                  gap: 문장 사이(ms) 또는 (방금 끝난 문장 번호) => ms, before(k, first): 문장 앞에 기다릴 일(async, 효과음),
                  onItem(i), onWord(i, k), onEnd(끝까지 들었는지), onChange(state) })
   play(i, w, single): i번째 문장의 w번째 단어부터 재생(single이면 그 문장만, 아니면 끝까지 이어서)
   seek(i, w): 단어 탭. 같은 문장을 재생 중이면 그 자리로 바로 이동, 이어 듣기 중이면 거기서부터 계속,
     재생 중이 아니면 그 문장만(옵션 tapSingle: false면 거기서부터 끝까지)
   toggle() 일시정지↔이어 듣기 · pause · resume · stop · next · prev · state() → { active, paused, single, index, word }
   소리는 모두 Player를 거치므로 Player.stop()(카드 넘김·모드 바꿈·시트 닫기·다른 재생)이 오면 바로 멈추고 강조도 지워짐 */
function createReader(o) {
  let t0 = -1, running = false, single = false, idx = -1, word = -1;
  const list = () => (typeof o.items === "function" ? o.items() : o.items) || [];
  const active = () => running && Player.getToken() === t0;
  const state = () => ({ active: active(), paused: active() && Player.isPaused(), single, index: idx, word });
  const changed = () => { if (o.onChange) o.onChange(state()); };

  function play(i, w, one) {
    const items = list();
    if (!items[i]) return;
    Player.stop();
    const my = t0 = Player.getToken();
    const alive = () => Player.getToken() === my;
    running = true; single = !!one; idx = i; word = w || 0;
    (async () => {
      let complete = false;
      try {
        for (let k = i, from = w || 0; k < items.length; k++, from = 0) {
          while (Player.isPaused() && alive()) await sleep(120);
          if (!alive()) return;
          idx = k; word = from;
          if (o.onItem) o.onItem(k);
          changed();
          if (o.before) { await o.before(k, k === i); if (!alive()) return; }   // 문장 앞에 할 일(드라이브 모드 효과음)
          const it = items[k];
          const sc = it.script || SCRIPTS[+it.el.dataset.sc];
          await Player.enqueue(sc.speech, it.who, it.btn || null, {
            script: sc, from: (it.from || 0) + from, to: it.to, voice: it.voice, engine: it.engine, rate: o.rate ? o.rate() : undefined,
            track: makeTrack(it.el, wk => { if (alive()) { word = wk; if (o.onWord) o.onWord(k, wk); } }, it.offset)
          });
          if (!alive() || single) break;
          if (k < items.length - 1) await sleep(typeof o.gap === "function" ? o.gap(k) : o.gap == null ? 400 : o.gap);
        }
        complete = alive();
      } finally {
        if (t0 === my) {                               // 이 재생기가 스스로 다시 시작한 경우(seek·next 등)는 끝 알림 없음
          running = false; idx = -1; word = -1;
          if (o.onEnd) o.onEnd(complete);
          changed();
        }
      }
    })();
  }
  function seek(i, w) {
    const items = list(), it = items[i];
    if (!it) return;
    /* w는 화면(el)의 단어 번호 → 읽는 글의 단어 번호 k = w − offset (연습 모드 썰 문장처럼 화면 글과 읽는 글이 다를 때) */
    const k = w - (it.offset || 0);
    if (active() && idx === i && Player.seekWord(it.script || SCRIPTS[+it.el.dataset.sc], k)) return;
    play(i, Math.max(0, k - (it.from || 0)), active() ? single : typeof o.tapSingle === "function" ? !!o.tapSingle() : o.tapSingle !== false);
  }
  function toggle() {
    if (!active()) return false;
    if (Player.isPaused()) Player.resume(); else Player.pause();
    return true;
  }
  return {
    play, seek, toggle, state,
    pause: () => { if (active()) Player.pause(); },
    resume: () => { if (active()) Player.resume(); },
    stop: () => { if (active()) Player.stop(); },
    next: () => { if (idx + 1 < list().length) play(idx + 1, 0, single); },
    prev: () => play(Math.max(0, idx - 1), 0, single)
  };
}

/* 그 줄이 화면 안에 보이게 스크롤. center면 지금 줄을 화면 위쪽 1/3쯤으로 (쉐도잉에서 따라 내려감) */
function follow(card, el, center) {
  const body = card.querySelector(".body");
  const r = el.getBoundingClientRect();
  const b = body.getBoundingClientRect();
  let top = null;
  if (center) top = body.scrollTop + (r.top - b.top) - b.height * 0.3;
  else if (r.bottom > b.bottom - 24) top = body.scrollTop + r.bottom - (b.bottom - 24);
  else if (r.top < b.top + 14) top = body.scrollTop + r.top - b.top - 14;
  if (top !== null) body.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}

/* ================= 상황 카드: 모드 3개 (읽기 / 듣기 / 쉐도잉) =================
   모드는 모든 카드 공통. 탭 바 위에서 고르고, 다시 열어도 유지(engcards.mode.v1).
   카드 하나의 진행 상태는 card._st에 모아 둠. 카드를 넘기거나 모드를 바꾸면 resetCard()로 처음 상태가 됨
   (예약된 '입력 중…' 취소 → 대화 다시 그리기 → 버튼 다시 그리기). 소리는 부르는 쪽에서 Player.stop() */
const MODE_KEY = "engcards.mode.v1";
const MODES = { read: "읽기", listen: "듣기", shadow: "쉐도잉" };
let mode = (() => {
  try { const m = localStorage.getItem(MODE_KEY); return m && MODES[m] ? m : "read"; } catch (e) { return "read"; }
})();

/* 쉐도잉 난이도(모든 카드 공통, 저장): easy 쉬움(영어 보며 한 줄씩) / mid 중간(영어 보며 쉬지 않고 이어서 — 동시 따라 말하기)
   / hard 어려움(영어 없이 두 사람 아이콘만 보며 한 줄씩, 막히면 '정답 보기').
   저장 { level, v: 2 }. v가 없는 예전 기록의 "hard"는 그때의 '어려움'(쉬지 않고 이어서) = 지금의 mid로 옮김.
   (예전의 repeat — 중간에서 끝나면 처음부터 다시 — 은 2026-10-03에 없앰. 저장에 남아 있어도 읽지 않음) */
const SHADOW_KEY = "engcards.shadow.v1";
const SHADOW_LEVELS = ["easy", "mid", "hard"];
const shadowPref = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(SHADOW_KEY) || "null");
    if (s && typeof s === "object") {
      const level = s.v !== 2 && s.level === "hard" ? "mid" : s.level;
      const p = { level: SHADOW_LEVELS.includes(level) ? level : "easy", v: 2 };
      if (s.v !== 2) try { localStorage.setItem(SHADOW_KEY, JSON.stringify(p)); } catch (e) {}
      return p;
    }
  } catch (e) {}
  return { level: "easy", v: 2 };
})();
function saveShadowPref() {
  try { localStorage.setItem(SHADOW_KEY, JSON.stringify(shadowPref)); } catch (e) {}
}
/* 읽기 난이도(2026-10-06 사용자 요청, 모든 카드 공통, 저장): normal 보통(내 대사만 한글) / hard 어려움(상대 대사도 한글 — 탭하면 영어, 내 대사와 같은 방식) */
const READ_KEY = "engcards.read.v1";
const readPref = (() => {
  try { const s = JSON.parse(localStorage.getItem(READ_KEY) || "null"); if (s && s.level === "hard") return { level: "hard" }; } catch (e) {}
  return { level: "normal" };
})();
const readHard = () => readPref.level === "hard";
function setReadLevel(level) {
  if (level === readPref.level) return;
  readPref.level = level === "hard" ? "hard" : "normal";
  try { localStorage.setItem(READ_KEY, JSON.stringify(readPref)); } catch (e) {}
  Player.stop();
  document.querySelectorAll(".card[data-i]").forEach(resetCard);
  buzz();
}
const MID_GAP = 250;                          // 중간: 줄 사이 짧은 간격(ms). 다음 음성을 불러오는 시간이 더해져 실제로는 약 0.3초
const isMid = st => st.mode === "shadow" && st.level === "mid";
const isBlind = st => st.mode === "shadow" && st.level === "hard";   // 어려움: 영어 없이 듣고 따라 말하기

const rowsOf = card => Array.from(card.querySelectorAll(".chat > .row:not(.typing)"));
const lineOf = (card, li) => CARDS[+card.dataset.i].dialogue[li];
const whoOf = line => (line.who === "me" ? "me" : "them");

function resetCard(card) {
  if (card.dataset.i == null) return;
  const old = card._st;
  if (old && old.timer) clearTimeout(old.timer);
  /* read: shown(보이는 줄 수)·full(전체 보기) / listen: revealed(정답 확인) / shadow: idx(지금 줄) / 공통: rd(대화 재생기) */
  /* shadow: level(easy 쉬움 / mid 중간 / hard 어려움) · started(중간에서 시작했는지)
     어려움: idx(지금 줄) · peek(지금 줄 정답 보기 중) · revealed(마지막 줄까지 끝나서 대화 전체를 보여 줌) */
  /* hold: 연습 모드에서 돌아온 뒤 '이어 듣기'로 이어 갈 줄(듣기·쉐도잉 중간, 없으면 -1). 무엇이든 재생을 시작하면 지움 */
  /* focus: 가장 최근에 재생했거나(cardReader onItem) 나타난·옮긴 줄(-1 = 아직 없음) — 연습 버튼이 이 줄부터 */
  const st = card._st = { mode, level: shadowPref.level, shown: 0, full: false, revealed: false, idx: -1, started: false, peek: false, timer: null, rd: null, hold: -1, focus: -1 };
  st.rd = cardReader(card, st);
  card.classList.remove("m-read", "m-listen", "m-shadow", "masked", "lpaused", "sh-mid", "sh-live", "sh-blind", "peek");
  card.classList.add("m-" + mode);
  card.classList.toggle("sh-mid", isMid(st));
  card.classList.toggle("sh-blind", isBlind(st));
  if (isBlind(st)) card.classList.add("masked");          // 어려움: 듣기 모드처럼 두 사람 아이콘
  card.querySelectorAll("[data-sh]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sh === shadowPref.level)));
  card.querySelectorAll("[data-rl]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.rl === readPref.level)));
  card.classList.toggle("rhard", readHard());
  card.querySelector(".chat").innerHTML = CHAT_HTML[+card.dataset.i];
  setCur(card, -1);
  const rows = rowsOf(card);
  if (mode === "read") {
    rows.forEach((r, i) => {
      r.classList.toggle("off", i > 0);
      if (r.classList.contains("me") || readHard()) r.classList.add("kq-on");   // 어려움: 상대 대사도 한글
    });
    st.shown = 1;
  } else if (mode === "listen") {
    card.classList.add("masked");
  } else {
    rows.forEach(r => r.classList.add("off"));
  }
  card.querySelector(".body").scrollTop = 0;
  renderActions(card);
}

/* 카드 대화의 재생기(인터랙티브 스크립트): 줄마다 .sc 요소. 읽기 모드는 음성 설정 속도, 듣기·쉐도잉은 drillRate.
   듣기 모드 이어 재생 중이면 지금 줄·말하는 쪽 아이콘을 따라 바꿈 */
function cardReader(card, st) {
  return createReader({
    items: () => rowsOf(card).map((r, i) => ({ el: r.querySelector(".sc"), who: whoOf(lineOf(card, i)), btn: r })),
    rate: () => (st.mode === "read" ? settings.speed : settings.drillRate),
    gap: () => (isMid(st) ? MID_GAP : 350),
    tapSingle: () => !isMid(st),                  // 중간: 단어를 누르면 거기서부터 끝까지 이어서
    onItem: i => {
      if (card._st !== st) return;
      st.hold = -1;
      st.focus = i;                                  // 연습 버튼은 가장 최근에 재생했거나 나타난 줄부터(cardLineNow)
      if (isMid(st)) { midCur(card, i); return; }
      if (st.mode !== "listen" || st.rd.state().single) return;
      setCur(card, i);
      if (i > 0 && !card.classList.contains("masked")) follow(card, rowsOf(card)[i]);   // 아이콘 화면에서는 스크롤할 줄이 없음
    },
    onEnd: complete => {
      if (card._st !== st) return;
      if (complete && !st.rd.state().single && (st.mode === "listen" || isMid(st))) markCardDone(cardIdx(card));   // 듣기·쉐도잉 중간: 대화 전체를 끝까지 들음
      if (isMid(st)) { midEnd(card); return; }
      if (st.mode !== "listen") return;
      setCur(card, -1);
      renderActions(card);
    },
    /* 재생이 시작되거나(문장마다) 끝나면 버튼(재생 / 일시정지 / 이어 듣기)과 어려움의 아이콘 퍼짐을 다시 그림.
       예) 중간에서 일시정지한 채 앞 줄 단어를 누르면 바로 재생되므로 버튼도 [일시정지]로 */
    onChange: () => { if (card._st === st && (st.mode === "listen" || isMid(st) || isBlind(st))) renderActions(card); }
  });
}

/* 지금 카드를 처음부터 (소리도 멈춤) */
function restartCard(card) {
  Player.stop();
  resetCard(card);
}

/* ---------- 하단 버튼: 주요 버튼(.main)은 세 모드 모두 오른쪽 넓은 자리 ---------- */
function actBtn(act, html, cls, label, disabled) {
  return '<button class="btn' + (cls ? " " + cls : "") + '" type="button" data-act="' + act + '"' +
    (label ? ' aria-label="' + label + '"' : "") + (disabled ? " disabled" : "") + '>' + html + '</button>';
}
function rateBtn() {
  const r = settings.drillRate === 1 ? "1.0" : String(settings.drillRate);
  return actBtn("rate", r + "x", "rate", "재생 속도 " + r + "배, 누르면 바뀜");
}
const NEXT_HTML = "<span>다음</span>" + ICON_ARROW;
const AGAIN_HTML = ICON_RESTART + "<span>처음부터</span>";

function renderActions(card) {
  const st = card._st;
  if (!st) return;
  const n = rowsOf(card).length;
  let html = "", note = "";
  if (st.mode === "read") {
    /* 왼쪽 버튼: 아직 다 안 나왔으면 [전체 보기](전체 보기 중이면 [접기]).
       [다음]으로 모든 줄이 다 나왔으면 — 한글로 남은 내 대사가 있으면 [내 답변 영어로](내 대사 전부 영어), 전부 영어면 [접기](한 번에 처음 상태로) */
    const end = st.shown >= n && !st.timer;
    const kq = rowsOf(card).some(r => r.classList.contains("kq-on"));
    const left = st.full ? actBtn("all", "접기", "on") : !end ? actBtn("all", "전체 보기") :
      kq ? actBtn("meen", readHard() ? "모두 영어로" : "내 답변 영어로") : actBtn("fold", "접기", "on");
    html = left + actBtn("next", end ? AGAIN_HTML : NEXT_HTML, "main");
  } else if (st.mode === "listen") {
    const rs = st.rd.state();
    const live = rs.active && !rs.single;                             // 대화 전체 이어 재생 중(한 줄만 듣기는 제외)
    const held = !rs.active && st.hold >= 0;                          // 연습 모드에서 돌아옴: 멈춘 줄부터 이어 듣기
    card.classList.toggle("lpaused", (live && rs.paused) || held);    // 일시정지 중엔 아이콘 퍼짐 효과 멈춤
    const main = held ? ICON_PLAY + "<span>이어 듣기</span>" : !live ? ICON_PLAY + "<span>재생</span>" :
      rs.paused ? ICON_PLAY + "<span>이어 듣기</span>" : ICON_PAUSE + "<span>일시정지</span>";
    html = actBtn("replay", ICON_RESTART, "ico-btn", "처음부터 다시 듣기") + rateBtn() +
      actBtn("answer", st.revealed ? "가리기" : "정답 확인", st.revealed ? "on" : "") +
      actBtn("play", main, "main");
    if (!st.revealed) note = "▶ 재생을 누르면 대화 전체를 글자 없이 들려줘요. 다 듣고 '정답 확인'.";
  } else if (isMid(st)) {
    /* 중간: [처음부터] [속도] [재생/일시정지] — 시작 전엔 [속도] [시작] */
    const rs = st.rd.state();
    if (!st.started) {
      html = rateBtn() + actBtn("mplay", ICON_PLAY + "<span>시작</span>", "main");
      note = "대화 전체를 쉬지 않고 이어서 들려줘요. 들리는 대로 바로 겹쳐서 따라 말해 보세요.";
    } else {
      const main = !rs.active ? ICON_PLAY + "<span>" + (st.hold >= 0 ? "이어 듣기" : "재생") + "</span>" :
        rs.paused ? ICON_PLAY + "<span>이어 듣기</span>" : ICON_PAUSE + "<span>일시정지</span>";
      html = actBtn("mrestart", ICON_RESTART, "ico-btn", "처음부터") + rateBtn() + actBtn("mplay", main, "main");
    }
  } else if (st.idx < 0) {
    html = actBtn("start", ICON_PLAY + "<span>시작</span>", "main");
    note = isBlind(st) ? "영어 없이 한 줄씩 들려줘요. 듣고 나서 소리 내어 따라 말해 보세요. 막히면 '정답 보기'." :
      "한 줄씩 들려줘요. 듣고 나서 소리 내어 따라 말해 보세요.";
  } else if (isBlind(st)) {
    /* 어려움: [이전] [한 번 더 듣기] [정답 보기] [속도] [다음] — 버튼 5개라 좁게(.five), 다음이 가장 크게 오른쪽.
       마지막 줄에선 [마치기](대화 전체 보이기) → 그 뒤 [처음부터]. 재생 중일 때만 말하는 쪽 아이콘이 퍼짐 */
    const rs = st.rd.state();
    card.classList.toggle("lpaused", !(rs.active && !rs.paused));
    const main = st.revealed ? AGAIN_HTML : st.idx >= n - 1 ? "<span>마치기</span>" : NEXT_HTML;
    html = actBtn("prev", "이전", "prev", "", st.idx <= 0 && !st.revealed) + actBtn("again", "한 번 더 듣기", "again") +
      actBtn("peek", st.peek ? "가리기" : "정답 보기", "peek" + (st.peek ? " on" : ""), "", st.revealed) + rateBtn() +
      actBtn("next", main, "main");
  } else {
    /* [이전] [한 번 더 듣기] [속도] [다음] — 다음이 가장 크게 오른쪽(엄지 자리). 첫 줄에선 이전 비활성 */
    html = actBtn("prev", "이전", "prev", "", st.idx <= 0) + actBtn("again", "한 번 더 듣기", "again") + rateBtn() +
      actBtn("next", st.idx >= n - 1 ? "<span>처음부터</span>" : NEXT_HTML, "main");
  }
  const acts = card.querySelector(".actions");
  acts.innerHTML = html;
  acts.classList.toggle("five", isBlind(st) && st.idx >= 0);
  card.querySelector(".mnote").textContent = note;
}

function onAct(card, act) {
  const st = card && card._st;
  if (!st) return;
  buzz();
  if (act === "rate") { toggleRate(card); return; }
  if (st.mode === "read") {
    if (act === "next") readNext(card);
    else if (act === "all") { if (st.full) restartCard(card); else readAll(card); }
    else if (act === "meen") { rowsOf(card).forEach(r => r.classList.remove("kq-on")); document.body.classList.add("hinted"); renderActions(card); }
    else if (act === "fold") restartCard(card);
  } else if (st.mode === "listen") {
    if (act === "play") listenPlay(card);
    else if (act === "replay") listenStart(card);
    else if (act === "answer") listenReveal(card, !st.revealed);
  } else if (isMid(st)) {
    if (act === "mplay") midPlay(card);
    else if (act === "mrestart") midStart(card, 0, 0);
  } else if (isBlind(st)) {
    const n = rowsOf(card).length;
    if (act === "start") blindGo(card, 0);
    else if (act === "next") { if (st.revealed) blindGo(card, 0); else if (st.idx < n - 1) blindGo(card, st.idx + 1); else blindFinish(card); }
    else if (act === "again") shadowSay(card);
    else if (act === "peek") blindPeek(card, !st.peek);
    else if (act === "prev") { if (st.revealed) blindGo(card, n - 1); else if (st.idx > 0) blindGo(card, st.idx - 1); }
  } else {
    if (act === "start") shadowGo(card, 0);
    else if (act === "next") shadowGo(card, st.idx >= rowsOf(card).length - 1 ? 0 : st.idx + 1);
    else if (act === "again") shadowSay(card);
    else if (act === "prev" && st.idx > 0) shadowGo(card, st.idx - 1);   // 앞 줄로: 뒤의 줄은 다시 숨기고 그 줄 재생(지금 소리는 끊김)
  }
}

/* 말풍선 탭: 읽기 모드의 내 대사는 한글 ↔ 영어(단어 탭으로 재생 위치를 옮기지 않음 — 탭 동작이 겹치지 않게).
   듣기(정답 확인 후)·쉐도잉: 단어를 탭하면 그 줄의 그 단어부터. 듣기 모드에서 단어 밖을 탭하면 그 줄만 처음부터 */
function onBubble(card, row, target) {
  const st = card && card._st;
  if (!st || !row || row.classList.contains("typing")) return;
  if (st.mode === "read" && (row.classList.contains("me") || readHard())) {   // 어려움은 상대 대사도 한글 ↔ 영어
    row.classList.toggle("kq-on");
    if (row.classList.contains("kq-on") && row.classList.contains("playing")) Player.stop();   // 한글로 돌아가면(스피커도 숨김) 그 줄 소리도 멈춤
    document.body.classList.add("hinted");
    buzz();
    renderActions(card);                            // 다 나온 뒤면 [내 답변 영어로] ↔ [접기]
    /* 말풍선 크기가 바뀌었으니, 바뀐 글자가 나타나는 애니메이션(.25초)이 끝난 뒤 그 줄 전체가 보이게 맞춤(이미 보이면 그대로) */
    clearTimeout(row._fit);
    row._fit = setTimeout(() => { if (card._st === st && row.isConnected) follow(card, row); }, 260);
  } else if ((st.mode === "listen" && st.revealed) || st.mode === "shadow") {
    const w = target && target.closest(".w");
    const i = +row.dataset.l;
    if (w) { buzz(); st.rd.seek(i, +w.dataset.w); }
    else if (st.mode === "listen") st.rd.play(i, 0, true);
  }
}

/* 읽기 모드 말풍선 옆 스피커: 그 줄만 읽고 단어 강조 (다시 누르면 멈춤) */
function cardSpeak(card, row) {
  const st = card && card._st;
  if (!st || !row) return;
  if (row.classList.contains("playing")) { Player.stop(); return; }
  st.rd.play(+row.dataset.l, 0, true);
}

/* 듣기·쉐도잉 공통 속도(0.8x / 1.0x). 재생 중인 소리에도 바로 적용 */
function toggleRate(card) {
  settings.drillRate = settings.drillRate === 1 ? 0.8 : 1;
  saveSettings();
  Player.setRate(settings.drillRate);
  renderActions(card);
}

/* ---------- 읽기: 떠올리고 확인하기 ---------- */
function showRow(card, row) {
  card._st.focus = +row.dataset.l;
  row.classList.remove("off");
  row.classList.add("pop");
  follow(card, row);
  if (+row.dataset.l === rowsOf(card).length - 1) markCardDone(cardIdx(card));   // 읽기: 마지막 줄까지 나옴 = 끝까지 봄
}
function readNext(card) {
  const st = card._st;
  const rows = rowsOf(card);
  if (st.timer) {                                   // '입력 중…'이면 기다리지 않고 바로 보여 줌
    clearTimeout(st.timer);
    st.timer = null;
    card.querySelectorAll(".typing").forEach(x => x.remove());
    showRow(card, rows[st.shown++]);
    renderActions(card);
    return;
  }
  if (st.shown >= rows.length) { restartCard(card); return; }
  const row = rows[st.shown];
  if (row.classList.contains("them")) {
    const typing = document.createElement("div");
    typing.className = "row them typing pop";
    typing.innerHTML = '<div class="bubble dots" aria-label="입력 중"><i></i><i></i><i></i></div>';
    row.parentNode.insertBefore(typing, row);
    follow(card, typing);
    st.timer = setTimeout(() => {
      if (card._st !== st) return;
      st.timer = null;
      typing.remove();
      showRow(card, rows[st.shown++]);
      renderActions(card);
    }, 850);
  } else {
    showRow(card, rows[st.shown++]);
  }
  renderActions(card);
}
function readAll(card) {
  const st = card._st;
  clearTimeout(st.timer);
  st.timer = null;
  card.querySelectorAll(".typing").forEach(x => x.remove());
  const rows = rowsOf(card);
  rows.forEach(r => {
    if (r.classList.contains("off")) { r.classList.remove("off"); r.classList.add("pop"); }
    r.classList.remove("kq-on");
  });
  st.shown = rows.length;
  st.full = true;
  markCardDone(cardIdx(card));                       // 읽기 [전체 보기] = 끝까지 봄
  renderActions(card);
}

/* ---------- 듣기: 글자 없이 듣기 ---------- */
/* 지금 줄(i, 없으면 -1): 대화의 줄 강조 + 두 사람 아이콘 중 말하는 쪽 + "3 / 6" */
function setCur(card, i) {
  const rows = rowsOf(card);
  rows.forEach((r, j) => r.classList.toggle("cur", j === i));
  const line = i >= 0 ? lineOf(card, i) : null;
  card.classList.toggle("talk-them", !!line && line.who !== "me");
  card.classList.toggle("talk-me", !!line && line.who === "me");
  card.querySelector(".duo-n").textContent = line ? (i + 1) + " / " + rows.length : "대사 " + rows.length + "줄";
}
function listenStart(card) {
  card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });   // 처음부터: 제목·상황이 보이는 위치에서 시작
  card._st.rd.play(0, 0, false);
  renderActions(card);
}
function listenPlay(card) {
  const rs = card._st.rd.state();
  if (rs.active && !rs.single) { card._st.rd.toggle(); return; }   // 재생 중이면 일시정지↔이어 듣기 (버튼은 Player.onChange가 다시 그림)
  if (!rs.active && card._st.hold >= 0) { card._st.rd.play(card._st.hold, 0, false); renderActions(card); return; }   // 연습 모드에서 돌아온 뒤: 멈춘 줄부터
  listenStart(card);
}
function listenReveal(card, on) {
  card._st.revealed = on;
  if (on) markCardDone(cardIdx(card));               // 듣기 [정답 확인] = 대화 전체를 봄
  card.classList.toggle("masked", !on);
  renderActions(card);
}

/* ---------- 쉐도잉: 한 줄씩 듣고 따라 말하기 ---------- */
function shadowGo(card, i) {
  const st = card._st;
  const rows = rowsOf(card);
  st.idx = i;
  st.focus = i;
  rows.forEach((r, j) => {
    if (j === i && r.classList.contains("off")) r.classList.add("pop");
    r.classList.toggle("off", j > i);
    r.classList.toggle("past", j < i);
    r.classList.toggle("cur", j === i);
  });
  if (i === 0) card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });
  else follow(card, rows[i], true);
  if (i === rows.length - 1) markCardDone(cardIdx(card));   // 쉐도잉 쉬움: 마지막 줄까지
  shadowSay(card);
  renderActions(card);
}
function shadowSay(card) {
  const st = card._st;
  if (st.idx >= 0) st.rd.play(st.idx, 0, true);
}

/* ---------- 쉐도잉 어려움: 영어 없이 한 줄씩 듣고 따라 말하기 ----------
   듣기 모드처럼 두 사람 아이콘(masked) + 말하는 쪽 강조 + "3 / 6". [다음]을 눌러야 다음 줄을 재생(쉬움과 같은 한 줄 재생).
   [정답 보기] = 지금 줄만 영어 + 작은 한글(아이콘 아래, .peek), 다른 줄로 가면 다시 숨김.
   [마치기](마지막 줄) → 아이콘이 사라지고 대화 전체(revealed), 버튼은 [처음부터] */
function blindPaint(card) {
  const st = card._st;
  card.classList.toggle("masked", !st.revealed);
  card.classList.toggle("peek", st.peek && !st.revealed);
  rowsOf(card).forEach((r, j) => {
    const on = st.revealed || (st.peek && j === st.idx);
    if (on && r.classList.contains("off")) r.classList.add("pop");
    r.classList.toggle("off", !on);
  });
  setCur(card, st.revealed ? -1 : st.idx);         // 줄 강조(.cur) · 말하는 쪽 아이콘 · "3 / 6"
}
function blindGo(card, i) {
  const st = card._st;
  st.idx = i;
  st.focus = i;
  st.peek = false;
  st.revealed = false;
  blindPaint(card);
  card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });
  if (i === rowsOf(card).length - 1) markCardDone(cardIdx(card));   // 쉐도잉 어려움: 마지막 줄까지
  st.rd.play(i, 0, true);
  renderActions(card);
}
function blindPeek(card, on) {
  const st = card._st;
  st.peek = on;
  blindPaint(card);
  if (on) follow(card, rowsOf(card)[st.idx]);
  renderActions(card);
}
function blindFinish(card) {
  const st = card._st;
  st.peek = false;
  st.revealed = true;
  blindPaint(card);
  card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });
  renderActions(card);
}

/* ---------- 쉐도잉 중간: 쉬지 않고 대화 전체를 이어서(줄 사이 MID_GAP) — 같은 카드 재생기(cardReader)를 그대로 씀 ----------
   시작하면 모든 줄이 보이고, 지금 줄은 크게(.cur) + 노래방식 채우기, 지나간 줄은 흐리게, 화면이 지금 줄을 따라감.
   단어 탭 → 그 위치부터 끝까지(seek, tapSingle false). 끝까지 들으면 멈춤(예전 '반복'은 없앰) */
function midStart(card, i, w) {
  const st = card._st;
  clearTimeout(st.timer);
  st.timer = null;
  if (!st.started) {
    st.started = true;
    rowsOf(card).forEach(r => { r.classList.remove("off"); r.classList.add("pop"); });
  }
  if (!i) card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });
  st.rd.play(i || 0, w || 0, false);
  renderActions(card);
}
function midPlay(card) {
  const st = card._st;
  if (st.rd.state().active) { st.rd.toggle(); return; }   // 버튼 모양은 Player.onChange가 다시 그림
  midStart(card, st.hold >= 0 ? st.hold : 0, 0);         // 연습 모드에서 돌아온 뒤면 멈춘 줄부터
}
function midCur(card, i) {
  card.classList.add("sh-live");
  rowsOf(card).forEach((r, j) => {
    r.classList.toggle("cur", j === i);
    r.classList.toggle("past", j < i);
  });
  follow(card, rowsOf(card)[i], true);
}
function midEnd(card) {
  card.classList.remove("sh-live");
  rowsOf(card).forEach(r => r.classList.remove("cur", "past"));
  renderActions(card);
}

/* ---------- 진도 저장: 마지막으로 본 카드 + 본 카드 목록 ---------- */
const PROGRESS_KEY = "engcards.progress.v1";
const storageOK = (() => {
  try {
    localStorage.setItem("__engcards_test", "1");
    const ok = localStorage.getItem("__engcards_test") === "1";
    localStorage.removeItem("__engcards_test");

function cardKey(i) {

  return c && c.id != null ? String(c.id) : "i" + i;   // id 기준이라 카드를 추가해도 기록이 안 꼬임
}
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "null");
    if (p && typeof p === "object") return { last: p.last == null ? null : String(p.last), seen: Array.isArray(p.seen) ? p.seen.map(String) : [],
      at: p.at && typeof p.at === "object" ? p.at : {} };   // at: 카드key → 마지막으로 본 시각(ms) — 홈 질문 고르기(오래전에 본 카드 먼저)
  } catch (e) {}
  return { last: null, seen: [], at: {} };
}
const progress = loadProgress();
const seenSet = new Set(progress.seen);
function saveProgress() {
  progress.seen = Array.from(seenSet);

}
function indexOfKey(key) {
  for (let i = 0; i < CARDS.length; i++) if (cardKey(i) === key) return i;

}
function jumpTo(idx) {

const DIARY_KEY = "engcards.diary.v1";
function loadDiary() {

/* 하루 기록 = { items: [ { q:{en,ko}, text, fix, updated, final?, listen?, fav? } ] } (최대 3편). 예전 형식({q,text,fix})은 자동으로 바꿔 읽음
   final = 첨삭 칸의 [최종본] 아래 영어(첨삭 칸이 바뀔 때마다 다시 뽑음), listen = '듣기용 본문 수정'으로 직접 다듬은 글, fav = 듣기용 ★ */
const MAX_WRITES = 3;
function normEntry(e) {
  if (!e || typeof e !== "object") return null;
  const raw = Array.isArray(e.items) ? e.items : [e];
  const items = raw.filter(x => x && typeof x === "object")
    .map(x => {
      const it = { q: x.q && x.q.en ? { en: x.q.en, ko: x.q.ko || "" } : null, text: x.text || "", fix: x.fix || "", updated: x.updated || 0 };
      if (typeof x.final === "string" && x.final.trim()) it.final = x.final;
      if (typeof x.listen === "string" && x.listen.trim()) it.listen = x.listen;
      if (x.fav) it.fav = true;
      return it;
    });
  return items.length ? { items: items.slice(0, MAX_WRITES) } : null;
}
Object.keys(diary.entries).forEach(k => {
  const n = normEntry(diary.entries[k]);
  if (n) diary.entries[k] = n; else delete diary.entries[k];
});
const hasContent = it => !!(it && ((it.text || "").trim() || (it.fix || "").trim()));

const pad2 = n => String(n).padStart(2, "0");
function dateKey(d) {
  d = d || appNow();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function dayNumber(key) {
  const p = key.split("-").map(Number);
  return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000);
}
/* 오늘 고를 수 있는 질문 5개: 날짜마다 정해진 순서에서, 다른 날 이미 답한 질문은 건너뜀.
   (같은 날엔 항상 같은 5개. 다 답하면 처음부터 다시 돌아옴) */
function candidatesFor(key) {
  const L = QUESTIONS.length;
  if (!L) return [];
  const start = ((dayNumber(key) * 5) % L + L) % L;
  const order = [];
  for (let i = 0; i < L; i++) order.push(QUESTIONS[(start + i) % L]);
  const used = new Set();
  Object.keys(diary.entries).forEach(k => {
    if (k === key) return;
    diary.entries[k].items.forEach(it => { if (it.q && hasContent(it)) used.add(it.q.en); });
  });
  const fresh = order.filter(q => !used.has(q.en));
  const pool = fresh.length >= 5 ? fresh : fresh.concat(order.filter(q => used.has(q.en)));
  return pool.slice(0, 5);
}
function koDate(key, withDay) {
  const p = key.split("-").map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  const year = p[0] !== appNow().getFullYear() ? p[0] + "년 " : "";
  return year + p[1] + "월 " + p[2] + "일" + (withDay ? " " + "일월화수목금토"[d.getDay()] + "요일" : "");
}

let todayKey = null;

function todayEntry() {

}
function newItem() {
  const usedToday = new Set(todayEntry().items.map(it => it.q && it.q.en));
  const q = todayCands.find(c => !usedToday.has(c.en)) || todayCands[0] || { en: "", ko: "" };
  return { q: { en: q.en, ko: q.ko }, text: "", fix: "", updated: 0 };
}

}
function autoGrow(ta) {

function countWords(s) {
  return (s.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length;
}
function updateCount() {

/* ---- 질문 고르기 (오늘의 후보 5개 중 하나) ---- */

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;left:0;opacity:0;";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

/* 첨삭 칸에서 한글이 들어간 줄(한국어 설명)·코드블록 기호(```)는 빼고 영어만 읽음 — [최종본]이 없는 일기의 듣기용 본문 */
const HANGUL_RE = /[가-힣ㄱ-ㅎㅏ-ㅣ]/;
const FENCE_LINE = /^\s*```/;
function englishOnly(text) {
  return String(text || "").split(/\r?\n/)
    .filter(l => l.trim() && !HANGUL_RE.test(l) && !FENCE_LINE.test(l))
    .join("\n").trim();
}
/* 첨삭 칸의 [최종본] 아래 영어 완성본. 코드블록 안에 있든(```…[최종본]…```) 밖에 있든 읽음:
   [최종본] 줄의 나머지 + 다음 줄들. 아직 글을 못 모았을 때의 ```는 여는 기호라 건너뛰고, 글을 모은 뒤의 ```에서 멈춤.
   굵게(**)·인용(>) 기호, 한글이 섞인 줄(설명·맺음말)은 뺌. 없으면 "" */
function extractFinal(fix) {
  const lines = String(fix || "").replace(/\r/g, "").split("\n");
  const at = lines.findIndex(l => /\[\s*최종본\s*\]/.test(l));
  if (at < 0) return "";
  const out = [];
  const first = lines[at].replace(/^.*?\[\s*최종본\s*\]\s*:?/, "").replace(/```.*$/, "");
  const take = l => {
    const s = l.replace(/\*\*|__/g, "").replace(/^\s*>\s?/, "").trim();
    if (s && !HANGUL_RE.test(s)) out.push(s);
  };
  take(first);
  for (let i = at + 1; i < lines.length; i++) {
    if (FENCE_LINE.test(lines[i])) { if (out.length) break; continue; }
    take(lines[i]);
  }
  return out.join("\n").trim();
}
/* 듣기용 본문: 직접 다듬은 글 → [최종본] → 첨삭에서 영어 줄만. 글쓰기 '듣기'·듣기용 목록·드라이브 '내 일기'가 모두 이걸 읽음 */
function listenBody(it) {
  if (!it) return "";
  return (it.listen && it.listen.trim()) || extractFinal(it.fix) || englishOnly(it.fix);
}
function listenSource(it) {
  return it.listen && it.listen.trim() ? "직접 다듬음" : extractFinal(it.fix) ? "[최종본]에서" : englishOnly(it.fix) ? "첨삭의 영어 줄에서" : "";
}
/* 문장 단위로 나눔(줄바꿈 = 문단, 그 안에서 . ! ? 뒤 + 대문자·숫자·따옴표 앞). 문장마다 음성을 따로 만들어서 고친 문장만 새로 만들어짐 */
function splitSentences(text) {
  const out = [];
  String(text || "").split(/\n+/).forEach(par => {
    par.replace(/\s+/g, " ").trim().split(/(?<=[.!?…]["”’)]*)\s+(?=["“‘(]?[A-Z0-9])/).forEach(s => { if (/[A-Za-z0-9]/.test(s)) out.push(s.trim()); });
  });
  return out;
}
/* 첨삭 칸이 바뀌면 [최종본]을 다시 뽑아 final에 저장. [최종본]이 새로 바뀌었으면 예전에 직접 다듬은 글(listen)은 새 최종본으로 대체 */
function syncFinal(it) {
  const f = extractFinal(it.fix);
  if (f === (it.final || "")) return;
  if (f) it.final = f; else delete it.final;
  if (f) delete it.listen;
}

function backupText() {
  const out = [];
  Object.keys(diary.entries).sort().reverse().forEach(k => {
    const list = diary.entries[k].items.filter(hasContent);
    list.forEach((it, n) => {
      const q = it.q || {};
      out.push("[" + k + (list.length > 1 ? " · 글 " + (n + 1) : "") + "]\nQ: " + (q.en || "") + (q.ko ? "\n(" + q.ko + ")" : "") +
        "\n\n내 글:\n" + it.text.trim() + "\n\n첨삭:\n" + it.fix.trim() +
        (it.listen && it.listen.trim() ? "\n\n듣기용 본문(직접 다듬음):\n" + it.listen.trim() : "") + (it.fav ? "\n★ 즐겨찾기" : ""));
    });
  });
  /* 표현 학습 기록·복습 일정·연습장도 함께 */
  const ids = Object.keys(study.items).sort();
  if (ids.length) {
    out.push("========== 표현 학습 기록 ==========");
    ids.forEach(id => {
      const s = study.items[id];
      const it = EXPR_BY_ID[id];
      const st = s.status === "stopped" ? "중단" : s.status === "mastered" ? "익힘" : "학습 중";
      /* 연습장: 날짜별 문장 카드(KO/ME/EN/TIP — [정리] 형식 그대로라 다시 붙여넣을 수도 있음) + 메모 */
      const ses = s.sessions || {};
      const notes = Object.keys(ses).sort().map(d => {
        const g = ses[d] || {}, cards = g.cards || [], memos = (g.memos || []).filter(m => String(m.text || "").trim());
        if (!cards.length && !memos.length) return "";
        return "· " + d +
          (cards.length ? "\n" + cards.map(c => "KO: " + c.ko + (c.me ? "\nME: " + c.me : "") + "\nEN: " + c.en + (c.tip ? "\nTIP: " + c.tip : "")).join("\n---\n") : "") +
          (memos.length ? "\n[메모]\n" + memos.map(m => String(m.text).trim()).join("\n\n") : "");
      }).filter(Boolean).join("\n\n");
      out.push("[" + id + "] " + (it ? it.ex.phrase + " (" + shortMeaning(it.ex) + ")" : "") +
        "\n상태: " + st + " · 시작: " + (s.startedOn || "-") + " · 단계: " + (s.step || 0) + "/" + INTERVALS.length +
        (s.due ? " · 다음 복습: " + s.due : "") + (s.masteredOn ? " · 익힘: " + s.masteredOn : "") +
        (notes ? "\n\n연습장:\n" + notes : ""));
    });
  }
  /* 내 대화문([대화문] 형식 그대로라 다시 붙여넣을 수도 있음) */
  if (talks.items.length) {
    out.push("========== 내 대화문 ==========");
    talks.items.forEach(t => out.push("[" + t.date + "] " + t.title + (t.fav ? " ★" : "") + "\n[대화문]\nTITLE: " + t.title + "\n" + talkText(t) +
      (t.raw ? "\n\n붙여넣은 원문:\n" + t.raw : "")));
  }
  return out.join("\n\n----------\n\n");
}

/* [클립보드에서 붙여넣기](글쓰기 첨삭 칸 · 연습장 정리하기 칸 공통, data-paste="칸 id"): 클립보드 글을 바로 넣음.
   칸이 비어 있으면 그대로, 글이 있으면 커서 자리(커서가 없으면 끝에 줄을 바꿔)에 넣음. input 이벤트를 보내서 자동 저장·미리보기가 그대로 돎.
   권한 거부·지원 안 함(readText 없음·https 아님)이면 "길게 눌러 붙여넣어 주세요"만(기존 방식) */
async function pasteInto(ta) {
  let text = null;
  try {
    if (navigator.clipboard && navigator.clipboard.readText && window.isSecureContext) text = await navigator.clipboard.readText();
  } catch (e) { text = null; }
  if (text == null) { toast("길게 눌러 붙여넣어 주세요"); ta.focus(); return false; }
  if (!text.trim()) { toast("클립보드가 비어 있어요"); return false; }
  const cur = ta.value;
  if (!cur.trim()) ta.value = text;
  else if (document.activeElement === ta) ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end");
  else ta.value = cur.replace(/\s*$/, "") + "\n\n" + text;
  ta.dispatchEvent(new Event("input", { bubbles: true }));
  buzz();
  toast("붙여넣었어요");
  return true;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-paste]");
  if (!b) return;
  const ta = document.getElementById(b.dataset.paste);
  if (ta) pasteInto(ta);
});

W.copy.addEventListener("click", async () => {

  const prompt = "내 영어 일기를 첨삭해줘. 내가 하려던 뜻은 살리고, 미국 원어민이 실제로 쓰는 자연스러운 영어로 고쳐줘. 주요 수정 이유는 한국어로 짧게 설명해줘.\n" +
    "Question: " + q.en + "\n" +

  const ok = await copyText(prompt);

/* ---- 듣기용 본문 상자(.lb): 글쓰기 오늘 글 아래 · 지난 기록 · 듣기용 목록 공통 ----
   문장마다 인터랙티브 스크립트(노래방식 채우기·단어 탭 = 그 자리부터)로 그리고, 상자마다 재생기 하나(el._rd).
   소리: 표현 탭과 같은 키·모델(v4), 목소리는 글쓰기용(voiceWrite)·속도 writeRate. 문장마다 따로 캐시 → 드라이브 '내 일기'와 같은 음성을 씀.
   [듣기용 본문 수정] → 글 상자에서 직접 다듬기([원래대로] = 직접 다듬은 글을 지우고 [최종본]·첨삭에서 다시) */
let lbEdit = null;                        // 수정 중인 상자 "날짜:번호"
function diaryItemAt(key) {
  const p = String(key).split(":"), e = diary.entries[p[0]];
  return e && e.items[+p[1]] || null;
}
function lbHtml(key, o) {                 // o = { play: 상자 안 [듣기] 버튼, label: 위 이름표 }
  const it = diaryItemAt(key);
  if (!it) return "";

      '<textarea class="w-area lb-in" rows="5" lang="en" placeholder="듣기용으로 읽을 영어 글">' + esc(body) + '</textarea>' +
      '<div class="lb-act"><button type="button" data-lb-act="cancel">취소</button>' +
        (it.listen ? '<button type="button" data-lb-act="reset">원래대로</button>' : "") +
        '<button type="button" class="pri" data-lb-act="save">저장</button></div></div>';
  }
  if (!body) return "";
  return '<div class="lb" data-lb="' + esc(key) + '">' +
    '<div class="lb-head">' + (o.label ? '<span class="lb-label">듣기용 본문</span>' : "") + '<span class="lb-src">' + esc(listenSource(it)) + '</span>' +
      (o.play ? '<button class="pill lb-play" type="button" data-lb-act="play"><span class="when-off">' + ICON_SPEAKER + '</span><span class="when-on">' + ICON_STOP + '</span>' +
        '<span class="when-off">듣기</span><span class="when-on">정지</span></button>' : "") +
      '<button class="lb-edit" type="button" data-lb-act="edit">듣기용 본문 수정</button></div>' +
    '<div class="lb-body" lang="en">' + splitSentences(body).map(s => '<p class="lb-s">' + scriptHtml(s) + '</p>').join("") + '</div></div>';
}
function lbReader(el, btn) {
  if (el._rd) return el._rd;
  el._rd = createReader({
    items: () => Array.from(el.querySelectorAll(".lb-s .sc")).map(sc => ({ el: sc, who: "me", voice: settings.voiceWrite, engine: "eleven" })),
    rate: () => settings.writeRate,
    gap: 350,
    tapSingle: false,
    onChange: () => { const s = el._rd.state(); if (btn) btn.classList.toggle("playing", s.active); el.classList.toggle("lb-on", s.active); },
    onEnd: () => { if (btn) btn.classList.remove("playing"); el.classList.remove("lb-on"); }
  });
  return el._rd;
}
function lbToggle(el, btn) {
  if (!el) return;
  const rd = lbReader(el, btn), s = rd.state();
  if (s.active) { Player.stop(); return; }
  buzz();

/* ---- 듣기용 목록: 첨삭 받은(듣기용 본문이 있는) 일기를 날짜별로(최신이 위). 범위 최근 7일 / 30일 / 전체 / 즐겨찾기
   항목 = 날짜 · 질문 · 첫 문장 일부 + ★. 누르면 그 일기만 바로 재생(펼쳐서 노래방식), 다시 누르면 멈추고 접힘.
   [이어서 듣기] → 드라이브 모드 '내 일기' 범위로 재생 화면(같은 범위의 위치가 저장돼 있으면 거기서부터) */
const AUDIO_RANGES = [["7", "최근 7일"], ["30", "최근 30일"], ["all", "전체"], ["fav", "즐겨찾기"]];
function diaryRangeOf(r) { return AUDIO_RANGES.some(x => x[0] === r) ? r : "30"; }
function diaryListenItems(range) {

  Object.keys(diary.entries).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort().reverse().forEach(k => {
    if (dayNumber(k) < from) return;
    const list = diary.entries[k].items;
    list.forEach((it, i) => {
      if (range === "fav" && !it.fav) return;
      const body = listenBody(it);

/* ---- 내 대화문(2026-10-06): GPT와 영어로 음성 대화 → 첨삭받은 1~2분 대화문을 붙여넣어 저장.
   드라이브 탭 범위 '내 대화문'으로 듣고 따라 말하기(내 말 = 내 목소리, AI 말 = 상대 목소리). 개인 콘텐츠라 미리 만든 음성은 없음 — 키로 줄마다 만들어 캐시.
   [대화문] 형식: TITLE:(선택) / ME: 내 말(고친 영어) / AI: 상대 말 / KO: 바로 앞 줄의 한국어 해석(없어도 됨). 읽기는 너그럽게(parseTalk).
   못 읽은 줄이 있으면 붙여넣은 원문(raw)도 같이 저장 — 내용이 사라지지 않게(연습장 메모와 같은 규칙) */
const TALK_KEY = "engcards.talks.v1";
const talks = (() => {
  try {
    const t = JSON.parse(localStorage.getItem(TALK_KEY) || "null");
    if (t && typeof t === "object" && Array.isArray(t.items)) return {
      items: t.items.filter(x => x && typeof x === "object" && Array.isArray(x.lines) && x.lines.length),
      draft: typeof t.draft === "string" ? t.draft : ""
    };
  } catch (e) {}
  return { items: [], draft: "" };
})();
function saveTalks() {
  try { localStorage.setItem(TALK_KEY, JSON.stringify(talks)); return true; } catch (e) { return false; }
}
/* 이름표: 내 말 / AI 말 / 한국어 / 제목 (대소문자 무시) */
function talkLabel(s) {
  const k = String(s).trim().toLowerCase().replace(/\s+/g, " ");
  if (/^(me|user|나|내 말|사용자)$/.test(k)) return "me";
  if (/^(ai|gpt|chatgpt|chat gpt|assistant|상대|상대방)$/.test(k)) return "ai";
  if (/^(ko|kr|한국어|해석|번역|뜻)$/.test(k)) return "ko";
  if (/^(title|제목|주제)$/.test(k)) return "title";
  return null;
}
function parseTalk(raw) {
  const lines = [];
  let cur = null, title = "", lost = 0, bad = 0;
  const push = () => {
    if (cur) {
      const en = cur.en.trim(), ko = cur.ko.trim();
      if (en && /[A-Za-z]/.test(en) && !HANGUL_RE.test(en)) lines.push({ who: cur.who, en, ko });
      else bad++;
    }
    cur = null;
  };
  const addEn = s => {                                                          // "ME: Hello (안녕)" → 끝의 괄호 속 한국어는 해석으로
    const g = s.match(/^(.*?)\s*[(（]([^()（）]*[가-힣][^()（）]*)[)）]\s*$/);
    if (g) { cur.en = (cur.en + " " + g[1]).trim(); cur.ko = (cur.ko + " " + g[2]).trim(); }
    else cur.en = (cur.en + " " + s).trim();
  };
  const koOnly = s => HANGUL_RE.test(s) && !/[A-Za-z]{2,}/.test(s.replace(/[(（][^)）]*[)）]/g, ""));
  String(raw || "").replace(/\r/g, "").split("\n").forEach(src => {
    let line = src.replace(/```[\w-]*/g, "").trim();
    if (!line || /^[-—–_=*·•─━]{3,}$/.test(line)) return;                      // 빈 줄·구분선
    line = line.replace(/\*\*|__/g, "").replace(/：/g, ":").trim();
    if (/^\[?\s*대화문\s*\]?$/.test(line) || /^#{1,6}\s/.test(line)) return;    // [대화문] 머리·마크다운 제목
    line = line.replace(/^(?:\d+\s*[.)]\s*|[-*•·]\s+|>\s*)+/, "").trim();
    const m = line.match(/^([A-Za-z가-힣][A-Za-z가-힣 ]{0,11}?)\s*:\s*(.*)$/);
    const k = m && talkLabel(m[1]);
    if (k === "title") { if (!title) title = m[2].trim().replace(/^["“'(（]+|["”')）]+$/g, ""); return; }
    if (k === "ko") { if (cur) cur.ko = (cur.ko + " " + m[2].trim()).trim(); else lost++; return; }
    if (k) { push(); cur = { who: k, en: "", ko: "" }; addEn(m[2].trim()); return; }
    if (!cur) { lost++; return; }
    if (koOnly(line)) cur.ko = (cur.ko + " " + line.replace(/^[(（]\s*|\s*[)）]$/g, "")).trim();   // 이름표 없는 한국어 줄 = 해석
    else if (!cur.ko) addEn(line);                                              // 영어가 다음 줄로 이어짐
    else lost++;
  });
  push();
  return { lines, title, partial: bad > 0 || lost > 0 };
}

/* ---- 내 대화문 듣기(2단계): 펼친 대화문마다 재생기 하나(body._rd). 내 말 = 내 목소리, AI 말 = 상대 목소리, 엔진은 일기처럼 ElevenLabs(키가 없으면 폰 기본 음성),
   속도 = 글쓰기 속도(writeRate — 글쓰기 탭 [듣기] 옆 0.8x/1.0x와 같은 값). 줄마다 따로 캐시 → 드라이브 '내 대화문'도 같은 음성을 씀.
   [전체 듣기] = 처음부터 끝까지, 단어 탭 = 그 자리부터 끝까지, 줄의 단어 밖을 누르면 그 줄 처음부터 끝까지. 지금 줄은 테두리 + 화면이 따라감 */
function tkReader(body) {
  if (body._rd) return body._rd;
  const btn = body.querySelector("[data-tk-play]");
  const rows = () => Array.from(body.querySelectorAll(".tk-l"));
  const mark = i => rows().forEach((r, k) => r.classList.toggle("tk-cur", k === i));
  body._rd = createReader({
    items: () => rows().map(r => ({ el: r.querySelector(".sc"), who: r.classList.contains("me") ? "me" : "them", engine: "eleven" })),
    rate: () => settings.writeRate,
    gap: k => { const r = rows(), me = x => x.classList.contains("me"); return r[k + 1] && me(r[k + 1]) !== me(r[k]) ? 550 : 300; },   // 말하는 사람이 바뀌면 조금 더 쉼
    tapSingle: false,
    onItem: i => {
      mark(i);
      const r = rows()[i], v = W.view.getBoundingClientRect(), b = r && r.getBoundingClientRect();
      if (b && (b.top < v.top + 12 || b.bottom > v.bottom - 90)) W.view.scrollTo({ top: Math.max(0, W.view.scrollTop + b.top - v.top - v.height * 0.3), behavior: "smooth" });
    },
    onChange: () => { const s = body._rd.state(); btn.classList.toggle("playing", s.active); body.classList.toggle("tk-on", s.active); },
    onEnd: () => { btn.classList.remove("playing"); body.classList.remove("tk-on"); mark(-1); }
  });
  return body._rd;
}
const tkBusy = () => Array.from(TK.list.querySelectorAll("[data-tk-body]")).some(b => b._rd && b._rd.state().active);

function talkById(id) { return talks.items.find(t => t.id === id) || null; }
/* [드라이브로 이어서 듣기] 아래 작은 글: 드라이브에 '내 대화문 · 전체' 위치가 있으면 그 위치, 아니면 개수 */

});
