/* ================= 표현 탭: 모음 · 학습 · 연습장 · 복습 =================
   표현 목록은 카드 데이터에서 자동으로 모음(따로 복사해서 관리하지 않음).
   학습 기록은 표현 id 기준으로 저장 → 문구를 고쳐도 기록이 유지됨 */
const STUDY_KEY = "engcards.study.v1";
const DAILY_PICKS = 3;                       // 하루에 새로 고를 수 있는 표현 수
const INTERVALS = [1, 3, 7, 14, 30];         // 복습 간격(일). 30일 복습까지 통과하면 '익힘'

/* 오늘 = dateKey()(앱 시계 appNow — 테스트용 ?debugDate=2026-10-20 / 2026-10-20T23:59도 여기 반영). 하루는 자정 기준 */
function studyToday() { return dateKey(); }
function addDays(key, n) {
  const p = key.split("-").map(Number);
  return dateKey(new Date(p[0], p[1] - 1, p[2] + n));
}

function exprIdOf(card, ex, ei, kind) {
  return ex.id || ("c" + card.id + "-" + (kind === "extra" ? "x" : "e") + (ei + 1));
}
/* 짧은 한국어 뜻: meaning 필드 → 설명의 첫 '…' → 설명 첫 문장 */
function shortMeaning(ex) {
  if (ex.meaning) return ex.meaning;
  const m = /'([^']{1,40})'/.exec(ex.ko || "");
  if (m) return m[1];
  return String(ex.ko || "").split(/[.!?]/)[0].slice(0, 30);
}

/* 카드 데이터 → 표현 목록 (카테고리 순 → 카드 id 순 → 핵심 다음 추가 표현) */
const EXPR_LIST = [];
const EXPR_BY_ID = {};
(function buildExprList() {
  const catOrder = (window.CATEGORY_DATA || []).map(c => c.name);
  const rank = name => { const i = catOrder.indexOf(name); return i < 0 ? 999 : i; };
  CARDS.map((c, ci) => ci)
    .sort((a, b) => rank(CARDS[a].category) - rank(CARDS[b].category) || CARDS[a].id - CARDS[b].id)
    .forEach(ci => {
      const card = CARDS[ci];
      const add = (ex, ei, kind) => {
        const id = exprIdOf(card, ex, ei, kind);
        if (EXPR_BY_ID[id]) return;
        const item = { id, ex, ci, ei, kind, card };
        EXPR_LIST.push(item);
        EXPR_BY_ID[id] = item;
      };
      (card.expressions || []).forEach((ex, ei) => { if (EXPR_OWNER[normPhrase(ex.phrase)] === ci) add(ex, ei, "core"); });
      (card.extraExpressions || []).forEach((ex, ei) => add(ex, ei, "extra"));
    });
})();

/* 학습 기록: { items: { 표현id: { status, startedOn, step, due, history:[{date, ok}], sessions, draft } }, picks: { 날짜: [표현id] } }
   sessions = 연습장 날짜별 연습 묶음 { "YYYY-MM-DD": { cards: [문장 카드 { id, ko, me, en, tip, date, at, rv }], memos: [{ text, at }] } }, draft = 정리하기 칸에 쓰다 만 글.
   (2026-10-04 전에는 notes: { 날짜: 글 } — 앱을 열 때 그 날짜의 메모로 옮김, migrateNotes) */
const study = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(STUDY_KEY) || "null");
    if (s && typeof s === "object") return { items: s.items && typeof s.items === "object" ? s.items : {}, picks: s.picks && typeof s.picks === "object" ? s.picks : {} };
  } catch (e) {}
  return { items: {}, picks: {} };
})();
function saveStudy() {
  try { localStorage.setItem(STUDY_KEY, JSON.stringify(study)); return true; } catch (e) { return false; }
}
/* 연습장 날짜 묶음(없으면 만듦) */
function drillDay(s, d) {
  if (!s.sessions || typeof s.sessions !== "object") s.sessions = {};
  const g = s.sessions[d] = s.sessions[d] && typeof s.sessions[d] === "object" ? s.sessions[d] : {};
  if (!Array.isArray(g.cards)) g.cards = [];
  if (!Array.isArray(g.memos)) g.memos = [];
  return g;
}
/* 예전 정리하기 글(notes{ 날짜: 글 }) → 그 날짜의 메모로(지우지 않고 옮김) */
(function migrateNotes() {
  let changed = false;
  Object.keys(study.items).forEach(id => {
    const s = study.items[id];
    if (!s || !s.notes || typeof s.notes !== "object") return;
    Object.keys(s.notes).sort().forEach(d => {
      const text = String(s.notes[d] || "");
      if (text.trim()) drillDay(s, d).memos.push({ text, at: Date.parse(d + "T12:00:00") || Date.now() });
    });
    delete s.notes;
    changed = true;
  });
  if (changed) saveStudy();
})();
/* 화면용 상태: new(미학습·중단) / learning(학습 중) / mastered(익힘) */
function statusOf(id) {
  const s = study.items[id];
  if (!s || s.status === "stopped") return "new";
  return s.status === "mastered" ? "mastered" : "learning";
}
const STATUS_LABEL = { new: "미학습", learning: "학습 중", mastered: "익힘" };
/* 오늘 새로 고른 표현 수: 오늘 고른 것 중 지금도 학습 중(또는 익힘)인 것만. 오늘 골랐다가 중단한 건 세지 않음(그 자리를 다시 쓸 수 있게).
   중단을 고치기 전 기록(오늘 목록에 중단한 표현이 남아 있음)도 이렇게 세면 바로 풀림 */
function picksToday() {
  return (study.picks[studyToday()] || []).filter(id => study.items[id] && study.items[id].status !== "stopped").length;
}

function startLearning(id) {
  const t = studyToday();
  if (picksToday() >= DAILY_PICKS) return false;
  const s = study.items[id] || {};
  s.status = "learning";
  s.startedOn = t;
  s.step = 0;
  s.due = addDays(t, INTERVALS[0]);
  s.history = s.history || [];
  study.items[id] = s;
  const list = study.picks[t] = study.picks[t] || [];
  if (!list.includes(id)) { list.push(id); logDay(t, "n"); }
  saveStudy();
  return true;
}
function stopLearning(id) {
  const s = study.items[id];
  if (!s) return;
  s.status = "stopped";     // 연습장 기록(sessions)은 그대로 남김
  delete s.due;
  /* 오늘 고른 표현을 오늘 중단하면 오늘 목록에서 빼서 그 자리를 다시 비움. 어제 이전에 시작한 표현은 오늘 개수와 상관없으니 그대로 */
  const t = studyToday(), list = study.picks[t];
  if (list && list.includes(id)) { study.picks[t] = list.filter(x => x !== id); logDay(t, "n", -1); }
  saveStudy();
}
/* 오늘 복습할 표현: 날짜가 지난(밀린) 것까지 모두, 오래된 것부터 */
function dueList() {
  const t = studyToday();
  return Object.keys(study.items)
    .filter(id => EXPR_BY_ID[id] && study.items[id].status === "learning" && study.items[id].due && study.items[id].due <= t)
    .sort((a, b) => study.items[a].due.localeCompare(study.items[b].due) || a.localeCompare(b));
}
/* 복습 평가(다음 복습 날짜)는 복습 덱의 gradeRate — 표현 카드들을 처음 봤을 때의 '알았음' 비율로 (2026-10-06, 예전 grade(기억남/헷갈림)를 바꿈) */
function dueText(id) {
  const s = study.items[id];
  if (!s || !s.due) return "";
  const d = dayNumber(s.due) - dayNumber(studyToday());
  if (d < 0) return (-d) + "일 밀림";
  if (d === 0) return "오늘 복습";
  return koDate(s.due) + " 복습 (" + d + "일 뒤)";
}
/* 탭 배지: 표현 = 오늘 복습할 표현 수, 글쓰기 = 오늘 아직 안 썼으면 점 */
function wroteToday() {
  const e = diary.entries[dateKey()];
  return !!(e && e.items.some(hasContent));
}
function updateBadges() {
  const n = dueList().length;
  const b = document.getElementById("exprBadge");
  b.hidden = n === 0;

}

/* 표현이 나온 대사(복습 힌트·상세에서 씀) */
function sourceLine(item) {
  const d = item.card.dialogue || [];
  return d.find(x => exprFound(item.ex, x.en || "")) || null;
}

/* ---- 표현 탭 화면 ---- */
const X = {
  view: document.getElementById("viewExpr"),
  date: document.getElementById("xDate"),
  rv: document.getElementById("rvCard"),
  search: document.getElementById("xSearch"),
  filter: document.getElementById("xFilter"),

let xFilter = "all";

function statusPill(st) {
  return '<span class="st st-' + st + '">' + (st === "mastered" ? ICON_CHECK : "") + STATUS_LABEL[st] + '</span>';
}

function renderReviewCard() {
  const due = dueList();
  const picked = picksToday();
  const head = '<div class="rv-head"><span class="rv-title">오늘의 복습</span>' +
    '<span class="rv-picks">오늘 새로 고른 표현 <b>' + picked + '</b> / ' + DAILY_PICKS + '</span></div>';
  /* 자유 복습(복습 날짜와 상관없이 언제든): 오늘 복습할 차례가 없으면 큰 버튼, 있으면 아래 작은 버튼 */
  const learned = EXPR_LIST.filter(it => statusOf(it.id) !== "new").length;
  const freeBtn = main => '<button class="btn ' + (main ? "rv-start" : "rv-free") + '" type="button" data-review-free>자유 복습 · 지금 연습하기</button>' +
    '<p class="rv-free-note">' + (learned > FREE_N ? freeRoundText(false).replace(/<\/?b>/g, "") + " · 오래전에 본 표현부터" :

/* ---- 궁금증 카드 자동 넘김(표현 탭) ----
   가만히 두면 설정 › 자동 넘김의 시간(5/10/20초, 기본 10초)마다 다음 3개로([다른 3개]는 그대로). 설정에서 끄면 막대·버튼·라벨 모두 없음.
   카드 아래 줄: [일시정지 / 다시 넘기기 버튼] + 막대(남은 시간) + 라벨("8초 후 다른 3개" / "일시정지됨" / "정답을 보는 동안 멈춤") — WCAG 2.2.2(멈추기·끄기·시간 조절).
   수동으로 넘기면 막대도 처음부터. 멈춤: 일시정지 버튼 · 카드를 누르고 있는 동안 · o.held()(정답 펼침) · o.ok()가 false(그 탭이 아님, 시트·드라이브·연습·설정이 덮음)
   · 앱이 백그라운드 · 카드가 화면 밖(스크롤해서 안 보임). 풀리면 남은 시간부터 이어서.
   넘어갈 때 o.parts()(카드 등)가 살짝 위로 사라졌다(qa-out) 새 질문이 아래에서 떠오름(qa-in).
   시간은 200ms마다 셈(막대는 CSS transition으로 부드럽게), 한 번에 더하는 시간은 최대 400ms(백그라운드에서 돌아온 직후 건너뛰지 않게).
   (2026-10-05 홈 질문 카드가 없어져서 지금은 표현 탭 하나만 씀) */
const ROTATE_TICK = 200;
const rotateMs = () => (settings.rotateSec || 10) * 1000;
function makeRotator(o) {      // o = { view, parts, ok, held: () => 정답을 보는 중인지, next, what: "다른 3개" }
  const r = { t: 0, press: false, busy: false, user: false, last: performance.now() };
  r.frac = () => Math.min(1, r.t / rotateMs());
  r.label = () => r.user ? "일시정지됨 · ▶를 누르면 다시 넘어가요" : o.held() ? "정답을 보는 동안 멈춤" :
    Math.max(1, Math.ceil((rotateMs() - r.t) / 1000)) + "초 후 " + o.what;
  function paint(snap) {
    const b = o.view.querySelector("[data-qa-bar]");
    if (!b) return;
    if (snap) { b.style.transition = "none"; b.style.transform = "scaleX(0)"; void b.offsetWidth; b.style.transition = ""; }
    b.style.transform = "scaleX(" + r.frac() + ")";
    const l = o.view.querySelector("[data-qa-label]");
    if (l) { const s = r.label(); if (l.textContent !== s) l.textContent = s; }
  }
  r.paint = paint;
  function visible() {
    const el = o.parts()[0];
    if (!el) return false;
    const a = el.getBoundingClientRect(), v = o.view.getBoundingClientRect();
    return a.height > 0 && a.bottom > v.top + 24 && a.top < v.bottom - 24;
  }
  r.running = () => settings.rotate && !r.user && !r.press && !r.busy && document.visibilityState === "visible" && o.ok() && !o.held() && visible();
  r.toggleUser = () => {                            // 일시정지 버튼 ↔ 다시 넘기기
    r.user = !r.user;
    const b = o.view.querySelector("[data-qa-pause]");
    if (b) { b.innerHTML = r.user ? ICON_PLAY : ICON_PAUSE; b.setAttribute("aria-label", r.user ? "자동 넘김 다시 켜기" : "자동 넘김 일시정지"); b.setAttribute("aria-pressed", String(r.user)); }
    paint();
  };
  r.swap = () => {                                  // 다음 질문으로(자동·수동 공통) — 막대는 처음부터
    if (r.busy) return;
    r.busy = true; r.t = 0;
    o.parts().forEach(el => el.classList.add("qa-out"));
    setTimeout(() => {
      o.next();
      const now = o.parts();
      now.forEach(el => el.classList.add("qa-in"));
      setTimeout(() => now.forEach(el => el.classList.remove("qa-in")), 400);
      r.busy = false; r.last = performance.now();
      paint(true);
    }, 180);
  };
  setInterval(() => {
    const now = performance.now(), dt = Math.min(400, now - r.last);
    r.last = now;
    if (!r.running()) { paint(); return; }
    r.t += dt;
    if (r.t >= rotateMs()) r.swap(); else paint();
  }, ROTATE_TICK);
  o.view.addEventListener("pointerdown", e => { if (e.target.closest("[data-qa-card]")) r.press = true; });
  ["pointerup", "pointercancel"].forEach(n => document.addEventListener(n, () => { r.press = false; }, true));
  return r;
}
/* 카드 아래 자동 넘김 줄(설정에서 끄면 없음) */
const qaBar = r => !settings.rotate ? "" :
  '<div class="qa-row"><button class="qa-pause" type="button" data-qa-pause aria-pressed="' + r.user + '" aria-label="' + (r.user ? "자동 넘김 다시 켜기" : "자동 넘김 일시정지") + '">' + (r.user ? ICON_PLAY : ICON_PAUSE) + '</button>' +
  '<div class="qa-main"><div class="qa-track" aria-hidden="true"><i data-qa-bar style="transform:scaleX(' + r.frac() + ')"></i></div>' +
  '<span class="qa-label" data-qa-label>' + esc(r.label()) + '</span></div></div>';

/* ---- 궁금증 카드 3개: 핵심 표현의 teaser("~할 때, 뭐라고 하지?") — 누르면 뒤집혀 정답 표현·짧은 뜻·[자세히 보기] ----
   고르기(pickTeasers): 앱을 켤 때 한 번 · [다른 3개]마다(표현 탭을 다시 그려도 그대로). 미학습 표현 먼저(모자라면 학습 중·익힘), 그중 무작위.
   최근에 나온 9개(3번 분량)는 빼고. 기록 engcards.teaser.v1 { recent: [표현id, …] } */
const TEASER_KEY = "engcards.teaser.v1";
const teaserState = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(TEASER_KEY) || "null");
    if (s && Array.isArray(s.recent)) return { recent: s.recent.filter(x => typeof x === "string").slice(-9) };
  } catch (e) {}
  return { recent: [] };
})();
let teaserPick = null;                  // 지금 보여 주는 3개 [표현id]
const teaserOpen = new Set();           // 뒤집어 본 카드
function pickTeasers() {
  const all = EXPR_LIST.filter(it => it.kind === "core" && it.ex.teaser);
  const block = new Set(teaserState.recent.slice(-Math.max(0, Math.min(9, all.length - 3))));
  const pool = all.filter(it => !block.has(it.id));
  const shuffle = list => { const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rank = it => ({ new: 0, learning: 1, mastered: 2 })[statusOf(it.id)];
  const pick = shuffle(pool).sort((a, b) => rank(a) - rank(b)).slice(0, 3).map(it => it.id);
  teaserState.recent = teaserState.recent.filter(id => !pick.includes(id)).concat(pick).slice(-9);
  try { localStorage.setItem(TEASER_KEY, JSON.stringify(teaserState)); } catch (e) {}
  teaserOpen.clear();
  return pick;
}
function renderTeasers() {
  if (!teaserPick) teaserPick = pickTeasers();
  const items = teaserPick.map(id => EXPR_BY_ID[id]).filter(Boolean);
  if (!items.length) { X.teasers.innerHTML = ""; return; }
  X.teasers.innerHTML = '<div class="xt-head"><h3 class="xt-title">이 말, 영어로 뭐라고 할까?</h3>' +
      '<button class="xt-more" type="button" data-xt-more>다른 3개</button></div>' +
    '<div class="xt-list">' + items.map(it => {
      const open = teaserOpen.has(it.id);
      return '<div class="xt-card' + (open ? " open" : "") + '" role="button" tabindex="0" aria-expanded="' + open + '" data-xt="' + esc(it.id) + '" data-qa-card style="--h:' + hueOf(it.card.category) + '">' +
        '<span class="xt-q">' + esc(it.ex.teaser) + '</span>' +
        '<span class="xt-tap">눌러서 정답 보기</span>' +
        '<span class="xt-a"><span class="xt-phrase" lang="en">' + esc(it.ex.phrase) + '</span>' +
          '<span class="xt-mean">' + esc(shortMeaning(it.ex)) + '</span>' +
          '<button class="xt-detail" type="button" data-xt-detail tabindex="' + (open ? 0 : -1) + '">예문·썰 자세히 보기' + ICON_ARROW + '</button></span>' +
      '</div>';
    }).join("") + '</div>' + qaBar(teaserRot);
}
/* 카드를 누르면 정답 펼치기 ↔ 접기. 표현 상세는 펼친 카드의 [자세히 보기] 버튼으로만 */
function toggleTeaser(c) {
  const id = c.dataset.xt, open = !teaserOpen.has(id);
  if (open) teaserOpen.add(id); else teaserOpen.delete(id);
  c.classList.toggle("open", open);
  c.setAttribute("aria-expanded", String(open));
  const d = c.querySelector("[data-xt-detail]");
  if (d) d.tabIndex = open ? 0 : -1;
}
X.teasers.addEventListener("click", e => {
  if (e.target.closest("[data-xt-more]")) { buzz(); teaserRot.swap(); return; }
  if (e.target.closest("[data-qa-pause]")) { buzz(); teaserRot.toggleUser(); return; }
  const d = e.target.closest("[data-xt-detail]");
  if (d) { buzz(); openExprDetail(d.closest("[data-xt]").dataset.xt, {}); return; }
  const c = e.target.closest("[data-xt]");
  if (c) { buzz(); toggleTeaser(c); }
});
X.teasers.addEventListener("keydown", e => {
  const c = e.target.closest("[data-xt]");
  if (c && e.target === c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleTeaser(c); }
});
const teaserRot = makeRotator({
  view: X.view,
  parts: () => Array.from(X.teasers.querySelectorAll(".xt-list")),
  ok: () => currentTab === "expr" && !sheetOpen && !D.open && !PC.open && !stOpen && !RV.open,
  held: () => teaserOpen.size > 0,
  what: "다른 3개",
  next: () => { teaserPick = pickTeasers(); renderTeasers(); }
});
X.rv.addEventListener("click", e => {
  const one = e.target.closest("[data-review]");
  if (e.target.closest("[data-review-free]")) { buzz(); startFreeReview(); return; }
  if (one || e.target.closest("[data-review-start]")) { buzz(); startReview(); }   // 목록의 표현을 눌러도 같은 덱(오늘 복습할 표현 전부를 섞음)
});

/* ---- 표현 상세 (상황 카드 시트·표현 탭 공통) ---- */
let detailId = null;
let detailOpts = {};

/* 연습장 'AI 연습 프롬프트 복사'(2026-10-04 문구). 중괄호 자리는 그 표현의 데이터 — 핵심·추가 표현 같은 형식.
   대사 = 표현이 들어간 그 카드의 첫 대사(sourceLine), 표현 설명 = ex.ko */
function practicePrompt(it) {
  const line = sourceLine(it) || { en: "", ko: "" };
  return '영어 표현 "' + it.ex.phrase + '"(' + shortMeaning(it.ex) + ')으로 말하기 연습을 하고 싶어.\n' +
    '- 이 표현이 나온 상황: ' + it.card.title + ' — ' + it.card.situation + '\n' +
    '- 실제 대사: "' + line.en + '" (' + line.ko + ')\n' +
    '- 표현 설명: ' + it.ex.ko + '\n\n' +
    '1) 롤플레이 3개: 상대방(직원, 친구, 동료 등)이 나에게 실제로 할 법한 말이나 상황을 주고, 내가 이 표현을 써서 자연스럽게 대답하거나 말을 꺼내게 해줘. 각각 누가 하는 말인지, 한국어 뜻도 같이 적어줘. 이 표현이 억지로 들어가는 상황은 빼줘.\n' +
    '2) 영작 10개: 전부 내가 누군가에게 직접 하는 말(대화체)로만. "~했다", "~하셨어" 같은 일기·서술체는 넣지 마. 각 문장 앞에 (직원에게), (친구에게)처럼 누구에게 하는 말인지 붙여줘. 이 표현이 자연스럽게 들어가는 상황으로, 일상·여행·직장·친구 등 다양하게, 짧은 것부터 조금 긴 순서로. 영어로 말했을 때 15단어를 넘지 않게.\n' +
    '정답은 내가 답을 보낸 다음에 보여줘.\n\n' +

    '첨삭이 모두 끝나면 마지막에 롤플레이와 영작 전부를 아래 형식으로 한 번에 정리해줘. 다른 말은 붙이지 말고 이 형식만. 내가 복사하기 쉽게 [정리]부터 끝까지 전부 코드블록(```) 안에 넣어줘.\n' +

/* ---- 연습장 문장 카드: [정리] 블록 읽기 → 미리보기 → 저장 → 날짜별 카드(펼치면 고친 영어·내 답·팁) ----
   [정리] 형식: 카드마다 KO:(필수) ME: EN:(필수) TIP:, 카드 사이 ---. 읽기는 너그럽게(parseDrill):
   코드블록 ```·굵게 **·번호(1. 1))·글머리(- •)·앞뒤 공백·전각 콜론(：)·대소문자 무시, --- 없어도 KO가 나오면 새 카드, 이름표 없는 줄은 앞 칸에 이어 붙임.
   KO·EN이 없는 카드나 카드 밖에서 버려지는 줄이 있으면 partial → 붙여넣은 원문을 그 날짜 메모로 같이 저장(내용이 사라지지 않게) */
function parseDrill(raw) {
  const cards = [];
  let cur = null, field = null, lost = 0, bad = 0;
  const push = () => { if (cur) { if (cur.ko && cur.en) cards.push(cur); else bad++; } cur = null; field = null; };
  String(raw || "").replace(/\r/g, "").split("\n").forEach(src => {
    let line = src.replace(/```[\w-]*/g, "").trim();
    if (!line) return;
    if (/^[-—–_=*·•─━]{3,}$/.test(line)) { push(); return; }                    // 구분선
    line = line.replace(/\*\*|__/g, "").replace(/：/g, ":").trim();
    if (/^\[?\s*정리\s*\]/.test(line)) return;                                  // [정리] 머리
    if (/^#{1,6}\s/.test(line)) { field = null; return; }                       // 마크다운 제목
    line = line.replace(/^(?:\d+\s*[.)]\s*|[-*•·]\s+|>\s*)+/, "").trim();
    const m = line.match(/^(KO|ME|EN|TIP)\s*:\s*(.*)$/i);
    if (m) {
      const k = m[1].toLowerCase(), v = m[2].trim();
      if (k === "ko") { push(); cur = { ko: v, me: "", en: "", tip: "" }; }
      else if (!cur) { lost++; return; }
      else cur[k] = cur[k] ? cur[k] + " " + v : v;
      field = k;
    } else if (cur && field) cur[field] = (cur[field] + " " + line).trim();
    else lost++;
  });
  push();
  return { cards, partial: bad > 0 || lost > 0 };
}
/* 맞았는지: 대소문자·문장 부호·둥근 따옴표 차이는 무시. ME가 없으면 맞음/틀림 판단 안 함 */
const drillNorm = s => String(s || "").toLowerCase().replace(/[‘’`]/g, "'").replace(/[^a-z0-9']+/g, " ").trim();
const drillHasMe = c => !!(c.me && c.me.trim());
const drillWrong = c => drillHasMe(c) && drillNorm(c.me) !== drillNorm(c.en);
function drillCards(id) {

}

/* 내 답에서 고친 문장과 다른 단어 표시(단어 단위 LCS — 같은 단어는 흐리게 그대로, 다른 단어는 <mark>) */
function drillDiffHtml(me, en) {
  const a = String(me).split(/\s+/).filter(Boolean), an = a.map(drillNorm);
  const b = String(en).split(/\s+/).filter(Boolean).map(drillNorm).filter(Boolean);
  const m = a.length, n = b.length, L = [];
  for (let i = 0; i <= m; i++) L.push(new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--)
    L[i][j] = an[i] && an[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const keep = new Set();
  for (let i = 0, j = 0; i < m && j < n;) {
    if (an[i] && an[i] === b[j]) { keep.add(i); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  return a.map((w, k) => keep.has(k) || !an[k] ? esc(w) : '<mark class="dc-x">' + esc(w) + '</mark>').join(" ");
}

  if (t.closest("[data-dp-save]")) {

  if (t.closest("[data-dp-clear]")) {

  if ((el = t.closest("[data-dc-toggle]"))) {
    const dc = el.closest("[data-dc]"), cid = dc.dataset.dc, open = !dcOpen.has(cid);
    if (open) dcOpen.add(cid); else dcOpen.delete(cid);

  if (t.closest("[data-dc-add]")) { buzz(); dcEdit = "new"; dcDel = null; rerenderDrill(); focusDrillForm(); return true; }
  if (t.closest("[data-dc-edit]")) { buzz(); dcEdit = t.closest("[data-dc]").dataset.dc; dcDel = null; rerenderDrill(); focusDrillForm(); return true; }
  if (t.closest("[data-dc-cancel]")) { dcEdit = null; rerenderDrill(); return true; }
  if (t.closest("[data-dc-save]")) {

    form.querySelectorAll("[data-f]").forEach(x => { v[x.dataset.f] = x.value.replace(/\s+/g, " ").trim(); });
    if (!v.ko || !v.en) { toast("KO(한국어)와 EN(고친 영어)은 꼭 써 주세요"); return true; }
    const s = study.items[id];
    if (!s) return true;
    if (form.dataset.dc === "new") {

      drillDay(s, tday).cards.push({ id: drillNewId(), ko: v.ko, me: v.me, en: v.en, tip: v.tip, date: tday, at: Date.now(), rv: 0 });
    } else {
      const f = findDrill(id, form.dataset.dc);
      if (f) Object.assign(f.c, { ko: v.ko, me: v.me, en: v.en, tip: v.tip });
    }

  }
  if ((el = t.closest("[data-dc-del]"))) {

    const f = findDrill(id, cid);

/* ================= 복습 덱(플래시카드 — 2026-10-06, 예전 시트 '떠올리기 → 내가 연습한 문장 → 기억남/헷갈림'을 바꿈) =================
   오늘 복습할 표현들의 카드를 한 덱으로 섞어서 진행(표현별로 따로 하지 않음, 같은 표현 카드가 연달아 나오지 않게 벌려 둠). 표현 하나당 6장 정도(deckCards):
     ① 표현 카드 1장 — 앞 = 짧은 뜻 + 상황(카드 제목·상황 설명), 뒤 = 표현 + 그 표현이 나온 대사(노래방식) + 그 대사 한글
     ② 내 문장 카드 최대 3장 — 연습장 문장 카드(pickMine: 틀렸던 문장 먼저 → 오래전에 복습에 나온 것), 앞 = (누구에게) 한국어, 뒤 = 고친 영어(내 목소리) + 내 답 차이 + 팁
     ③ 예문 카드 — 6장이 될 때까지(최대 5장), 최근 복습에 안 나온 예문 먼저(study.items[id].exRv = { 예문 번호: 나온 시각 ms })
   카드: 앞면 탭(또는 [뒤집기]) → 뒷면(영어 + 작은 한글). 설정 › 복습 › 자동 재생이 켜져 있으면 뒤집을 때 읽음, 스피커로 다시, 단어 탭 = 그 단어부터.
   평가: 뒷면에서 오른쪽으로 밀기·[알았음] / 왼쪽으로 밀기·[다시]. '다시' 카드는 덱 끝에 다시 나옴(한 카드가 다시 나오는 건 최대 2번 — REP_MAX).
   [↶] = 바로 전 평가 되돌리기(여러 번 누르면 계속 앞으로). 그 평가로 표현 날짜가 정해졌으면 날짜도 그 전으로(snap).
   표현의 다음 복습 날짜(gradeRate): 그 표현 카드들을 '처음' 봤을 때(rep 0)의 '알았음' 비율 — 80% 이상 다음 간격 / 50~80% 같은 간격 한 번 더 / 50% 미만 처음(1일 뒤).
     그 표현의 처음 카드를 모두 평가한 순간 정함 → 중간에 나가도 끝낸 표현은 반영됨.
   진행 상황은 engcards.review.v1에 매번 저장, 같은 날 다시 들어오면 이어서(날짜가 바뀌면 새 덱 — 아직 안 끝낸 표현은 계속 복습할 차례).
   끝 화면: 본 카드·다시·표현 수, 다음 간격으로 / 같은 간격 한 번 더 / 처음부터 다시 표현 목록, 내일 복습 예정 수, [틀린 카드만 한 번 더](저장 안 하는 연습 판, 날짜에 영향 없음) */
const REVIEW_KEY = "engcards.review.v1";
const MINE_MAX = 3, DECK_PER = 6, REP_MAX = 2;
const ICON_UNDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>';
const rvEl = document.getElementById("review");
/* s = 지금 덱 { v, date, ids: [표현id], q: [카드], i: 지금 카드, log: [평가 { q, ok, add, snap }], res: { 표현id: 결과 }, n, fin, extra?, base? }
   카드 { n, x: 표현id, t: p(표현)|m(내 문장)|e(예문), ref(문장 카드 id / 예문 번호), ko, en, lko(표현 카드: 대사 한글), me, tip, who, rep(몇 번째 다시), ok(null|true|false) } */
const RV = { open: false, id: 0, s: null, flipped: false, busy: false, rd: null, echoLeft: 0, echoTok: 0, echoT: null, ka: null };   // echo* = 따라 말하기, ka = 이어폰·차 버튼용 조용한 소리

function rvLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(REVIEW_KEY) || "null");
    if (s && s.v === 1 && s.date === studyToday() && !s.fin && Array.isArray(s.q) && Array.isArray(s.log) && Array.isArray(s.ids) && s.res && typeof s.res === "object") return s;
  } catch (e) {}
  return null;
}
function rvSave() {
  const s = RV.s;
  if (!s || s.extra || s.free) return;   // '틀린 카드만 한 번 더'·자유 복습은 저장하지 않음
  try { localStorage.setItem(REVIEW_KEY, JSON.stringify(s)); } catch (e) {}
}
/* 이어서 할 덱이 있으면 { i, n } (오늘 탭·표현 탭 버튼 이름) */
function reviewProgress() {
  const s = rvLoad();
  return s && s.i < s.q.length && dueList().length ? { i: s.i, n: s.q.length } : null;
}
/* 표현 하나의 카드들(①②③). 고른 문장 카드·예문에 '복습에 나온 시각'을 남김(다음엔 오래된 것부터) */
function deckCards(id, now) {
  const it = EXPR_BY_ID[id], st = study.items[id];
  if (!it) return [];
  const line = sourceLine(it), out = [];
  out.push({ x: id, t: "p", ko: shortMeaning(it.ex), en: line ? line.en : sayPhrase(it.ex.phrase), lko: line ? line.ko || "" : "", line: !!line,
    who: line && line.who !== "me" ? "them" : "me" });
  pickMine(id, MINE_MAX).forEach(c => {
    c.rv = now;
    out.push({ x: id, t: "m", ref: c.id, ko: c.ko, en: c.en, me: c.me || "", tip: c.tip || "", who: "me" });
  });
  const exs = it.ex.examples || [], drs = drillsOf(id);
  /* ③ 채우기: 예문 5개 + 직접 말해 보기(drills) 10문장 중에서 가장 오래전에 나온 것부터(같으면 무작위 — 처음엔 예문·말해 보기가 섞여 나옴).
     나온 시각: 학습 기록이 있으면 study.items[id].exRv(예문)·drRv(말해 보기), 없으면(자유 복습의 안 배운 표현) freeLog.ex[id]·freeLog.dr[id] */
  const mapOf = (holder, key) => (holder[key] = holder[key] && typeof holder[key] === "object" ? holder[key] : {});
  const seenEx = st ? mapOf(st, "exRv") : mapOf(freeLog.ex, id), seenDr = st ? mapOf(st, "drRv") : mapOf(freeLog.dr, id);
  const pool = exs.map((e, k) => ({ t: "e", k, m: seenEx })).filter(p => exs[p.k] && exs[p.k].en)
    .concat(drs.map((d, k) => ({ t: "d", k, m: seenDr })));
  dvShuffled(pool).sort((a, b) => (a.m[a.k] || 0) - (b.m[b.k] || 0))
    .slice(0, Math.max(0, DECK_PER - out.length))
    .forEach(p => {
      p.m[p.k] = now;
      if (p.t === "e") out.push({ x: id, t: "e", ref: p.k, ko: exs[p.k].ko || "", en: exs[p.k].en, who: "them" });
      else out.push({ x: id, t: "d", ref: p.k, ko: drs[p.k].ko, en: drs[p.k].en, who: "me" });
    });
  return out;
}
/* 섞기: 바로 앞 카드와 다른 표현 중에서 남은 장수만큼의 확률로 고름(같은 표현 카드가 연달아 나오지 않게).
   한 표현이 남은 카드의 절반을 넘으면 그 표현을 먼저(끝에 같은 표현만 몰리지 않게) */
function deckShuffle(a) {
  const g = {};
  dvShuffled(a).forEach(c => { (g[c.x] = g[c.x] || []).push(c); });
  const q = [];
  let last = null;
  for (let left = a.length; left > 0; left--) {
    const keys = Object.keys(g).filter(x => g[x].length);
    const big = keys.find(x => x !== last && g[x].length * 2 >= left + 1);
    let pool = big ? [big] : keys.filter(x => x !== last);
    if (!pool.length) pool = keys;
    let r = Math.random() * pool.reduce((n, x) => n + g[x].length, 0), pick = pool[0];
    for (const x of pool) { r -= g[x].length; if (r < 0) { pick = x; break; } }
    q.push(g[pick].pop());
    last = pick;
  }
  return q;
}
function deckPush(s, cards) {
  deckShuffle(cards).forEach(c => { c.n = ++s.n; c.rep = 0; c.ok = null; s.q.push(c); });
}
function rvNew(ids) {
  const now = Date.now(), all = [];
  ids.forEach(id => deckCards(id, now).forEach(c => all.push(c)));
  saveStudy();
  const s = { v: 1, date: studyToday(), ids: ids.slice(), q: [], i: 0, log: [], res: {}, n: 0, fin: false };
  deckPush(s, all);
  return s;
}
/* 이어서 할 때: 그사이 학습을 멈춘 표현의 남은 카드는 빼고, 새로 복습할 차례가 된 표현은 덱 끝에 더함 */
function rvRefresh(s, due) {
  const live = x => !!(EXPR_BY_ID[x] && study.items[x] && study.items[x].status === "learning");
  s.q = s.q.filter((c, k) => k < s.i || live(c.x));
  const fresh = due.filter(x => !s.ids.includes(x));
  if (!fresh.length) return;
  const now = Date.now(), add = [];
  fresh.forEach(x => { s.ids.push(x); deckCards(x, now).forEach(c => add.push(c)); });
  saveStudy();
  deckPush(s, add);
}
/* 오늘 탭 '지금 할 일'·표현 탭 '오늘의 복습' → 덱(같은 날 하던 덱이 있으면 이어서) */
function startReview() {
  const due = dueList();
  let s = rvLoad();
  if (s) rvRefresh(s, due);
  if (!s || s.i >= s.q.length) {
    if (!due.length) { toast("오늘 복습할 표현이 없어요"); return; }
    s = rvNew(due);
  }
  RV.s = s;
  RV.flipped = false;
  rvSave();
  rvShow();
}

/* 표현의 다음 복습 날짜: 처음 본 카드들의 '알았음' 비율(rate 0~1) */
function gradeRate(id, rate) {
  const s = study.items[id];
  if (!s) return null;
  const t = studyToday(), step = s.step || 0;
  s.history = s.history || [];
  s.history.push({ date: t, ok: rate >= 0.8, step, rate: Math.round(rate * 100) / 100 });
  logDay(t, "r");
  let out;
  if (rate >= 0.8) {                                   // 다음 간격으로
    s.step = step + 1;
    if (s.step >= INTERVALS.length) { s.status = "mastered"; s.masteredOn = t; delete s.due; out = "mastered"; }
    else { s.due = addDays(t, INTERVALS[s.step]); out = "next"; }
  } else if (rate >= 0.5) {                            // 같은 간격 한 번 더(단계 그대로)
    s.due = addDays(t, INTERVALS[step]); out = "same";
  } else {                                             // 처음(1일 뒤)부터
    s.step = 0; s.due = addDays(t, INTERVALS[0]); out = "reset";
  }
  saveStudy();
  return { rate, out, due: s.due || null };
}

const rvCur = () => RV.s && RV.s.q[RV.s.i];

/* 틀린 카드('다시'를 한 번이라도 누른 카드, 같은 카드는 하나로) */
function rvWrong() {

  if (s.q[L.q]) s.q[L.q].ok = null;
  s.i = L.q;
  s.fin = false;
  RV.flipped = true;                                   // 평가하던 뒷면으로 돌아감
  rvSave();
  updateBadges();
  rvRender();
  toast("바로 전 평가를 되돌렸어요");
}
/* 틀린 카드만 한 번 더: 저장하지 않는 연습 판(복습 날짜에 영향 없음). 끝 화면에는 원래 복습 결과도 같이 */
function rvRetry() {
  const s = RV.s, wrong = rvWrong();
  if (!s || !wrong.length) return;
  const ns = { v: 1, extra: true, base: rvSummary(s), date: s.date, ids: s.ids, q: [], i: 0, log: [], res: {}, n: 0, fin: false };
  deckPush(ns, wrong.map(c => Object.assign({}, c)));
  RV.s = ns;
  RV.flipped = false;
  buzz();
  rvRender();
}

/* 밀기: 뒷면에서만. 가로로 10px 넘게 움직이면 끌기 시작(세로면 스크롤에 맡김), 놓을 때 카드 폭 25%(최소 80px) 넘으면 평가.
   손가락은 touch 이벤트로(2026-10-06 폰에서 안 됨 — 카드 안 .fc-face가 스크롤 영역이라 브라우저가 가로 움직임을 가져가 pointercancel → 제자리로 돌아감.
   CSS로 카드 안 전체를 touch-action: pan-y로 막고, touch 이벤트는 브라우저가 끼어들어도 끝까지 오므로 손가락은 이걸로). 마우스·펜은 pointer 이벤트.
   앞면에서 옆으로 밀면 "먼저 탭해서 뒤집기" 안내 */
let rvDrag = null, rvDragAt = 0;
function rvDragStart(target, x, y, id) {
  const card = target.closest && target.closest("#fcCard");
  if (!card || RV.busy || target.closest(".spk")) return;
  rvDrag = { x0: x, y0: y, dx: 0, on: false, id, card, front: !RV.flipped };
}
function rvDragMove(x, y, e) {
  const d = rvDrag;
  if (!d) return;
  const dx = x - d.x0, dy = y - d.y0;
  if (!d.on) {
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) { if (Math.abs(dy) > 14) rvDrag = null; return; }
    d.on = true;
    if (d.front) return;
    d.card.classList.remove("snap");
    d.card.classList.add("dragging");
  }
  if (e && e.cancelable) e.preventDefault();          // 가로로 끄는 중엔 화면이 따라 움직이지 않게
  d.dx = dx;
  if (d.front) return;
  d.card.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 22) + "deg)";
  const k = Math.min(1, Math.abs(dx) / 110);
  d.card.querySelector(".fc-stamp.yes").style.opacity = dx > 0 ? k : 0;
  d.card.querySelector(".fc-stamp.no").style.opacity = dx < 0 ? k : 0;
}
function rvDragEnd(commit) {
  const d = rvDrag;
  rvDrag = null;
  if (!d || !d.on) return;
  rvDragAt = performance.now();
  if (d.front) { if (commit && Math.abs(d.dx) > 60) toast("먼저 탭해서 뒤집은 뒤 옆으로 밀어 주세요"); return; }
  d.card.classList.remove("dragging");
  if (commit && Math.abs(d.dx) > Math.max(80, d.card.offsetWidth * 0.25)) { rvGrade(d.dx > 0); return; }
  d.card.classList.add("snap");
  d.card.style.transform = "";
  d.card.querySelectorAll(".fc-stamp").forEach(x => { x.style.opacity = ""; });
}
const rvTouch = (e, id) => Array.from(e.changedTouches).find(t => t.identifier === id);
rvEl.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { rvDragEnd(false); return; }
  const t = e.changedTouches[0];
  rvDragStart(e.target, t.clientX, t.clientY, "t" + t.identifier);
}, { passive: true });
rvEl.addEventListener("touchmove", e => {
  const t = rvDrag && rvTouch(e, +String(rvDrag.id).slice(1));
  if (t) rvDragMove(t.clientX, t.clientY, e);
}, { passive: false });
rvEl.addEventListener("touchend", e => { if (rvDrag && rvTouch(e, +String(rvDrag.id).slice(1))) rvDragEnd(true); });
rvEl.addEventListener("touchcancel", () => rvDragEnd(false));
rvEl.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch" || e.button > 0) return;
  rvDragStart(e.target, e.clientX, e.clientY, e.pointerId);
  if (rvDrag) try { rvDrag.card.setPointerCapture(e.pointerId); } catch (err) {}
});
rvEl.addEventListener("pointermove", e => { if (rvDrag && e.pointerId === rvDrag.id) rvDragMove(e.clientX, e.clientY, null); });
rvEl.addEventListener("pointerup", e => { if (rvDrag && e.pointerId === rvDrag.id) rvDragEnd(true); });
rvEl.addEventListener("pointercancel", e => { if (rvDrag && e.pointerId === rvDrag.id) rvDragEnd(false); });
rvEl.addEventListener("click", e => {
  if (performance.now() - rvDragAt < 350) return;      // 끌고 난 뒤의 클릭은 무시
  const t = e.target;
  let el;
  if ((el = t.closest("[data-rv]"))) {
    if (el.disabled) return;
    const a = el.dataset.rv;
    if (a === "close") { buzz(); closeReview(); }
    else if (a === "settings") { buzz(); openSettings("review"); }
    else if (a === "flip") rvFlip();
    else if (a === "yes" || a === "no") rvGrade(a === "yes");
    else if (a === "undo") rvUndo();
    else if (a === "say") { buzz(); rvSay(true); }
    else if (a === "retry") rvRetry();
    else if (a === "free") startFreeReview();
    return;
  }
  if (!t.closest("#fcCard")) return;
  if (!RV.flipped) { rvFlip(); return; }
  const w = t.closest(".fc-back .w");
  if (w) { const rd = rvReader(); if (rd) rd.seek(0, +w.dataset.w); }
});
/* 키보드: Space·Enter 뒤집기, → 알았음, ← 다시, Esc 닫기 */
document.addEventListener("keydown", e => {

/* ================= 오늘 탭(대시보드) — 2026-10-05 예전 '홈'(질문 카드 + 바로가기 4칸)을 바꿈 =================

   '지금 할 일' 고르는 순서(nowTask): 1 오늘 복습할 표현 → 복습 시작 / 2 오늘 새 표현 3개 미만 → 표현 탭 미학습 목록 /

     / 4 오늘 일기를 안 씀 → 일기 쓰기 / 5 다 함 → "오늘 목표를 모두 채웠어요" + 내일 복습 예정 수 + 보조 버튼 '상황 카드 더 보기'.
   저절로 바뀌지 않음(탭에 올 때·앱으로 돌아올 때·날짜가 바뀔 때만 다시 그림) */
try { localStorage.removeItem("engcards.home.v1"); } catch (e) {}   // 예전 홈 질문 카드 기록(최근 질문 10개)

let todayReady = false;   // 스크립트를 끝까지 읽은 뒤(드라이브 상태 D 등)부터 그림 — 맨 아래에서 켬

/* 예전 기록에서 날짜별 학습 기록 채우기(처음 한 번 — filled): 복습 history → r, picks → n, 일기 → w, 카드를 마지막으로 본 시각(progress.at) → c */
(function fillDays() {
  if (dayLog.filled) return;
  const isDay = d => /^\d{4}-\d{2}-\d{2}$/.test(String(d || ""));
  const rv = {}, nw = {};
  Object.keys(study.items).forEach(id => (study.items[id].history || []).forEach(h => { if (h && isDay(h.date)) rv[h.date] = (rv[h.date] || 0) + 1; }));
  Object.keys(rv).forEach(d => { const r = dayRec(d); r.r = Math.max(r.r || 0, rv[d]); });
  Object.keys(study.picks).forEach(d => { if (isDay(d) && (study.picks[d] || []).length) nw[d] = study.picks[d].length; });
  Object.keys(study.items).forEach(id => { const d = study.items[id].startedOn; if (isDay(d) && !nw[d]) nw[d] = 1; });
  Object.keys(nw).forEach(d => { const r = dayRec(d); r.n = Math.max(r.n || 0, nw[d]); });
  Object.keys(diary.entries).forEach(d => { if (isDay(d) && diary.entries[d].items.some(hasContent)) dayRec(d).w = 1; });
  Object.keys(progress.at || {}).forEach(key => {
    const ms = Number(progress.at[key]), c = CARDS.find(x => String(x.id) === key);
    if (!ms || !c) return;
    const r = dayRec(dateKey(new Date(ms)));
    if (!r.c.includes(c.id)) r.c.push(c.id);
  });
  dayLog.filled = 1;
  saveDays();
})();

function todayStats() {
  const t = dateKey(), rec = dayLog.days[t];
  return {
    t,
    reviewed: Object.keys(study.items).filter(id => EXPR_BY_ID[id] && (study.items[id].history || []).some(h => h && h.date === t)).length,
    due: dueList().length,
    picks: picksToday(),
    newLeft: EXPR_LIST.some(it => statusOf(it.id) === "new"),
    cards: rec && rec.c ? rec.c.length : 0,
    wrote: wroteToday()
  };
}
/* 아직 안 본 다음 카드(마지막으로 본 카드 다음부터, 화면 순서). 다 봤으면 마지막으로 본 카드의 다음 카드 */
function nextCardIdx() {
  const last = progress.last == null ? -1 : indexOfKey(progress.last), L = CARDS.length;
  for (let k = 1; k <= L; k++) { const i = (last + k + L) % L; if (!seenSet.has(cardKey(i))) return i; }
  return (last + 1 + L) % L;
}
function nowTask(s) {
  if (s.due) return { kind: "review" };
  if (s.picks < DAILY_PICKS && s.newLeft) return { kind: "new" };
  if (!s.cards && CARDS.length) {
    const ci = nextCardIdx(), x = allHooks().find(h => h.ci === ci);
    return x ? { kind: "hook", ci, x } : { kind: "card", ci };
  }
  if (!s.wrote) return { kind: "write" };
  return { kind: "done" };
}
function allHooks() {
  const out = [];
  CARDS.forEach((c, ci) => (Array.isArray(c.hooks) ? c.hooks : []).forEach(h => {
    const d = c.dialogue || [];
    if (h && h.ko && Number.isInteger(h.line) && d[h.line - 1] && d[h.line - 1].who === "me") out.push({ ci, h, key: c.id + ":" + h.line });
  }));
  return out;
}
/* 드라이브를 중간에 멈췄으면 { o: 그때의 범위로 맞춘 옵션, label, left: 남은 문장 수, mins } */
function driveResumeInfo() {
  const p = D.pos;
  if (!p) return null;
  const o = Object.assign({}, D.opts, { scope: p.scope, cats: p.cats ? String(p.cats).split(",").filter(Boolean) : D.opts.cats });
  if (p.scope === "diary" && p.range) o.diaryRange = p.range;
  if (p.scope === "talk" && p.range) { const r = String(p.range); o.talkRange = r.startsWith("one:") ? "one" : r; if (r.startsWith("one:")) o.talkId = r.slice(4); }
  let pl = buildDrive(o);
  if (o.order === "random" && Array.isArray(p.order) && pl.blocks.length > 1) pl = dvReorder(pl, p.order);
  const k = dvResumeIdx(pl, o, p);
  if (k < 0) return null;
  let words = 0;
  const rest = pl.items.slice(k);
  rest.forEach(it => { words += getScript(it.text).words.length * (dvEchoOn(o, it) || dvRoleOn(o, it) ? 2 : 1); });
  return { o, label: p.label || "", left: rest.length, mins: Math.max(1, Math.round((words * 0.4 / o.rate + rest.length * 0.6) / 60)) };
}

const dvSetupEl = document.getElementById("dvSetup");
const dvPlayEl = document.getElementById("dvPlay");

/* 표현을 소리 내어 읽을 글: ~ 자리 표시는 빼고 자연스럽게 ("Can I get ~?" → "Can I get...?", "~ to go" → "to go") */
function sayPhrase(p) {
  return String(p).replace(/~\w*/g, "~").replace(/^\s*~\s*/, "").replace(/\s*~/g, "...")
    .replace(/\.{4,}/g, "...").replace(/\s{2,}/g, " ").trim();
}
const catsKey = cats => cats.slice().sort().join(",");
const dvVoice = it => it.voice || (it.who === "me" ? settings.voiceMe : settings.voiceThem);
function dvElevenOK() { return settings.engine === "eleven" && !!settings.apiKey && navigator.onLine !== false; }

/* ---- 재생 목록 만들기 → { items: [문장], blocks: [카드 또는 표현], exprScope }
   문장 { kind: dlg|phrase|ex|story, text, ko, who, fx: card|expr|null(앞에 효과음), block, ci, xid, ex, n, total, key } */
function driveExprs(o) {
  if (o.scope === "due") return dueList().map(id => EXPR_BY_ID[id]).filter(Boolean);
  return EXPR_LIST.filter(it => statusOf(it.id) === "learning");
}
function buildDrive(o) {
  const items = [], blocks = [];
  const exprScope = o.scope === "learning" || o.scope === "due", diaryScope = o.scope === "diary", talkScope = o.scope === "talk";
  const push = x => { if (String(x.text || "").trim()) items.push(x); };
  const exprItems = (b, it, withEx, withStory) => {
    const ex = it.ex, base = { block: b, ci: it.ci, xid: it.id, ex };
    push(Object.assign({ kind: "phrase", text: sayPhrase(ex.phrase), ko: shortMeaning(ex), who: "me", fx: "expr", n: 1, total: 1 }, base));
    if (withEx) (ex.examples || []).forEach((x, n, arr) => push(Object.assign({ kind: "ex", text: x.en, ko: x.ko, who: "them", n: n + 1, total: arr.length }, base)));
    if (withStory && ex.story) push(Object.assign({ kind: "story", text: ex.story.en, ko: ex.story.ko, who: "me", n: 1, total: 1 }, base));
  };
  if (talkScope) {
    /* 내 대화문(2026-10-06): 대화문마다 [새 대화문 효과음] 줄을 차례대로(내 말 = 내 목소리, AI 말 = 상대 목소리, 최신 대화문부터) */
    talksFor(o).forEach(tk => {
      const b = blocks.length;
      blocks.push({ kind: "talk", key: "t" + tk.id, tid: tk.id, start: items.length });
      tk.lines.forEach((l, n) => push({ kind: "tl", text: l.en, ko: l.ko || "", who: l.who === "me" ? "me" : "them", name: l.who === "me" ? "나" : "AI",
        fx: n === 0 ? "card" : null, block: b, tid: tk.id, title: tk.title, n: n + 1, total: tk.lines.length }));
    });
  } else if (diaryScope) {
    /* 내 일기: 일기마다 질문 → 듣기용 본문 문장들(최신 일기부터) */
    diaryListenItems(o.diaryRange).forEach(x => {
      const b = blocks.length, q = x.it.q || {}, sents = splitSentences(x.body);
      blocks.push({ kind: "diary", key: "w" + x.key, date: x.date, di: x.i, start: items.length });
      const base = { block: b, date: x.date, di: x.i, multi: x.multi };
      push(Object.assign({ kind: "q", text: q.en || "", ko: q.ko || "", who: "them", voice: settings.voiceThem, fx: "card", n: 1, total: 1 }, base));
      sents.forEach((t, n) => push(Object.assign({ kind: "wr", text: t, ko: "", who: "me", voice: settings.voiceWrite, fx: n === 0 && !q.en ? "card" : null, n: n + 1, total: sents.length }, base)));
    });
  } else if (exprScope) {
    driveExprs(o).forEach(it => {
      blocks.push({ kind: "expr", ci: it.ci, xid: it.id, key: "x" + it.id, start: items.length });
      exprItems(blocks.length - 1, it, true, true);
    });
  } else {
    CARDS.forEach((card, ci) => {
      if (o.scope === "cat" && !o.cats.includes(card.category)) return;
      const b = blocks.length, d = card.dialogue || [], start = items.length;
      blocks.push({ kind: "card", ci, cid: card.id, key: "c" + card.id, start });
      if (hasDlg(o.content)) d.forEach((line, n) => push({ kind: "dlg", text: line.en, ko: line.ko || "", who: whoOf(line), name: whoLabel(line.who), fx: n === 0 ? "card" : null, block: b, ci, n: n + 1, total: d.length }));
      /* 대화문만 = 대화만(표현 효과음·표현 읽기·예문·썰 없음) / 예문까지 = 표현마다 표현 읽기 + 예문 / 썰까지 = + 썰 / 예문만·썰만 = 대화 없이 표현마다 표현 읽기 + 예문(또는 썰) */
      if (hasEx(o.content) || hasStory(o.content)) EXPR_LIST.filter(it => it.ci === ci && it.kind === "core").forEach(it => exprItems(b, it, hasEx(o.content), hasStory(o.content)));
      if (items[start] && !hasDlg(o.content)) items[start].fx = "card";   // 대화가 없으면 카드의 첫 문장(표현 읽기)에서 새 카드 효과음
    });
  }
  items.forEach(it => { it.key = blocks[it.block].key + "/" + it.kind + "/" + (it.xid || "") + "/" + it.n; });
  if (items.length && !items[0].fx) items[0].fx = exprScope ? "expr" : "card";
  return { items, blocks: blocks.filter(bl => items.some(it => it.block === blocks.indexOf(bl))), exprScope, diaryScope, talkScope };
}
const dvDiaryTitle = it => koDate(it.date) + " 일기" + (it.multi ? " · 글 " + (it.di + 1) : "");
const dvBlockTitle = it => it.kind === "tl" ? it.title : it.date ? dvDiaryTitle(it) : CARDS[it.ci].title;   // 카드 제목 / 일기 / 대화문 제목

/* 지금 위치 표시: [위 줄, 아래 줄] 예) "카페에서 주문하기 · 3/18" / "대화 4/6", "Can I get ~? · 예문 2/5", "Can I get ~? · 썰" */
function driveLabels(k) {
  const pl = D.pl, it = pl.items[k];
  const bi = pl.blocks.findIndex(bl => pl.items[bl.start] && pl.items[bl.start].block === it.block);
  const pos = (bi + 1) + "/" + pl.blocks.length;
  if (pl.talkScope) return [it.title + " · " + pos, (it.who === "me" ? "내 말" : "AI") + " · 줄 " + it.n + "/" + it.total];   // 예) "북한산 얘기 · 1/3" / "내 말 · 줄 3/12"
  if (pl.diaryScope) return [dvDiaryTitle(it) + " · " + pos, it.kind === "q" ? "질문" : "문장 " + it.n + "/" + it.total];   // 예) "10월 4일 일기 · 2/5" / "문장 3/8"
  const card = CARDS[it.ci];
  const ph = it.ex ? it.ex.phrase : "";
  return [
    pl.exprScope ? "표현 " + pos + " · " + card.title : card.title + " · " + pos,
    it.kind === "dlg" ? "대화 " + it.n + "/" + it.total :
      it.kind === "phrase" ? ph + " · 핵심 표현" :
      it.kind === "ex" ? ph + " · 예문 " + it.n + "/" + it.total : ph + " · 썰"
  ];
}
function dvBlockIndex(k) {
  const b = D.pl.items[k].block;
  return D.pl.blocks.findIndex(bl => D.pl.items[bl.start].block === b);
}

/* 문장 하나의 화면 요소(지금 문장·앞뒤 문장 자리를 옮겨 다님). 영어는 인터랙티브 스크립트(scriptHtml)라 노래방식 채우기가 그대로 됨 */
function dvEl(k) {
  if (D.els[k]) return D.els[k];
  const it = D.pl.items[k];
  const el = document.createElement("div");
  el.className = "dv-line k-" + it.kind + (it.who === "me" ? " me" : "") + (it.kind === "story" || it.text.length > 120 ? " long" : "") +
    (dvRoleOn(D.opts, it) ? " role-me" : "");                   // 역할극: 내 말은 차례가 오기 전까지 영어를 가림
  const who = it.kind === "dlg" || it.kind === "tl" ? it.name : it.kind === "phrase" ? "핵심 표현" : it.kind === "ex" ? "예문 " + it.n :
    it.kind === "q" ? "오늘의 질문" : it.kind === "wr" ? "내 일기 · " + it.n + "/" + it.total : "썰";
  el.innerHTML = '<div class="dv-who">' + esc(who) + '</div>' +
    '<div class="dv-en" lang="en">' + scriptHtml(it.text, it.ex && it.kind !== "phrase" ? markRanges(it.text, it.ex) : []) + '</div>' +
    (it.ko ? '<div class="dv-ko">' + esc(it.ko) + '</div>' : "");
  return (D.els[k] = el);
}

/* ---- 재생기: 인터랙티브 스크립트 공통 재생기를 그대로 씀 ---- */
D.rd = createReader({
  items: () => (D.pl ? D.pl.items.map((it, k) => ({ get el() { return dvEl(k).querySelector(".sc"); }, who: it.who, voice: it.voice })) : []),
  rate: () => D.opts.rate,
  before: (k, first) => dvBefore(k, first),
  gap: k => dvGap(k),
  onItem: k => dvOnItem(k),
  onEnd: complete => dvOnEnd(complete),
  onChange: () => dvPaintCtl()
});

/* 문장 앞: 새 카드·표현의 첫 문장이면 효과음(이전 문장 버튼으로 돌아온 경우는 생략).
   백그라운드에서 내장 음성으로 읽어야 하면(키 없음·인터넷 끊김) 소리가 안 나고 넘어가 버리므로 그 문장에서 멈춰 기다림 */
async function dvBefore(k, first) {
  if (document.visibilityState === "hidden" && !dvMp3OK(k)) { dvInterrupt(); return; }
  const it = D.pl.items[k];
  if (it.fx && !(first && D.lastAct === "prev")) {   // [이전 문장]으로 돌아온 경우는 효과음 생략
    const ms = await dvChime(it.fx);
    if (ms) await sleep(ms);
  }
  dvChimeOff();                                    // 음성이 나오기 전에 Web Audio를 끔(효과음 중간에 넘긴 경우도)
  if (dvRoleOn(D.opts, it)) await dvRoleWait(k);
}
/* 역할극: 내 차례면 영어를 가린 채(한국어만) 먼저 기다림 → 그동안 영어로 말해 보고 → 정답(내 말) 재생.
   기다리는 시간은 소리를 듣기 전이라 단어 수로 어림(단어 × 0.38초 ÷ 속도, 1.5~12초) + 0.8초. 일시정지 중엔 시간이 안 감, 다른 문장으로 옮기면 그만둠 */
async function dvRoleWait(k) {
  const it = D.pl.items[k], el = dvEl(k), my = Player.getToken();
  let left = Math.round(Math.min(12, Math.max(1.5, getScript(it.text).words.length * 0.38 / D.opts.rate)) * 1000) + 800, shown = false;
  el.classList.add("dv-quiz");
  try {
    while (left > 0) {
      if (Player.getToken() !== my || !D.open) return;
      if (Player.isPaused()) { shown = false; await sleep(150); continue; }
      if (!shown || !D.echo) { dvEcho(left, "내 차례예요 · 영어로 말해 보세요"); shown = true; }
      const t0 = performance.now();
      await sleep(100);
      if (!Player.isPaused()) left -= performance.now() - t0;   // 실제로 흐른 시간만큼(타이머가 늦게 와도 맞게)
    }
  } finally {
    el.classList.remove("dv-quiz");
    if (D.echo) { D.echo = false; dvPaintCtl(); }   // 정답이 나올 때 '내 차례예요' 막대를 지움
  }
}
/* 문장 사이: 카드·표현이 바뀌면 조금 더 쉬고, '따라 말할 시간'이면 방금 문장 길이만큼 쉼(썰은 여러 문장이라 쉬지 않음) */
function dvGap(k) {
  const it = D.pl.items[k], nx = D.pl.items[k + 1];
  let ms = nx && nx.block !== it.block ? 900 : nx && nx.fx ? 650 : 450;
  if (dvEchoOn(D.opts, it)) {
    let len = Player.lastLength();
    if (!len) len = getScript(it.text).words.length * 0.38 / D.opts.rate;   // 길이를 못 쟀으면 단어 수로 어림
    const echo = Math.round(Math.min(12, Math.max(1.2, len)) * 1000);
    dvEcho(echo);
    ms = Math.max(ms, echo + 250);
  }
  return ms;
}
function dvOnItem(k) {
  D.idx = k;
  D.done = false;
  D.interrupted = false;
  D.echo = false;
  dvShow(k);
  dvSavePos();
  dvMedia();
  dvPrefetch(k);
}
function dvOnEnd(complete) {
  D.echo = false;
  if (complete) {                               // 끝까지 다 들음 → 다음엔 처음부터
    D.done = true;
    D.pos = null;
    saveDrive();
  }
  dvPaintCtl();
}

/* ---- 재생 화면 그리기 ---- */
function dvPlayHtml() {
  return '<header class="dv-ptop">' +
      '<button class="dv-x" type="button" data-dv="close" aria-label="드라이브 모드 나가기">' + ICON_X + '</button>' +
      '<div class="dv-loc"><div class="dv-loc1"></div><div class="dv-loc2"></div></div>' +
    '</header>' +
    '<div class="dv-stage">' +
      '<div class="dv-prev" aria-hidden="true"></div>' +
      '<div class="dv-scroll"><div class="dv-cur"></div></div>' +
      '<div class="dv-next" aria-hidden="true"></div>' +
    '</div>' +
    '<div class="dv-note" aria-live="polite"></div>' +
    '<div class="dv-ctl">' +
      '<button class="dv-b" type="button" data-dv="prev">' + ICON_PREV + '<span>이전 문장</span></button>' +
      '<button class="dv-b main" type="button" data-dv="toggle"></button>' +
      '<button class="dv-b" type="button" data-dv="next">' + ICON_NEXT + '<span>다음 문장</span></button>' +
      '<button class="dv-b wide" type="button" data-dv="block">' + ICON_SKIP + '<span class="dv-block-label"></span></button>' +
    '</div>';
}
function dvShow(k) {
  const U = D.ui, pl = D.pl;
  if (!U || !pl || !pl.items[k]) return;
  U.prev.replaceChildren(...(k > 0 ? [dvEl(k - 1)] : []));
  U.cur.replaceChildren(dvEl(k));
  U.next.replaceChildren(...(k + 1 < pl.items.length ? [dvEl(k + 1)] : []));
  U.scroll.scrollTop = 0;
  const L = driveLabels(k);
  U.loc1.textContent = L[0];
  U.loc2.textContent = L[1];
}
function dvPaintCtl() {
  const U = D.ui;
  if (!D.open || D.screen !== "play" || !U) return;
  const s = D.rd.state();
  const playing = s.active && !s.paused;
  U.toggle.innerHTML = (playing ? ICON_PAUSE : ICON_PLAY) + '<span>' + (playing ? "일시정지" : D.done ? "처음부터" : "재생") + '</span>';
  U.toggle.setAttribute("aria-label", playing ? "일시정지" : "재생");
  if (!(D.echo && playing)) {                    // '따라 말해 보세요' 중이 아니면 상태 글
    D.echo = false;
    U.note.textContent = D.done ? "끝까지 다 들었어요" :
      playing ? "" : D.interrupted ? "소리가 끊겨서 멈췄어요 · 재생을 누르면 이 문장부터" : "일시정지";
  }
  dvKeepAlive(playing);
  try { if (navigator.mediaSession) navigator.mediaSession.playbackState = playing ? "playing" : "paused"; } catch (e) {}
}
function dvEcho(ms, label) {
  if (!D.ui) return;
  D.echo = true;
  D.ui.note.innerHTML = '<div class="dv-echo"><span>' + (label || "따라 말해 보세요") + '</span><i><b style="animation-duration:' + ms + 'ms"></b></i></div>';
}

/* ---- 조작: 버튼 4개 · 잠금화면 · 블루투스 ---- */
function dvGo(k, act) {
  if (!D.pl || !D.pl.items.length) return;
  D.lastAct = act || "";
  D.done = false;
  D.interrupted = false;
  dvAudioUnlock();
  D.rd.play(Math.max(0, Math.min(k, D.pl.items.length - 1)), 0, false);
}
function dvToggle() {
  const s = D.rd.state();
  if (s.active) { D.rd.toggle(); return; }
  dvGo(D.done ? 0 : D.idx, "play");
}
function dvStep(d) {
  const k = D.idx + d;
  if (k < 0) { dvGo(0, "prev"); return; }
  if (k >= D.pl.items.length) { toast("마지막 문장이에요"); return; }
  dvGo(k, d < 0 ? "prev" : "next");
}
function dvNextBlock() {
  const b = dvBlockIndex(D.idx) + 1;
  if (b >= D.pl.blocks.length) { toast(D.pl.talkScope ? "마지막 대화문이에요" : D.pl.diaryScope ? "마지막 일기예요" : D.pl.exprScope ? "마지막 표현이에요" : "마지막 카드예요"); return; }
  dvGo(D.pl.blocks[b].start, "block");
}
/* 소리가 끊김(전화·다른 앱 소리·화면 꺼짐으로 재생이 멈춤) → 그 문장 처음에서 일시정지 상태로 기다림 */
function dvInterrupt() {
  if (!D.open || D.screen !== "play" || !D.rd.state().active) return;
  const k = D.idx;
  D.interrupted = true;
  D.rd.stop();
  dvChimeOff();
  D.idx = k;
  dvSavePos();
  dvPaintCtl();
}
Player.onInterrupt(dvInterrupt);
Player.onChange(() => { if (D.open) dvPaintCtl(); });

function dvMedia() {
  const ms = navigator.mediaSession;
  if (!ms || !D.pl) return;
  try {
    const it = D.pl.items[D.idx];
    ms.metadata = new MediaMetadata({
      title: getScript(it.text).speech,
      artist: dvBlockTitle(it) + " · " + driveLabels(D.idx)[1],
      album: "한 장 영어 · 드라이브 모드",
      artwork: [{ src: "icon-192.png", sizes: "192x192", type: "image/png" }, { src: "icon-512.png", sizes: "512x512", type: "image/png" }]
    });
  } catch (e) {}
}
/* 잠금화면·블루투스 버튼: 재생/일시정지, 다음 = 다음 문장, 이전 = 이전 문장 */
function dvMediaHandlers(on) {
  const ms = navigator.mediaSession;
  if (!ms) return;
  const set = (a, f) => { try { ms.setActionHandler(a, on ? f : null); } catch (e) {} };
  set("play", () => { const s = D.rd.state(); if (s.active) D.rd.resume(); else dvToggle(); });
  set("pause", () => { if (D.rd.state().active) D.rd.pause(); });
  set("nexttrack", () => dvStep(1));
  set("previoustrack", () => dvStep(-1));
  if (!on) try { ms.metadata = null; ms.playbackState = "none"; } catch (e) {}
}
/* 짧은 문장 소리만으로는 휴대폰이 잠금화면·블루투스 조작을 붙여 주지 않아서, 재생하는 동안 조용한 소리를 계속 틀어 둠.
   이 소리를 시스템이 멈추면(전화 등) 끊김으로 봄.
   음성(ElevenLabs mp3_44100)과 같은 44.1kHz·16비트로 만듦 — 예전 8kHz·8비트는 음성과 형식이 다른 소리가 같이 섞여서 음질에 영향을 줄 수 있었음 */
function silentWav(sec) {
  const rate = 44100, n = rate * sec, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);   // 16비트 무음 = 0
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, n * 2, true);
  return new Blob([buf], { type: "audio/wav" });
}
/* 문장을 옮길 때(이전·다음)는 잠깐 멈췄다 다시 재생되므로, 끄는 건 조금 늦춰서 깜빡이지 않게 */
let dvKaTimer = null;
function dvKeepAlive(on) {
  if (on && !D.ka) {
    try {
      D.ka = new Audio(URL.createObjectURL(silentWav(6)));   // 5초보다 길어야 잠금화면 조작이 붙음
      D.ka.loop = true;
      D.ka.addEventListener("pause", () => {
        if (D.kaSelf) { D.kaSelf = false; return; }   // 앱이 직접 멈춘 것
        if (D.kaWant) dvInterrupt();                 // 시스템이 멈춤(전화 등)
      });
    } catch (e) { return; }
  }
  if (!D.ka) return;
  clearTimeout(dvKaTimer);
  if (on) {
    D.kaWant = true;
    try { if (D.ka.paused) { const p = D.ka.play(); if (p && p.catch) p.catch(() => {}); } } catch (e) {}
    return;
  }
  const off = () => {
    D.kaWant = false;
    try { if (!D.ka.paused) { D.kaSelf = true; D.ka.pause(); } } catch (e) {}
  };
  if (D.open && D.screen === "play") dvKaTimer = setTimeout(off, 400); else off();
}

/* 효과음(Web Audio, 외부 파일 없음): 새 카드 = 부드럽게 올라가는 두 음, 표현 = 짧은 한 음. 작고 짧게.
   Web Audio는 효과음에만 쓰고, 음성은 상황 카드와 똑같이 Player의 audio 요소로만 나감(Web Audio를 거치지 않음).
   효과음을 낼 때만 켜고(resume) 끝나면 바로 끔(suspend) — 켜 둔 채로 두면 음성이 나오는 동안에도
   저지연 출력이 하나 더 열려 있어서 음질에 영향을 줄 수 있음. latencyHint "playback"으로 일반 재생용 출력을 씀 */
function dvAudioUnlock() {                         // 버튼을 누를 때(사용자 동작) 만들어 둠. 첫 문장 앞(dvBefore)에서 효과음 뒤 끔
  try {
    if (!D.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { D.ac = new AC({ latencyHint: "playback" }); } catch (e) { D.ac = new AC(); }
    }
  } catch (e) {}
}
/* 상태와 상관없이 suspend — 아직 끝나지 않은 resume이 있어도 그 뒤에 처리되어 결국 꺼짐 */
function dvChimeOff() {
  try { if (D.ac && D.ac.state !== "closed") D.ac.suspend().catch(() => {}); } catch (e) {}
}
async function dvChime(kind) {
  try {
    const ac = D.ac;
    if (!ac) return 0;
    if (ac.state !== "running") await Promise.race([ac.resume(), sleep(600)]);   // 백그라운드 등에서 켜지지 않으면 효과음만 건너뜀
    if (ac.state !== "running") return 0;
    const card = kind === "card";
    const t = ac.currentTime + 0.03;
    const vol = card ? 0.12 : 0.085, len = card ? 0.55 : 0.3;
    (card ? [[587.33, 0], [880, 0.15]] : [[783.99, 0]]).forEach(nd => {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = card ? "sine" : "triangle";
      osc.frequency.value = nd[0];
      g.gain.setValueAtTime(0.0001, t + nd[1]);
      g.gain.exponentialRampToValueAtTime(vol, t + nd[1] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + nd[1] + len);
      osc.connect(g);
      g.connect(ac.destination);
      osc.start(t + nd[1]);
      osc.stop(t + nd[1] + len + 0.05);
    });
    return card ? 850 : 450;
  } catch (e) { return 0; }
}

/* 화면 꺼짐 방지(Wake Lock): 재생 화면에 있는 동안만. 지원하지 않으면 조용히 무시 */
async function dvLock(on) {
  try {
    if (!on) {
      const l = D.lock;
      D.lock = null;
      if (l) await l.release();
      return;
    }
    if (D.lock || D.lockReq || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
    D.lockReq = true;
    const l = await navigator.wakeLock.request("screen");
    D.lockReq = false;
    if (!D.open || D.screen !== "play") { l.release(); return; }
    D.lock = l;
    l.addEventListener("release", () => { if (D.lock === l) D.lock = null; });
  } catch (e) { D.lockReq = false; }
}

/* 재생 중 저장 안 된 문장을 만나면 Player가 그 자리에서 만들고, 다음 3문장은 미리 만들어 둠(끊김 줄이기) */
let dvPreQ = Promise.resolve();
const dvPreSeen = new Set();
function dvPrefetch(k) {
  if (navigator.onLine === false) return;
  const eleven = dvElevenOK();
  for (let j = k + 1; j <= k + 3 && j < D.pl.items.length; j++) {
    const it = D.pl.items[j], sp = getScript(it.text).speech, v = dvVoice(it);
    if (!eleven && !Prebuilt.has(sp, v)) continue;                  // 키가 없으면 미리 만든 음성만 받아 둠
    const key = settings.model + "|" + v + "|" + sp;
    if (dvPreSeen.has(key)) continue;
    dvPreSeen.add(key);
    dvPreQ = dvPreQ.then(() => (D.open ? Player.warmClip(sp, v, eleven).catch(() => { dvPreSeen.delete(key); }) : dvPreSeen.delete(key)));
  }
}
/* 이 문장을 mp3로 낼 수 있는지(미리 만든 음성이 있거나 ElevenLabs를 쓸 수 있음) — 아니면 백그라운드에서 내장 음성이라 소리가 안 남 */
function dvMp3OK(k) {
  const it = D.pl && D.pl.items[k];
  return dvElevenOK() || (!!it && Prebuilt.has(getScript(it.text).speech, dvVoice(it)));
}

/* ---- 위치 기억 ---- */
function dvSavePos() {
  if (!D.pl || !D.pl.items[D.idx] || D.done) return;
  const it = D.pl.items[D.idx], bl = D.pl.items[D.idx] && D.pl.blocks[dvBlockIndex(D.idx)];
  D.pos = {
    scope: D.opts.scope, cats: catsKey(D.opts.cats), key: it.key, block: bl ? bl.key : "",
    range: D.pl.diaryScope ? D.opts.diaryRange : D.pl.talkScope ? talkRangeKey(D.opts) : undefined,
    cid: it.ci != null ? CARDS[it.ci].id : undefined, bi: dvBlockIndex(D.idx),
    label: dvBlockTitle(it) + " · " + driveLabels(D.idx)[1],
    order: D.opts.order === "random" ? D.pl.blocks.map(b => b.key) : undefined   // 랜덤일 때 섞은 순서(이어 듣기에 그대로 씀)
  };
  saveDrive();
}
/* 저장된 위치 → 이 재생 목록의 문장 번호. 같은 문장이 없으면 그 카드(표현)의 처음, 카드가 없어졌으면 가장 가까운 카드의 처음. 이어 들을 수 없으면 -1 */
function dvResumeIdx(pl, o, p) {        // o·p를 안 주면 지금 옵션(D.opts)·저장 위치(D.pos) — 오늘 탭 '이어 듣기'는 멈췄을 때의 범위로 계산
  o = o || D.opts;
  p = p || D.pos;
  if (!p || !pl.items.length || p.scope !== o.scope || (p.scope === "cat" && p.cats !== catsKey(o.cats)) ||
    (p.scope === "diary" && p.range !== o.diaryRange) || (p.scope === "talk" && p.range !== talkRangeKey(o))) return -1;
  const k = pl.items.findIndex(it => it.key === p.key);
  if (k >= 0) return k;
  const b = pl.blocks.find(bl => bl.key === p.block);
  if (b) return b.start;
  if (!pl.exprScope && !pl.diaryScope && !pl.talkScope && p.cid != null) {
    const near = pl.blocks.find(bl => bl.cid > p.cid) || pl.blocks[pl.blocks.length - 1];
    return near.start;
  }
  return pl.blocks[Math.max(0, Math.min(p.bi || 0, pl.blocks.length - 1))].start;
}

    const noKey = settings.engine !== "eleven" || !settings.apiKey;
    html = '<p class="note" style="margin-top:0">카드·표현 음성은 앱에 들어 있어요. 앱에 없는 문장(내 일기·내 대화문 등)만 세어서, ElevenLabs 키가 있으면 미리 만들어 폰에 저장해요.' +
        (noKey ? " ElevenLabs API 키를 넣으면 쓸 수 있어요." : "") + '</p>' +
      row((noKey ? b("voice-settings", "설정 › 음성 열기", "link") : "") + b("pre-count", "미리 받아두기"));
  }
  box.innerHTML = html;
}
async function dvPreCount() {
  const P = D.pre = { state: "counting" };
  dvPaintPre();
  const pl = buildDrive(D.opts);
  const seen = new Set(), todo = [];
  pl.items.forEach(it => {
    const sp = getScript(it.text).speech, v = dvVoice(it), k = v + "|" + sp;
    if (!sp.trim() || seen.has(k)) return;
    seen.add(k);
    todo.push({ sp, v });
  });
  await Prebuilt.ready;
  const rest = todo.filter(x => !Prebuilt.has(x.sp, x.v));      // 앱에 들어 있는(미리 만든) 음성은 받을 필요 없음
  const have = await Promise.all(rest.map(x => Player.isCached(x.sp, x.v)));
  if (D.pre !== P) return;
  P.pre = todo.length - rest.length;
  P.need = rest.filter((x, i) => !have[i]);
  P.have = rest.length - P.need.length;
  P.chars = P.need.reduce((s, x) => s + x.sp.length, 0);
  P.state = "confirm";
  dvPaintPre();
}
async function dvPreRun() {
  const P = D.pre;
  if (P.state !== "confirm" || !P.need.length) return;
  const list = P.need;
  Object.assign(P, { state: "running", done: 0, fail: 0, total: list.length, cancel: false });
  dvPaintPre();
  let next = 0, stopMsg = "";
  const worker = async () => {
    while (!P.cancel && next < list.length) {
      const x = list[next++];
      try { await Player.fetchClip(x.sp, x.v); }
      catch (e) {
        P.fail++;
        if (/키를 확인|크레딧|연결하지 못/.test(e.message)) { stopMsg = e.message; P.cancel = true; }   // 계속해도 실패할 오류면 멈춤
      }
      P.done++;
      if (D.pre === P) dvPaintPre();
    }
  };
  await Promise.all([worker(), worker()]);          // 두 문장씩 동시에
  const saved = P.done - P.fail;
  P.state = "done";
  P.msg = (stopMsg ? stopMsg + " · 멈췄어요. " : P.done < P.total ? "취소했어요. " : "다 받았어요. ") +
    saved + "개 저장" + (P.fail ? " · 실패 " + P.fail + "개는 건너뜀" : "") + (P.done < P.total ? " · 남은 " + (P.total - P.done) + "개" : "");
  if (D.pre === P) dvPaintPre();
}

/* 블록(카드·표현) 순서를 order(블록 key 목록)대로 바꾼 재생 목록. order에 없는 블록은 뒤에 그대로. 한 블록 안의 문장 순서는 그대로 */
function dvReorder(pl, order) {
  const rank = {};
  order.forEach((k, i) => { rank[k] = i; });
  const idx = pl.blocks.map((b, i) => i).sort((a, b) => {
    const ra = pl.blocks[a].key in rank ? rank[pl.blocks[a].key] : 1e9 + a, rb = pl.blocks[b].key in rank ? rank[pl.blocks[b].key] : 1e9 + b;
    return ra - rb;
  });
  const items = [], blocks = [];
  idx.forEach(bi => {
    const b = pl.blocks[bi], from = pl.items[b.start].block, nb = blocks.length;
    blocks.push(Object.assign({}, b, { start: items.length }));
    pl.items.forEach(it => { if (it.block === from) items.push(Object.assign({}, it, { block: nb })); });
  });
  return { items, blocks, exprScope: pl.exprScope, diaryScope: pl.diaryScope, talkScope: pl.talkScope };
}
function dvShuffled(keys) {
  const a = keys.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function dvStart(resume) {
  D.pl = buildDrive(D.opts);
  /* 랜덤: 이어 듣기면 저장해 둔 순서(pos.order) 그대로, 처음부터면 새로 섞음 */
  if (D.opts.order === "random" && D.pl.blocks.length > 1) {
    const saved = resume && D.pos && Array.isArray(D.pos.order) ? D.pos.order : null;
    D.pl = dvReorder(D.pl, saved || dvShuffled(D.pl.blocks.map(b => b.key)));
  }
  D.els = [];
  if (!D.pl.items.length) return;
  const k = resume ? Math.max(0, dvResumeIdx(D.pl)) : 0;
  D.idx = k;
  D.done = false;
  dvScreen("play");
  dvShow(k);
  dvGo(k, "start");
}
/* 재생 화면 닫기 → 드라이브 탭 시작 화면(이어 듣기 위치를 새로 보여 줌) */

/* 재생 화면(#drive)과 드라이브 탭 시작 화면(#dvSetup) 공통 */
function onDriveClick(e) {
  const t = e.target;
  let el;
  if ((el = t.closest("[data-dv]"))) {
    if (el.disabled) return;
    const a = el.dataset.dv;
    buzz();
    if (a === "close") closeDrive();
    else if (a === "voice-settings") openSettings("voice");
    else if (a === "start" || a === "restart") dvStart(false);
    else if (a === "resume") dvStart(true);
    else if (a === "toggle") dvToggle();
    else if (a === "prev") dvStep(-1);
    else if (a === "next") dvStep(1);
    else if (a === "block") dvNextBlock();
    else if (a === "pre-count") dvPreCount();
    else if (a === "pre-run") dvPreRun();
    else if (a === "pre-stop") { D.pre.cancel = true; dvPaintPre(); }
    else if (a === "pre-cancel") { D.pre = { state: "idle" }; dvPaintPre(); }
    return;
  }
  /* 시작 화면 옵션: 바꿀 때마다 저장(다음에 그대로 보여 줌) */
  const o = D.opts;
  if ((el = t.closest("[data-dv-scope]"))) {
    o.scope = el.dataset.dvScope;
    if (o.scope === "cat" && !o.cats.length && activeCard && activeCard.dataset.i != null) o.cats = [CARDS[+activeCard.dataset.i].category];
  } else if ((el = t.closest("[data-dv-cat]"))) {
    const n = el.dataset.dvCat;
    o.cats = o.cats.includes(n) ? o.cats.filter(x => x !== n) : o.cats.concat([n]);
  } else if ((el = t.closest("[data-dv-talk]"))) {
    o.talkId = el.dataset.dvTalk;
  } else if ((el = t.closest("[data-dv-cbx]"))) {
    o.content = contentToggle(o.content, +el.dataset.dvCbx);
  } else if ((el = t.closest("[data-dv-set] button"))) {
    const name = el.parentNode.dataset.dvSet, v = el.dataset.v;
    o[name] = name === "rate" ? parseFloat(v) : name === "shadow" ? v === "true" : v;
    if (name === "diaryRange") { diary.listenRange = v; saveDiary(); }   // 글쓰기 탭 '듣기용' 범위와 같이
    if (name === "talkRange" && v === "one" && !talks.items.some(x => x.id === o.talkId) && talks.items[0]) o.talkId = talks.items[0].id;   // 하나만: 처음엔 최신 대화문
  } else return;
  buzz();
  saveDrive();
  if (D.pre.state !== "running") D.pre = { state: "idle" };
  dvRenderSetup();
}

/* 화면이 꺼지거나 다른 앱으로 가면: ElevenLabs 음성은 계속 재생(잠금화면에서도 들을 수 있게),
   내장 음성은 백그라운드에서 끊기므로 그 문장에서 멈춰 기다림. 돌아오면 화면 꺼짐 방지를 다시 켬 */

/* ================= 연습 모드: 청크 · 연음 · 발음 (한 문장씩 말하기 연습) =================
   시작 화면(옵션 — 드라이브 모드 시작 화면과 같은 틀·CSS) → 연습 화면(한 문장씩). 시작 화면은 끝 화면의 [연습]·연습 화면 [옵션]으로.
   바로 연습(PC.quick, 시작 화면 없음): 상황 카드 위쪽 [연습] = 이 카드를 보던 줄부터 / 표현 시트·복습의 "이 표현 연습하기" = 예문 5개 → 썰.
     위치(pos)를 저장하지 않고(시작 화면의 '이어 하기'를 안 덮어씀), 닫으면 연 곳(PC.origin)으로 돌아가 보던 상태를 멈춘 채로 되살림.
   재생 목록(buildPractice): 대화 줄(dlg) · 예문(ex) · 썰 문장(story)을 차례로.
     카드 범위(지금 보던 카드 / 전체 / 카테고리): 카드마다 대화 → (예문까지) 핵심 표현마다 예문 5개 → (썰까지) 표현마다 예문 뒤에 썰 문장들
     표현 범위(학습 중 / 오늘 복습 — 드라이브와 같은 driveExprs 순서): 표현마다 예문 5개 → 썰 문장들
   한 문장 = 청크 단계(청크 하나씩 듣고 따라 말하기: 다음·이전·한 번 더) → 연결 단계(문장 전체를 한 번에) → [다음]으로 다음 문장.
     청크가 하나뿐이거나 연습 방식이 '전체 문장만'이면 바로 연결 단계. 속도는 연습 모드 전용(시작 화면·연습 화면 공통, 저장).
   데이터: 대사 줄·예문 = { chunks, tips, soloChunks? } / 썰 = story.sentences: [{ chunks, ko, tips, soloChunks? }]
     chunks: " / " = 끊어 읽는 곳, "‿" = 소리가 이어지는 곳(단어 사이 공백 대신). 괄호 속 한국어 뜻은 넣지 않음(화면에서 문장 아래 따로 보여 줌)
     썰 sentences의 chunks에서 표시를 빼고 공백 하나로 이으면 썰 영어(괄호 속 한국어를 뺀 것)와 똑같아야 함 → 그게 문장 나누기
   소리(새 음성을 만들지 않음): 대사·예문은 그 문장 음성, 썰 문장은 썰 전체 음성(표현 시트·드라이브와 같은 캐시)의 그 문장 구간.
     청크·썰 문장은 Player 구간 재생 ②(재생 전에 소리를 실제로 잘라 냄 — 'Player' 참고). soloChunks로 표시한 청크만 그 청크 글을 따로 요청.
   화면 단어 ↔ 음성 단어: 화면 글(괄호 속 한국어를 뺀 문장)의 j번째 단어 = 음성 글의 (a0 + j)번째 단어
   위치: 문장·단계가 바뀔 때마다, 닫을 때, pagehide에 저장. 끝까지 다 하면 위치를 지움 */
const PRACTICE_KEY = "engcards.practice.v1";
const PC_SCOPES = { current: "지금 보던 카드", all: "전체 카드", cat: "카테고리 선택", learning: "학습 중인 표현만", due: "오늘 복습할 표현만" };
const PC_DEFAULT = { scope: "current", cats: [], content: "dialogue", method: "chunk", rate: 1 };

/* 저장: { opts: 시작 화면 옵션, pos: 마지막 위치 { scope, cats, cid(지금 보던 카드 범위일 때 그 카드), key(문장), step, block, bcid, bi, label } } */
function loadPractice() {
  try {
    const s = JSON.parse(localStorage.getItem(PRACTICE_KEY) || "null");
    if (s && typeof s === "object") {
      const o = Object.assign({}, PC_DEFAULT, s.opts && typeof s.opts === "object" ? s.opts : {});
      if (!PC_SCOPES[o.scope]) o.scope = "current";
      if (!CONTENT_KEYS[o.content]) o.content = "dialogue";
      o.method = o.method === "whole" ? "whole" : "chunk";
      o.cats = Array.isArray(o.cats) ? o.cats.filter(c => typeof c === "string") : [];
      o.rate = o.rate === 0.8 ? 0.8 : 1;
      return { opts: o, pos: s.pos && typeof s.pos === "object" && s.pos.key ? s.pos : null };
    }
  } catch (e) {}
  return { opts: Object.assign({}, PC_DEFAULT), pos: null };
}
const PC = Object.assign(loadPractice(), {
  open: false, screen: "setup", openId: 0, curCi: 0,   // curCi: 연 순간에 보고 있던 카드('지금 보던 카드' 범위)
  quick: false, origin: null,                          // quick: 바로 연습(카드 [연습]·"이 표현 연습하기") — 위치(pos)를 저장하지 않음
                                                       // origin: 바로 연습을 연 곳 { kind: "card", card, st, hold, scroll } | { kind: "sheet", scroll } → 닫으면 거기로
  pl: null, idx: -1, step: 0, done: false,            // 재생 목록 · 지금 문장 번호 · 단계 · 끝까지 다 했는지
  u: null, ui: null                                    // 지금 문장의 연습 정보(pcUnit) · 연습 화면 요소
});
function savePractice() {
  try { localStorage.setItem(PRACTICE_KEY, JSON.stringify({ opts: PC.opts, pos: PC.pos })); } catch (e) {}
}
const practiceEl = document.getElementById("practice");
const pcSetupEl = document.getElementById("pcSetup");
const pcPlayEl = document.getElementById("pcPlay");

/* chunks 글 → { text: 슬래시·연음 표시를 뺀 글(원문과 같아야 함), parts: [{ s, e }](text 안 청크 위치), links: [연음 공백 위치] } */
function parseChunks(src) {
  const parts = [], links = [];
  let text = "";
  String(src).trim().split(/\s+\/\s+/).forEach((p, n) => {
    if (n) text += " ";
    const s = text.length;
    for (let i = 0; i < p.length; i++) {
      if (p[i] === "‿") { links.push(text.length); text += " "; }
      else text += p[i];
    }
    parts.push({ s, e: text.length });
  });
  return { text, parts, links };
}
/* 괄호 속 한국어 뜻을 뺀 글(연습 화면에 보이는 글·chunks와 비교하는 기준) */
const stripGloss = t => String(t || "").replace(GLOSS_RE, "");

/* 썰 → 연습 문장들 [{ text: 화면 글, data: sentences[i] 또는 null, a0, a1: 썰 음성 안 단어 번호 }]
   sentences가 썰 영어와 맞으면 그대로, 없거나 안 맞으면 문장 부호로 나눔(연습 데이터 없음 — 문장 전체로 연습) */
const STORY_SENTS = new WeakMap();
function storySents(story) {
  if (STORY_SENTS.has(story)) return STORY_SENTS.get(story);
  const G = stripGloss(story.en), gsc = getScript(G);
  let list = null;
  if (Array.isArray(story.sentences) && story.sentences.length) {
    const texts = story.sentences.map(s => (s && typeof s.chunks === "string" ? parseChunks(s.chunks).text : ""));
    if (texts.join(" ") === G) list = texts.map((text, i) => ({ text, data: story.sentences[i] }));
  }
  if (!list) list = G.split(/(?<=[.!?]["”]?)\s+(?=[A-Z“"])/).filter(t => t.trim()).map(text => ({ text, data: null }));
  let pos = 0;
  list.forEach(s => {
    const at = G.indexOf(s.text, pos), st = at < 0 ? pos : at;
    pos = st + s.text.length;
    s.a0 = -1; s.a1 = -1;
    for (let i = st; i < pos; i++) { const w = gsc.wAt[i]; if (w >= 0) { if (s.a0 < 0) s.a0 = w; s.a1 = w; } }
  });
  const out = list.filter(s => s.a0 >= 0);
  STORY_SENTS.set(story, out);
  return out;
}
/* 음성 글에서 a0~a1 단어 구간 안의 괄호 속 한국어 뜻 → [{ en: 바로 앞 단어, ko: 뜻 }] */
function glossesIn(text, a0, a1) {
  const sc = getScript(text), out = [];
  const re = new RegExp(GLOSS_RE.source, "g");
  let m;
  while ((m = re.exec(text))) {
    let j = m.index - 1;
    while (j >= 0 && /\s/.test(text[j])) j--;
    const k = j >= 0 ? sc.wAt[j] : -1;
    if (k < a0 || k > a1) continue;
    const w = sc.words[k];
    const en = w.pieces.map(p => text.slice(p[0], p[1])).join("").replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, "");
    out.push({ en, ko: m[0].trim().replace(/^\(|\)$/g, "") });
  }
  return out;
}

/* ---- 재생 목록 → { items: [문장], blocks: [카드 또는 표현], exprScope }
   문장 { kind: dlg|ex|story, ci, block, n, total, who, key, line(dlg) | ex·xid + x(ex) / si(story) } */
function buildPractice(o, curCi) {
  const items = [], blocks = [];
  const exprScope = o.scope === "learning" || o.scope === "due" || o.scope === "expr";   // expr: 표현 하나(o.xid — "이 표현 연습하기")
  const addBlock = (b, fill) => {                     // 문장이 하나라도 있을 때만 블록으로
    const start = items.length;
    fill(blocks.length);
    if (items.length > start) blocks.push(Object.assign(b, { start }));
  };
  const exprItems = (bi, it, withEx, withStory) => {
    const ex = it.ex, base = { block: bi, ci: it.ci, xid: it.id, ex };
    if (withEx) (ex.examples || []).forEach((x, n, arr) => { if (x && x.en) items.push(Object.assign({ kind: "ex", x, n: n + 1, total: arr.length, who: "them" }, base)); });
    if (withStory && ex.story && ex.story.en) storySents(ex.story).forEach((s, n, arr) => items.push(Object.assign({ kind: "story", si: n, n: n + 1, total: arr.length, who: "me" }, base)));
  };
  if (exprScope) {
    (o.scope === "expr" ? [EXPR_BY_ID[o.xid]].filter(Boolean) : driveExprs(o)).forEach(it => addBlock({ kind: "expr", ci: it.ci, xid: it.id, key: "x" + it.id }, bi => exprItems(bi, it, true, true)));
  } else {
    CARDS.forEach((card, ci) => {
      if (o.scope === "current" && ci !== curCi) return;
      if (o.scope === "cat" && !o.cats.includes(card.category)) return;
      addBlock({ kind: "card", ci, cid: card.id, key: "c" + card.id }, bi => {
        const d = card.dialogue || [];
        if (hasDlg(o.content)) d.forEach((line, n) => { if (line.en) items.push({ kind: "dlg", line, who: whoOf(line), name: whoLabel(line.who), block: bi, ci, n: n + 1, total: d.length }); });
        if (hasEx(o.content) || hasStory(o.content)) EXPR_LIST.filter(it => it.ci === ci && it.kind === "core").forEach(it => exprItems(bi, it, hasEx(o.content), hasStory(o.content)));
      });
    });
  }
  items.forEach(it => { it.key = blocks[it.block].key + "/" + it.kind + "/" + (it.xid || "") + "/" + it.n; });
  return { items, blocks, exprScope };
}

/* 문장 하나의 연습 정보 { it, audio(음성 글), display(화면 글), asc·dsc(각 글의 getScript), a0, a1, has(연습 데이터 있음),
   chunks: [{ s, e(화면 글 위치), d0, d1(화면 단어 번호), solo }], links, tips, ko, glosses, who } */
function pcUnit(it) {
  let audio, display, data, a0 = 0, a1 = null, ko = "";
  if (it.kind === "dlg") { audio = it.line.en; display = stripGloss(audio); data = it.line; ko = it.line.ko; }
  else if (it.kind === "ex") { audio = it.x.en; display = stripGloss(audio); data = it.x; ko = it.x.ko; }
  else {
    const s = storySents(it.ex.story)[it.si];
    audio = it.ex.story.en; display = s.text; data = s.data; a0 = s.a0; a1 = s.a1; ko = data ? data.ko : "";
  }
  const asc = getScript(audio), dsc = getScript(display);
  if (a1 == null) a1 = asc.words.length - 1;
  const pc = data && typeof data.chunks === "string" ? parseChunks(data.chunks) : null;
  const has = !!pc && pc.text === display;
  const parts = has ? pc.parts : [{ s: 0, e: display.length }];
  const solo = has && Array.isArray(data.soloChunks) && parts.length > 1 ? data.soloChunks : [];
  const chunks = [];
  parts.forEach((p, n) => {
    let d0 = -1, d1 = -1;
    for (let i = p.s; i < p.e; i++) if (dsc.wAt[i] >= 0) { if (d0 < 0) d0 = dsc.wAt[i]; d1 = dsc.wAt[i]; }
    if (d0 >= 0) chunks.push({ s: p.s, e: p.e, d0, d1, solo: solo.includes(n + 1) });
  });
  return { it, audio, display, asc, dsc, a0, a1, has, chunks, links: has ? pc.links : [],
    tips: has && Array.isArray(data.tips) ? data.tips : [], ko: ko || "", glosses: glossesIn(audio, a0, a1), who: it.who };
}
/* 단계 수: 청크 n개 + 연결 단계 1개. 청크가 하나뿐이거나 '전체 문장만'이면 연결 단계만 */
const pcSteps = u => (PC.opts.method === "chunk" && u.chunks.length > 1 ? u.chunks.length + 1 : 1);
const pcIsLink = () => !!PC.u && PC.step === pcSteps(PC.u) - 1;

/* 문장: 인터랙티브 스크립트(scriptHtml)로 그리고, 청크마다 .ck로 감싸 사이에 슬래시, 연음 자리는 .lk */
function pcSentenceHtml(u) {
  const last = u.chunks.length - 1;
  const ranges = u.chunks.map((c, n) => ({
    s: c.s, e: c.e, open: '<span class="ck" data-ck="' + n + '">',
    close: '</span>' + (n < last ? '<span class="ck-sep" aria-hidden="true">/</span>' : "")
  }));
  return scriptHtml(u.display, ranges, { links: new Set(u.links) });
}

/* 재생기: 지금 문장의 항목 = [청크 1…n, 문장 전체] (청크 단계가 없으면 [문장 전체]). 단계 번호 = 항목 번호 */
PC.rd = createReader({
  items: () => {
    const u = PC.u, el = PC.ui && PC.ui.en.querySelector(".sc");
    if (!u || !el) return [];
    const base = { el, who: u.who, script: u.asc };
    const whole = u.a0 === 0 && u.a1 === u.asc.words.length - 1;        // 음성 전체가 이 문장(대사·예문) → 원래 mp3 그대로
    const link = whole ? base : Object.assign({ from: u.a0, to: u.a1, offset: -u.a0 }, base);
    if (pcSteps(u) === 1) return [link];
    return u.chunks.map(c => (c.solo ?
      { el, who: u.who, script: getScript(u.display.slice(c.s, c.e)), offset: c.d0 } :
      Object.assign({}, base, { from: u.a0 + c.d0, to: u.a0 + c.d1, offset: -u.a0 }))).concat([link]);
  },
  rate: () => PC.opts.rate,
  onEnd: () => pcPaint(),
  onChange: () => pcPaint()
});
Player.onChange(() => { if (PC.open) pcPaint(); });

/* 지금 위치 [위 줄, 아래 줄] 예) "카페에서 주문하기 · 1/2" / "대화 2/6", "Can I get ~? · 예문 3/5", "Can I get ~? · 썰 · 문장 2/4" */
function pcLabels(k) {
  const pl = PC.pl, it = pl.items[k], card = CARDS[it.ci], B = pl.blocks.length, pos = (it.block + 1) + "/" + B;
  const ph = it.ex ? it.ex.phrase : "";
  return [
    pl.exprScope && B > 1 ? "표현 " + pos + " · " + card.title : card.title + (B > 1 ? " · " + pos : ""),
    it.kind === "dlg" ? "대화 " + it.n + "/" + it.total :
      it.kind === "ex" ? ph + " · 예문 " + it.n + "/" + it.total : ph + " · 썰 · 문장 " + it.n + "/" + it.total
  ];
}

/* ---- 위치 기억 ---- */
function pcSavePos() {
  const pl = PC.pl, it = pl && pl.items[PC.idx];
  if (!it || PC.done || PC.quick) return;             // 바로 연습은 시작 화면의 '이어 하기' 위치를 건드리지 않음
  PC.pos = {
    scope: PC.opts.scope, cats: catsKey(PC.opts.cats), cid: PC.opts.scope === "current" ? CARDS[PC.curCi].id : null,
    key: it.key, step: PC.step, block: pl.blocks[it.block].key, bcid: CARDS[it.ci].id, bi: it.block, label: pcLabels(PC.idx).join(" · ")
  };
  savePractice();
}
/* 저장된 위치 → 이 재생 목록의 문장 번호. 같은 문장 → 그 카드(표현)의 처음 → 가장 가까운 카드의 처음. 이어 할 수 없으면 -1 */
function pcResumeIdx(pl) {
  const p = PC.pos;
  if (!p || !pl.items.length || p.scope !== PC.opts.scope) return -1;
  if (p.scope === "cat" && p.cats !== catsKey(PC.opts.cats)) return -1;
  if (p.scope === "current" && p.cid !== CARDS[PC.curCi].id) return -1;
  const k = pl.items.findIndex(it => it.key === p.key);
  if (k >= 0) return k;
  const b = pl.blocks.find(bl => bl.key === p.block);
  if (b) return b.start;
  if (!pl.exprScope && p.bcid != null) return (pl.blocks.find(bl => bl.cid > p.bcid) || pl.blocks[pl.blocks.length - 1]).start;
  return pl.blocks[Math.max(0, Math.min(p.bi || 0, pl.blocks.length - 1))].start;
}

/* ---- 시작 화면 (드라이브 모드 시작 화면과 같은 틀·CSS) ---- */
function pcSetupHtml() {

  const seg = (name, list, cls) => '<div class="seg' + (cls ? " " + cls : "") + '" data-pc-set="' + name + '">' +

  const resumeK = pcResumeIdx(pl);
  let words = 0, noData = 0;
  pl.items.forEach(it => {

  });

  const mins = Math.max(1, Math.round((words * 0.4 * per / o.rate + pl.items.length * 2) / 60));
  const empty = o.scope === "cat" && !o.cats.length ? "카테고리를 하나 이상 골라 주세요" :
    o.scope === "learning" ? "학습 중인 표현이 없어요 · 표현 탭에서 '학습하기'를 시작해 보세요" :
    o.scope === "due" ? "오늘 복습할 표현이 없어요" : "연습할 문장이 없어요";
  const unit = exprScope ? "표현 " + pl.blocks.length + "개" : "카드 " + pl.blocks.length + "장";
  return '<header class="dv-head">' +
      '<button class="dv-x" type="button" data-pc="close" aria-label="닫기">' + ICON_X + '</button>' +
      '<h2 class="dv-title">연습 모드</h2>' +
    '</header>' +
    '<div class="dv-sbody">' +
      '<p class="dv-lead">한 문장씩 청크(끊어 읽는 덩어리)·연음·발음을 듣고 소리 내어 따라 말해요.</p>' +
      '<div class="set-group"><span class="set-label">범위</span><div class="dv-scope">' +
        opt("current", CARDS[PC.curCi].title, true) +
        opt("all", "카드 " + CARDS.length + "장") +
        opt("cat", o.scope === "cat" && o.cats.length ? o.cats.length + "개 고름" : "골라서 연습") +
        opt("learning", nLearn + "개") +
        opt("due", nDue + "개") +
      '</div>' +
      (o.scope === "cat" ? '<div class="dv-cats">' + cats.map(n =>
        '<button class="dv-cat" type="button" data-pc-cat="' + esc(n) + '" aria-pressed="' + o.cats.includes(n) + '">' +
          (CATEGORY_EMOJI[n] || "") + " " + esc(n) + " " + CARDS.filter(c => c.category === n).length + '</button>').join("") + '</div>' : "") +
      '</div>' +
      '<div class="set-group' + (exprScope ? " dv-dis" : "") + '"><span class="set-label">내용 (여러 개 선택)</span>' +
        contentChecksHtml(o.content, "data-pc-cbx") +
        '<p class="note">' + contentNote(o.content, false, exprScope) + '</p>' +
      '</div>' +
      '<div class="set-group"><span class="set-label">연습 방식</span>' +
        seg("method", [["chunk", "청크 단계 포함"], ["whole", "전체 문장만"]]) +
        '<p class="note">' + (o.method === "chunk" ?
          "청크를 하나씩 듣고 따라 말한 다음, 문장 전체를 한 번에 이어서 말해요." :
          "청크 단계 없이 문장 전체를 듣고 한 번에 따라 말해요.") + '</p>' +

      '<div class="dv-sum">' + (pl.items.length ? unit + " · 문장 " + pl.items.length + "개 · 약 " + mins + "분" +
        (noData ? "<br>청크·발음 팁이 아직 없는 " + noData + "문장은 문장 전체로 연습해요" : "") : esc(empty)) + '</div>' +
      '<div class="dv-go">' + (resumeK >= 0 ?
        '<button class="btn" type="button" data-pc="restart">처음부터</button>' +
        '<button class="btn main" type="button" data-pc="resume"><span>이어 하기</span><small>' + esc(PC.pos.label || "") + '</small></button>' :
        '<button class="btn main" type="button" data-pc="start"' + (pl.items.length ? "" : " disabled") + '><span>시작</span></button>') +
      '</div>' +

}
function pcRenderSetup() {

  const y = body ? body.scrollTop : 0;

}

/* ---- 연습 화면 ---- */
function pcPlayHtml() {

      '<button class="dv-x" type="button" data-pc="close" aria-label="연습 모드 나가기">' + ICON_X + '</button>' +
