<!-- 카드를 추가하려면 CARDS 배열 끝에 객체를 붙여넣으세요 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>한 장 영어</title>
<!-- 웹앱 설치용(같은 폴더에 manifest·아이콘·sw.js가 있을 때만 동작, 없어도 앱은 정상 동작) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    color-scheme: dark;
    --bg:#121417;
    --bg-2:#1A1D21;
    --bg-3:#23272D;
    --text:#ECE9E4;
    --text-2:#C9CBCF;
    --muted:#A1A7B0;
    --faint:#6E747D;
    --line:rgba(255,255,255,.08);
    --bubble:#1F2328;
    --bubble-text:#E9E7E3;
    --accent:#86C2AC;
    --accent-soft:rgba(134,194,172,.11);
    --accent-line:rgba(134,194,172,.42);
    --mark:rgba(134,194,172,.26);
    --me:#2D5C4F;
    --me-text:#F0F7F3;
    --sheet:#1A1D21;
    --scrim:rgba(0,0,0,.58);
    --shadow:0 -12px 40px rgba(0,0,0,.45);
    --toast:#2B3036;
    --tag-l:74%;
    --tag-a:.15;
    --glow-a:.10;
    --pad:20px;
    --tabbar-h:58px;
    --on-accent:#10201B;
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme: light;
      --bg:#F5F3EE;
      --bg-2:#ECE9E2;
      --bg-3:#F0EDE6;
      --text:#1F2226;
      --text-2:#3B3F45;
      --muted:#5E646C;
      --faint:#979DA5;
      --line:rgba(0,0,0,.08);
      --bubble:#FFFFFF;
      --bubble-text:#24272B;
      --accent:#2C7A63;
      --accent-soft:rgba(44,122,99,.07);
      --accent-line:rgba(44,122,99,.36);
      --mark:rgba(44,122,99,.16);
      --me:#2C7A63;
      --me-text:#FFFFFF;
      --sheet:#FBFAF7;
      --scrim:rgba(20,22,25,.34);
      --shadow:0 -12px 40px rgba(0,0,0,.12);
      --toast:#2B3036;
      --tag-l:34%;
      --tag-a:.12;
      --glow-a:.09;
      --on-accent:#FFFFFF;
    }
  }
  @media (max-width:370px){ :root{ --pad:18px; } }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background:var(--bg); color:var(--text);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:17px; line-height:1.55;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    word-break:keep-all; overflow-wrap:break-word;
  }
  button{
    font:inherit; color:inherit; background:none; border:0; padding:0; margin:0;
    cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  button:focus{ outline:none; }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  svg{ display:block; }

  /* ---------- 앱 틀: 화면 + 하단 탭 바 ---------- */
  .app{
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
  }
  .views{ position:relative; flex:1; min-height:0; }
  .view{ position:absolute; inset:0; }
  .view.off{ visibility:hidden; pointer-events:none; }   /* display:none이 아니라서 스크롤 위치·입력 내용이 그대로 남음 */
  .tabbar{
    position:relative; z-index:15;
    flex:none; display:flex;
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
    padding:0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background:var(--bg);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:12.5px; font-weight:600; color:var(--faint);
    transition:color .2s ease;
  }
  .tab svg{ width:23px; height:23px; }
  .tab[aria-selected="true"]{ color:var(--accent); }
  .tab:active svg{ transform:scale(.92); }
  body.typing .tabbar{ display:none; }   /* 키보드가 올라와 있을 땐 입력칸을 넓게 */

  /* ---------- 피드 ---------- */
  .feed{
    overflow-y:auto; overflow-x:hidden;
    scroll-snap-type:y mandatory;
    overscroll-behavior-y:none;
    scrollbar-width:none;
  }
  .feed::-webkit-scrollbar{ display:none; }

  .card{
    --h:160;
    position:relative;
    height:100%;
    scroll-snap-align:start; scroll-snap-stop:always;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:55%;
    background:radial-gradient(120% 70% at 50% -15%, hsl(var(--h) 55% 50% / var(--glow-a)), transparent 62%);
    pointer-events:none;
  }

  .top{
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) max(var(--pad), env(safe-area-inset-right)) 8px max(var(--pad), env(safe-area-inset-left));
  }
  .tag{
    font-size:13.5px; font-weight:600; letter-spacing:.01em;
    padding:6px 12px; border-radius:999px;
    color:hsl(var(--h) 52% var(--tag-l));
    background:hsl(var(--h) 50% 55% / var(--tag-a));
  }
  .top-r{ display:flex; align-items:center; gap:2px; }
  .jump{
    display:flex; align-items:center; gap:6px;
    height:36px; padding:0 10px; border-radius:999px;
    font-size:14px; color:var(--faint); font-variant-numeric:tabular-nums; letter-spacing:.02em;
  }
  .jump:active{ background:var(--line); }
  .jump svg{ width:17px; height:17px; }
  .gear{
    width:40px; height:40px; margin-right:-10px;
    display:grid; place-items:center; border-radius:50%;
    color:var(--faint);
  }
  .gear:active{ background:var(--line); }
  .gear svg{ width:21px; height:21px; }

  .body{
    position:relative;
    flex:1; min-height:0;
    overflow-y:auto; overflow-x:hidden;
    overscroll-behavior-y:auto;
    padding:0 max(var(--pad), env(safe-area-inset-right)) 0 max(var(--pad), env(safe-area-inset-left));
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 22px), transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 22px), transparent 100%);
  }
  .body::-webkit-scrollbar{ display:none; }
  .inner{
    min-height:100%;
    display:flex; flex-direction:column; justify-content:flex-start;
    padding:22px 0 30px;
  }

  .title{ margin:0; font-size:24px; line-height:1.3; font-weight:700; letter-spacing:-.015em; }
  .situation{ margin:10px 0 0; font-size:17px; line-height:1.6; color:var(--text-2); }

  /* ---------- 대화 ---------- */
  .chat{ display:flex; flex-direction:column; gap:10px; margin-top:28px; }
  .row{ display:flex; flex-direction:column; max-width:88%; }
  .row.them{ align-self:flex-start; align-items:flex-start; }
  .row.me{ align-self:flex-end; align-items:flex-end; }
  .row.later{ display:none; }
  .row.pop{ animation:popIn .38s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes popIn{ from{ opacity:0; transform:translateY(10px) scale(.98); } to{ opacity:1; transform:none; } }
  .who{ font-size:13px; color:var(--faint); margin:0 0 5px 8px; }
  .line{ display:flex; align-items:center; gap:8px; }

  .bubble{
    display:block;
    font-size:17.5px; line-height:1.45; text-align:left;
    padding:11px 15px; border-radius:20px;
  }
  .them .bubble{
    background:var(--bubble); color:var(--bubble-text);
    border-bottom-left-radius:6px;
    transition:transform .12s ease;
  }
  .say:active{ transform:scale(.98); }
  .say .ico{
    display:inline-block; vertical-align:-2px; margin-left:6px;
    width:16px; height:16px; color:var(--faint);
  }
  .say .ico svg{ width:16px; height:16px; }
  .say.playing .ico{ color:var(--accent); }
  .say.playing .ico svg{ animation:pulse 1s ease-in-out infinite; }
  @media (prefers-color-scheme: light){
    .them .bubble{ box-shadow:0 1px 2px rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.04); }
  }

  .blank{
    position:relative; display:block;
    font-size:17.5px; line-height:1.45; text-align:left;
    padding:11px 15px; border-radius:20px; border-bottom-right-radius:6px;
    border:1.5px dashed var(--accent-line);
    background:var(--accent-soft);
    color:var(--me-text);
    transition:background-color .35s ease, border-color .35s ease, transform .12s ease;
  }
  .blank:active{ transform:scale(.97); }
  .blank .ans{
    display:block;
    opacity:0; filter:blur(10px);
    transition:opacity .35s ease, filter .45s ease;
  }
  .blank .lines{
    position:absolute; inset:11px 15px;
    display:flex; flex-direction:column; justify-content:center; gap:9px;
    transition:opacity .25s ease;
    pointer-events:none;
  }
  .blank .lines i{ display:block; height:2px; border-radius:2px; background:var(--accent); opacity:.4; }
  .blank .lines i:last-child{ width:58%; }
  .blank.shown{ background:var(--me); border-color:transparent; border-style:solid; }
  .blank.shown .ans{ opacity:1; filter:blur(0); }
  .blank.shown .lines{ opacity:0; }

  .spk{
    flex:none;
    width:36px; height:36px; border-radius:50%;
    display:grid; place-items:center;
    color:var(--accent); background:var(--accent-soft);
    transition:opacity .3s ease, transform .3s ease;
  }
  .spk svg{ width:18px; height:18px; }
  .spk:active{ transform:scale(.92); }
  .spk.playing svg{ animation:pulse 1s ease-in-out infinite; }
  .row.me .spk{ opacity:0; transform:scale(.6); pointer-events:none; }
  .row.me.revealed .spk{ opacity:1; transform:none; pointer-events:auto; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .ko{
    display:none;
    font-size:15.5px; line-height:1.5; color:var(--muted);
    margin:6px 8px 0;
  }
  .row.me .ko{ text-align:right; }
  .card.ko-on .ko{ display:block; animation:fadeIn .25s ease both; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  .typing .dots{ display:flex; gap:5px; padding:16px 17px; }
  .typing .dots i{ width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1s infinite ease-in-out; }
  .typing .dots i:nth-child(2){ animation-delay:.15s; }
  .typing .dots i:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; transform:translateY(0); } 40%{ opacity:.85; transform:translateY(-3px); } }

  .hint{
    font-size:12.5px; color:var(--faint);
    margin:6px 6px 0 0; max-height:20px;
    transition:opacity .3s ease, max-height .4s ease .2s, margin .4s ease .2s;
  }
  .hint.gone{ opacity:0; max-height:0; margin-top:0; }

  /* ---------- 대사 속 핵심 표현 (밑줄, 누르면 예문·썰) ---------- */
  .xp{
    text-decoration:underline;
    text-decoration-color:var(--accent);
    text-decoration-thickness:2px;
    text-underline-offset:4px;
    border-radius:4px;
    cursor:pointer;
    transition:background-color .15s ease;
  }
  .xp:active{ background:var(--accent-soft); }
  .blank.shown .xp{ text-decoration-color:rgba(255,255,255,.75); }
  .blank.shown .xp:active{ background:rgba(255,255,255,.14); }
  .xp-ko{ margin:12px 0 4px; font-size:16.5px; line-height:1.65; color:var(--text-2); }

  /* ---------- 하단 버튼 ---------- */
  .bottom{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:10px max(var(--pad), env(safe-area-inset-right)) 14px max(var(--pad), env(safe-area-inset-left));   /* 아래 여백(제스처 바)은 탭 바가 맡음 */
  }
  .actions{ display:flex; gap:10px; width:100%; }
  .btn{
    height:54px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:17px; font-weight:600;
    background:var(--bg-2); color:var(--text);
    border:1px solid var(--line);
    transition:transform .12s ease, background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn:active{ transform:scale(.98); }
  .restart{ flex:1; }
  .ko-btn{ flex:none; width:78px; font-size:16px; color:var(--muted); }
  .pa-main{ flex:1; color:var(--accent); }
  .pa-main svg{ width:20px; height:20px; }
  .card.pa-playing .pa-main, .card.pa-paused .pa-main{ background:var(--accent-soft); border-color:var(--accent-line); }
  .pa-stop{ flex:none; width:58px; color:var(--text); }
  .pa-stop svg{ width:20px; height:20px; }
  .pa-stop:disabled{ opacity:.35; cursor:default; }
  .pa-stop:disabled:active{ transform:none; }
  .ko-btn[aria-pressed="true"]{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .swipe-hint{ font-size:12.5px; color:var(--faint); }

  /* ---------- 마지막 카드 ---------- */
  .end .inner{ align-items:center; justify-content:center; text-align:center; }
  .end-emoji{ font-size:44px; line-height:1; margin-bottom:18px; }
  .end-title{ margin:0; font-size:34px; font-weight:750; letter-spacing:-.02em; }
  .end-sub{ margin:12px 0 0; font-size:17px; line-height:1.65; color:var(--text-2); }

  /* ---------- 바텀시트 ---------- */
  .scrim{
    position:fixed; inset:0; z-index:20;
    background:var(--scrim);
    opacity:0; pointer-events:none;
    transition:opacity .28s ease;
    touch-action:none;
  }
  .scrim.on{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:21;
    max-height:88vh; max-height:88dvh;
    display:flex; flex-direction:column;
    background:var(--sheet);
    border-radius:24px 24px 0 0;
    box-shadow:var(--shadow);
    transform:translateY(105%);
    visibility:hidden;
    transition:transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s linear .32s;
  }
  .sheet.on{
    transform:translateY(0); visibility:visible;
    transition:transform .36s cubic-bezier(.2,.8,.2,1), visibility 0s;
  }
  .sheet.dragging{ transition:none; }
  .sheet-head{
    flex:none; touch-action:none;
    padding:10px max(var(--pad), env(safe-area-inset-right)) 14px max(var(--pad), env(safe-area-inset-left));
    border-bottom:1px solid var(--line);
  }
  .handle{ width:40px; height:5px; border-radius:3px; background:var(--faint); opacity:.5; margin:0 auto 14px; }
  .sheet-ctx{ font-size:13px; color:var(--faint); }
  .sheet-title{ margin:4px 0 0; font-size:24px; line-height:1.3; font-weight:700; color:var(--accent); letter-spacing:-.01em; }
  .sheet-body{
    flex:1; min-height:0; overflow-y:auto;
    overscroll-behavior:contain;
    padding:6px max(var(--pad), env(safe-area-inset-right)) 8px max(var(--pad), env(safe-area-inset-left));
  }
  .sec-h{
    margin:20px 0 6px;
    font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--faint);
  }
  .sec-row{ display:flex; align-items:center; justify-content:space-between; margin:20px 0 6px; }
  .sec-row .sec-h{ margin:0; }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    height:36px; padding:0 14px 0 11px; border-radius:999px;
    font-size:14.5px; font-weight:600;
    color:var(--accent); background:var(--accent-soft);
  }
  .pill svg{ width:17px; height:17px; }
  .pill.playing svg{ animation:pulse 1s ease-in-out infinite; }
  .pill:active{ transform:scale(.96); }
  .ex{ list-style:none; margin:0; padding:0; counter-reset:ex; }
  .ex li{
    counter-increment:ex;
    position:relative; padding:12px 44px 12px 30px;
    border-bottom:1px solid var(--line);
  }
  .ex li:last-child{ border-bottom:0; }
  .ex li::before{
    content:counter(ex);
    position:absolute; left:0; top:14px;
    width:20px; height:20px; border-radius:50%;
    font-size:12px; font-weight:600; line-height:20px; text-align:center;
    color:var(--accent); background:var(--accent-soft);
  }
  .ex .spk{ position:absolute; right:0; top:10px; width:34px; height:34px; }
  .ex-en{ font-size:17px; line-height:1.5; }
  .ex-ko{ margin-top:3px; font-size:16px; line-height:1.55; color:var(--muted); }
  mark{
    color:inherit; font-weight:650;
    background:linear-gradient(transparent 58%, var(--mark) 58%);
    border-radius:2px; padding:0 1px;
  }
  .story{
    margin-top:6px; padding:16px 16px 14px;
    border-radius:18px; background:var(--bg-3);
  }
  .story-en{ margin:0; font-size:17.5px; line-height:1.7; }
  .story-ko{ margin:12px 0 0; padding-top:12px; border-top:1px solid var(--line); font-size:16px; line-height:1.65; color:var(--muted); }
  .sheet-foot{
    flex:none;
    padding:10px max(var(--pad), env(safe-area-inset-right)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(var(--pad), env(safe-area-inset-left));
    border-top:1px solid var(--line);
  }
  .sheet-close{ width:100%; }

  /* ---------- 설정 ---------- */
  .set-group{ padding:16px 0; border-bottom:1px solid var(--line); }
  .set-group:last-child{ border-bottom:0; }
  .set-label{ display:block; font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--faint); margin-bottom:9px; }
  .seg{ display:flex; gap:3px; padding:3px; border-radius:13px; background:var(--bg-2); border:1px solid var(--line); }
  .seg button{ flex:1; height:42px; border-radius:10px; font-size:15.5px; color:var(--muted); }
  .seg button[aria-pressed="true"]{ background:var(--bubble); color:var(--text); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .field{
    display:block; width:100%; height:48px; padding:0 14px;
    border-radius:12px; border:1px solid var(--line);
    background:var(--bg-2); color:var(--text);
    font:inherit; font-size:16px;
  }
  .field:focus{ outline:2px solid var(--accent-line); outline-offset:0; }
  .field + .field{ margin-top:8px; }
  .note{ margin:9px 2px 0; font-size:14px; line-height:1.6; color:var(--muted); }
  .switch-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .switch-row .set-label{ margin:0; font-size:16px; letter-spacing:0; color:var(--text); font-weight:500; }
  .switch{ flex:none; width:52px; height:32px; border-radius:999px; background:var(--bg-3); border:1px solid var(--line); position:relative; transition:background-color .2s ease; }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s ease; }
  .switch[aria-checked="true"]{ background:var(--accent); border-color:transparent; }
  .switch[aria-checked="true"]::after{ transform:translateX(20px); }
  .el-only[hidden]{ display:none; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn-row .btn{ flex:1; height:46px; font-size:15.5px; min-width:140px; }

  /* ---------- 목록 ---------- */
  .prog{ padding:14px 0 16px; }
  .prog-text{ font-size:15.5px; color:var(--text-2); margin-bottom:9px; }
  .prog-text b{ color:var(--accent); }
  .bar{ height:6px; border-radius:3px; background:var(--bg-3); overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:3px; background:var(--accent); }
  .toc-group{ margin-top:34px; }
  .toc-group:first-of-type{ margin-top:26px; }
  .toc-head{ display:flex; align-items:center; gap:11px; margin-bottom:10px; }
  .toc-emoji{
    flex:none; width:36px; height:36px; border-radius:11px;
    display:grid; place-items:center; font-size:19px; line-height:1;
    background:hsl(var(--h) 50% 55% / var(--tag-a));
  }
  .toc-cat{
    margin:0; flex:1;
    font-size:20px; font-weight:750; letter-spacing:-.015em;
    color:hsl(var(--h) 52% var(--tag-l));
  }
  .toc-cnt{ font-size:13.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .toc{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .toc-item{
    position:relative;
    width:100%; display:flex; align-items:center; gap:12px;
    padding:12px 12px 12px 14px; border-radius:12px;
    text-align:left; font-size:16.5px; line-height:1.4;
  }
  .toc-item:active{ background:var(--line); }
  .toc-n{
    flex:none; width:28px; height:28px; border-radius:50%;
    display:grid; place-items:center;
    font-size:13px; font-weight:600; color:var(--muted); background:var(--bg-2);
  }
  .toc-t{ flex:1; min-width:0; }
  .toc-check{
    flex:none; width:24px; height:24px; border-radius:50%;
    display:grid; place-items:center;
    border:1.5px solid var(--line);
  }
  .toc-check svg{ width:14px; height:14px; }
  .toc-item.seen .toc-check{ background:var(--accent); border-color:transparent; color:var(--on-accent); }
  .toc-item.current{ background:var(--accent-soft); }
  .toc-item.current::before{
    content:""; position:absolute; left:0; top:9px; bottom:9px;
    width:3.5px; border-radius:2px; background:var(--accent);
  }
  .toc-item.current .toc-t{ font-weight:650; }
  .toc-item.current .toc-n{ color:var(--accent); background:var(--bg-2); }

  /* ---------- 글쓰기 ---------- */
  .write{
    overflow-y:auto; overflow-x:hidden;
    overscroll-behavior-y:contain;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) max(var(--pad), env(safe-area-inset-right)) 40px max(var(--pad), env(safe-area-inset-left));
  }
  .w-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .w-date{ font-size:13.5px; color:var(--faint); font-weight:600; letter-spacing:.02em; }
  .w-title{ margin:4px 0 0; font-size:24px; line-height:1.3; font-weight:700; letter-spacing:-.015em; }
  .w-top .gear{ margin-top:2px; }
  .q-card{
    margin-top:20px; padding:18px 18px 16px;
    border-radius:20px;
    background:radial-gradient(120% 120% at 0% 0%, var(--accent-soft), transparent 70%), var(--bg-2);
    border:1px solid var(--line);
  }
  .q-label{ font-size:12.5px; font-weight:700; letter-spacing:.06em; color:var(--accent); }
  .q-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .q-change{
    font-size:13.5px; font-weight:600; color:var(--accent);
    padding:6px 10px; margin:-6px -8px -6px 0; border-radius:999px;
  }
  .q-change:active{ background:var(--accent-soft); }
  .q-pick{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .q-pick[hidden]{ display:none; }
  .q-opt{
    display:block; width:100%; text-align:left;
    padding:12px 14px; border-radius:14px;
    background:var(--bg); border:1px solid var(--line);
  }
  .q-opt:active{ transform:scale(.99); }
  .q-opt .o-en{ display:block; font-size:16px; font-weight:600; line-height:1.45; color:var(--text); }
  .q-opt .o-ko{ display:block; margin-top:3px; font-size:13.5px; line-height:1.5; color:var(--muted); }
  .q-opt .o-note{ display:block; margin-top:5px; font-size:12.5px; color:var(--faint); }
  .q-opt[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); }
  .q-opt:disabled{ opacity:.45; cursor:default; }
  .w-tabs{ display:flex; gap:8px; margin-top:18px; overflow-x:auto; scrollbar-width:none; }
  .w-tabs::-webkit-scrollbar{ display:none; }
  .w-tab{
    flex:none; display:inline-flex; align-items:center; gap:6px;
    height:38px; padding:0 15px; border-radius:999px;
    font-size:15px; font-weight:600; color:var(--muted);
    background:var(--bg-2); border:1px solid var(--line);
  }
  .w-tab[aria-selected="true"]{ color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .w-tab.add{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .w-tab .x{
    display:grid; place-items:center; width:20px; height:20px; margin-right:-7px;
    border-radius:50%; font-size:12px; line-height:1; background:rgba(0,0,0,.15);
  }
  .h-item + .h-item{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); }
  .h-num{ margin-bottom:6px; font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--accent); }
  .h-more{ flex:none; font-size:12.5px; color:var(--faint); }
  .q-en{ margin:8px 0 0; font-size:21px; line-height:1.4; font-weight:650; letter-spacing:-.01em; }
  .q-ko{ margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--muted); }
  .w-label{ display:block; margin:26px 2px 8px; font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--faint); }
  .w-area{
    display:block; width:100%; resize:none; overflow:hidden;
    padding:14px 16px; border-radius:16px;
    border:1px solid var(--line); background:var(--bg-2); color:var(--text);
    font:inherit; font-size:17px; line-height:1.65;
    -webkit-user-select:text; user-select:text;
  }
  .w-area:focus{ outline:2px solid var(--accent-line); outline-offset:0; }
  .w-area::placeholder{ color:var(--faint); }
  .w-main{ font-size:18.5px; line-height:1.7; min-height:190px; }
  #wFix{ min-height:140px; }
  .w-meta{ display:flex; justify-content:space-between; margin:8px 4px 0; font-size:13px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .w-ico{ display:inline-grid; place-items:center; width:20px; height:20px; }
  .w-ico svg{ width:20px; height:20px; }
  .when-on{ display:none !important; }
  .playing > .when-off, .done > .when-off{ display:none !important; }
  .playing > .when-on, .done > .when-on{ display:inline-grid !important; }
  .h-chev svg{ width:100%; height:100%; }
  .w-copy{ width:100%; margin-top:14px; color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .w-copy.done{ color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .listen-row{ display:flex; gap:10px; margin-top:12px; }
  .w-listen{ flex:1; }
  .w-listen.playing{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .w-rate{ flex:none; width:136px; align-self:center; }
  .w-h{ margin:40px 0 4px; font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--faint); }
  .w-empty{ margin:10px 2px 0; font-size:15px; color:var(--faint); }
  .w-history details{ border-bottom:1px solid var(--line); }
  .w-history summary{
    list-style:none; cursor:pointer;
    display:flex; align-items:center; gap:12px;
    padding:14px 2px;
  }
  .w-history summary::-webkit-details-marker{ display:none; }
  .h-date{ flex:none; font-size:13px; font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums; }
  .h-q{ flex:1; min-width:0; font-size:15.5px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .h-chev{ flex:none; width:18px; height:18px; color:var(--faint); transition:transform .25s ease; }
  .w-history details[open] .h-chev{ transform:rotate(180deg); }
  .h-body{ padding:0 2px 18px; }
  .h-qfull{ margin:0; font-size:16.5px; font-weight:600; line-height:1.5; }
  .h-qko{ margin:4px 0 0; font-size:14px; color:var(--muted); }
  .h-label-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0 6px; }
  .h-label-row .h-label{ margin:0; }
  .h-listen{ height:34px; }
  .h-listen .when-on svg, .h-listen .when-off svg{ width:16px; height:16px; }
  .h-label{ margin:14px 0 6px; font-size:12.5px; font-weight:600; letter-spacing:.04em; color:var(--faint); }
  .h-text{
    margin:0; padding:12px 14px; border-radius:14px; background:var(--bg-2);
    font-size:16px; line-height:1.65; white-space:pre-wrap; word-break:break-word;
    -webkit-user-select:text; user-select:text;
  }

  /* ---------- 토스트 ---------- */
  .toast{
    position:fixed; left:50%; z-index:40;
    bottom:calc(env(safe-area-inset-bottom, 0px) + var(--tabbar-h) + 84px);
    max-width:calc(100% - 40px);
    padding:11px 18px; border-radius:16px;
    background:var(--toast); color:#F1EFEB;
    font-size:14.5px; line-height:1.45; text-align:center;
    box-shadow:0 6px 24px rgba(0,0,0,.3);
    opacity:0; transform:translate(-50%, 10px);
    transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
  }
  .toast.on{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="views">
    <main class="view feed" id="feed" aria-label="영어 회화 카드"></main>

    <section class="view write off" id="viewWrite" aria-label="글쓰기" inert>
      <header class="w-top">
        <div>
          <div class="w-date" id="wDate"></div>
          <h2 class="w-title">오늘의 영어 일기</h2>
        </div>
        <button class="gear" id="wGear" type="button" aria-label="글쓰기 설정"></button>
      </header>

      <div class="w-tabs" id="wTabs" role="tablist" aria-label="오늘 쓴 글"></div>

      <div class="q-card">
        <div class="q-head">
          <div class="q-label">오늘의 질문</div>
          <button class="q-change" id="qChange" type="button" aria-expanded="false">다른 질문 고르기</button>
        </div>
        <p class="q-en" id="qEn"></p>
        <p class="q-ko" id="qKo"></p>
        <div class="q-pick" id="qPick" hidden></div>
      </div>

      <label class="w-label" for="wText">내 글</label>
      <textarea class="w-area w-main" id="wText" rows="6" placeholder="Write in English…" autocapitalize="sentences"></textarea>
      <div class="w-meta"><span id="wSaved"></span><span id="wCount">0 words</span></div>

      <button class="btn w-copy" id="wCopy" type="button"><span class="w-ico" id="wCopyIco"></span><span id="wCopyLabel">AI 첨삭용으로 복사</span></button>

      <label class="w-label" for="wFix">첨삭 붙여넣기</label>
      <textarea class="w-area" id="wFix" rows="5" placeholder="AI가 고쳐 준 글을 여기에 붙여넣으세요"></textarea>

      <div class="listen-row">
        <button class="btn w-listen" id="wListen" type="button"><span class="w-ico" id="wListenIco"></span><span id="wListenLabel">듣기</span></button>
        <div class="seg w-rate" id="wRate">
          <button type="button" data-v="0.8">0.8x</button>
          <button type="button" data-v="1">1.0x</button>
        </div>
      </div>

      <h3 class="w-h">지난 기록</h3>
      <div class="w-history" id="wHistory"></div>
    </section>
  </div>

  <nav class="tabbar" role="tablist" aria-label="화면 전환">
    <button class="tab" id="tabCards" type="button" role="tab" data-tab="cards" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M8 21h8"/></svg>
      <span>표현</span>
    </button>
    <button class="tab" id="tabWrite" type="button" role="tab" data-tab="write" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
      <span>글쓰기</span>
    </button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sheet-head" id="sheetHead">
    <div class="handle"></div>
    <div class="sheet-ctx" id="sheetCtx"></div>
    <h3 class="sheet-title" id="sheetTitle"></h3>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot">
    <button class="btn sheet-close" id="sheetClose" type="button">닫기</button>
  </div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* 카드를 추가하려면 CARDS 배열 끝에 객체를 붙여넣으세요 */
/* dialogue의 ko(한국어 뜻)는 '한글' 버튼을 눌렀을 때만 보여요. */
const CARDS = [
  {
    id: 1,
    category: "카페·식당",
    title: "카페에서 주문하기",
    situation: "동네 카페에서 따뜻한 아메리카노를 주문하려고 해요. 가져갈 거고, 직원이 이름도 물어볼 거예요.",
    dialogue: [
      { who: "staff", en: "Hi there! What can I get started for you?", ko: "안녕하세요! 뭐 준비해 드릴까요?" },
      { who: "me", en: "Can I get a medium hot americano, please?", ko: "따뜻한 아메리카노 미디엄으로 주시겠어요?" },
      { who: "staff", en: "Sure thing. For here or to go?", ko: "그럼요. 드시고 가세요, 가져가세요?" },
      { who: "me", en: "To go, please.", ko: "가져갈게요." },
      { who: "staff", en: "Perfect. And can I get a name for the order?", ko: "좋아요. 주문하신 분 성함이 어떻게 되세요?" },
      { who: "me", en: "It's Minji.", ko: "민지예요." },
      { who: "staff", en: "Sorry, how do you spell that?", ko: "죄송한데, 철자가 어떻게 되세요?" },
      { who: "me", en: "M-I-N-J-I.", ko: "M-I-N-J-I요." }
    ],
    expressions: [
      {
        phrase: "Can I get ~?",
        ko: "주문할 때 제일 많이 쓰는 말로, '~ 주세요'를 부드럽게 말하는 느낌이에요. 뒤에 please를 붙이면 더 공손해요. 주문뿐 아니라 뭔가 부탁할 때도 두루 써요. 비슷한 표현: I'll have ~. / Could I get ~?",
        examples: [
          { en: "Can I get the check when you get a chance?", ko: "시간 되실 때 계산서 좀 주시겠어요?" },
          { en: "Can I get a window seat, please?", ko: "창가 자리로 주실 수 있나요?" },
          { en: "Can I get a quick update on the project before lunch?", ko: "점심 전에 프로젝트 진행 상황 좀 간단히 들을 수 있을까요?" },
          { en: "Can I get a bite of your sandwich?", ko: "네 샌드위치 한 입만 먹어봐도 돼?" },
          { en: "Can I get a late checkout tomorrow?", ko: "내일 레이트 체크아웃 가능할까요?" }
        ],
        story: {
          en: "So yesterday I walked into this tiny café, and I got super nervous because the line was so long. When it was finally my turn, I just blurted out, “Can I get an iced latte?” and the barista goes, “Sure, what size?” I totally hadn't thought about sizes, so I just pointed at a random cup and laughed it off.",
          ko: "어제 진짜 작은 카페에 들어갔는데, 줄이 너무 길어서 엄청 긴장했거든. 드디어 내 차례가 돼서 그냥 “아이스 라떼 주세요” 하고 불쑥 말했는데, 바리스타가 “네, 사이즈는요?” 하는 거야. 사이즈는 생각도 못 해서, 그냥 아무 컵이나 가리키고 웃어넘겼지."
        }
      },
      {
        phrase: "~ to go",
        ko: "'포장해서 가져갈게요'라는 뜻이에요. 음식·음료 이름 뒤에 붙이면 끝. 점원이 For here or to go?(드시고 가세요, 가져가세요?)라고 물으면 To go 한마디로 답하면 돼요. 먹다 남은 음식을 싸 달라고 할 때도 써요. 비슷한 표현: takeout(포장 음식)",
        examples: [
          { en: "Can I get the rest of this to go?", ko: "남은 거 포장해 갈 수 있을까요?" },
          { en: "I'll just grab a salad to go and eat at my desk.", ko: "그냥 샐러드 포장해서 자리에서 먹을게요." },
          { en: "Let's get tacos to go and eat by the river.", ko: "타코 포장해서 강가에서 먹자." },
          { en: "We grabbed two coffees to go before our train left.", ko: "기차 떠나기 전에 커피 두 잔 포장해 왔어." },
          { en: "Is that for here or to go?", ko: "드시고 가세요, 가져가세요?" }
        ],
        story: {
          en: "Okay, so this morning I was running super late, right? I ran into the café and said, “One latte to go, please!” like I was in some movie. Then I realized I'd left my wallet at home, so I had to pay with my phone while the whole line watched me. So embarrassing.",
          ko: "오늘 아침에 나 완전 늦었거든? 카페에 뛰어 들어가서 무슨 영화 주인공처럼 “라떼 한 잔 포장이요!” 했지. 근데 지갑을 집에 두고 온 걸 알아채서, 줄 선 사람들이 다 보는 앞에서 폰으로 결제해야 했어. 진짜 창피했어."
        }
      },
      {
        phrase: "Sure thing.",
        ko: "'물론이죠', '그럼요'라는 밝은 대답이에요. 그냥 Sure보다 친근하고 기분 좋은 느낌. 점원이 손님 부탁에 대답할 때 정말 자주 들려요. 비슷한 표현: You got it. / No problem.",
        examples: [
          { en: "Sure thing, I'll send you the file in a minute.", ko: "그럼요, 금방 파일 보내드릴게요." },
          { en: "Sure thing, I'll save you a seat.", ko: "그럼, 네 자리 맡아둘게." },
          { en: "Sure thing, your table will be ready in five minutes.", ko: "물론이죠, 5분 뒤에 테이블 준비돼요." },
          { en: "Sure thing, I'll bring up some extra towels right away.", ko: "물론이죠, 수건 바로 더 가져다드릴게요." },
          { en: "Sure thing, I can pick you up at the airport.", ko: "그럼, 공항으로 데리러 갈게." }
        ],
        story: {
          en: "Last night my roommate texted me asking if I could feed her cat this weekend. I just replied, “Sure thing!” without even checking my calendar. Then I remembered I'd already booked a trip to Busan for that exact weekend. So now I'm frantically looking for a cat sitter, which is so me.",
          ko: "어젯밤에 룸메이트가 이번 주말에 고양이 밥 좀 줄 수 있냐고 문자를 보냈어. 나는 일정도 안 보고 “당연하지!” 하고 답장했지. 그러고 나서야 바로 그 주말에 부산 여행을 이미 예약해 둔 게 생각난 거야. 그래서 지금 정신없이 고양이 돌봐줄 사람 찾는 중이야. 완전 나답지."
        }
      }
    ]
  },
  {
    id: 2,
    category: "카페·식당",
    title: "음료가 잘못 나왔을 때",
    situation: "분명 아이스 라떼를 시켰는데, 직원이 내 이름을 부르며 따뜻한 라떼를 내밀어요. 기분 상하지 않게 말하고 싶어요.",
    dialogue: [

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function hueOf(category) {
  if (category in CATEGORY_HUE) return CATEGORY_HUE[category];
  let h = 0;
  for (const ch of String(category)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}

/* 예문·썰에서 표현 부분을 형광펜으로 (밑줄과 같은 규칙으로 찾음) */
function decorate(text, ex) {
  const ranges = [];
  exprSources(ex).forEach(src => {
    const re = new RegExp(src, "gi");
    let m;
    while ((m = re.exec(text))) {
      if (!m[0].length) { re.lastIndex++; continue; }
      ranges.push([m.index, m.index + m[0].length]);
    }
  });
  ranges.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
  let html = "", pos = 0;
  ranges.forEach(r => {
    if (r[0] < pos) return;
    html += esc(text.slice(pos, r[0])) + "<mark>" + esc(text.slice(r[0], r[1])) + "</mark>";
    pos = r[1];
  });
  return html + esc(text.slice(pos));
}

function buzz() {
  try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) { /* 지원 안 하면 무시 */ }
}

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2800);
}

function spkAttrs(text, who) {
  return ' data-say="' + esc(text) + '" data-who="' + who + '"';
}

/* ---------- 핵심 표현 찾기: phrase의 ~ 자리는 아무 단어, forms는 활용형(예: stayed in) ---------- */
function patternSource(p) {
  const parts = String(p).split("~")
    .map(s => s.trim().replace(/^[\s,.!?]+|[\s,.!?]+$/g, ""))
    .filter(Boolean);
  if (!parts.length) return null;
  let src = parts.map(reEsc).join(".{1,40}?");
  if (/^\w/.test(parts[0])) src = "\\b" + src;
  if (/\w$/.test(parts[parts.length - 1])) src += "\\b";
  return src;
}
function exprSources(e) {
  return [e.phrase].concat(e.forms || []).map(patternSource).filter(Boolean);
}
function exprFound(e, text) {
  return exprSources(e).some(src => new RegExp(src, "i").test(text));
}
/* 대사 안의 핵심 표현에 밑줄(누르면 예문·썰) */
function markExpressions(text, card, ci) {
  const ranges = [];
  (card.expressions || []).forEach((e, ei) => {
    exprSources(e).forEach(src => {
      const re = new RegExp(src, "gi");
      let m;
      while ((m = re.exec(text))) {
        if (!m[0].length) { re.lastIndex++; continue; }
        ranges.push({ s: m.index, e: m.index + m[0].length, ei });
      }
    });
  });
  ranges.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  let html = "", pos = 0;
  ranges.forEach(r => {
    if (r.s < pos) return;
    html += esc(text.slice(pos, r.s)) +
      '<span class="xp" data-c="' + ci + '" data-e="' + r.ei + '">' + esc(text.slice(r.s, r.e)) + '</span>';
    pos = r.e;
  });
  return html + esc(text.slice(pos));
}

/* ---------- 렌더링 ---------- */
function renderCard(card, i) {
  let firstThem = true;
  let hintPlaced = false;
  let meCount = 0;
  const rows = (card.dialogue || []).map(line => {
    const stage = meCount;                      // 앞에 나온 "me" 대사 수 = 이 줄이 보이는 단계
    const later = stage > 0 ? " later" : "";
    const ko = line.ko ? '<div class="ko">' + esc(line.ko) + '</div>' : "";
    if (line.who === "me") {
      meCount++;
      const bars = "<i></i>".repeat(line.en.length > 30 ? 3 : 2);
      let hint = "";
      if (i === 0 && !hintPlaced) { hint = '<div class="hint">탭해서 확인</div>'; hintPlaced = true; }
      return '<div class="row me' + later + '" data-stage="' + stage + '">' +
        '<div class="line">' +
          '<button class="spk" type="button" aria-label="내 대사 듣기"' + spkAttrs(line.en, "me") + '>' + ICON_SPEAKER + '</button>' +
          '<button class="blank" type="button" aria-pressed="false" aria-label="내 차례. 탭해서 정답 보기">' +
            '<span class="ans">' + markExpressions(line.en, card, i) + '</span>' +
            '<span class="lines" aria-hidden="true">' + bars + '</span>' +
          '</button>' +
        '</div>' + ko + hint +
      '</div>';
    }
    const label = firstThem ? '<span class="who">' + esc(WHO_LABEL[line.who] || "상대") + '</span>' : "";
    firstThem = false;
    return '<div class="row them' + later + '" data-stage="' + stage + '">' + label +
      '<button class="bubble say" type="button"' + spkAttrs(line.en, "them") + '>' + markExpressions(line.en, card, i) +
        '<span class="ico">' + ICON_SPEAKER + '</span></button>' + ko +
    '</div>';
  }).join("");

  const swipe = i === 0 ? '<div class="swipe-hint">밑줄 친 표현을 누르면 예문·썰 · 위로 넘기면 다음 상황</div>' : "";

  return '<section class="card" style="--h:' + hueOf(card.category) + '" data-i="' + i + '" data-stage="0">' +
    '<header class="top"><span class="tag">' + esc(card.category) + '</span>' +
      '<span class="top-r"><button class="jump" type="button" aria-label="카드 목록">' + (i + 1) + ' / ' + CARDS.length + ICON_LIST + '</button>' +
      '<button class="gear" type="button" aria-label="음성 설정">' + ICON_SLIDERS + '</button></span></header>' +
    '<div class="body"><div class="inner">' +
      '<h2 class="title">' + esc(card.title) + '</h2>' +
      '<p class="situation">' + esc(card.situation) + '</p>' +
      '<div class="chat">' + rows + '</div>' +
    '</div></div>' +
    '<footer class="bottom">' +
      '<div class="actions">' +
        '<button class="btn ko-btn" type="button" aria-pressed="false">한글</button>' +
        '<button class="btn pa-main" type="button">' + paLabel("idle") + '</button>' +
        '<button class="btn pa-stop" type="button" aria-label="정지하고 처음으로" disabled>' + ICON_STOP + '</button>' +
      '</div>' +
      swipe +
    '</footer>' +
  '</section>';
}

/* 전체 듣기 버튼 모양: idle(전체 듣기) / playing(일시정지) / paused(이어 듣기) */
function paLabel(state) {
  if (state === "playing") return ICON_PAUSE + '<span>일시정지</span>';
  if (state === "paused") return ICON_PLAY + '<span>이어 듣기</span>';
  return ICON_PLAY + '<span>전체 듣기</span>';
}

/* ---------- 음성 캐시 (한 번 만든 ElevenLabs 음성은 폰에 저장해서 재사용) ---------- */
const AudioCache = (() => {
  const mem = new Map();
  let dbp = null;
  function db() {
    if (!dbp) {
      dbp = new Promise(res => {
        try {
          const r = indexedDB.open("engcards-tts", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("audio");
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(null);
        } catch (e) { res(null); }
      });
    }
    return dbp;
  }
  async function get(k) {
    if (mem.has(k)) return mem.get(k);
    const d = await db();
    if (!d) return null;
    return new Promise(res => {
      try {
        const q = d.transaction("audio").objectStore("audio").get(k);
        q.onsuccess = () => { const b = q.result || null; if (b) mem.set(k, b); res(b); };
        q.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  async function put(k, blob) {
    mem.set(k, blob);
    const d = await db();
    if (!d) return;
    try { d.transaction("audio", "readwrite").objectStore("audio").put(blob, k); } catch (e) {}
  }
  async function clear() {
    mem.clear();
    const d = await db();
    if (!d) return;
    try { d.transaction("audio", "readwrite").objectStore("audio").clear(); } catch (e) {}
  }
  return { get, put, clear };
})();

/* ---------- 음성 재생 ---------- */
const Player = (() => {
  const audio = new Audio();
  let token = 0;
  let currentBtn = null;
  let queue = Promise.resolve();
  let deviceVoice = null;
  let warnedNoKey = false;

  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      const us = vs.filter(v => /en[-_]US/i.test(v.lang));
      deviceVoice = us.find(v => /google|samsung/i.test(v.name)) || us[0] || vs.find(v => /^en/i.test(v.lang)) || null;
    } catch (e) { deviceVoice = null; }
  }
  try {
    if ("speechSynthesis" in window) {
      pickVoice();
      speechSynthesis.addEventListener("voiceschanged", pickVoice);
    }
  } catch (e) {}

  function mark(btn, on) { if (btn) btn.classList.toggle("playing", on); }

  /* 일시정지 상태: 재생 중이던 줄을 멈춰 두고, resume()에서 이어서(내장 음성은 그 줄 처음부터) 재생 */
  let paused = false;
  let resumeFn = null;
  let audioCtl = null;    // 지금 재생 중인 mp3 { finish }
  let speechCtl = null;   // 지금 읽는 중인 내장 음성 { halt, restart, finish }

  function stop() {
    token++;
    paused = false;
    resumeFn = null;
    try { audio.pause(); } catch (e) {}
    if (audioCtl) audioCtl.finish();
    if (speechCtl) { speechCtl.halt(); speechCtl.finish(); }
    mark(currentBtn, false);
    currentBtn = null;
    queue = Promise.resolve();
  }

  function pause() {
    if (paused) return;
    paused = true;
    if (audioCtl && !audio.paused) {
      try { audio.pause(); } catch (e) {}
      const ctl = audioCtl;
      resumeFn = () => { const p = audio.play(); if (p && p.catch) p.catch(ctl.finish); };
    } else if (speechCtl) {
      speechCtl.halt();
      resumeFn = speechCtl.restart;
    }
  }

  function resume() {
    if (!paused) return;
    paused = false;
    const f = resumeFn;
    resumeFn = null;
    if (f) f();
  }

  function playBlob(blob, rate) {
    return new Promise(res => {
      const url = URL.createObjectURL(blob);
      let finished = false;
      const ctl = {
        finish() {
          if (finished) return;
          finished = true;
          audio.onended = audio.onerror = null;
          if (audioCtl === ctl) audioCtl = null;
          URL.revokeObjectURL(url);
          res();
        }
      };
      audioCtl = ctl;
      audio.onended = ctl.finish; audio.onerror = ctl.finish;
      audio.src = url;
      try { audio.preservesPitch = true; audio.defaultPlaybackRate = rate; audio.playbackRate = rate; } catch (e) {}
      const start = () => { const p = audio.play(); if (p && p.catch) p.catch(() => { if (!paused) ctl.finish(); }); };
      if (paused) resumeFn = start;
      else start();
    });
  }

  /* 긴 글은 안드로이드 내장 음성이 중간에 끊길 수 있어서 문장 단위로 나눠 읽음 */
  function speakDevice(text, who, rate) {
    return new Promise(res => {
      if (!("speechSynthesis" in window)) { toast("이 브라우저는 음성 재생을 지원하지 않아요"); return res(); }
      let finished = false, gen = 0, timer = null;
      const chunks = text.length < 220 ? [text] : (text.match(/[^.!?\n]+(?:[.!?]+["”’)]*|$)/g) || [text]);
      const parts = chunks.map(s => s.trim()).filter(Boolean);
      const ctl = {
        finish() {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          if (speechCtl === ctl) speechCtl = null;
          res();
        },
        halt() {
          gen++;
          clearTimeout(timer);
          try { speechSynthesis.cancel(); } catch (e) {}
        },
        restart() {
          if (finished) return;
          const my = ++gen;
          clearTimeout(timer);
          try {
            if (!deviceVoice) pickVoice();
            parts.forEach((p, idx) => {
              const u = new SpeechSynthesisUtterance(p);
              u.lang = "en-US";
              if (deviceVoice) u.voice = deviceVoice;
              u.rate = rate;
              u.pitch = who === "me" ? 0.92 : 1.08;
              if (idx === parts.length - 1) u.onend = u.onerror = () => { if (my === gen) ctl.finish(); };
              speechSynthesis.speak(u);
            });
            timer = setTimeout(() => { if (my === gen) ctl.finish(); }, 4000 + text.length * 110 / rate);   // 일부 안드로이드에서 onend가 안 오는 경우 대비
          } catch (e) { ctl.finish(); }
        }
      };
      if (!parts.length) return ctl.finish();
      speechCtl = ctl;
      if (paused) resumeFn = ctl.restart;
      else ctl.restart();
    });
  }

  async function getEleven(text, voice) {
    const key = [settings.model, voice, text].join("|");
    const cached = await AudioCache.get(key);
    if (cached) return cached;
    /* 속도는 재생할 때 조절함 (v4는 API 속도 설정을 지원하지 않음) */
    const vs = { stability: 0.5, similarity_boost: 0.75 };
    let res;
    try {
      res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + encodeURIComponent(voice) + "?output_format=mp3_44100_128", {
        method: "POST",
        headers: { "xi-api-key": settings.apiKey, "Content-Type": "application/json", "Accept": "audio/mpeg" },
        body: JSON.stringify({ text: text, model_id: settings.model, voice_settings: vs })
      });
    } catch (e) {
      throw new Error("ElevenLabs에 연결하지 못했어요");
    }
    if (!res.ok) {
      let code = "", msg = "";
      try { const j = await res.json(); code = (j.detail && (j.detail.status || j.detail.code)) || ""; msg = (j.detail && j.detail.message) || ""; } catch (e) {}
      if (res.status === 401 && /quota/i.test(code + msg)) throw new Error("ElevenLabs 크레딧이 부족해요");
      if (res.status === 401) throw new Error("API 키를 확인해 주세요");
      if (/voice/i.test(code + msg)) throw new Error("목소리 ID를 확인해 주세요");
      throw new Error("ElevenLabs 오류 (" + res.status + ")");
    }
    const blob = await res.blob();
    AudioCache.put(key, blob);
    return blob;
  }

  /* opts: { engine: "eleven" | "device", voice: voice ID, rate: 재생 속도 } — 없으면 표현 탭 설정을 따름 */
  async function run(text, who, btn, t, opts) {
    opts = opts || {};
    const engine = opts.engine || settings.engine;
    const voice = opts.voice || (who === "me" ? settings.voiceMe : settings.voiceThem);
    const rate = opts.rate || settings.speed;
    currentBtn = btn;
    mark(btn, true);
    try {
      if (engine === "eleven") {
        if (!settings.apiKey) {
          if (!warnedNoKey) { toast("API 키가 없어서 폰 기본 음성으로 읽어요"); warnedNoKey = true; }
        } else {
          try {
            const blob = await getEleven(text, voice);
            if (t !== token) return;
            await playBlob(blob, rate);
            return;
          } catch (err) {
            if (t !== token) return;
            toast(err.message + " · 폰 기본 음성으로 읽어요");
          }
        }
      }
      if (t !== token) return;
      await speakDevice(text, who, rate);
    } finally {
      if (t === token) { mark(btn, false); currentBtn = null; }
    }
  }

  /* 지금 재생 중인 걸 끊고 바로 재생 */
  function play(text, who, btn, opts) {
    stop();
    const t = token;
    queue = run(text, who, btn, t, opts);
    return queue;
  }
  /* 지금 재생이 끝나면 이어서 재생 */
  function enqueue(text, who, btn, opts) {
    const t = token;
    queue = queue.then(() => (t === token ? run(text, who, btn, t, opts) : undefined));
    return queue;
  }
  function isPlaying(btn) { return btn && btn.classList.contains("playing"); }
  function getToken() { return token; }
  function isPaused() { return paused; }

  return { play, enqueue, stop, pause, resume, isPaused, isPlaying, getToken };
})();

function sayFromButton(btn) {
  if (Player.isPlaying(btn)) { Player.stop(); return; }
  Player.play(btn.dataset.say, btn.dataset.who, btn);
}

/* ---------- 대화 진행: 내 대답을 열어야 다음 대사가 나옴 ---------- */
function ensureVisible(body, el) {
  const r = el.getBoundingClientRect();
  const b = body.getBoundingClientRect();
  const over = r.bottom - (b.bottom - 24);
  if (over > 0) body.scrollBy({ top: over, behavior: "smooth" });
}

function showRows(card, rows) {
  const body = card.querySelector(".body");
  rows.forEach(r => { r.classList.remove("later"); r.classList.add("pop"); });
  if (rows.length) ensureVisible(body, rows[rows.length - 1]);
  if (settings.autoplay) {
    rows.forEach(r => {
      const say = r.querySelector(".say");
      if (say) Player.enqueue(say.dataset.say, "them", say);
    });
  }
}

function advance(card, stage) {
  if (+card.dataset.stage > stage) return;
  const next = stage + 1;
  card.dataset.stage = next;
  const rows = Array.from(card.querySelectorAll(".row.later")).filter(r => +r.dataset.stage === next);
  if (!rows.length) return;
  const tok = card._tok = (card._tok || 0) + 1;
  if (rows[0].classList.contains("them")) {
    const typing = document.createElement("div");
    typing.className = "row them typing pop";
    typing.innerHTML = '<div class="bubble dots" aria-label="입력 중"><i></i><i></i><i></i></div>';
    rows[0].parentNode.insertBefore(typing, rows[0]);
    ensureVisible(card.querySelector(".body"), typing);
    setTimeout(() => {
      if (card._tok !== tok) return;
      typing.remove();
      showRows(card, rows);
    }, 850);
  } else {
    showRows(card, rows);
  }
}

function setBlank(btn, show) {
  btn.classList.toggle("shown", show);
  btn.setAttribute("aria-pressed", show ? "true" : "false");
  btn.closest(".row").classList.toggle("revealed", show);
  if (show) btn.removeAttribute("aria-label");
  else btn.setAttribute("aria-label", "내 차례. 탭해서 정답 보기");
}

function onBlank(btn) {
  const row = btn.closest(".row");
  const card = btn.closest(".card");
  const show = !btn.classList.contains("shown");
  setBlank(btn, show);
  hideHint();
  buzz();
  if (show) {
    const spk = row.querySelector(".spk");
    if (settings.autoplay) Player.play(spk.dataset.say, "me", spk);
    advance(card, +row.dataset.stage);
  } else if (Player.isPlaying(row.querySelector(".spk"))) {
    Player.stop();
  }
}

/* ---------- 대화 전체 듣기 ----------
   ▶ 전체 듣기: 안 열린 줄은 차례대로 열면서 처음부터 끝까지 읽음
   ⏸ 일시정지 → ▶ 이어 듣기: 멈춘 곳부터 계속
   ■ 정지: 소리를 끄고 카드를 처음 상태(대사 가림)로 되돌림 */
const sleep = ms => new Promise(r => setTimeout(r, ms));

function setPA(card, state) {
  card.classList.toggle("pa-playing", state === "playing");
  card.classList.toggle("pa-paused", state === "paused");
  const main = card.querySelector(".pa-main");
  if (main) {
    main.innerHTML = paLabel(state);
    main.setAttribute("aria-label", state === "playing" ? "일시정지" : state === "paused" ? "이어 듣기" : "대화 전체 듣기");
  }
  const stopBtn = card.querySelector(".pa-stop");
  if (stopBtn) stopBtn.disabled = state === "idle";
}

/* 카드를 처음 상태로: 내 대사는 다시 빈칸, 첫 단계 이후 줄은 숨김 */
function resetCard(card) {
  card._tok = (card._tok || 0) + 1;
  card.querySelectorAll(".typing").forEach(x => x.remove());
  card.querySelectorAll(".blank").forEach(b => setBlank(b, false));
  card.querySelectorAll(".chat > .row").forEach(r => {
    r.classList.remove("pop");
    if (+r.dataset.stage > 0) r.classList.add("later");
  });
  card.dataset.stage = 0;
  card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });
}

function stopAll(card) {
  const s = card._pa;
  if (!s) return;
  s.reset = true;
  Player.stop();
  setPA(card, "idle");
  resetCard(card);
  buzz();
}

async function playAll(card) {
  const cur = card._pa;
  if (cur && cur.alive()) {                         // 재생 중이면 일시정지, 일시정지면 이어 듣기
    if (cur.paused) { cur.paused = false; Player.resume(); setPA(card, "playing"); }
    else { cur.paused = true; Player.pause(); setPA(card, "paused"); }
    buzz();
    return;
  }
  Player.stop();
  const t0 = Player.getToken();
  const s = card._pa = { paused: false, reset: false, alive: () => Player.getToken() === t0 };
  const gate = async () => { while (s.paused && s.alive()) await sleep(120); };
  card._tok = (card._tok || 0) + 1;                 // 진행 중이던 '입력 중' 표시 취소
  card.querySelectorAll(".typing").forEach(x => x.remove());
  setPA(card, "playing");
  hideHint();
  buzz();
  const body = card.querySelector(".body");
  let lastMeStage = -1;
  try {
    for (const row of Array.from(card.querySelectorAll(".chat > .row"))) {
      await gate();
      if (!s.alive()) break;
      const st = +row.dataset.stage;
      if (row.classList.contains("later")) {
        if (row.classList.contains("them")) {
          const typing = document.createElement("div");
          typing.className = "row them typing pop";
          typing.innerHTML = '<div class="bubble dots" aria-label="입력 중"><i></i><i></i><i></i></div>';
          row.parentNode.insertBefore(typing, row);
          ensureVisible(body, typing);
          await sleep(650);
          await gate();
          typing.remove();
          if (!s.alive()) break;
        }
        row.classList.remove("later");
        row.classList.add("pop");
      }
      if (+card.dataset.stage < st) card.dataset.stage = st;
      const blank = row.querySelector(".blank");
      if (blank) {
        lastMeStage = st;
        if (!blank.classList.contains("shown")) setBlank(blank, true);
      } else {
        lastMeStage = -1;
      }
      ensureVisible(body, row);
      const btn = row.querySelector(".say, .spk");
      await Player.enqueue(btn.dataset.say, btn.dataset.who, btn);
      if (!s.alive()) break;
      await sleep(300);
    }
  } finally {
    if (card._pa === s) card._pa = null;
    if (!s.reset) {
      setPA(card, "idle");
      /* 다른 말풍선을 누르거나 카드를 넘겨서 끊겼을 때, 화면이 평소 흐름과 같은 상태가 되도록 정리 */
      card.querySelectorAll(".row.later").forEach(r => {
        if (+r.dataset.stage <= +card.dataset.stage) { r.classList.remove("later"); r.classList.add("pop"); }
      });
      if (lastMeStage >= 0 && +card.dataset.stage <= lastMeStage) advance(card, lastMeStage);
    }
  }
}

function toggleKo(cardEl) {

feed.addEventListener("click", e => {
  const t = e.target;

/* ---------- 진도 저장: 마지막으로 본 카드 + 본 카드 목록 ---------- */
const PROGRESS_KEY = "engcards.progress.v1";
const storageOK = (() => {
  try {
    localStorage.setItem("__engcards_test", "1");
    const ok = localStorage.getItem("__engcards_test") === "1";
    localStorage.removeItem("__engcards_test");
    return ok;
  } catch (e) { return false; }
})();
function cardKey(i) {
  const c = CARDS[i];
  return c && c.id != null ? String(c.id) : "i" + i;   // id 기준이라 카드를 추가해도 기록이 안 꼬임
}
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "null");
    if (p && typeof p === "object") return { last: p.last == null ? null : String(p.last), seen: Array.isArray(p.seen) ? p.seen.map(String) : [] };
  } catch (e) {}
  return { last: null, seen: [] };
}
const progress = loadProgress();
const seenSet = new Set(progress.seen);
function saveProgress() {
  progress.seen = Array.from(seenSet);
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
}
function indexOfKey(key) {
  for (let i = 0; i < CARDS.length; i++) if (cardKey(i) === key) return i;
  return -1;
}
function jumpTo(idx) {
  const el = feed.children[idx];
  if (el) feed.scrollTo({ top: el.offsetTop, behavior: "auto" });
}

/* 지난번 보던 카드로 바로 이동 */
(function restore() {
  const idx = progress.last == null ? -1 : indexOfKey(progress.last);
  if (idx > 0) {
    jumpTo(idx);
    setTimeout(() => { if (currentTab === "cards") toast("지난번 보던 " + (idx + 1) + "번 카드부터 이어볼게요"); }, 300);
  }
})();

/* 카드를 넘기면 재생 중인 소리를 멈추고, 자동 재생이 켜져 있으면 첫 대사를 읽어줌 */
let activeCard = null;
try {
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting || en.intersectionRatio < 0.6 || activeCard === en.target) return;
      activeCard = en.target;
      Player.stop();
      if (activeCard.dataset.i != null) {
        const key = cardKey(+activeCard.dataset.i);
        progress.last = key;
        seenSet.add(key);
        saveProgress();
      }
      if (settings.autoplay && !activeCard.dataset.greeted) {
        activeCard.dataset.greeted = "1";
        activeCard.querySelectorAll(".row.them:not(.later) .say").forEach(s => Player.enqueue(s.dataset.say, "them", s));
      }
    });
  }, { root: feed, threshold: [0.6] });
  document.querySelectorAll(".card").forEach(c => io.observe(c));
} catch (e) {}

/* ================= 글쓰기 탭 ================= */
const DIARY_KEY = "engcards.diary.v1";
function loadDiary() {
  try {
    const d = JSON.parse(localStorage.getItem(DIARY_KEY) || "null");
    if (d && typeof d === "object" && d.entries && typeof d.entries === "object") return d;
  } catch (e) {}
  return { entries: {} };
}
const diary = loadDiary();
function saveDiary() {
  try { localStorage.setItem(DIARY_KEY, JSON.stringify(diary)); return true; } catch (e) { return false; }
}

/* 하루 기록 = { items: [ { q:{en,ko}, text, fix, updated } ] } (최대 3편). 예전 형식({q,text,fix})은 자동으로 바꿔 읽음 */
const MAX_WRITES = 3;
function normEntry(e) {
  if (!e || typeof e !== "object") return null;
  const raw = Array.isArray(e.items) ? e.items : [e];
  const items = raw.filter(x => x && typeof x === "object")
    .map(x => ({ q: x.q && x.q.en ? { en: x.q.en, ko: x.q.ko || "" } : null, text: x.text || "", fix: x.fix || "", updated: x.updated || 0 }));
  return items.length ? { items: items.slice(0, MAX_WRITES) } : null;
}
Object.keys(diary.entries).forEach(k => {
  const n = normEntry(diary.entries[k]);
  if (n) diary.entries[k] = n; else delete diary.entries[k];
});
const hasContent = it => !!(it && ((it.text || "").trim() || (it.fix || "").trim()));

const pad2 = n => String(n).padStart(2, "0");
function dateKey(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function dayNumber(key) {
  const p = key.split("-").map(Number);
  return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000);
}
/* 오늘 고를 수 있는 질문 5개: 날짜마다 정해진 순서에서, 다른 날 이미 답한 질문은 건너뜀.
   (같은 날엔 항상 같은 5개. 다 답하면 처음부터 다시 돌아옴) */
function candidatesFor(key) {
  const L = QUESTIONS.length;
  if (!L) return [];
  const start = ((dayNumber(key) * 5) % L + L) % L;
  const order = [];
  for (let i = 0; i < L; i++) order.push(QUESTIONS[(start + i) % L]);
  const used = new Set();
  Object.keys(diary.entries).forEach(k => {
    if (k === key) return;
    diary.entries[k].items.forEach(it => { if (it.q && hasContent(it)) used.add(it.q.en); });
  });
  const fresh = order.filter(q => !used.has(q.en));
  const pool = fresh.length >= 5 ? fresh : fresh.concat(order.filter(q => used.has(q.en)));
  return pool.slice(0, 5);
}
function koDate(key, withDay) {
  const p = key.split("-").map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  const year = p[0] !== new Date().getFullYear() ? p[0] + "년 " : "";
  return year + p[1] + "월 " + p[2] + "일" + (withDay ? " " + "일월화수목금토"[d.getDay()] + "요일" : "");
}

let todayKey = null;
let activeIdx = 0;
let todayCands = [];
function todayEntry() {
  if (!diary.entries[todayKey]) diary.entries[todayKey] = { items: [] };
  return diary.entries[todayKey];
}
function newItem() {
  const usedToday = new Set(todayEntry().items.map(it => it.q && it.q.en));
  const q = todayCands.find(c => !usedToday.has(c.en)) || todayCands[0] || { en: "", ko: "" };
  return { q: { en: q.en, ko: q.ko }, text: "", fix: "", updated: 0 };
}
function activeItem() {
  const items = todayEntry().items;
  if (!items.length) items.push(newItem());
  if (activeIdx >= items.length) activeIdx = items.length - 1;
  if (!items[activeIdx].q) items[activeIdx].q = newItem().q;
  return items[activeIdx];
}
function autoGrow(ta) {
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + 2 + "px";
}
function countWords(s) {
  return (s.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length;
}
function updateCount() {
  const n = countWords(W.text.value);

}

function initWrite() {
  const key = dateKey();

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;left:0;opacity:0;";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

/* 첨삭 칸에서 한글이 들어간 줄(한국어 설명)은 빼고 영어만 읽음 */
function englishOnly(text) {
  return text.split(/\r?\n/)
    .filter(l => l.trim() && !/[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(l))
    .join("\n").trim();
}

function backupText() {
  const out = [];
  Object.keys(diary.entries).sort().reverse().forEach(k => {
    const list = diary.entries[k].items.filter(hasContent);
    list.forEach((it, n) => {
      const q = it.q || {};
      out.push("[" + k + (list.length > 1 ? " · 글 " + (n + 1) : "") + "]\nQ: " + (q.en || "") + (q.ko ? "\n(" + q.ko + ")" : "") +
        "\n\n내 글:\n" + it.text.trim() + "\n\n첨삭:\n" + it.fix.trim());
    });
  });
  return out.join("\n\n----------\n\n");
}

function openWriteSettings() {

/* ================= 자동 점검: 주소 끝에 #check 를 붙여 열면 결과가 뜸 (규칙은 CLAUDE.md) ================= */
function sceneOf(card) {
  return card.scene || (card.category === "일상 대화" ? "free" : "task");   // task: 정해진 용건(10단어), free: 자유 대화(12단어)
}
function runChecks() {
  const issues = [];
  const stats = { cards: CARDS.length, expressions: 0, examples: 0, meTurns: 0, questions: QUESTIONS.length };
  const ids = new Set();
  let prevId = -Infinity;
  CARDS.forEach((c, i) => {
    const tag = "카드 " + (i + 1) + (c.id != null ? " (id " + c.id + ")" : "");
    if (c.id == null) issues.push(tag + ": id 없음");
    else {
      if (ids.has(c.id)) issues.push(tag + ": id 중복");
      if (typeof c.id === "number" && c.id <= prevId) issues.push(tag + ": id가 앞 카드보다 작음");
      ids.add(c.id);
      if (typeof c.id === "number") prevId = c.id;
    }
    ["category", "title", "situation"].forEach(k => { if (!c[k]) issues.push(tag + ": " + k + " 없음"); });
    const d = c.dialogue || [];
    if (d.length < 4 || d.length > 10) issues.push(tag + ": 대화 " + d.length + "줄 (4~10줄)");
    const me = d.filter(x => x.who === "me");
    if (me.length < 2) issues.push(tag + ": me 턴 " + me.length + "개 (2턴 이상)");
    const limit = sceneOf(c) === "free" ? 12 : 10;
    d.forEach(x => { if (!x.en || !x.ko) issues.push(tag + ": 대사 en/ko 누락 — " + (x.en || x.ko || "")); });
    me.forEach(x => {
      stats.meTurns++;
      const w = String(x.en || "").split(/\s+/).filter(Boolean).length;
      if (w > limit) issues.push(tag + ": me " + w + "단어 (상한 " + limit + ") — " + x.en);
    });
    const ex = c.expressions || [];
    if (ex.length < 2 || ex.length > 5) issues.push(tag + ": 표현 " + ex.length + "개 (2~5개)");
    const allLines = d.map(x => x.en || "").join("\n");
    ex.forEach(e => {
      stats.expressions++;
      const p = "\"" + e.phrase + "\"";
      if (!e.phrase || !e.ko) issues.push(tag + ": 표현 phrase/ko 누락");
      if (!exprFound(e, allLines)) issues.push(tag + " " + p + ": 대화에 표현이 없어서 밑줄이 안 생김");
      const n = (e.examples || []).length;
      stats.examples += n;
      if (n !== 5) issues.push(tag + " " + p + ": 예문 " + n + "개 (정확히 5개)");
      (e.examples || []).forEach(x => { if (!x.en || !x.ko) issues.push(tag + " " + p + ": 예문 en/ko 누락"); });
      if (!e.story || !e.story.en || !e.story.ko) { issues.push(tag + " " + p + ": 썰 누락"); return; }
      if (!exprFound(e, e.story.en)) issues.push(tag + " " + p + ": 썰에 표현이 없음");
      if (/[가-힣]/.test(e.story.en)) issues.push(tag + " " + p + ": 썰 영어에 한글이 섞임");
      const sents = e.story.en.split(/(?<=[.!?]["”]?)\s+(?=[A-Z“"])/).length;
      if (sents < 3 || sents > 5) issues.push(tag + " " + p + ": 썰 " + sents + "문장 (3~4문장 권장)");
    });
  });
  const qSeen = new Set();
  QUESTIONS.forEach((q, i) => {
    if (!q.en || !q.ko) issues.push("질문 " + (i + 1) + ": en/ko 누락");
    const k = String(q.en || "").toLowerCase();
    if (qSeen.has(k)) issues.push("질문 " + (i + 1) + ": 중복 — " + q.en);
    qSeen.add(k);
  });
  if (QUESTIONS.length < 60) issues.push("질문 " + QUESTIONS.length + "개 (60개 이상 권장)");
  return { stats, issues };
}
window.runChecks = runChecks;
if (location.hash === "#check") {
  setTimeout(() => {
    const r = runChecks();
    const s = r.stats;
    showSheet("자동 점검", r.issues.length ? "문제 " + r.issues.length + "개" : "이상 없음",
      '<p class="note">카드 ' + s.cards + '장 · 표현 ' + s.expressions + '개 · 예문 ' + s.examples + '개 · me 턴 ' + s.meTurns + '개 · 질문 ' + s.questions + '개</p>' +
      (r.issues.length ? '<ul class="note">' + r.issues.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : ""));
  }, 300);
}

function openList() {
  const cur = activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : -1;
  const seenCount = CARDS.filter((c, i) => seenSet.has(cardKey(i))).length;
  const pct = CARDS.length ? Math.round(seenCount / CARDS.length * 100) : 0;
  const groups = [];
  CARDS.forEach((c, i) => {
    let g = groups.find(x => x.name === c.category);
    if (!g) { g = { name: c.category, items: [] }; groups.push(g); }
    g.items.push(i);
  });
  const listHtml = groups.map(g => {
    const seenInGroup = g.items.filter(i => seenSet.has(cardKey(i))).length;
    return '<section class="toc-group" style="--h:' + hueOf(g.name) + '">' +
      '<div class="toc-head"><span class="toc-emoji" aria-hidden="true">' + (CATEGORY_EMOJI[g.name] || "📌") + '</span>' +
        '<h4 class="toc-cat">' + esc(g.name) + '</h4>' +
        '<span class="toc-cnt">' + seenInGroup + ' / ' + g.items.length + '</span></div>' +
      '<ul class="toc">' +
      g.items.map(i => {
        const seen = seenSet.has(cardKey(i));
        const cls = "toc-item" + (seen ? " seen" : "") + (i === cur ? " current" : "");
        return '<li><button class="' + cls + '" type="button" data-go="' + i + '"' + (i === cur ? ' aria-current="true"' : "") + '>' +
          '<span class="toc-n">' + (i + 1) + '</span><span class="toc-t">' + esc(CARDS[i].title) + '</span>' +
          '<span class="toc-check"' + (seen ? ' aria-label="봤음"' : "") + '>' + (seen ? ICON_CHECK : "") + '</span></button></li>';
      }).join("") + '</ul></section>';
  }).join("");
  const warn = storageOK ? "" :
    '<p class="note">지금 연 방식에서는 기록이 저장되지 않아서, 앱을 다시 열면 처음부터 시작해요.</p>';
  const html =
    '<div class="prog"><div class="prog-text">본 카드 <b>' + seenCount + '</b> / ' + CARDS.length + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' + warn + '</div>' +
    '<div class="btn-row"><button class="btn" type="button" id="goUnseen">안 본 카드로</button>' +
      '<button class="btn" type="button" id="goFirst">처음부터</button></div>' +
    listHtml +
    '<div class="set-group"><div class="btn-row"><button class="btn" type="button" id="resetProgress">본 기록 지우기</button></div></div>';
  showSheet("카드 " + CARDS.length + "장", "목록", html);
  const curEl = sheetBody.querySelector(".toc-item.current");
  if (curEl) sheetBody.scrollTop = Math.max(0, curEl.offsetTop - sheetBody.clientHeight / 2);
}

    const text = backupText();
    if (!text) { toast("아직 저장된 기록이 없어요"); return; }
    copyText(text).then(ok => toast(ok ? "전체 기록을 복사했어요" : "복사하지 못했어요"));
    return;
  }
  if ((el = t.closest("#goUnseen"))) {
    const cur = activeCard && activeCard.dataset.i != null ? +activeCard.dataset.i : -1;
    let idx = -1;
    for (let k = 1; k <= CARDS.length && idx < 0; k++) {
      const i = (cur + k + CARDS.length) % CARDS.length;
      if (!seenSet.has(cardKey(i))) idx = i;
    }
    if (idx < 0) { toast("모든 카드를 다 봤어요!"); return; }
    goFromList(idx);
    return;
  }
  if ((el = t.closest("#resetProgress"))) {
    seenSet.clear();
    if (activeCard && activeCard.dataset.i != null) seenSet.add(cardKey(+activeCard.dataset.i));
    saveProgress();
    openList();
    toast("본 기록을 지웠어요");
    return;
  }
  if ((el = t.closest(".seg button"))) {
    const name = el.parentNode.dataset.set;
    const v = el.dataset.v;
    settings[name] = name === "speed" ? parseFloat(v) : v;
    saveSettings();
    el.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === el ? "true" : "false"));
    if (name === "engine") {
      const box = sheetBody.querySelector(".el-only");
      if (box) box.hidden = v !== "eleven";
    }
    buzz();
    return;
  }
  if ((el = t.closest("[data-switch]"))) {
    const name = el.dataset.switch;
    settings[name] = !settings[name];
    saveSettings();
    el.setAttribute("aria-checked", settings[name] ? "true" : "false");
    buzz();
    return;
  }
  if ((el = t.closest("#testVoice"))) {
    if (Player.isPlaying(el)) { Player.stop(); return; }
    Player.play("Hi there! What can I get started for you?", "them", el);
    Player.enqueue("Can I get a medium hot americano, please?", "me", el);
    return;
  }
  if ((el = t.closest("#clearCache"))) {
    AudioCache.clear().then(() => toast("저장된 음성을 지웠어요"));
  }
});

sheetBody.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "setKey") { settings.apiKey = t.value.trim(); saveSettings(); }
  else if (t.dataset.voiceCustom) {
    const v = t.value.trim();
    settings[t.dataset.voiceCustom] = v || DEFAULTS[t.dataset.voiceCustom];
    saveSettings();
  }
});
sheetBody.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "setModel") { settings.model = t.value; saveSettings(); }
  else if (t.dataset.voice) {
    const name = t.dataset.voice;
    const custom = sheetBody.querySelector('[data-voice-custom="' + name + '"]');
    if (t.value === "custom") {
      custom.hidden = false;
      custom.focus();
      if (custom.value.trim()) { settings[name] = custom.value.trim(); saveSettings(); }
    } else {
      custom.hidden = true;
      settings[name] = t.value;
      saveSettings();
    }
  }
});

function hideSheet() {
  if (!sheetOpen) return;
  sheetOpen = false;
  Player.stop();
  if (document.activeElement && sheet.contains(document.activeElement)) document.activeElement.blur();
  sheet.classList.remove("on", "dragging");
  sheet.style.transform = "";
  scrim.classList.remove("on");
  sheet.setAttribute("aria-hidden", "true");
}

/* 닫기 버튼·바깥 탭: 히스토리를 되돌려서 안드로이드 뒤로 가기와 같은 흐름으로 닫음 */
function closeSheet() {
  if (!sheetOpen) return;
  let viaHistory = false;
  try { viaHistory = !!(history.state && history.state.sheet); } catch (e) {}
  if (viaHistory) history.back();
  else hideSheet();
}

window.addEventListener("popstate", hideSheet);
scrim.addEventListener("click", closeSheet);
sheetClose.addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* 손잡이 부분을 아래로 끌어서 닫기 */
let dragY0 = null, dragDy = 0;
sheetHead.addEventListener("touchstart", e => {
  dragY0 = e.touches[0].clientY; dragDy = 0;
  sheet.classList.add("dragging");
}, { passive: true });
sheetHead.addEventListener("touchmove", e => {
  if (dragY0 === null) return;
  dragDy = Math.max(0, e.touches[0].clientY - dragY0);
  sheet.style.transform = "translateY(" + dragDy + "px)";
}, { passive: true });
sheetHead.addEventListener("touchend", () => {
  if (dragY0 === null) return;
  dragY0 = null;
  sheet.classList.remove("dragging");
  if (dragDy > 90) closeSheet();
  else sheet.style.transform = "";
});
</script>
</body>
