  /* 문장 mp3에서 from~to 단어 구간을 잘라 낸 WAV → { blob, times: 잘라 낸 소리 기준 단어 시간 }. 같은 구간은 한 번만 만듦.
     타임스탬프가 실제 소리와 통째로 조금 밀려 있을 수 있어서(mp3 앞 여백 등), 첫소리 위치와 첫 단어 시작을 비교해 그만큼 보정한 뒤 경계를 찾음 */
  function cutClip(mp3, times, from, to) {
    if (!cutOf.has(mp3)) cutOf.set(mp3, new Map());
    const m = cutOf.get(mp3), key = from + "-" + to;
    if (!m.has(key)) {
      const p = decodePcm(mp3).then(P => {
        const E = P.env, dur = P.data.length / P.rate;
        let on = 0; while (on < E.length - 1 && E[on] < P.thr) on++;               // 첫소리
        let off = E.length - 1; while (off > 0 && E[off] < P.thr) off--;           // 끝소리
        const shift = Math.max(-0.15, Math.min(0.15, times[0].s - on * HOP));      // 타임스탬프 밀림(+면 늦음)
        const ts = times.map(x => ({ s: x.s - shift, e: x.e - shift }));
        const a = from > 0 ? cutPoint(P, ts, from - 1).startR : Math.max(0, on * HOP - 0.06);        // 문장 처음: 첫소리 조금 앞부터
        const b = to < ts.length - 1 ? cutPoint(P, ts, to).endL : Math.min(dur, off * HOP + 0.15);   // 문장 끝: 끝소리 울림까지
        if (b - a < 0.05) throw new Error("구간이 너무 짧음");
        return { blob: wavOf(P, a, b, 0.012, 0.03), times: ts.map(x => ({ s: x.s - a, e: x.e - a })) };
      });
      p.catch(() => m.delete(key));          // 실패하면 다음엔 다시 시도(이번엔 ①방식으로)
      m.set(key, p);
    }
    return m.get(key);
  }

  /* opts: { engine: "eleven" | "device", voice, rate, script: getScript() 결과, from: 시작 단어, to: 끝 단어(있으면 구간 재생), track: 강조 받는 쪽 }
     engine·voice·rate가 없으면 표현 탭 설정. script가 있으면 괄호 속 한국어를 뺀 글(speech)을 읽고, from 단어부터 시작 */
  async function run(text, who, btn, t, opts) {
    opts = opts || {};
    const engine = opts.engine || settings.engine;
    const voice = opts.voice || (who === "me" ? settings.voiceMe : settings.voiceThem);
    const rate = opts.rate || settings.speed;
    const sc = opts.script && opts.script.words.length ? opts.script : null;
    const say = sc ? sc.speech : text;
    const from = sc ? Math.max(0, Math.min(opts.from || 0, sc.words.length - 1)) : 0;
    const to = sc && opts.to != null ? Math.max(from, Math.min(opts.to, sc.words.length - 1)) : -1;
    const track = opts.track || null;
    let complete = false;                              // 끊기지 않고 끝까지 읽었는지 (강조를 다 채운 채로 잠시 둘지)
    lastLen = 0;
    currentBtn = btn;
    mark(btn, true);
    try {
      if (engine === "eleven") {
        if (!settings.apiKey) {
          if (!warnedNoKey) { toast("API 키가 없어서 폰 기본 음성으로 읽어요"); warnedNoKey = true; }
        } else {
          try {
            const clip = await getEleven(say, voice);
            if (t !== token) return;
            const times = sc ? wordTimes(sc, clip.align) : null;
            if (to >= 0 && times) {                      // 구간 재생 ②: 잘라 낸 소리(못 만들면 아래 ①방식)
              const cut = await cutClip(clip.audio, times, from, to).catch(() => null);
              if (t !== token) return;
              if (cut) {
                await playBlob(cut.blob, rate, { sc, track, wordFrom: from, wordTo: to, times: cut.times });
                complete = t === token;
                return;
              }
            }
            const seg = to >= 0 && times ? segWindow(times, from, to) : null;   // 구간 재생 ①: 재생 중에 멈춤(타임스탬프가 없거나 풀기 실패 때만)
            await playBlob(clip.audio, rate, {
              sc, times, track,
              startAt: seg ? seg.a : from && times ? Math.max(0, times[from].s - 0.02) : 0,
              startFrac: from && !times ? sc.words[from].ss / say.length : 0,
              endAt: seg ? seg.b : 0,
              endFrac: to >= 0 && !times ? sc.words[to].se / say.length : 0,   // 단어 시간이 없으면 글자 비율로 어림
              fade: to >= 0 ? SEG_FADE : 0,
              wordFrom: to >= 0 ? from : 0,
              wordTo: to >= 0 ? to : null
            });
            complete = t === token;
            return;
          } catch (err) {
            if (t !== token) return;
            toast(err.message + " · 폰 기본 음성으로 읽어요");
          }
        }
      }
      if (t !== token) return;
      const off = from ? sc.words[from].ss : 0;          // 내장 음성은 그 단어부터 끝까지 읽음(구간이면 to 단어까지만)
      await speakDevice(to >= 0 ? say.slice(off, sc.words[to].se) : say.slice(off), who, rate, { sc, track, offset: off });
      complete = t === token;
    } finally {
      if (track) track.end(complete);
      if (t === token) { mark(btn, false); currentBtn = null; }
    }
  }

  /* 재생 중인 mp3 안에서 그 단어 위치로 바로 이동(같은 문장일 때만). 못 하면 false → 부르는 쪽이 처음부터 다시 재생 */
  function seekWord(sc, k) {
    const c = audioCtl;
    if (paused || !c || c.sc !== sc || !c.times || !c.times[k]) return false;
    try { audio.currentTime = Math.max(0, c.times[k].s - 0.02); } catch (e) { return false; }
    return true;
  }

  /* 지금 재생 중인 걸 끊고 바로 재생 */
  function play(text, who, btn, opts) {
    stop();
    const t = token;
    queue = run(text, who, btn, t, opts);
    return queue;
  }
  /* 지금 재생이 끝나면 이어서 재생 */
  function enqueue(text, who, btn, opts) {
    const t = token;
    queue = queue.then(() => (t === token ? run(text, who, btn, t, opts) : undefined));
    return queue;
  }
  function isPlaying(btn) { return btn && btn.classList.contains("playing"); }
  function getToken() { return token; }
  function isPaused() { return paused; }
  /* 지금 소리를 내는 쪽: "audio"(ElevenLabs mp3) / "speech"(내장 음성) / null(문장 사이) */
  function current() { return audioCtl ? "audio" : speechCtl ? "speech" : null; }
  /* 드라이브 모드 미리 받아두기: 저장돼 있는지 / 만들어서 저장(같은 캐시·같은 키) */
  function isCached(text, voice) { return AudioCache.has(clipKey(text, voice)); }
  function fetchClip(text, voice) { return getEleven(text, voice); }

  return { play, enqueue, stop, pause, resume, setRate, seekWord, isPaused, isPlaying, getToken, onChange,
    onInterrupt, current, lastLength: () => lastLen, isCached, fetchClip };
})();

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= 인터랙티브 스크립트 ② 타이밍 · 강조 · 재생기 ================= */

/* ElevenLabs 문자별 시간(alignment) → 단어별 { s, e }(초). 글자를 차례로 맞춰 보고, 단어의 20% 넘게 못 맞추면 null(줄 강조로) */
function wordTimes(sc, align) {
  if (!align || !Array.isArray(align.characters)) return null;
  const ch = align.characters, st = align.character_start_times_seconds || [], en = align.character_end_times_seconds || [];
  const sp = sc.speech, S = new Array(sp.length), E = new Array(sp.length);
  let j = 0;
  for (let i = 0; i < sp.length && j < ch.length; i++) {
    let f = -1;
    for (let d = 0; d <= 3 && j + d < ch.length; d++) if (ch[j + d] === sp[i]) { f = j + d; break; }
    if (f < 0) continue;
    S[i] = st[f]; E[i] = en[f]; j = f + 1;
  }
  let miss = 0;
  const times = sc.words.map(w => {
    let s = null, e = null;
    for (let i = w.ss; i < w.se; i++) if (S[i] != null) { if (s == null) s = S[i]; e = E[i]; }
    if (s == null) { miss++; return null; }
    return { s, e };
  });
  if (!times.length || miss > times.length * 0.2) return null;
  for (let k = 0; k < times.length; k++) if (!times[k]) { const p = k ? times[k - 1].e : 0; times[k] = { s: p, e: p }; }
  return times;
}

/* 한 문장(.sc 요소)의 강조. 재생 한 번마다 새로 만들고, 같은 요소를 다음 재생이 이어받으면 앞의 것은 아무것도 안 함.
   end(complete): 끝까지 읽었으면 전체를 채운 채로 잠시(FILL_HOLD) 두었다가 평소 표시로, 중간에 끊겼으면 바로 평소 표시로 */
const FILL_HOLD = 900;
/* off: 읽는 글의 단어 k를 el의 k + off번째 단어로 칠함(연습 모드에서 청크만 따로 만든 음성을 문장 안 그 자리에 강조) */
function makeTrack(el, onWord, off) {
  off = off || 0;
  const clear = () => {
    el._trk = null;
    el.classList.remove("reading", "lineonly", "filled");
    paintWord(el, -1);
  };
  const trk = {
    start(mode) {
      if (!el) return;
      el._trk = trk;
      el.classList.remove("filled");
      el.classList.add("reading");
      el.classList.toggle("lineonly", mode === "line");     // 단어 신호가 없으면 문장 전체를 강조
      paintWord(el, -1);
    },
    word(k) {
      if (!el || el._trk !== trk) return;
      k += off;
      el.classList.remove("lineonly");
      paintWord(el, k);
      if (onWord) onWord(k);
    },
    end(complete) {
      if (!el || el._trk !== trk) return;
      if (!complete || el.classList.contains("lineonly")) { clear(); return; }
      el.classList.add("filled");
      setTimeout(() => { if (el._trk === trk) clear(); }, FILL_HOLD);
    }
  };
  return trk;
}
/* 읽은 단어(past)·지금 단어(now)는 채워짐, 그 뒤 단어는 흐린 채로. 앞쪽 단어로 이동하면 그 뒤가 다시 흐려짐 */
function paintWord(el, k) {
  if (el._k === k) return;
  el._k = k;
  let now = null;
  el.querySelectorAll(".w").forEach(w => {
    const n = +w.dataset.w;
    w.classList.toggle("now", n === k);
    w.classList.toggle("past", k >= 0 && n < k);
    if (n === k && !now) now = w;
  });
  if (now) keepInView(now);
}
/* 강조된 단어가 화면(시트 본문·카드 본문) 밖으로 나가려 하면 부드럽게 따라 스크롤 */
function keepInView(w) {
  const box = w.closest(".sheet-body, .body, .dv-scroll, .pc-scroll");
  if (!box || !w.getClientRects().length) return;
  const r = w.getBoundingClientRect(), b = box.getBoundingClientRect();
  if (r.top < b.top + 12 || r.bottom > b.bottom - 48) {
    box.scrollTo({ top: Math.max(0, box.scrollTop + r.top - b.top - b.height * 0.35), behavior: "smooth" });
  }
}

/* ---------- 문장 목록 재생기 (예문 5개·썰·카드 대화·드라이브 모드 공통) ----------
   createReader({ items: () => [{ el: .sc 요소, who: "me"|"them", btn?, voice?, from?, to?, script?, offset? }], rate: () => 속도,
     (from·to: 그 문장의 from~to 단어 구간만 재생 — 연습 모드 청크 / script·offset: el 대신 다른 글(따로 만든 청크 음성)을 읽고 강조는 el의 offset번째 단어부터)
                  gap: 문장 사이(ms) 또는 (방금 끝난 문장 번호) => ms, before(k, first): 문장 앞에 기다릴 일(async, 효과음),
                  onItem(i), onWord(i, k), onEnd(끝까지 들었는지), onChange(state) })
   play(i, w, single): i번째 문장의 w번째 단어부터 재생(single이면 그 문장만, 아니면 끝까지 이어서)
   seek(i, w): 단어 탭. 같은 문장을 재생 중이면 그 자리로 바로 이동, 이어 듣기 중이면 거기서부터 계속,
     재생 중이 아니면 그 문장만(옵션 tapSingle: false면 거기서부터 끝까지)
   toggle() 일시정지↔이어 듣기 · pause · resume · stop · next · prev · state() → { active, paused, single, index, word }
   소리는 모두 Player를 거치므로 Player.stop()(카드 넘김·모드 바꿈·시트 닫기·다른 재생)이 오면 바로 멈추고 강조도 지워짐 */
function createReader(o) {
  let t0 = -1, running = false, single = false, idx = -1, word = -1;
  const list = () => (typeof o.items === "function" ? o.items() : o.items) || [];
  const active = () => running && Player.getToken() === t0;
  const state = () => ({ active: active(), paused: active() && Player.isPaused(), single, index: idx, word });
  const changed = () => { if (o.onChange) o.onChange(state()); };

  function play(i, w, one) {
    const items = list();
    if (!items[i]) return;
    Player.stop();
    const my = t0 = Player.getToken();
    const alive = () => Player.getToken() === my;
    running = true; single = !!one; idx = i; word = w || 0;
    (async () => {
      let complete = false;
      try {
        for (let k = i, from = w || 0; k < items.length; k++, from = 0) {
          while (Player.isPaused() && alive()) await sleep(120);
          if (!alive()) return;
          idx = k; word = from;
          if (o.onItem) o.onItem(k);
          changed();
          if (o.before) { await o.before(k, k === i); if (!alive()) return; }   // 문장 앞에 할 일(드라이브 모드 효과음)
          const it = items[k];
          const sc = it.script || SCRIPTS[+it.el.dataset.sc];
          await Player.enqueue(sc.speech, it.who, it.btn || null, {
            script: sc, from: (it.from || 0) + from, to: it.to, voice: it.voice, rate: o.rate ? o.rate() : undefined,
            track: makeTrack(it.el, wk => { if (alive()) { word = wk; if (o.onWord) o.onWord(k, wk); } }, it.offset)
          });
          if (!alive() || single) break;
          if (k < items.length - 1) await sleep(typeof o.gap === "function" ? o.gap(k) : o.gap == null ? 400 : o.gap);
        }
        complete = alive();
      } finally {
        if (t0 === my) {                               // 이 재생기가 스스로 다시 시작한 경우(seek·next 등)는 끝 알림 없음
          running = false; idx = -1; word = -1;
          if (o.onEnd) o.onEnd(complete);
          changed();
        }
      }
    })();
  }
  function seek(i, w) {
    const items = list(), it = items[i];
    if (!it) return;
    /* w는 화면(el)의 단어 번호 → 읽는 글의 단어 번호 k = w − offset (연습 모드 썰 문장처럼 화면 글과 읽는 글이 다를 때) */
    const k = w - (it.offset || 0);
    if (active() && idx === i && Player.seekWord(it.script || SCRIPTS[+it.el.dataset.sc], k)) return;
    play(i, Math.max(0, k - (it.from || 0)), active() ? single : typeof o.tapSingle === "function" ? !!o.tapSingle() : o.tapSingle !== false);
  }
  function toggle() {
    if (!active()) return false;
    if (Player.isPaused()) Player.resume(); else Player.pause();
    return true;
  }
  return {
    play, seek, toggle, state,
    pause: () => { if (active()) Player.pause(); },
    resume: () => { if (active()) Player.resume(); },
    stop: () => { if (active()) Player.stop(); },
    next: () => { if (idx + 1 < list().length) play(idx + 1, 0, single); },
    prev: () => play(Math.max(0, idx - 1), 0, single)
  };
}

/* 그 줄이 화면 안에 보이게 스크롤. center면 지금 줄을 화면 위쪽 1/3쯤으로 (쉐도잉에서 따라 내려감) */
function follow(card, el, center) {
  const body = card.querySelector(".body");
  const r = el.getBoundingClientRect();
  const b = body.getBoundingClientRect();
  let top = null;
  if (center) top = body.scrollTop + (r.top - b.top) - b.height * 0.3;
  else if (r.bottom > b.bottom - 24) top = body.scrollTop + r.bottom - (b.bottom - 24);
  else if (r.top < b.top + 14) top = body.scrollTop + r.top - b.top - 14;
  if (top !== null) body.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}

/* ================= 상황 카드: 모드 3개 (읽기 / 듣기 / 쉐도잉) =================
   모드는 모든 카드 공통. 탭 바 위에서 고르고, 다시 열어도 유지(engcards.mode.v1).
   카드 하나의 진행 상태는 card._st에 모아 둠. 카드를 넘기거나 모드를 바꾸면 resetCard()로 처음 상태가 됨
   (예약된 '입력 중…' 취소 → 대화 다시 그리기 → 버튼 다시 그리기). 소리는 부르는 쪽에서 Player.stop() */
const MODE_KEY = "engcards.mode.v1";
const MODES = { read: "읽기", listen: "듣기", shadow: "쉐도잉" };
let mode = (() => {
  try { const m = localStorage.getItem(MODE_KEY); return m && MODES[m] ? m : "read"; } catch (e) { return "read"; }
})();

/* 쉐도잉 난이도(모든 카드 공통, 저장): easy 쉬움(영어 보며 한 줄씩) / mid 중간(영어 보며 쉬지 않고 이어서 — 동시 따라 말하기)
   / hard 어려움(영어 없이 두 사람 아이콘만 보며 한 줄씩, 막히면 '정답 보기').
   저장 { level, v: 2 }. v가 없는 예전 기록의 "hard"는 그때의 '어려움'(쉬지 않고 이어서) = 지금의 mid로 옮김.
   (예전의 repeat — 중간에서 끝나면 처음부터 다시 — 은 2026-10-03에 없앰. 저장에 남아 있어도 읽지 않음) */
const SHADOW_KEY = "engcards.shadow.v1";
const SHADOW_LEVELS = ["easy", "mid", "hard"];
const shadowPref = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(SHADOW_KEY) || "null");
    if (s && typeof s === "object") {
      const level = s.v !== 2 && s.level === "hard" ? "mid" : s.level;
      const p = { level: SHADOW_LEVELS.includes(level) ? level : "easy", v: 2 };
      if (s.v !== 2) try { localStorage.setItem(SHADOW_KEY, JSON.stringify(p)); } catch (e) {}
      return p;
    }
  } catch (e) {}
  return { level: "easy", v: 2 };
})();
function saveShadowPref() {
  try { localStorage.setItem(SHADOW_KEY, JSON.stringify(shadowPref)); } catch (e) {}
}
const MID_GAP = 250;                          // 중간: 줄 사이 짧은 간격(ms). 다음 음성을 불러오는 시간이 더해져 실제로는 약 0.3초
const isMid = st => st.mode === "shadow" && st.level === "mid";
const isBlind = st => st.mode === "shadow" && st.level === "hard";   // 어려움: 영어 없이 듣고 따라 말하기

const rowsOf = card => Array.from(card.querySelectorAll(".chat > .row:not(.typing)"));
const lineOf = (card, li) => CARDS[+card.dataset.i].dialogue[li];
const whoOf = line => (line.who === "me" ? "me" : "them");

function resetCard(card) {
  if (card.dataset.i == null) return;
  const old = card._st;
  if (old && old.timer) clearTimeout(old.timer);
  /* read: shown(보이는 줄 수)·full(전체 보기) / listen: revealed(정답 확인) / shadow: idx(지금 줄) / 공통: rd(대화 재생기) */
  /* shadow: level(easy 쉬움 / mid 중간 / hard 어려움) · started(중간에서 시작했는지)
     어려움: idx(지금 줄) · peek(지금 줄 정답 보기 중) · revealed(마지막 줄까지 끝나서 대화 전체를 보여 줌) */
  /* hold: 연습 모드에서 돌아온 뒤 '이어 듣기'로 이어 갈 줄(듣기·쉐도잉 중간, 없으면 -1). 무엇이든 재생을 시작하면 지움 */
  /* focus: 가장 최근에 재생했거나(cardReader onItem) 나타난·옮긴 줄(-1 = 아직 없음) — 연습 버튼이 이 줄부터 */
  const st = card._st = { mode, level: shadowPref.level, shown: 0, full: false, revealed: false, idx: -1, started: false, peek: false, timer: null, rd: null, hold: -1, focus: -1 };
  st.rd = cardReader(card, st);
  card.classList.remove("m-read", "m-listen", "m-shadow", "masked", "lpaused", "sh-mid", "sh-live", "sh-blind", "peek");
  card.classList.add("m-" + mode);
  card.classList.toggle("sh-mid", isMid(st));
  card.classList.toggle("sh-blind", isBlind(st));
  if (isBlind(st)) card.classList.add("masked");          // 어려움: 듣기 모드처럼 두 사람 아이콘
  card.querySelectorAll("[data-sh]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sh === shadowPref.level)));
  card.querySelector(".chat").innerHTML = CHAT_HTML[+card.dataset.i];
  setCur(card, -1);
  const rows = rowsOf(card);
  if (mode === "read") {
    rows.forEach((r, i) => {
      r.classList.toggle("off", i > 0);
      if (r.classList.contains("me")) r.classList.add("kq-on");
    });
    st.shown = 1;
  } else if (mode === "listen") {
    card.classList.add("masked");
  } else {
    rows.forEach(r => r.classList.add("off"));
  }
  card.querySelector(".body").scrollTop = 0;
  renderActions(card);
}

/* 카드 대화의 재생기(인터랙티브 스크립트): 줄마다 .sc 요소. 읽기 모드는 음성 설정 속도, 듣기·쉐도잉은 drillRate.
   듣기 모드 이어 재생 중이면 지금 줄·말하는 쪽 아이콘을 따라 바꿈 */
function cardReader(card, st) {
  return createReader({
    items: () => rowsOf(card).map((r, i) => ({ el: r.querySelector(".sc"), who: whoOf(lineOf(card, i)), btn: r })),
    rate: () => (st.mode === "read" ? settings.speed : settings.drillRate),
    gap: () => (isMid(st) ? MID_GAP : 350),
    tapSingle: () => !isMid(st),                  // 중간: 단어를 누르면 거기서부터 끝까지 이어서
    onItem: i => {
      if (card._st !== st) return;
      st.hold = -1;
      st.focus = i;                                  // 연습 버튼은 가장 최근에 재생했거나 나타난 줄부터(cardLineNow)
      if (isMid(st)) { midCur(card, i); return; }
      if (st.mode !== "listen" || st.rd.state().single) return;
      setCur(card, i);
      if (i > 0 && !card.classList.contains("masked")) follow(card, rowsOf(card)[i]);   // 아이콘 화면에서는 스크롤할 줄이 없음
    },
    onEnd: complete => {
      if (card._st !== st) return;
      if (isMid(st)) { midEnd(card); return; }
      if (st.mode !== "listen") return;
      setCur(card, -1);
      renderActions(card);
    },
    /* 재생이 시작되거나(문장마다) 끝나면 버튼(재생 / 일시정지 / 이어 듣기)과 어려움의 아이콘 퍼짐을 다시 그림.
       예) 중간에서 일시정지한 채 앞 줄 단어를 누르면 바로 재생되므로 버튼도 [일시정지]로 */
    onChange: () => { if (card._st === st && (st.mode === "listen" || isMid(st) || isBlind(st))) renderActions(card); }
  });
}

/* 지금 카드를 처음부터 (소리도 멈춤) */
function restartCard(card) {
  Player.stop();
  resetCard(card);
}

/* ---------- 하단 버튼: 주요 버튼(.main)은 세 모드 모두 오른쪽 넓은 자리 ---------- */
function actBtn(act, html, cls, label, disabled) {
  return '<button class="btn' + (cls ? " " + cls : "") + '" type="button" data-act="' + act + '"' +
    (label ? ' aria-label="' + label + '"' : "") + (disabled ? " disabled" : "") + '>' + html + '</button>';
}
function rateBtn() {
  const r = settings.drillRate === 1 ? "1.0" : String(settings.drillRate);
  return actBtn("rate", r + "x", "rate", "재생 속도 " + r + "배, 누르면 바뀜");
}
const NEXT_HTML = "<span>다음</span>" + ICON_ARROW;
const AGAIN_HTML = ICON_RESTART + "<span>처음부터</span>";

function renderActions(card) {
  const st = card._st;
  if (!st) return;
  const n = rowsOf(card).length;
  let html = "", note = "";
  if (st.mode === "read") {
    /* 왼쪽 버튼: 아직 다 안 나왔으면 [전체 보기](전체 보기 중이면 [접기]).
       [다음]으로 모든 줄이 다 나왔으면 — 한글로 남은 내 대사가 있으면 [내 답변 영어로](내 대사 전부 영어), 전부 영어면 [접기](한 번에 처음 상태로) */
    const end = st.shown >= n && !st.timer;
    const kq = rowsOf(card).some(r => r.classList.contains("me") && r.classList.contains("kq-on"));
    const left = st.full ? actBtn("all", "접기", "on") : !end ? actBtn("all", "전체 보기") :
      kq ? actBtn("meen", "내 답변 영어로") : actBtn("fold", "접기", "on");
    html = left + actBtn("next", end ? AGAIN_HTML : NEXT_HTML, "main");
  } else if (st.mode === "listen") {
    const rs = st.rd.state();
    const live = rs.active && !rs.single;                             // 대화 전체 이어 재생 중(한 줄만 듣기는 제외)
    const held = !rs.active && st.hold >= 0;                          // 연습 모드에서 돌아옴: 멈춘 줄부터 이어 듣기
    card.classList.toggle("lpaused", (live && rs.paused) || held);    // 일시정지 중엔 아이콘 퍼짐 효과 멈춤
    const main = held ? ICON_PLAY + "<span>이어 듣기</span>" : !live ? ICON_PLAY + "<span>재생</span>" :
      rs.paused ? ICON_PLAY + "<span>이어 듣기</span>" : ICON_PAUSE + "<span>일시정지</span>";
    html = actBtn("replay", ICON_RESTART, "ico-btn", "처음부터 다시 듣기") + rateBtn() +
      actBtn("answer", st.revealed ? "가리기" : "정답 확인", st.revealed ? "on" : "") +
      actBtn("play", main, "main");
    if (!st.revealed) note = "▶ 재생을 누르면 대화 전체를 글자 없이 들려줘요. 다 듣고 '정답 확인'.";
  } else if (isMid(st)) {
    /* 중간: [처음부터] [속도] [재생/일시정지] — 시작 전엔 [속도] [시작] */
    const rs = st.rd.state();
    if (!st.started) {
      html = rateBtn() + actBtn("mplay", ICON_PLAY + "<span>시작</span>", "main");
      note = "대화 전체를 쉬지 않고 이어서 들려줘요. 들리는 대로 바로 겹쳐서 따라 말해 보세요.";
    } else {
      const main = !rs.active ? ICON_PLAY + "<span>" + (st.hold >= 0 ? "이어 듣기" : "재생") + "</span>" :
        rs.paused ? ICON_PLAY + "<span>이어 듣기</span>" : ICON_PAUSE + "<span>일시정지</span>";
      html = actBtn("mrestart", ICON_RESTART, "ico-btn", "처음부터") + rateBtn() + actBtn("mplay", main, "main");
    }
  } else if (st.idx < 0) {
    html = actBtn("start", ICON_PLAY + "<span>시작</span>", "main");
    note = isBlind(st) ? "영어 없이 한 줄씩 들려줘요. 듣고 나서 소리 내어 따라 말해 보세요. 막히면 '정답 보기'." :
      "한 줄씩 들려줘요. 듣고 나서 소리 내어 따라 말해 보세요.";
  } else if (isBlind(st)) {
    /* 어려움: [이전] [한 번 더 듣기] [정답 보기] [속도] [다음] — 버튼 5개라 좁게(.five), 다음이 가장 크게 오른쪽.
       마지막 줄에선 [마치기](대화 전체 보이기) → 그 뒤 [처음부터]. 재생 중일 때만 말하는 쪽 아이콘이 퍼짐 */
    const rs = st.rd.state();
    card.classList.toggle("lpaused", !(rs.active && !rs.paused));
    const main = st.revealed ? AGAIN_HTML : st.idx >= n - 1 ? "<span>마치기</span>" : NEXT_HTML;
    html = actBtn("prev", "이전", "prev", "", st.idx <= 0 && !st.revealed) + actBtn("again", "한 번 더 듣기", "again") +
      actBtn("peek", st.peek ? "가리기" : "정답 보기", "peek" + (st.peek ? " on" : ""), "", st.revealed) + rateBtn() +
      actBtn("next", main, "main");
  } else {
    /* [이전] [한 번 더 듣기] [속도] [다음] — 다음이 가장 크게 오른쪽(엄지 자리). 첫 줄에선 이전 비활성 */
    html = actBtn("prev", "이전", "prev", "", st.idx <= 0) + actBtn("again", "한 번 더 듣기", "again") + rateBtn() +
      actBtn("next", st.idx >= n - 1 ? "<span>처음부터</span>" : NEXT_HTML, "main");
  }
  const acts = card.querySelector(".actions");
  acts.innerHTML = html;
  acts.classList.toggle("five", isBlind(st) && st.idx >= 0);
  card.querySelector(".mnote").textContent = note;
}

function onAct(card, act) {
  const st = card && card._st;
  if (!st) return;
  buzz();
  if (act === "rate") { toggleRate(card); return; }
  if (st.mode === "read") {
    if (act === "next") readNext(card);
    else if (act === "all") { if (st.full) restartCard(card); else readAll(card); }
    else if (act === "meen") { rowsOf(card).forEach(r => r.classList.remove("kq-on")); document.body.classList.add("hinted"); renderActions(card); }
    else if (act === "fold") restartCard(card);
  } else if (st.mode === "listen") {
    if (act === "play") listenPlay(card);
    else if (act === "replay") listenStart(card);
    else if (act === "answer") listenReveal(card, !st.revealed);
  } else if (isMid(st)) {
    if (act === "mplay") midPlay(card);
    else if (act === "mrestart") midStart(card, 0, 0);
  } else if (isBlind(st)) {
    const n = rowsOf(card).length;
    if (act === "start") blindGo(card, 0);
    else if (act === "next") { if (st.revealed) blindGo(card, 0); else if (st.idx < n - 1) blindGo(card, st.idx + 1); else blindFinish(card); }
    else if (act === "again") shadowSay(card);
    else if (act === "peek") blindPeek(card, !st.peek);
    else if (act === "prev") { if (st.revealed) blindGo(card, n - 1); else if (st.idx > 0) blindGo(card, st.idx - 1); }
  } else {
    if (act === "start") shadowGo(card, 0);
    else if (act === "next") shadowGo(card, st.idx >= rowsOf(card).length - 1 ? 0 : st.idx + 1);
    else if (act === "again") shadowSay(card);
    else if (act === "prev" && st.idx > 0) shadowGo(card, st.idx - 1);   // 앞 줄로: 뒤의 줄은 다시 숨기고 그 줄 재생(지금 소리는 끊김)
  }
}

/* 말풍선 탭: 읽기 모드의 내 대사는 한글 ↔ 영어(단어 탭으로 재생 위치를 옮기지 않음 — 탭 동작이 겹치지 않게).
   듣기(정답 확인 후)·쉐도잉: 단어를 탭하면 그 줄의 그 단어부터. 듣기 모드에서 단어 밖을 탭하면 그 줄만 처음부터 */
function onBubble(card, row, target) {
  const st = card && card._st;
  if (!st || !row || row.classList.contains("typing")) return;
  if (st.mode === "read" && row.classList.contains("me")) {
    row.classList.toggle("kq-on");
    if (row.classList.contains("kq-on") && row.classList.contains("playing")) Player.stop();   // 한글로 돌아가면(스피커도 숨김) 그 줄 소리도 멈춤
    document.body.classList.add("hinted");
    buzz();
    renderActions(card);                            // 다 나온 뒤면 [내 답변 영어로] ↔ [접기]
    /* 말풍선 크기가 바뀌었으니, 바뀐 글자가 나타나는 애니메이션(.25초)이 끝난 뒤 그 줄 전체가 보이게 맞춤(이미 보이면 그대로) */
    clearTimeout(row._fit);
    row._fit = setTimeout(() => { if (card._st === st && row.isConnected) follow(card, row); }, 260);
  } else if ((st.mode === "listen" && st.revealed) || st.mode === "shadow") {
    const w = target && target.closest(".w");
    const i = +row.dataset.l;
    if (w) { buzz(); st.rd.seek(i, +w.dataset.w); }
    else if (st.mode === "listen") st.rd.play(i, 0, true);
  }
}

/* 읽기 모드 말풍선 옆 스피커: 그 줄만 읽고 단어 강조 (다시 누르면 멈춤) */
function cardSpeak(card, row) {
  const st = card && card._st;
  if (!st || !row) return;
  if (row.classList.contains("playing")) { Player.stop(); return; }
  st.rd.play(+row.dataset.l, 0, true);
}

/* 듣기·쉐도잉 공통 속도(0.8x / 1.0x). 재생 중인 소리에도 바로 적용 */
function toggleRate(card) {
  settings.drillRate = settings.drillRate === 1 ? 0.8 : 1;
  saveSettings();
  Player.setRate(settings.drillRate);
  renderActions(card);
}

/* ---------- 읽기: 떠올리고 확인하기 ---------- */
function showRow(card, row) {
  card._st.focus = +row.dataset.l;
  row.classList.remove("off");
  row.classList.add("pop");
  follow(card, row);
}
function readNext(card) {
  const st = card._st;
  const rows = rowsOf(card);
  if (st.timer) {                                   // '입력 중…'이면 기다리지 않고 바로 보여 줌
    clearTimeout(st.timer);
    st.timer = null;
    card.querySelectorAll(".typing").forEach(x => x.remove());
    showRow(card, rows[st.shown++]);
    renderActions(card);
    return;
  }
  if (st.shown >= rows.length) { restartCard(card); return; }
  const row = rows[st.shown];
  if (row.classList.contains("them")) {
    const typing = document.createElement("div");
    typing.className = "row them typing pop";
    typing.innerHTML = '<div class="bubble dots" aria-label="입력 중"><i></i><i></i><i></i></div>';
    row.parentNode.insertBefore(typing, row);
    follow(card, typing);
    st.timer = setTimeout(() => {
      if (card._st !== st) return;
      st.timer = null;
      typing.remove();
      showRow(card, rows[st.shown++]);
      renderActions(card);
    }, 850);
  } else {
    showRow(card, rows[st.shown++]);
  }
  renderActions(card);
}
function readAll(card) {
  const st = card._st;
  clearTimeout(st.timer);
  st.timer = null;
  card.querySelectorAll(".typing").forEach(x => x.remove());
  const rows = rowsOf(card);
  rows.forEach(r => {
    if (r.classList.contains("off")) { r.classList.remove("off"); r.classList.add("pop"); }
    r.classList.remove("kq-on");
  });
  st.shown = rows.length;
  st.full = true;
  renderActions(card);
}

/* ---------- 듣기: 글자 없이 듣기 ---------- */
/* 지금 줄(i, 없으면 -1): 대화의 줄 강조 + 두 사람 아이콘 중 말하는 쪽 + "3 / 6" */
function setCur(card, i) {
  const rows = rowsOf(card);
  rows.forEach((r, j) => r.classList.toggle("cur", j === i));
  const line = i >= 0 ? lineOf(card, i) : null;
  card.classList.toggle("talk-them", !!line && line.who !== "me");
  card.classList.toggle("talk-me", !!line && line.who === "me");
  card.querySelector(".duo-n").textContent = line ? (i + 1) + " / " + rows.length : "대사 " + rows.length + "줄";
}
function listenStart(card) {
  card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });   // 처음부터: 제목·상황이 보이는 위치에서 시작
  card._st.rd.play(0, 0, false);
  renderActions(card);
}
function listenPlay(card) {
  const rs = card._st.rd.state();
  if (rs.active && !rs.single) { card._st.rd.toggle(); return; }   // 재생 중이면 일시정지↔이어 듣기 (버튼은 Player.onChange가 다시 그림)
  if (!rs.active && card._st.hold >= 0) { card._st.rd.play(card._st.hold, 0, false); renderActions(card); return; }   // 연습 모드에서 돌아온 뒤: 멈춘 줄부터
  listenStart(card);
}
function listenReveal(card, on) {
  card._st.revealed = on;
  card.classList.toggle("masked", !on);
  renderActions(card);
}

/* ---------- 쉐도잉: 한 줄씩 듣고 따라 말하기 ---------- */
function shadowGo(card, i) {
  const st = card._st;
  const rows = rowsOf(card);
  st.idx = i;
  st.focus = i;
  rows.forEach((r, j) => {
    if (j === i && r.classList.contains("off")) r.classList.add("pop");
    r.classList.toggle("off", j > i);
    r.classList.toggle("past", j < i);
    r.classList.toggle("cur", j === i);
  });
  if (i === 0) card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });
  else follow(card, rows[i], true);
  shadowSay(card);
  renderActions(card);
}
function shadowSay(card) {
  const st = card._st;
  if (st.idx >= 0) st.rd.play(st.idx, 0, true);
}

/* ---------- 쉐도잉 어려움: 영어 없이 한 줄씩 듣고 따라 말하기 ----------
   듣기 모드처럼 두 사람 아이콘(masked) + 말하는 쪽 강조 + "3 / 6". [다음]을 눌러야 다음 줄을 재생(쉬움과 같은 한 줄 재생).
   [정답 보기] = 지금 줄만 영어 + 작은 한글(아이콘 아래, .peek), 다른 줄로 가면 다시 숨김.
   [마치기](마지막 줄) → 아이콘이 사라지고 대화 전체(revealed), 버튼은 [처음부터] */
function blindPaint(card) {
  const st = card._st;
  card.classList.toggle("masked", !st.revealed);
  card.classList.toggle("peek", st.peek && !st.revealed);
  rowsOf(card).forEach((r, j) => {
    const on = st.revealed || (st.peek && j === st.idx);
    if (on && r.classList.contains("off")) r.classList.add("pop");
    r.classList.toggle("off", !on);
  });
  setCur(card, st.revealed ? -1 : st.idx);         // 줄 강조(.cur) · 말하는 쪽 아이콘 · "3 / 6"
}
function blindGo(card, i) {
  const st = card._st;
  st.idx = i;
  st.focus = i;
  st.peek = false;
  st.revealed = false;
  blindPaint(card);
  card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });
  st.rd.play(i, 0, true);
  renderActions(card);
}
function blindPeek(card, on) {
  const st = card._st;
  st.peek = on;
  blindPaint(card);
  if (on) follow(card, rowsOf(card)[st.idx]);
  renderActions(card);
}
function blindFinish(card) {
  const st = card._st;
  st.peek = false;
  st.revealed = true;
  blindPaint(card);
  card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });
  renderActions(card);
}

/* ---------- 쉐도잉 중간: 쉬지 않고 대화 전체를 이어서(줄 사이 MID_GAP) — 같은 카드 재생기(cardReader)를 그대로 씀 ----------
   시작하면 모든 줄이 보이고, 지금 줄은 크게(.cur) + 노래방식 채우기, 지나간 줄은 흐리게, 화면이 지금 줄을 따라감.
   단어 탭 → 그 위치부터 끝까지(seek, tapSingle false). 끝까지 들으면 멈춤(예전 '반복'은 없앰) */
function midStart(card, i, w) {
  const st = card._st;
  clearTimeout(st.timer);
  st.timer = null;
  if (!st.started) {
    st.started = true;
    rowsOf(card).forEach(r => { r.classList.remove("off"); r.classList.add("pop"); });
  }
  if (!i) card.querySelector(".body").scrollTo({ top: 0, behavior: "smooth" });
  st.rd.play(i || 0, w || 0, false);
  renderActions(card);
}
function midPlay(card) {
  const st = card._st;
  if (st.rd.state().active) { st.rd.toggle(); return; }   // 버튼 모양은 Player.onChange가 다시 그림
  midStart(card, st.hold >= 0 ? st.hold : 0, 0);         // 연습 모드에서 돌아온 뒤면 멈춘 줄부터
}
function midCur(card, i) {
  card.classList.add("sh-live");
  rowsOf(card).forEach((r, j) => {
    r.classList.toggle("cur", j === i);
    r.classList.toggle("past", j < i);
  });
  follow(card, rowsOf(card)[i], true);
}
function midEnd(card) {
  card.classList.remove("sh-live");
  rowsOf(card).forEach(r => r.classList.remove("cur", "past"));
  renderActions(card);
}

/* ---------- 진도 저장: 마지막으로 본 카드 + 본 카드 목록 ---------- */
const PROGRESS_KEY = "engcards.progress.v1";
const storageOK = (() => {

    const ok = localStorage.getItem("__engcards_test") === "1";

function cardKey(i) {

  return c && c.id != null ? String(c.id) : "i" + i;   // id 기준이라 카드를 추가해도 기록이 안 꼬임
}
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "null");
    if (p && typeof p === "object") return { last: p.last == null ? null : String(p.last), seen: Array.isArray(p.seen) ? p.seen.map(String) : [],
      at: p.at && typeof p.at === "object" ? p.at : {} };   // at: 카드key → 마지막으로 본 시각(ms) — 홈 질문 고르기(오래전에 본 카드 먼저)
  } catch (e) {}

}
const progress = loadProgress();
const seenSet = new Set(progress.seen);
function saveProgress() {

}
function indexOfKey(key) {

}
function jumpTo(idx) {

const DIARY_KEY = "engcards.diary.v1";
function loadDiary() {

    if (d && typeof d === "object" && d.entries && typeof d.entries === "object") return d;

/* 하루 기록 = { items: [ { q:{en,ko}, text, fix, updated } ] } (최대 3편). 예전 형식({q,text,fix})은 자동으로 바꿔 읽음 */
const MAX_WRITES = 3;
function normEntry(e) {
  if (!e || typeof e !== "object") return null;
  const raw = Array.isArray(e.items) ? e.items : [e];
  const items = raw.filter(x => x && typeof x === "object")
    .map(x => ({ q: x.q && x.q.en ? { en: x.q.en, ko: x.q.ko || "" } : null, text: x.text || "", fix: x.fix || "", updated: x.updated || 0 }));
  return items.length ? { items: items.slice(0, MAX_WRITES) } : null;
}
Object.keys(diary.entries).forEach(k => {
  const n = normEntry(diary.entries[k]);
  if (n) diary.entries[k] = n; else delete diary.entries[k];
});
const hasContent = it => !!(it && ((it.text || "").trim() || (it.fix || "").trim()));

const pad2 = n => String(n).padStart(2, "0");
function dateKey(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function dayNumber(key) {
  const p = key.split("-").map(Number);
  return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000);
}
/* 오늘 고를 수 있는 질문 5개: 날짜마다 정해진 순서에서, 다른 날 이미 답한 질문은 건너뜀.
   (같은 날엔 항상 같은 5개. 다 답하면 처음부터 다시 돌아옴) */
function candidatesFor(key) {
  const L = QUESTIONS.length;
  if (!L) return [];
  const start = ((dayNumber(key) * 5) % L + L) % L;
  const order = [];
  for (let i = 0; i < L; i++) order.push(QUESTIONS[(start + i) % L]);
  const used = new Set();
  Object.keys(diary.entries).forEach(k => {
    if (k === key) return;
    diary.entries[k].items.forEach(it => { if (it.q && hasContent(it)) used.add(it.q.en); });
  });
  const fresh = order.filter(q => !used.has(q.en));
  const pool = fresh.length >= 5 ? fresh : fresh.concat(order.filter(q => used.has(q.en)));
  return pool.slice(0, 5);
}
function koDate(key, withDay) {
  const p = key.split("-").map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  const year = p[0] !== new Date().getFullYear() ? p[0] + "년 " : "";
  return year + p[1] + "월 " + p[2] + "일" + (withDay ? " " + "일월화수목금토"[d.getDay()] + "요일" : "");
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;left:0;opacity:0;";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

  /* 표현 학습 기록·복습 일정·연습장도 함께 */
  const ids = Object.keys(study.items).sort();
  if (ids.length) {

      out.push("[" + id + "] " + (it ? it.ex.phrase + " (" + shortMeaning(it.ex) + ")" : "") +
        "\n상태: " + st + " · 시작: " + (s.startedOn || "-") + " · 단계: " + (s.step || 0) + "/" + INTERVALS.length +
        (s.due ? " · 다음 복습: " + s.due : "") + (s.masteredOn ? " · 익힘: " + s.masteredOn : "") +
        (notes ? "\n\n연습장:\n" + notes : ""));
    });
  }
  return out.join("\n\n----------\n\n");
}

/* ================= 표현 탭: 모음 · 학습 · 연습장 · 복습 =================
   표현 목록은 카드 데이터에서 자동으로 모음(따로 복사해서 관리하지 않음).
   학습 기록은 표현 id 기준으로 저장 → 문구를 고쳐도 기록이 유지됨 */
const STUDY_KEY = "engcards.study.v1";
const DAILY_PICKS = 3;                       // 하루에 새로 고를 수 있는 표현 수
const INTERVALS = [1, 3, 7, 14, 30];         // 복습 간격(일). 30일 복습까지 통과하면 '익힘'

/* 테스트용: 주소에 ?debugDate=2026-10-20 을 붙이면 그 날짜로 계산 (화면에는 안 보임) */
const DEBUG_DATE = (() => {
  try {
    const v = new URLSearchParams(location.search).get("debugDate");
    return /^\d{4}-\d{2}-\d{2}$/.test(v || "") ? v : null;
  } catch (e) { return null; }
})();
function studyToday() { return DEBUG_DATE || dateKey(); }
function addDays(key, n) {
  const p = key.split("-").map(Number);
  return dateKey(new Date(p[0], p[1] - 1, p[2] + n));
}

function exprIdOf(card, ex, ei, kind) {
  return ex.id || ("c" + card.id + "-" + (kind === "extra" ? "x" : "e") + (ei + 1));
}
/* 짧은 한국어 뜻: meaning 필드 → 설명의 첫 '…' → 설명 첫 문장 */
function shortMeaning(ex) {
  if (ex.meaning) return ex.meaning;
  const m = /'([^']{1,40})'/.exec(ex.ko || "");
  if (m) return m[1];
  return String(ex.ko || "").split(/[.!?]/)[0].slice(0, 30);
}

/* 카드 데이터 → 표현 목록 (카테고리 순 → 카드 id 순 → 핵심 다음 추가 표현) */
const EXPR_LIST = [];
const EXPR_BY_ID = {};
(function buildExprList() {
  const catOrder = (window.CATEGORY_DATA || []).map(c => c.name);
  const rank = name => { const i = catOrder.indexOf(name); return i < 0 ? 999 : i; };
  CARDS.map((c, ci) => ci)
    .sort((a, b) => rank(CARDS[a].category) - rank(CARDS[b].category) || CARDS[a].id - CARDS[b].id)
    .forEach(ci => {
      const card = CARDS[ci];
      const add = (ex, ei, kind) => {
        const id = exprIdOf(card, ex, ei, kind);
        if (EXPR_BY_ID[id]) return;
        const item = { id, ex, ci, ei, kind, card };
        EXPR_LIST.push(item);
        EXPR_BY_ID[id] = item;
      };
      (card.expressions || []).forEach((ex, ei) => { if (EXPR_OWNER[normPhrase(ex.phrase)] === ci) add(ex, ei, "core"); });
      (card.extraExpressions || []).forEach((ex, ei) => add(ex, ei, "extra"));
    });
})();

/* 학습 기록: { items: { 표현id: { status, startedOn, step, due, history:[{date, ok}], notes:{ 날짜: 글 } } }, picks: { 날짜: [표현id] } } */
const study = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(STUDY_KEY) || "null");
    if (s && typeof s === "object") return { items: s.items && typeof s.items === "object" ? s.items : {}, picks: s.picks && typeof s.picks === "object" ? s.picks : {} };
  } catch (e) {}
  return { items: {}, picks: {} };
})();
function saveStudy() {
  try { localStorage.setItem(STUDY_KEY, JSON.stringify(study)); return true; } catch (e) { return false; }
}
/* 화면용 상태: new(미학습·중단) / learning(학습 중) / mastered(익힘) */
function statusOf(id) {
  const s = study.items[id];
  if (!s || s.status === "stopped") return "new";
  return s.status === "mastered" ? "mastered" : "learning";
}
const STATUS_LABEL = { new: "미학습", learning: "학습 중", mastered: "익힘" };
/* 오늘 새로 고른 표현 수: 오늘 고른 것 중 지금도 학습 중(또는 익힘)인 것만. 오늘 골랐다가 중단한 건 세지 않음(그 자리를 다시 쓸 수 있게).
   중단을 고치기 전 기록(오늘 목록에 중단한 표현이 남아 있음)도 이렇게 세면 바로 풀림 */
function picksToday() {
  return (study.picks[studyToday()] || []).filter(id => study.items[id] && study.items[id].status !== "stopped").length;
}

function startLearning(id) {
  const t = studyToday();
  if (picksToday() >= DAILY_PICKS) return false;
  const s = study.items[id] || {};
  s.status = "learning";
  s.startedOn = t;
  s.step = 0;
  s.due = addDays(t, INTERVALS[0]);
  s.history = s.history || [];
  s.notes = s.notes || {};
  study.items[id] = s;
  const list = study.picks[t] = study.picks[t] || [];
  if (!list.includes(id)) list.push(id);
  saveStudy();
  return true;
}
function stopLearning(id) {
  const s = study.items[id];
  if (!s) return;
  s.status = "stopped";     // 연습장 기록(notes)은 그대로 남김
  delete s.due;
  /* 오늘 고른 표현을 오늘 중단하면 오늘 목록에서 빼서 그 자리를 다시 비움. 어제 이전에 시작한 표현은 오늘 개수와 상관없으니 그대로 */
  const t = studyToday(), list = study.picks[t];
  if (list && list.includes(id)) study.picks[t] = list.filter(x => x !== id);
  saveStudy();
}
/* 오늘 복습할 표현: 날짜가 지난(밀린) 것까지 모두, 오래된 것부터 */
function dueList() {
  const t = studyToday();
  return Object.keys(study.items)
    .filter(id => EXPR_BY_ID[id] && study.items[id].status === "learning" && study.items[id].due && study.items[id].due <= t)
    .sort((a, b) => study.items[a].due.localeCompare(study.items[b].due) || a.localeCompare(b));
}
/* 기억남 → 다음 간격, 헷갈림 → 처음(1일 뒤)부터 */
function grade(id, remembered) {
  const s = study.items[id];
  if (!s) return;
  const t = studyToday();
  s.history = s.history || [];
  s.history.push({ date: t, ok: remembered, step: s.step || 0 });
  if (remembered) {
    s.step = (s.step || 0) + 1;
    if (s.step >= INTERVALS.length) { s.status = "mastered"; s.masteredOn = t; delete s.due; }
    else s.due = addDays(t, INTERVALS[s.step]);
  } else {
    s.step = 0;
    s.due = addDays(t, INTERVALS[0]);
  }
  saveStudy();
}
function dueText(id) {
  const s = study.items[id];
  if (!s || !s.due) return "";
  const d = dayNumber(s.due) - dayNumber(studyToday());
  if (d < 0) return (-d) + "일 밀림";
  if (d === 0) return "오늘 복습";
  return koDate(s.due) + " 복습 (" + d + "일 뒤)";
}
function updateExprBadge() {
  const n = dueList().length;
  const b = document.getElementById("exprBadge");
  b.hidden = n === 0;
  b.textContent = n > 99 ? "99+" : String(n);
  document.getElementById("tabExpr").setAttribute("aria-label", "표현" + (n ? ", 복습 " + n + "개" : ""));
}

/* 표현이 나온 대사(복습 힌트·상세에서 씀) */
function sourceLine(item) {
  const d = item.card.dialogue || [];
  return d.find(x => exprFound(item.ex, x.en || "")) || null;
}

function renderExprList() {
  const q = X.search.value.trim().toLowerCase();
  const match = it => {
    if (xFilter !== "all" && statusOf(it.id) !== xFilter) return false;
    if (!q) return true;
    const hay = [it.ex.phrase, it.ex.ko, shortMeaning(it.ex), it.card.title, it.ex.meaning || ""].join(" ").toLowerCase();
    return hay.includes(q);
  };
  const groups = [];
  EXPR_LIST.forEach(it => {
    if (!match(it)) return;
    let g = groups.find(x => x.name === it.card.category);
    if (!g) { g = { name: it.card.category, items: [] }; groups.push(g); }
    g.items.push(it);
  });
  if (!groups.length) {
    X.list.innerHTML = '<p class="w-empty">' + (q ? "검색 결과가 없어요." : "해당하는 표현이 없어요.") + '</p>';
    return;

  X.list.innerHTML = groups.map(g =>
    '<section class="toc-group" style="--h:' + hueOf(g.name) + '">' +
      '<div class="toc-head"><span class="toc-emoji" aria-hidden="true">' + (CATEGORY_EMOJI[g.name] || "📌") + '</span>' +
        '<h4 class="toc-cat">' + esc(g.name) + '</h4><span class="toc-cnt">' + g.items.length + '개</span></div>' +
      '<ul class="x-items">' + g.items.map(it =>
        '<li><button class="x-item' + (it.kind === "extra" ? " extra" : "") + '" type="button" data-xid="' + esc(it.id) + '">' +
          '<span class="x-main"><span class="x-phrase">' + esc(it.ex.phrase) + '</span>' +
            '<span class="x-mean">' + esc(shortMeaning(it.ex)) + '</span>' +
            '<span class="x-src">' + (it.kind === "extra" ? '<span class="x-tag">추가 표현</span>' : "") + (it.ci + 1) + '. ' + esc(it.card.title) + '</span></span>' +
          statusPill(statusOf(it.id)) +
        '</button></li>').join("") + '</ul>' +
    '</section>').join("");
}

/* 연습장 기록(날짜별) 보기 */
function pastNotesHtml(id, exceptToday) {
  const s = study.items[id];
  const notes = (s && s.notes) || {};
  const t = studyToday();
  const keys = Object.keys(notes).filter(k => (notes[k] || "").trim() && !(exceptToday && k === t)).sort().reverse();

/* 시트 안: 학습하기·중단·프롬프트 복사·상황 카드로 가기·복습 확인 */

  }

/* ================= 홈 =================
   위: 오늘의 질문 — 카드의 hooks({ ko: 질문, line: 내 대사 줄 번호(1부터) }) 중 하나를 크게. 앱을 켤 때마다·[다른 질문]마다 새로 고름.
     고르는 순서(pickHook): 아직 안 본 카드의 질문(그중 무작위) → 없으면 가장 오래전에 본 카드(progress.at)의 질문. 최근에 나온 10개는 빼고.
     누르면(openHook) 그 카드로 가서 읽기 모드, 연결된 내 대사 줄까지 나온 상태(그 줄은 한글) + 잠깐 강조 → 답을 떠올린 뒤 탭해서 영어로 확인.
   아래: 바로가기 2×2 — 상황 / 표현 / 글쓰기(그 탭으로) · 드라이브(시작 화면) + 작은 현황.
   기록: engcards.home.v1 { recent: ["카드id:line", …] } — 최근에 보여 준 질문 10개 */
const HOME_KEY = "engcards.home.v1";
const HOOK_RECENT = 10;
const homeEl = document.getElementById("viewHome");
const homeState = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(HOME_KEY) || "null");
    if (s && Array.isArray(s.recent)) return { recent: s.recent.filter(x => typeof x === "string").slice(-HOOK_RECENT) };
  } catch (e) {}
  return { recent: [] };
})();
function saveHome() {
  try { localStorage.setItem(HOME_KEY, JSON.stringify(homeState)); } catch (e) {}
}
let homeHook = null;      // 지금 보여 주는 질문 { ci, h, key }
let homeReady = false;    // 스크립트를 끝까지 읽은 뒤(드라이브 상태 D 등)부터 홈을 그림 — 맨 아래에서 켬
function allHooks() {
  const out = [];
  CARDS.forEach((c, ci) => (Array.isArray(c.hooks) ? c.hooks : []).forEach(h => {
    const d = c.dialogue || [];
    if (h && h.ko && Number.isInteger(h.line) && d[h.line - 1] && d[h.line - 1].who === "me") out.push({ ci, h, key: c.id + ":" + h.line });
  }));
  return out;
}
function pickHook() {
  const all = allHooks();
  if (!all.length) return null;
  const block = new Set(homeState.recent.slice(-Math.min(HOOK_RECENT, all.length - 1)));   // 질문이 적어도 하나는 남게
  const pool = all.filter(x => !block.has(x.key));
  const rand = list => list[Math.floor(Math.random() * list.length)];
  const unseen = pool.filter(x => !seenSet.has(cardKey(x.ci)));
  let pick;
  if (unseen.length) pick = rand(unseen);
  else {
    const at = x => Number(progress.at && progress.at[cardKey(x.ci)]) || 0;     // 이 기능 전에 본 카드는 시각이 없음 → 가장 오래된 쪽
    const min = Math.min.apply(null, pool.map(at));
    pick = rand(pool.filter(x => at(x) === min));
  }
  homeState.recent = homeState.recent.filter(k => k !== pick.key).concat([pick.key]).slice(-HOOK_RECENT);
  saveHome();
  return pick;
}
function renderHome() {
  if (!homeReady) return;
  const x = homeHook, card = x && CARDS[x.ci];
  const seen = CARDS.filter((c, i) => seenSet.has(cardKey(i))).length;
  const entry = diary.entries[dateKey()];
  const wrote = !!(entry && entry.items.some(hasContent));
  const dp = D.pos, dpCard = dp && CARDS.find(c => c.id === dp.cid);
  const dvTxt = dp ? "이어 듣기: " + (dpCard ? dpCard.title : String(dp.label || "").split(" · ")[0]) : "시작하기";
  const svg = sel => { const s = document.querySelector(sel); return s ? s.outerHTML : ""; };
  const go = (to, icon, name, sub) => '<button class="h-go" type="button" data-home-go="' + to + '">' + icon + '<b>' + name + '</b><small>' + esc(sub) + '</small></button>';
  homeEl.innerHTML =
    '<header class="w-top"><div><div class="w-date">' + esc(koDate(dateKey(), true)) + '</div><h2 class="w-title">한 장 영어</h2></div></header>' +
    '<div class="hq">' + (x ?
      '<button class="hq-card" type="button" data-hq-go style="--h:' + hueOf(card.category) + '">' +
        '<span class="hq-label">오늘의 질문</span><span class="hq-text">' + esc(x.h.ko) + '</span>' +
        '<span class="hq-go">눌러서 떠올려 보기' + ICON_ARROW + '</span></button>' +
      '<div class="hq-meta"><span class="hq-src">' + (CATEGORY_EMOJI[card.category] || "") + " " + esc(card.category) + " · " + esc(card.title) + '</span>' +
        '<button class="hq-next" type="button" data-hq-next>다른 질문</button></div>' :
      '<p class="hq-empty">아직 질문이 없어요</p>') + '</div>' +
    '<nav class="h-grid" aria-label="바로가기">' +
      go("cards", svg("#tabCards svg"), "상황", CARDS.length + "장 중 " + seen + "장 봄") +
      go("expr", svg("#tabExpr svg"), "표현", "오늘 복습 " + dueList().length + "개 · 새 표현 " + picksToday() + "/" + DAILY_PICKS) +
      go("write", svg("#tabWrite svg"), "글쓰기", wrote ? "오늘 작성 완료" : "오늘 아직 안 씀") +
      go("drive", ICON_CAR, "드라이브", dvTxt) +
    '</nav>';
}
/* 질문 카드 → 그 카드의 그 줄: 읽기 모드(듣기·쉐도잉이었으면 바꿈), 그 줄까지 보이고 그 줄(내 대사)은 한글, 잠깐 강조 */
function openHook(x) {
  const card = feed.children[x.ci];
  if (!card || !card._st) return;
  setMode("read");
  switchTab("cards", true);
  jumpTo(x.ci);
  Player.stop();
  resetCard(card);
  const st = card._st, rows = rowsOf(card), li = Math.min(x.h.line, rows.length) - 1, row = rows[li];
  rows.forEach((r, j) => r.classList.toggle("off", j > li));
  st.shown = li + 1;
  st.focus = li;
  row.classList.add("kq-on");
  renderActions(card);
  requestAnimationFrame(() => {
    follow(card, row);
    row.classList.remove("hook-hi");
    void row.offsetWidth;                            // 애니메이션을 처음부터 다시
    row.classList.add("hook-hi");
  });
  clearTimeout(row._hook);
  row._hook = setTimeout(() => row.classList.remove("hook-hi"), 2400);
}
homeEl.addEventListener("click", e => {
  const t = e.target;
  let el;
  if ((el = t.closest("[data-hq-go]"))) { buzz(); if (homeHook) openHook(homeHook); return; }
  if ((el = t.closest("[data-hq-next]"))) { buzz(); homeHook = pickHook(); renderHome(); return; }
  if ((el = t.closest("[data-home-go]"))) {
    const to = el.dataset.homeGo;
    if (to === "drive") openDrive(); else switchTab(to);
  }
});

/* ================= 하단 탭 =================
   [홈 | 상황 | 표현 | 글쓰기]. 앱을 켜면 항상 홈(2026-10-03부터 — 예전 '마지막 탭 기억' engcards.tab.v1은 지움).
   탭을 오가도 각 화면의 상태(보던 카드·모드·스크롤·입력)는 그대로(.view.off는 visibility:hidden이라 남아 있음) */
try { localStorage.removeItem("engcards.tab.v1"); } catch (e) {}
const VIEWS = { home: homeEl, cards: feed, expr: X.view, write: W.view };
let currentTab = "home";
function switchTab(name, quiet) {
  if (!VIEWS[name]) name = "home";
  if (name !== currentTab) Player.stop();
  currentTab = name;
  Object.keys(VIEWS).forEach(k => {
    const on = k === name;
    VIEWS[k].classList.toggle("off", !on);
    VIEWS[k].inert = !on;
  });
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === name ? "true" : "false"));
  document.body.classList.toggle("tab-cards", name === "cards");
  if (name === "write") {
    if (todayKey !== dateKey()) { saveToday(); initWrite(); }
    else { autoGrow(W.text); autoGrow(W.fix); }
  }
  if (name === "expr") renderExprTab();
  if (name === "home") renderHome();
  if (!quiet) buzz();
}
document.querySelector(".tabbar").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (t) switchTab(t.dataset.tab);
});
switchTab("home", true);                             // 앱을 켜면 항상 홈(내용은 스크립트 맨 아래에서 질문을 고른 뒤 그림)

/* ================= 드라이브 모드: 여러 카드를 이어서 듣기 (운전·이동 중) =================
   상황 카드 위쪽 [드라이브] → 시작 화면(옵션) → 재생 화면. 새 재생 로직은 없고 인터랙티브 스크립트의 createReader 하나로 재생:
   재생 목록(D.pl.items)의 문장마다 .sc 요소를 필요할 때 만들어(dvEl) items로 넘기고,
   효과음은 before(), 따라 말할 시간은 gap(), 지금 위치(화면·저장·잠금화면)는 onItem()에서 처리.
   소리는 모두 Player → AudioCache(다른 화면에서 들은 문장은 그대로 재사용). 한국어는 읽지 않음.
   재생 순서
   - 카드 범위: 카드마다 [새 카드 효과음] 대화 전체 → 핵심 표현마다 [표현 효과음] 표현 읽기 → 예문 5개 → 썰
     (내용: 대화문만 = 대화만 / 예문까지 = 대화 → 표현마다 표현 읽기 + 예문 / 썰까지 = + 썰 / 예문만·썰만 = 대화 없이 표현 읽기 + 예문 또는 썰)
   - 표현 범위(학습 중 / 오늘 복습): 표현마다 [표현 효과음] 표현 읽기 → 예문 5개 → 썰 */
const DRIVE_KEY = "engcards.drive.v1";
const DRIVE_SCOPES = { all: "전체 카드", cat: "카테고리 선택", learning: "학습 중인 표현", due: "오늘 복습할 표현" };
/* 내용(드라이브·연습 모드 공통): dialogue 대화문만 / examples 예문까지 / story 썰까지 — 대화 포함
   / exOnly 예문만 / storyOnly 썰만 — 대화 없이 핵심 표현의 예문 또는 썰만. 시작 화면에서 두 줄([대화 포함 3개] [대화 없이 2개])로 보여 줌 */
const CONTENT_ROWS = [[["dialogue", "대화문만"], ["examples", "예문까지"], ["story", "썰까지"]], [["exOnly", "예문만"], ["storyOnly", "썰만"]]];
const hasDlg = c => c !== "exOnly" && c !== "storyOnly";
const hasEx = c => c === "examples" || c === "story" || c === "exOnly";
const hasStory = c => c === "story" || c === "storyOnly";
const DRIVE_CONTENT = { dialogue: "대화문만", examples: "예문까지", story: "썰까지", exOnly: "예문만", storyOnly: "썰만" };
const DV_DEFAULT = { scope: "all", cats: [], content: "story", shadow: false, rate: 1 };

/* 저장: { opts: 시작 화면 옵션, pos: 마지막 위치 { scope, cats, key(문장), block(카드·표현), cid, bi, label } } */
function loadDrive() {
  try {
    const s = JSON.parse(localStorage.getItem(DRIVE_KEY) || "null");
    if (s && typeof s === "object") {
      const o = Object.assign({}, DV_DEFAULT, s.opts && typeof s.opts === "object" ? s.opts : {});
      if (!DRIVE_SCOPES[o.scope]) o.scope = "all";
      if (!DRIVE_CONTENT[o.content]) o.content = "story";
      o.cats = Array.isArray(o.cats) ? o.cats.filter(c => typeof c === "string") : [];
      o.shadow = !!o.shadow;
      o.rate = o.rate === 0.8 ? 0.8 : 1;
      return { opts: o, pos: s.pos && typeof s.pos === "object" && s.pos.key ? s.pos : null };
    }
  } catch (e) {}
  return { opts: Object.assign({}, DV_DEFAULT), pos: null };
}
const D = Object.assign(loadDrive(), {
  open: false, screen: "setup",
  pl: null, idx: 0, els: [],                 // 재생 목록 · 지금 문장 번호 · 문장 요소(필요할 때 만듦)
  done: false, interrupted: false, echo: false, lastAct: "",
  ui: null, lock: null, lockReq: false, ka: null, kaWant: false, ac: null,
  pre: { state: "idle" }                     // 미리 받아두기: idle | counting | confirm | running | done
});
function saveDrive() {
  try { localStorage.setItem(DRIVE_KEY, JSON.stringify({ opts: D.opts, pos: D.pos })); } catch (e) {}
}
const driveEl = document.getElementById("drive");
const dvSetupEl = document.getElementById("dvSetup");
const dvPlayEl = document.getElementById("dvPlay");

/* 표현을 소리 내어 읽을 글: ~ 자리 표시는 빼고 자연스럽게 ("Can I get ~?" → "Can I get...?", "~ to go" → "to go") */
function sayPhrase(p) {
  return String(p).replace(/~\w*/g, "~").replace(/^\s*~\s*/, "").replace(/\s*~/g, "...")
    .replace(/\.{4,}/g, "...").replace(/\s{2,}/g, " ").trim();
}
const catsKey = cats => cats.slice().sort().join(",");
const dvVoice = it => (it.who === "me" ? settings.voiceMe : settings.voiceThem);
function dvElevenOK() { return settings.engine === "eleven" && !!settings.apiKey && navigator.onLine !== false; }

/* ---- 재생 목록 만들기 → { items: [문장], blocks: [카드 또는 표현], exprScope }
   문장 { kind: dlg|phrase|ex|story, text, ko, who, fx: card|expr|null(앞에 효과음), block, ci, xid, ex, n, total, key } */
function driveExprs(o) {
  if (o.scope === "due") return dueList().map(id => EXPR_BY_ID[id]).filter(Boolean);
  return EXPR_LIST.filter(it => statusOf(it.id) === "learning");
}
function buildDrive(o) {
  const items = [], blocks = [];
  const exprScope = o.scope === "learning" || o.scope === "due";
  const push = x => { if (String(x.text || "").trim()) items.push(x); };
  const exprItems = (b, it, withEx, withStory) => {
    const ex = it.ex, base = { block: b, ci: it.ci, xid: it.id, ex };
    push(Object.assign({ kind: "phrase", text: sayPhrase(ex.phrase), ko: shortMeaning(ex), who: "me", fx: "expr", n: 1, total: 1 }, base));
    if (withEx) (ex.examples || []).forEach((x, n, arr) => push(Object.assign({ kind: "ex", text: x.en, ko: x.ko, who: "them", n: n + 1, total: arr.length }, base)));
    if (withStory && ex.story) push(Object.assign({ kind: "story", text: ex.story.en, ko: ex.story.ko, who: "me", n: 1, total: 1 }, base));
  };
  if (exprScope) {
    driveExprs(o).forEach(it => {
      blocks.push({ kind: "expr", ci: it.ci, xid: it.id, key: "x" + it.id, start: items.length });
      exprItems(blocks.length - 1, it, true, true);
    });
  } else {
    CARDS.forEach((card, ci) => {
      if (o.scope === "cat" && !o.cats.includes(card.category)) return;
      const b = blocks.length, d = card.dialogue || [], start = items.length;
      blocks.push({ kind: "card", ci, cid: card.id, key: "c" + card.id, start });
      if (hasDlg(o.content)) d.forEach((line, n) => push({ kind: "dlg", text: line.en, ko: line.ko || "", who: whoOf(line), name: whoLabel(line.who), fx: n === 0 ? "card" : null, block: b, ci, n: n + 1, total: d.length }));
      /* 대화문만 = 대화만(표현 효과음·표현 읽기·예문·썰 없음) / 예문까지 = 표현마다 표현 읽기 + 예문 / 썰까지 = + 썰 / 예문만·썰만 = 대화 없이 표현마다 표현 읽기 + 예문(또는 썰) */
      if (o.content !== "dialogue") EXPR_LIST.filter(it => it.ci === ci && it.kind === "core").forEach(it => exprItems(b, it, hasEx(o.content), hasStory(o.content)));
      if (items[start] && !hasDlg(o.content)) items[start].fx = "card";   // 대화가 없으면 카드의 첫 문장(표현 읽기)에서 새 카드 효과음
    });
  }
  items.forEach(it => { it.key = blocks[it.block].key + "/" + it.kind + "/" + (it.xid || "") + "/" + it.n; });
  if (items.length && !items[0].fx) items[0].fx = exprScope ? "expr" : "card";
  return { items, blocks: blocks.filter(bl => items.some(it => it.block === blocks.indexOf(bl))), exprScope };
}

/* 지금 위치 표시: [위 줄, 아래 줄] 예) "카페에서 주문하기 · 3/18" / "대화 4/6", "Can I get ~? · 예문 2/5", "Can I get ~? · 썰" */
function driveLabels(k) {
  const pl = D.pl, it = pl.items[k];
  const card = CARDS[it.ci];
  const bi = pl.blocks.findIndex(bl => pl.items[bl.start] && pl.items[bl.start].block === it.block);
  const pos = (bi + 1) + "/" + pl.blocks.length;
  const ph = it.ex ? it.ex.phrase : "";
  return [
    pl.exprScope ? "표현 " + pos + " · " + card.title : card.title + " · " + pos,
    it.kind === "dlg" ? "대화 " + it.n + "/" + it.total :
      it.kind === "phrase" ? ph + " · 핵심 표현" :
      it.kind === "ex" ? ph + " · 예문 " + it.n + "/" + it.total : ph + " · 썰"
  ];
}
function dvBlockIndex(k) {
  const b = D.pl.items[k].block;
  return D.pl.blocks.findIndex(bl => D.pl.items[bl.start].block === b);
}

/* 문장 하나의 화면 요소(지금 문장·앞뒤 문장 자리를 옮겨 다님). 영어는 인터랙티브 스크립트(scriptHtml)라 노래방식 채우기가 그대로 됨 */
function dvEl(k) {
  if (D.els[k]) return D.els[k];
  const it = D.pl.items[k];
  const el = document.createElement("div");
  el.className = "dv-line k-" + it.kind + (it.who === "me" ? " me" : "") + (it.kind === "story" || it.text.length > 120 ? " long" : "");
  const who = it.kind === "dlg" ? it.name : it.kind === "phrase" ? "핵심 표현" : it.kind === "ex" ? "예문 " + it.n : "썰";
  el.innerHTML = '<div class="dv-who">' + esc(who) + '</div>' +
    '<div class="dv-en" lang="en">' + scriptHtml(it.text, it.ex && it.kind !== "phrase" ? markRanges(it.text, it.ex) : []) + '</div>' +
    (it.ko ? '<div class="dv-ko">' + esc(it.ko) + '</div>' : "");
  return (D.els[k] = el);
}

/* ---- 재생기: 인터랙티브 스크립트 공통 재생기를 그대로 씀 ---- */
D.rd = createReader({
  items: () => (D.pl ? D.pl.items.map((it, k) => ({ get el() { return dvEl(k).querySelector(".sc"); }, who: it.who })) : []),
  rate: () => D.opts.rate,
  before: (k, first) => dvBefore(k, first),
  gap: k => dvGap(k),
  onItem: k => dvOnItem(k),
  onEnd: complete => dvOnEnd(complete),
  onChange: () => dvPaintCtl()
});

/* 문장 앞: 새 카드·표현의 첫 문장이면 효과음(이전 문장 버튼으로 돌아온 경우는 생략).
   백그라운드에서 내장 음성으로 읽어야 하면(키 없음·인터넷 끊김) 소리가 안 나고 넘어가 버리므로 그 문장에서 멈춰 기다림 */
async function dvBefore(k, first) {
  if (document.visibilityState === "hidden" && !dvElevenOK()) { dvInterrupt(); return; }
  const it = D.pl.items[k];
  if (!it.fx || (first && D.lastAct === "prev")) { dvChimeOff(); return; }   // 효과음 중간에 넘긴 경우도 꺼 둠
  const ms = await dvChime(it.fx);
  if (ms) await sleep(ms);
  dvChimeOff();                                    // 음성이 나오기 전에 Web Audio를 끔
}
/* 문장 사이: 카드·표현이 바뀌면 조금 더 쉬고, '따라 말할 시간'이면 방금 문장 길이만큼 쉼(썰은 여러 문장이라 쉬지 않음) */
function dvGap(k) {
  const it = D.pl.items[k], nx = D.pl.items[k + 1];
  let ms = nx && nx.block !== it.block ? 900 : nx && nx.fx ? 650 : 450;
  if (D.opts.shadow && it.kind !== "story") {
    let len = Player.lastLength();
    if (!len) len = getScript(it.text).words.length * 0.38 / D.opts.rate;   // 길이를 못 쟀으면 단어 수로 어림
    const echo = Math.round(Math.min(12, Math.max(1.2, len)) * 1000);
    dvEcho(echo);
    ms = Math.max(ms, echo + 250);
  }
  return ms;
}
function dvOnItem(k) {
  D.idx = k;
  D.done = false;
  D.interrupted = false;
  D.echo = false;
  dvShow(k);
  dvSavePos();
  dvMedia();
  dvPrefetch(k);
}
function dvOnEnd(complete) {
  D.echo = false;
  if (complete) {                               // 끝까지 다 들음 → 다음엔 처음부터
    D.done = true;
    D.pos = null;
    saveDrive();
  }
  dvPaintCtl();
}

/* ---- 재생 화면 그리기 ---- */
function dvPlayHtml() {
  return '<header class="dv-ptop">' +
      '<button class="dv-x" type="button" data-dv="close" aria-label="드라이브 모드 나가기">' + ICON_X + '</button>' +
      '<div class="dv-loc"><div class="dv-loc1"></div><div class="dv-loc2"></div></div>' +
    '</header>' +
    '<div class="dv-stage">' +
      '<div class="dv-prev" aria-hidden="true"></div>' +
      '<div class="dv-scroll"><div class="dv-cur"></div></div>' +
      '<div class="dv-next" aria-hidden="true"></div>' +
    '</div>' +
    '<div class="dv-note" aria-live="polite"></div>' +
    '<div class="dv-ctl">' +
      '<button class="dv-b" type="button" data-dv="prev">' + ICON_PREV + '<span>이전 문장</span></button>' +
      '<button class="dv-b main" type="button" data-dv="toggle"></button>' +
      '<button class="dv-b" type="button" data-dv="next">' + ICON_NEXT + '<span>다음 문장</span></button>' +
      '<button class="dv-b wide" type="button" data-dv="block">' + ICON_SKIP + '<span class="dv-block-label"></span></button>' +
    '</div>';
}
function dvShow(k) {
  const U = D.ui, pl = D.pl;
  if (!U || !pl || !pl.items[k]) return;
  U.prev.replaceChildren(...(k > 0 ? [dvEl(k - 1)] : []));
  U.cur.replaceChildren(dvEl(k));
  U.next.replaceChildren(...(k + 1 < pl.items.length ? [dvEl(k + 1)] : []));
  U.scroll.scrollTop = 0;
  const L = driveLabels(k);
  U.loc1.textContent = L[0];
  U.loc2.textContent = L[1];
}
function dvPaintCtl() {
  const U = D.ui;
  if (!D.open || D.screen !== "play" || !U) return;
  const s = D.rd.state();
  const playing = s.active && !s.paused;
  U.toggle.innerHTML = (playing ? ICON_PAUSE : ICON_PLAY) + '<span>' + (playing ? "일시정지" : D.done ? "처음부터" : "재생") + '</span>';
  U.toggle.setAttribute("aria-label", playing ? "일시정지" : "재생");
  if (!(D.echo && playing)) {                    // '따라 말해 보세요' 중이 아니면 상태 글
    D.echo = false;
    U.note.textContent = D.done ? "끝까지 다 들었어요" :
      playing ? "" : D.interrupted ? "소리가 끊겨서 멈췄어요 · 재생을 누르면 이 문장부터" : "일시정지";
  }
  dvKeepAlive(playing);
  try { if (navigator.mediaSession) navigator.mediaSession.playbackState = playing ? "playing" : "paused"; } catch (e) {}
}
function dvEcho(ms) {
  if (!D.ui) return;
  D.echo = true;
  D.ui.note.innerHTML = '<div class="dv-echo"><span>따라 말해 보세요</span><i><b style="animation-duration:' + ms + 'ms"></b></i></div>';
}

/* ---- 조작: 버튼 4개 · 잠금화면 · 블루투스 ---- */
function dvGo(k, act) {
  if (!D.pl || !D.pl.items.length) return;
  D.lastAct = act || "";
  D.done = false;
  D.interrupted = false;
  dvAudioUnlock();
  D.rd.play(Math.max(0, Math.min(k, D.pl.items.length - 1)), 0, false);
}
function dvToggle() {
  const s = D.rd.state();
  if (s.active) { D.rd.toggle(); return; }
  dvGo(D.done ? 0 : D.idx, "play");
}
function dvStep(d) {
  const k = D.idx + d;
  if (k < 0) { dvGo(0, "prev"); return; }
  if (k >= D.pl.items.length) { toast("마지막 문장이에요"); return; }
  dvGo(k, d < 0 ? "prev" : "next");
}
function dvNextBlock() {
  const b = dvBlockIndex(D.idx) + 1;
  if (b >= D.pl.blocks.length) { toast(D.pl.exprScope ? "마지막 표현이에요" : "마지막 카드예요"); return; }
  dvGo(D.pl.blocks[b].start, "block");
}
/* 소리가 끊김(전화·다른 앱 소리·화면 꺼짐으로 재생이 멈춤) → 그 문장 처음에서 일시정지 상태로 기다림 */
function dvInterrupt() {
  if (!D.open || D.screen !== "play" || !D.rd.state().active) return;
  const k = D.idx;
  D.interrupted = true;
  D.rd.stop();
  dvChimeOff();
  D.idx = k;
  dvSavePos();
  dvPaintCtl();
}
Player.onInterrupt(dvInterrupt);
Player.onChange(() => { if (D.open) dvPaintCtl(); });

function dvMedia() {
  const ms = navigator.mediaSession;
  if (!ms || !D.pl) return;
  try {
    const it = D.pl.items[D.idx];
    ms.metadata = new MediaMetadata({
      title: getScript(it.text).speech,
      artist: CARDS[it.ci].title + " · " + driveLabels(D.idx)[1],
      album: "한 장 영어 · 드라이브 모드",
      artwork: [{ src: "icon-192.png", sizes: "192x192", type: "image/png" }, { src: "icon-512.png", sizes: "512x512", type: "image/png" }]
    });
  } catch (e) {}
}
/* 잠금화면·블루투스 버튼: 재생/일시정지, 다음 = 다음 문장, 이전 = 이전 문장 */
function dvMediaHandlers(on) {
  const ms = navigator.mediaSession;
  if (!ms) return;
  const set = (a, f) => { try { ms.setActionHandler(a, on ? f : null); } catch (e) {} };
  set("play", () => { const s = D.rd.state(); if (s.active) D.rd.resume(); else dvToggle(); });
  set("pause", () => { if (D.rd.state().active) D.rd.pause(); });
  set("nexttrack", () => dvStep(1));
  set("previoustrack", () => dvStep(-1));
  if (!on) try { ms.metadata = null; ms.playbackState = "none"; } catch (e) {}
}
/* 짧은 문장 소리만으로는 휴대폰이 잠금화면·블루투스 조작을 붙여 주지 않아서, 재생하는 동안 조용한 소리를 계속 틀어 둠.
   이 소리를 시스템이 멈추면(전화 등) 끊김으로 봄.
   음성(ElevenLabs mp3_44100)과 같은 44.1kHz·16비트로 만듦 — 예전 8kHz·8비트는 음성과 형식이 다른 소리가 같이 섞여서 음질에 영향을 줄 수 있었음 */
function silentWav(sec) {
  const rate = 44100, n = rate * sec, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);   // 16비트 무음 = 0
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, n * 2, true);
  return new Blob([buf], { type: "audio/wav" });
}
/* 문장을 옮길 때(이전·다음)는 잠깐 멈췄다 다시 재생되므로, 끄는 건 조금 늦춰서 깜빡이지 않게 */
let dvKaTimer = null;
function dvKeepAlive(on) {
  if (on && !D.ka) {
    try {
      D.ka = new Audio(URL.createObjectURL(silentWav(6)));   // 5초보다 길어야 잠금화면 조작이 붙음
      D.ka.loop = true;
      D.ka.addEventListener("pause", () => {
        if (D.kaSelf) { D.kaSelf = false; return; }   // 앱이 직접 멈춘 것
        if (D.kaWant) dvInterrupt();                 // 시스템이 멈춤(전화 등)
      });
    } catch (e) { return; }
  }
  if (!D.ka) return;
  clearTimeout(dvKaTimer);
  if (on) {
    D.kaWant = true;
    try { if (D.ka.paused) { const p = D.ka.play(); if (p && p.catch) p.catch(() => {}); } } catch (e) {}
    return;
  }
  const off = () => {
    D.kaWant = false;
    try { if (!D.ka.paused) { D.kaSelf = true; D.ka.pause(); } } catch (e) {}
  };
  if (D.open && D.screen === "play") dvKaTimer = setTimeout(off, 400); else off();
}

/* 효과음(Web Audio, 외부 파일 없음): 새 카드 = 부드럽게 올라가는 두 음, 표현 = 짧은 한 음. 작고 짧게.
   Web Audio는 효과음에만 쓰고, 음성은 상황 카드와 똑같이 Player의 audio 요소로만 나감(Web Audio를 거치지 않음).
   효과음을 낼 때만 켜고(resume) 끝나면 바로 끔(suspend) — 켜 둔 채로 두면 음성이 나오는 동안에도
   저지연 출력이 하나 더 열려 있어서 음질에 영향을 줄 수 있음. latencyHint "playback"으로 일반 재생용 출력을 씀 */
function dvAudioUnlock() {                         // 버튼을 누를 때(사용자 동작) 만들어 둠. 첫 문장 앞(dvBefore)에서 효과음 뒤 끔
  try {
    if (!D.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { D.ac = new AC({ latencyHint: "playback" }); } catch (e) { D.ac = new AC(); }
    }
  } catch (e) {}
}
/* 상태와 상관없이 suspend — 아직 끝나지 않은 resume이 있어도 그 뒤에 처리되어 결국 꺼짐 */
function dvChimeOff() {
  try { if (D.ac && D.ac.state !== "closed") D.ac.suspend().catch(() => {}); } catch (e) {}
}
async function dvChime(kind) {
  try {
    const ac = D.ac;
    if (!ac) return 0;
    if (ac.state !== "running") await Promise.race([ac.resume(), sleep(600)]);   // 백그라운드 등에서 켜지지 않으면 효과음만 건너뜀
    if (ac.state !== "running") return 0;
    const card = kind === "card";
    const t = ac.currentTime + 0.03;
    const vol = card ? 0.12 : 0.085, len = card ? 0.55 : 0.3;
    (card ? [[587.33, 0], [880, 0.15]] : [[783.99, 0]]).forEach(nd => {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = card ? "sine" : "triangle";
      osc.frequency.value = nd[0];
      g.gain.setValueAtTime(0.0001, t + nd[1]);
      g.gain.exponentialRampToValueAtTime(vol, t + nd[1] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + nd[1] + len);
      osc.connect(g);
      g.connect(ac.destination);
      osc.start(t + nd[1]);
      osc.stop(t + nd[1] + len + 0.05);
    });
    return card ? 850 : 450;
  } catch (e) { return 0; }
}

/* 화면 꺼짐 방지(Wake Lock): 재생 화면에 있는 동안만. 지원하지 않으면 조용히 무시 */
async function dvLock(on) {
  try {
    if (!on) {
      const l = D.lock;
      D.lock = null;
      if (l) await l.release();
      return;
    }
    if (D.lock || D.lockReq || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
    D.lockReq = true;
    const l = await navigator.wakeLock.request("screen");
    D.lockReq = false;
    if (!D.open || D.screen !== "play") { l.release(); return; }
    D.lock = l;
    l.addEventListener("release", () => { if (D.lock === l) D.lock = null; });
  } catch (e) { D.lockReq = false; }
}

/* 재생 중 저장 안 된 문장을 만나면 Player가 그 자리에서 만들고, 다음 3문장은 미리 만들어 둠(끊김 줄이기) */
let dvPreQ = Promise.resolve();
const dvPreSeen = new Set();
function dvPrefetch(k) {
  if (!dvElevenOK()) return;
  for (let j = k + 1; j <= k + 3 && j < D.pl.items.length; j++) {
    const it = D.pl.items[j], sp = getScript(it.text).speech, v = dvVoice(it);
    const key = settings.model + "|" + v + "|" + sp;
    if (dvPreSeen.has(key)) continue;
    dvPreSeen.add(key);
    dvPreQ = dvPreQ.then(() => (D.open ? Player.fetchClip(sp, v).catch(() => { dvPreSeen.delete(key); }) : dvPreSeen.delete(key)));
  }
}

/* ---- 위치 기억 ---- */
function dvSavePos() {
  if (!D.pl || !D.pl.items[D.idx] || D.done) return;
  const it = D.pl.items[D.idx], bl = D.pl.items[D.idx] && D.pl.blocks[dvBlockIndex(D.idx)];
  D.pos = {
    scope: D.opts.scope, cats: catsKey(D.opts.cats), key: it.key, block: bl ? bl.key : "",
    cid: CARDS[it.ci].id, bi: dvBlockIndex(D.idx), label: CARDS[it.ci].title + " · " + driveLabels(D.idx)[1]
  };
  saveDrive();
}
/* 저장된 위치 → 이 재생 목록의 문장 번호. 같은 문장이 없으면 그 카드(표현)의 처음, 카드가 없어졌으면 가장 가까운 카드의 처음. 이어 들을 수 없으면 -1 */
function dvResumeIdx(pl) {
  const p = D.pos;
  if (!p || !pl.items.length || p.scope !== D.opts.scope || (p.scope === "cat" && p.cats !== catsKey(D.opts.cats))) return -1;
  const k = pl.items.findIndex(it => it.key === p.key);
  if (k >= 0) return k;
  const b = pl.blocks.find(bl => bl.key === p.block);
  if (b) return b.start;
  if (!pl.exprScope && p.cid != null) {
    const near = pl.blocks.find(bl => bl.cid > p.cid) || pl.blocks[pl.blocks.length - 1];
    return near.start;
  }
  return pl.blocks[Math.max(0, Math.min(p.bi || 0, pl.blocks.length - 1))].start;
}

/* ---- 시작 화면 ---- */
function dvSetupHtml() {
  const o = D.opts;
  const pl = buildDrive(o);
  const nLearn = EXPR_LIST.filter(it => statusOf(it.id) === "learning").length;
  const nDue = dueList().length;
  const exprScope = pl.exprScope;
  const cats = (window.CATEGORY_DATA || []).map(c => c.name).filter(n => CARDS.some(c => c.category === n));
  const opt = (v, sub) => '<button class="dv-opt" type="button" data-dv-scope="' + v + '" aria-pressed="' + (o.scope === v) + '"><b>' + DRIVE_SCOPES[v] + '</b><small>' + sub + '</small></button>';
  const seg = (name, list, cls) => '<div class="seg' + (cls ? " " + cls : "") + '" data-dv-set="' + name + '">' +
    list.map(x => '<button type="button" data-v="' + x[0] + '" aria-pressed="' + (String(o[name]) === String(x[0])) + '">' + x[1] + '</button>').join("") + '</div>';
  const contentNote = { dialogue: "대화만 이어서 들어요.", examples: "대화 → 핵심 표현마다 표현 읽기 + 예문 5개", story: "대화 → 핵심 표현마다 표현 읽기 + 예문 5개 + 썰",
    exOnly: "대화 없이 핵심 표현마다 표현 읽기 + 예문 5개", storyOnly: "대화 없이 핵심 표현마다 표현 읽기 + 썰" };
  const resumeK = dvResumeIdx(pl);
  let words = 0;
  pl.items.forEach(it => { words += getScript(it.text).words.length * (o.shadow && it.kind !== "story" ? 2 : 1); });
  const mins = Math.max(1, Math.round((words * 0.4 / o.rate + pl.items.length * 0.6) / 60));
  const empty = o.scope === "cat" && !o.cats.length ? "카테고리를 하나 이상 골라 주세요" :
    o.scope === "learning" ? "학습 중인 표현이 없어요 · 표현 탭에서 '학습하기'를 시작해 보세요" :
    o.scope === "due" ? "오늘 복습할 표현이 없어요" : "들을 문장이 없어요";
  const unit = exprScope ? "표현 " + pl.blocks.length + "개" : "카드 " + pl.blocks.length + "장";
  return '<header class="dv-head">' +
      '<button class="dv-x" type="button" data-dv="close" aria-label="닫기">' + ICON_X + '</button>' +
      '<h2 class="dv-title">드라이브 모드</h2>' +
    '</header>' +
    '<div class="dv-sbody">' +
      '<p class="dv-lead">여러 카드를 이어서 영어로만 들려줘요. 화면을 보지 않아도 되고, 잠금화면·블루투스 버튼으로도 조작할 수 있어요.</p>' +
      '<div class="set-group"><span class="set-label">범위</span><div class="dv-scope">' +
        opt("all", "카드 " + CARDS.length + "장") +
        opt("cat", o.scope === "cat" && o.cats.length ? o.cats.length + "개 고름" : "골라서 듣기") +
        opt("learning", nLearn + "개") +
        opt("due", nDue + "개") +
      '</div>' +
      (o.scope === "cat" ? '<div class="dv-cats">' + cats.map(n =>
        '<button class="dv-cat" type="button" data-dv-cat="' + esc(n) + '" aria-pressed="' + o.cats.includes(n) + '">' +
          (CATEGORY_EMOJI[n] || "") + " " + esc(n) + " " + CARDS.filter(c => c.category === n).length + '</button>').join("") + '</div>' : "") +
      '</div>' +
      '<div class="set-group' + (exprScope ? " dv-dis" : "") + '"><span class="set-label">내용</span>' +
        seg("content", CONTENT_ROWS[0]) + seg("content", CONTENT_ROWS[1], "seg2") +
        '<p class="note">' + (exprScope ? "표현 범위는 표현마다 표현 → 예문 5개 → 썰 순서로 들어요." : contentNote[o.content]) + '</p>' +
      '</div>' +
      '<div class="set-group"><span class="set-label">따라 말할 시간</span>' +
        seg("shadow", [["false", "없음"], ["true", "문장 길이만큼 쉬기"]]) +
        '<p class="note">' + (o.shadow ? "한 문장이 끝나면 그 문장 길이만큼 조용히 기다려요. 그동안 소리 내어 따라 말해 보세요. (썰은 길어서 쉬지 않고 넘어가요)" : "쉬지 않고 이어서 들려줘요.") + '</p>' +
      '</div>' +
      '<div class="set-group"><span class="set-label">속도</span>' + seg("rate", [["0.8", "0.8x"], ["1", "1.0x"]]) + '</div>' +
      '<div class="set-group"><span class="set-label">미리 받아두기</span><div id="dvPre"></div></div>' +
    '</div>' +
    '<footer class="dv-sfoot">' +
      '<div class="dv-sum">' + (pl.items.length ? unit + " · 문장 " + pl.items.length + "개 · 약 " + mins + "분" : esc(empty)) + '</div>' +
      '<div class="dv-go">' + (resumeK >= 0 ?
        '<button class="btn" type="button" data-dv="restart">처음부터</button>' +
        '<button class="btn main" type="button" data-dv="resume"><span>이어 듣기</span><small>' + esc(D.pos.label || "") + '</small></button>' :
        '<button class="btn main" type="button" data-dv="start"' + (pl.items.length ? "" : " disabled") + '><span>시작</span></button>') +
      '</div>' +
    '</footer>';
}
function dvRenderSetup() {
  const body = dvSetupEl.querySelector(".dv-sbody");
  const y = body ? body.scrollTop : 0;
  dvSetupEl.innerHTML = dvSetupHtml();
  dvSetupEl.querySelector(".dv-sbody").scrollTop = y;
  dvPaintPre();
}

/* ---- 미리 받아두기: 지금 고른 범위·내용에서 아직 저장 안 된 문장만 ElevenLabs로 만들어 AudioCache에 저장 ---- */
function dvPaintPre() {
  const box = document.getElementById("dvPre");
  if (!box) return;
  const P = D.pre;
  const row = btns => '<div class="dv-pre-row">' + btns + '</div>';
  const b = (act, label, cls, dis) => '<button class="btn' + (cls ? " " + cls : "") + '" type="button" data-dv="' + act + '"' + (dis ? " disabled" : "") + '>' + label + '</button>';
  let html;
  if (P.state === "counting") html = '<p class="dv-pre-msg">저장된 문장을 확인하는 중…</p>';
  else if (P.state === "confirm") {
    html = P.need.length ?
      '<p class="dv-pre-msg">새로 만들 문장 <b>' + P.need.length + '개</b> · 약 <b>' + P.chars.toLocaleString() + '자</b></p>' +
        '<p class="note">이미 저장된 ' + P.have + '개는 다시 만들지 않아요. 글자 수만큼 ElevenLabs 크레딧이 들어요.</p>' +
        row(b("pre-cancel", "취소") + b("pre-run", "만들기", "ok")) :
      '<p class="dv-pre-msg">이 범위의 문장 ' + P.have + '개가 모두 저장돼 있어요.</p>' + row(b("pre-cancel", "확인"));
  } else if (P.state === "running") {
    html = '<div class="dv-bar"><i style="width:' + (P.total ? Math.round(P.done / P.total * 100) : 0) + '%"></i></div>' +
      '<p class="dv-pre-msg">' + P.done + ' / ' + P.total + ' 만드는 중…' + (P.fail ? ' (실패 ' + P.fail + '개)' : "") + '</p>' +
      row(b("pre-stop", P.cancel ? "멈추는 중…" : "취소", "", P.cancel));
  } else if (P.state === "done") {
    html = '<p class="dv-pre-msg">' + esc(P.msg) + '</p>' + row(b("pre-cancel", "확인"));
  } else {
    const ok = dvElevenOK();
    html = '<p class="note" style="margin-top:0">' + (ok ?
        "지금 고른 범위의 음성을 미리 만들어 폰에 저장해요. 저장된 문장은 인터넷 없이도 바로 재생돼요." :
        settings.engine !== "eleven" || !settings.apiKey ? "음성 설정(상황 카드 오른쪽 위 조절 아이콘)에서 ElevenLabs와 API 키를 넣으면 쓸 수 있어요." :
        "인터넷에 연결되어 있을 때 쓸 수 있어요.") + '</p>' +
      row(b("pre-count", "미리 받아두기", "", !ok));
  }
  box.innerHTML = html;
}
async function dvPreCount() {
  const P = D.pre = { state: "counting" };
  dvPaintPre();
  const pl = buildDrive(D.opts);
  const seen = new Set(), todo = [];
  pl.items.forEach(it => {
    const sp = getScript(it.text).speech, v = dvVoice(it), k = v + "|" + sp;
    if (!sp.trim() || seen.has(k)) return;
    seen.add(k);
    todo.push({ sp, v });
  });
  const have = await Promise.all(todo.map(x => Player.isCached(x.sp, x.v)));
  if (D.pre !== P) return;
  P.need = todo.filter((x, i) => !have[i]);
  P.have = todo.length - P.need.length;
  P.chars = P.need.reduce((s, x) => s + x.sp.length, 0);
  P.state = "confirm";
  dvPaintPre();
}
async function dvPreRun() {
  const P = D.pre;
  if (P.state !== "confirm" || !P.need.length) return;
  const list = P.need;
  Object.assign(P, { state: "running", done: 0, fail: 0, total: list.length, cancel: false });
  dvPaintPre();
  let next = 0, stopMsg = "";
  const worker = async () => {
    while (!P.cancel && next < list.length) {
      const x = list[next++];
      try { await Player.fetchClip(x.sp, x.v); }
      catch (e) {
        P.fail++;
        if (/키를 확인|크레딧|연결하지 못/.test(e.message)) { stopMsg = e.message; P.cancel = true; }   // 계속해도 실패할 오류면 멈춤
      }
      P.done++;
      if (D.pre === P) dvPaintPre();
    }
  };
  await Promise.all([worker(), worker()]);          // 두 문장씩 동시에
  const saved = P.done - P.fail;
  P.state = "done";
  P.msg = (stopMsg ? stopMsg + " · 멈췄어요. " : P.done < P.total ? "취소했어요. " : "다 받았어요. ") +
    saved + "개 저장" + (P.fail ? " · 실패 " + P.fail + "개는 건너뜀" : "") + (P.done < P.total ? " · 남은 " + (P.total - P.done) + "개" : "");
  if (D.pre === P) dvPaintPre();
}

/* ---- 열기 · 화면 바꾸기 · 닫기 ---- */
function openDrive() {
  if (D.open) return;
  Player.stop();
  buzz();
  D.open = true;
  if (D.pre.state !== "running") D.pre = { state: "idle" };
  dvScreen("setup");
  driveEl.hidden = false;
  document.querySelector(".app").inert = true;
  document.body.classList.add("driving");
  D.openId = Date.now();                       // 새로고침 전에 남은 기록과 구분
  try { history.pushState({ drive: D.openId }, ""); } catch (e) {}
}
function dvScreen(name) {
  D.screen = name;
  dvSetupEl.hidden = name !== "setup";
  dvPlayEl.hidden = name !== "play";
  if (name === "setup") {
    D.rd.stop();
    dvChimeOff();
    dvKeepAlive(false);
    dvLock(false);
    dvMediaHandlers(false);
    D.ui = null;
    dvRenderSetup();
  } else {
    dvPlayEl.innerHTML = dvPlayHtml();
    const q = s => dvPlayEl.querySelector(s);
    D.ui = { prev: q(".dv-prev"), cur: q(".dv-cur"), next: q(".dv-next"), scroll: q(".dv-scroll"),
      loc1: q(".dv-loc1"), loc2: q(".dv-loc2"), note: q(".dv-note"), toggle: q('[data-dv="toggle"]') };
    q(".dv-block-label").textContent = D.pl.exprScope ? "다음 표현" : "다음 카드";
    dvMediaHandlers(true);
    dvLock(true);
  }
}
function dvStart(resume) {
  D.pl = buildDrive(D.opts);
  D.els = [];
  if (!D.pl.items.length) return;
  const k = resume ? Math.max(0, dvResumeIdx(D.pl)) : 0;
  D.idx = k;
  D.done = false;
  dvScreen("play");
  dvShow(k);
  dvGo(k, "start");
}
function dvHide() {
  if (!D.open) return;
  dvSavePos();
  D.rd.stop();
  Player.stop();
  dvChimeOff();
  dvKeepAlive(false);
  dvLock(false);
  dvMediaHandlers(false);
  if (D.pre.state === "running") D.pre.cancel = true;
  D.open = false;
  D.screen = "setup";
  D.ui = null;
  D.els = [];
  dvPlayEl.innerHTML = "";
  driveEl.hidden = true;
  document.querySelector(".app").inert = false;
  document.body.classList.remove("driving");
  if (currentTab === "home") renderHome();          // 홈에서 연 드라이브를 닫으면 이어 듣기 현황을 새로
}
function closeDrive() {
  let viaHistory = false;
  try { viaHistory = !!(history.state && history.state.drive === D.openId); } catch (e) {}
  if (viaHistory) history.back(); else dvHide();
}
/* 안드로이드 뒤로 가기 = 드라이브 모드 닫기 */
window.addEventListener("popstate", () => {
  let st = null;
  try { st = history.state; } catch (e) {}
  if (D.open && !(st && st.drive === D.openId)) dvHide();
});

driveEl.addEventListener("click", e => {
  const t = e.target;
  let el;
  if ((el = t.closest("[data-dv]"))) {
