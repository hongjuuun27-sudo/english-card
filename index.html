<!-- 화면과 동작만 담은 파일. 카드는 data/cards/ 폴더, 질문은 data/questions.js에 추가하세요 (규칙은 CLAUDE.md) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>한 장 영어</title>
<!-- 웹앱 설치용(같은 폴더에 manifest·아이콘·sw.js가 있을 때만 동작, 없어도 앱은 정상 동작) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    color-scheme: dark;
    --bg:#121417;
    --bg-2:#1A1D21;
    --bg-3:#23272D;
    --text:#ECE9E4;
    --text-2:#C9CBCF;
    --muted:#A1A7B0;
    --faint:#6E747D;
    --line:rgba(255,255,255,.08);
    --bubble:#1F2328;
    --bubble-text:#E9E7E3;
    --accent:#86C2AC;
    --accent-soft:rgba(134,194,172,.11);
    --accent-line:rgba(134,194,172,.42);
    --mark:rgba(134,194,172,.26);
    --me:#2D5C4F;
    --me-text:#F0F7F3;
    --sheet:#1A1D21;
    --scrim:rgba(0,0,0,.58);
    --shadow:0 -12px 40px rgba(0,0,0,.45);
    --toast:#2B3036;
    --tag-l:74%;
    --tag-a:.15;
    --glow-a:.10;
    --pad:20px;
    --tabbar-h:58px;
    --modebar-h:46px;
    --on-accent:#10201B;
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme: light;
      --bg:#F5F3EE;
      --bg-2:#ECE9E2;
      --bg-3:#F0EDE6;
      --text:#1F2226;
      --text-2:#3B3F45;
      --muted:#5E646C;
      --faint:#979DA5;
      --line:rgba(0,0,0,.08);
      --bubble:#FFFFFF;
      --bubble-text:#24272B;
      --accent:#2C7A63;
      --accent-soft:rgba(44,122,99,.07);
      --accent-line:rgba(44,122,99,.36);
      --mark:rgba(44,122,99,.16);
      --me:#2C7A63;
      --me-text:#FFFFFF;
      --sheet:#FBFAF7;
      --scrim:rgba(20,22,25,.34);
      --shadow:0 -12px 40px rgba(0,0,0,.12);
      --toast:#2B3036;
      --tag-l:34%;
      --tag-a:.12;
      --glow-a:.09;
      --on-accent:#FFFFFF;
    }
  }
  @media (max-width:370px){ :root{ --pad:18px; } }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background:var(--bg); color:var(--text);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:17px; line-height:1.55;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    word-break:keep-all; overflow-wrap:break-word;
  }
  button{
    font:inherit; color:inherit; background:none; border:0; padding:0; margin:0;
    cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  button:focus{ outline:none; }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  svg{ display:block; }

  /* ---------- 앱 틀: 화면 + 하단 탭 바 ---------- */
  .app{
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
  }
  .views{ position:relative; flex:1; min-height:0; }
  .view{ position:absolute; inset:0; }
  .view.off{ visibility:hidden; pointer-events:none; }   /* display:none이 아니라서 스크롤 위치·입력 내용이 그대로 남음 */
  .tabbar{
    position:relative; z-index:15;
    flex:none; display:flex;
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
    padding:0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background:var(--bg);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:12.5px; font-weight:600; color:var(--faint);
    transition:color .2s ease;
  }
  .tab svg{ width:23px; height:23px; }
  .tab[aria-selected="true"]{ color:var(--accent); }
  .tab:active svg{ transform:scale(.92); }
  body.typing .tabbar{ display:none; }   /* 키보드가 올라와 있을 땐 입력칸을 넓게 */

  /* ---------- 피드 ---------- */
  .feed{
    overflow-y:auto; overflow-x:hidden;
    scroll-snap-type:y mandatory;
    overscroll-behavior-y:none;
    scrollbar-width:none;
  }
  .feed::-webkit-scrollbar{ display:none; }

  .card{
    --h:160;
    position:relative;
    height:100%;
    scroll-snap-align:start; scroll-snap-stop:always;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:55%;
    background:radial-gradient(120% 70% at 50% -15%, hsl(var(--h) 55% 50% / var(--glow-a)), transparent 62%);
    pointer-events:none;
  }

  .top{
    position:relative;
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) max(var(--pad), env(safe-area-inset-right)) 8px max(var(--pad), env(safe-area-inset-left));
  }
  .tag{
    flex:none; white-space:nowrap;
    font-size:13.5px; font-weight:600; letter-spacing:.01em;
    padding:6px 11px; border-radius:999px;
    color:hsl(var(--h) 52% var(--tag-l));
    background:hsl(var(--h) 50% 55% / var(--tag-a));
  }
  .tag-btn{ display:flex; align-items:center; gap:1px; padding:6px 6px 6px 10px; }   /* 누르면 그 카테고리 상황 목록(작은 아래 화살표로 눌리는 요소임을 보여 줌). 384px 위쪽 줄에 들어가게 좁게 */
  .tag-btn svg{ width:13px; height:13px; opacity:.8; }
  .tag-btn:active{ transform:scale(.96); }
  .top-r{ display:flex; align-items:center; gap:2px; }
  .jump{
    display:flex; align-items:center; gap:4px;
    height:36px; padding:0 5px 0 6px; border-radius:999px; white-space:nowrap;
    font-size:14px; color:var(--faint); font-variant-numeric:tabular-nums;
  }
  .jump:active{ background:var(--line); }
  .jump svg{ width:17px; height:17px; }
  .gear{
    width:40px; height:40px; margin-right:-10px;
    flex:none;
    display:grid; place-items:center; border-radius:50%;
    color:var(--faint);
  }
  .gear:active{ background:var(--line); }
  .gear svg{ width:21px; height:21px; }

  .body{
    position:relative;
    flex:1; min-height:0;
    overflow-y:auto; overflow-x:hidden;
    overscroll-behavior-y:auto;
    padding:0 max(var(--pad), env(safe-area-inset-right)) 0 max(var(--pad), env(safe-area-inset-left));
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 22px), transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 22px), transparent 100%);
  }
  .body::-webkit-scrollbar{ display:none; }
  .inner{
    min-height:100%;
    display:flex; flex-direction:column; justify-content:flex-start;
    padding:22px 0 30px;
  }

  .title{ margin:0; font-size:24px; line-height:1.3; font-weight:700; letter-spacing:-.015em; }
  .situation{ margin:10px 0 0; font-size:17px; line-height:1.6; color:var(--text-2); }

  /* ---------- 대화: 한 줄 = renderLine() (세 모드 공통) ----------
     줄에서 무엇을 보일지는 클래스로 정함: 카드 m-read/m-listen/m-shadow·masked, 줄 off/kq-on/cur/past/playing */
  .mnote{ margin:18px 0 0; font-size:14.5px; line-height:1.6; color:var(--faint); }
  .mnote:empty{ display:none; }
  .chat{ display:flex; flex-direction:column; gap:10px; margin-top:28px; -webkit-user-select:none; user-select:none; }
  .mnote:not(:empty) ~ .chat{ margin-top:18px; }
  .row{ display:flex; flex-direction:column; max-width:88%; }
  .row.them{ align-self:flex-start; align-items:flex-start; }
  .row.me{ align-self:flex-end; align-items:flex-end; }
  .row.off{ display:none; }
  .row.pop{ animation:popIn .38s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes popIn{ from{ opacity:0; transform:translateY(10px) scale(.98); } to{ opacity:1; transform:none; } }
  .who{ display:none; font-size:13px; color:var(--faint); margin:0 8px 5px; }
  .row.first-them .who{ display:block; }
  .line{ display:flex; align-items:center; gap:8px; }
  .row.me .line{ flex-direction:row-reverse; }

  .bubble{
    display:block; text-align:left;
    font-size:17.5px; line-height:1.45;
    padding:11px 15px; border-radius:20px;
    border:1.5px solid transparent;
    transition:background-color .3s ease, border-color .3s ease, box-shadow .3s ease, opacity .3s ease, transform .12s ease;
  }
  .row.them .bubble{ background:var(--bubble); color:var(--bubble-text); border-bottom-left-radius:6px; }
  .row.me .bubble{ background:var(--me); color:var(--me-text); border-bottom-right-radius:6px; }
  @media (prefers-color-scheme: light){
    .row.them .bubble{ box-shadow:0 1px 2px rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.04); }
  }
  .bubble .en{ display:block; }
  .bubble .kq{ display:none; }
  .m-read .row.me .bubble, .m-listen:not(.masked) .bubble{ cursor:pointer; }
  .m-read .row.me .bubble:active, .m-listen:not(.masked) .bubble:active{ transform:scale(.98); }

  .ko{ font-size:15px; line-height:1.5; color:var(--muted); margin:5px 8px 0; }
  .row.me .ko{ text-align:right; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  /* 읽기: 아직 확인 안 한 내 대사는 한글만, 탭할 때마다 영어 ↔ 한글 */
  .row.me.kq-on .bubble{ background:var(--accent-soft); border-color:var(--accent-line); border-style:dashed; color:var(--text); }
  .row.me.kq-on .en, .row.me.kq-on .ko{ display:none; }
  .row.me.kq-on .kq{ display:block; font-size:16.5px; line-height:1.5; animation:fadeIn .25s ease both; }
  .m-read .row.me:not(.kq-on) .en{ animation:fadeIn .25s ease both; }
  .hint{ display:none; font-size:12.5px; color:var(--faint); margin:6px 8px 0; }
  .m-read .row.me.kq-on .hint{ display:block; }
  body.hinted .m-read .row.me .hint{ display:none; }

  /* 쉐도잉·듣기: 지금 줄 강조, 지나간 줄은 흐리게 */
  .row.cur .bubble, .row.playing .bubble{ box-shadow:0 0 0 2.5px var(--accent); }
  .row > *{ transition:opacity .3s ease; }
  .row.past > *{ opacity:.42; }   /* 줄 자체는 popIn 애니메이션이 opacity를 잡고 있어서 안쪽을 흐리게 */

  /* 쉐도잉 쉬움 / 중간 / 어려움 선택 (쉐도잉 모드에서만, 카드 위쪽) */
  .sh-seg{ width:264px; max-width:100%; margin-top:16px; }
  .card:not(.m-shadow) .sh-seg{ display:none; }   /* 읽기·듣기에서는 숨김 (아래 .seg{display:flex}보다 우선하도록 선택자를 구체적으로) */
  .sh-seg button{ height:34px; font-size:14.5px; }
  /* 어려움: 아이콘(.masked) 아래에 지금 줄만 '정답 보기'(.peek) */
  .sh-blind.peek .chat{ display:flex; margin-top:6px; }
  .sh-blind.peek .duo{ flex:none; min-height:0; padding-bottom:0; }
  /* 중간: 지금 줄을 크게, 아직 안 나온 줄은 조금 흐리게 */
  .sh-mid .row .bubble{ transition:font-size .2s ease, background-color .3s ease, border-color .3s ease, box-shadow .3s ease, transform .12s ease; }
  .sh-mid .row.cur .bubble{ font-size:20.5px; }
  .sh-mid.sh-live .row:not(.cur):not(.past) > *{ opacity:.62; }

  /* 듣기: 정답 확인 전에는 대화 대신 두 사람 아이콘(왼쪽 상대, 오른쪽 나). 말하는 쪽은 진한 테두리 + 은은하게 퍼짐, 안 말하는 쪽은 흐리게
     카드 클래스: masked(정답 확인 전) · talk-them / talk-me(지금 말하는 쪽) · lpaused(일시정지) */
  .duo{ display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:22px; min-height:250px; padding:20px 0 6px; }
  .masked .chat{ display:none; }
  .masked .duo{ display:flex; }
  .duo-people{ display:flex; gap:48px; }
  .person{
    display:flex; flex-direction:column; align-items:center; gap:11px;
    --c:hsl(var(--h) 52% var(--tag-l)); --g:hsl(var(--h) 50% 55% / .3);
    transition:opacity .35s ease;
  }
  .person.me{ --c:var(--accent); --g:var(--accent-line); }
  .avatar{
    position:relative; width:88px; height:88px; border-radius:50%;
    display:grid; place-items:center;
    color:var(--c); background:var(--bg-2); border:2px solid var(--line);
    transition:border-color .3s ease, box-shadow .4s ease, transform .3s ease;
  }
  .avatar svg{ width:52px; height:52px; }
  .avatar::after{ content:""; position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--c); opacity:0; pointer-events:none; }
  .pname{ font-size:15px; font-weight:600; color:var(--text-2); transition:color .3s ease; }
  .duo-n{ font-size:13.5px; color:var(--faint); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .talk-them .person.me, .talk-me .person.them{ opacity:.35; }
  .talk-them .person.them .avatar, .talk-me .person.me .avatar{ border:3px solid var(--c); box-shadow:0 0 26px 6px var(--g); transform:scale(1.04); }
  .talk-them .person.them .avatar::after, .talk-me .person.me .avatar::after{ animation:ripple 1.6s ease-out infinite; }
  .talk-them .person.them .pname, .talk-me .person.me .pname{ color:var(--c); }
  .lpaused .avatar::after{ animation:none !important; opacity:0; }
  @keyframes ripple{ from{ opacity:.55; transform:scale(1); } to{ opacity:0; transform:scale(1.42); } }

  .spk{
    flex:none;
    width:36px; height:36px; border-radius:50%;
    display:grid; place-items:center;
    color:var(--accent); background:var(--accent-soft);
    transition:transform .2s ease;
  }
  .spk svg{ width:18px; height:18px; }
  .spk:active{ transform:scale(.92); }
  .spk.playing svg{ animation:pulse 1s ease-in-out infinite; }
  .card:not(.m-read) .row .spk{ display:none; }   /* 줄마다 스피커는 읽기 모드에만 */
  .m-read .row.me.kq-on .spk{ display:none; }     /* 읽기 모드: 영어가 보이는 줄에만 (내 대사는 탭해서 영어로 바뀌었을 때) */
  .m-read .row.me:not(.kq-on) .spk{ animation:fadeIn .25s ease both; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .typing .dots{ display:flex; gap:5px; padding:16px 17px; }
  .typing .dots i{ width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1s infinite ease-in-out; }
  .typing .dots i:nth-child(2){ animation-delay:.15s; }
  .typing .dots i:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; transform:translateY(0); } 40%{ opacity:.85; transform:translateY(-3px); } }

  /* ---------- 대사 속 표현: 핵심(밑줄) · 추가(연한 점선). 누르면 설명 바텀시트 ---------- */
  .xp{
    text-decoration:underline;
    text-decoration-color:var(--accent);
    text-decoration-thickness:2px;
    text-underline-offset:4px;
    border-radius:4px;
    cursor:pointer;
    transition:background-color .15s ease;
  }
  .xp:active{ background:var(--accent-soft); }
  .xp-x{ text-decoration-style:dotted; text-decoration-color:var(--muted); text-decoration-thickness:1.5px; }
  .row.me .xp{ text-decoration-color:rgba(255,255,255,.75); }
  .row.me .xp-x{ text-decoration-color:rgba(255,255,255,.55); }
  .row.me .xp:active{ background:rgba(255,255,255,.14); }
  /* 듣기·쉐도잉: 밑줄을 그리지 않음(같은 HTML, 표시만 끔). 단어는 '그 위치부터 재생'으로만 동작 */
  .m-listen .xp, .m-shadow .xp{ text-decoration:none; cursor:inherit; }
  .m-listen .xp:active, .m-shadow .xp:active{ background:none; }
  .xp-ko{ margin:12px 0 4px; font-size:16.5px; line-height:1.65; color:var(--text-2); }

  /* ---------- 인터랙티브 스크립트: 노래방 자막처럼 채워지는 강조 (대화문·예문·썰 공통) ----------
     .sc(문장) > .w(단어). 재생을 시작하면 .sc.reading → 문장 전체가 흐려지고(35%),
     읽은 단어(.past)와 지금 단어(.now)는 선명하고 진하게 채워져 그대로 유지. 끝까지 읽으면 .filled(전부 진하게) → 잠시 뒤 평소 표시.
     진하게는 밝기 + text-shadow로만(글자 굵기를 바꾸지 않아서 단어 폭·줄바꿈이 그대로).
     단어 신호가 없으면 .sc.lineonly(흐리게 하지 않고 문장 전체를 은은한 배경으로) */
  .sc .w, .sc .gloss{ transition:opacity .22s ease, text-shadow .22s ease; }
  .sc.reading .w, .sc.reading .gloss{ opacity:.35; }
  .sc.reading .w.past, .sc.reading .w.now, .sc.reading.filled .w{ opacity:1; text-shadow:.3px 0 currentColor, -.3px 0 currentColor; }
  .sc.reading.lineonly .w, .sc.reading.lineonly .gloss{ opacity:1; }
  .sc.reading.lineonly{ background:var(--mark); box-shadow:0 0 0 2px var(--mark); border-radius:4px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .row.me .sc.reading.lineonly{ background:rgba(255,255,255,.16); box-shadow:0 0 0 2px rgba(255,255,255,.16); }
  .gloss{ color:var(--muted); font-size:.9em; }
  .sheet .sc .w, .m-shadow .sc .w, .m-listen:not(.masked) .sc .w{ cursor:pointer; }
  .row.playing .spk svg{ animation:pulse 1s ease-in-out infinite; }
  .rd-play.on{ color:var(--on-accent); background:var(--accent); }

  /* ---------- 하단 버튼: 모드마다 다르지만 주요 버튼은 항상 오른쪽 넓은 자리 ---------- */
  .bottom{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:10px max(var(--pad), env(safe-area-inset-right)) calc(8px + var(--modebar-h)) max(var(--pad), env(safe-area-inset-left));   /* 아래 여백: 모드 선택 줄만큼 (제스처 바는 탭 바가 맡음) */
  }
  .actions{ display:flex; gap:8px; width:100%; }
  .btn{
    height:54px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:17px; font-weight:600;
    background:var(--bg-2); color:var(--text);
    border:1px solid var(--line);
    transition:transform .12s ease, background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn:active{ transform:scale(.98); }
  .actions .btn{ flex:none; min-width:0; gap:6px; padding:0 13px; font-size:15.5px; white-space:nowrap; }
  .actions .btn svg{ width:19px; height:19px; flex:none; }
  .actions .main{ flex:1; padding:0 10px; font-size:16.5px; color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .actions .ico-btn{ width:46px; padding:0; color:var(--muted); }
  .actions .rate{ width:54px; padding:0; color:var(--accent); font-variant-numeric:tabular-nums; }
  .actions .on{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .actions .btn:disabled{ opacity:.38; cursor:default; transform:none; }
  .actions .prev{ width:52px; padding:0; }
  .actions .again{ width:76px; padding:0 6px; font-size:14.5px; line-height:1.25; white-space:normal; text-align:center; }   /* 두 줄로 접어 '다음' 자리를 넓게 */
  .actions .restart{ flex:1; }
  /* 쉐도잉 어려움: 버튼 5개 [이전] [한 번 더 듣기] [정답 보기] [속도] [다음] — 360px에서도 [다음]이 가장 넓게 */
  .actions.five{ gap:6px; }
  .actions.five .prev{ width:46px; }
  .actions.five .again{ width:62px; padding:0 4px; font-size:13.5px; }
  .actions.five .peek{ width:56px; padding:0 4px; font-size:13.5px; line-height:1.25; white-space:normal; text-align:center; }
  .actions.five .rate{ width:48px; }
  .swipe-hint{ font-size:12.5px; color:var(--faint); }

  /* ---------- 모드 선택: 탭 바 바로 위, 상황 탭에서만 ---------- */
  .modebar{
    position:absolute; left:0; right:0; bottom:0; z-index:5;
    height:var(--modebar-h);
    display:none; align-items:center; justify-content:center;
    padding:0 max(var(--pad), env(safe-area-inset-right)) 6px max(var(--pad), env(safe-area-inset-left));
    background:var(--bg);
  }
  body.tab-cards .modebar{ display:flex; }
  .mode-seg{ width:100%; max-width:360px; }
  .modebar .mode-seg button{ height:32px; font-size:14.5px; }

  /* ---------- 마지막 카드 ---------- */
  .end .inner{ align-items:center; justify-content:center; text-align:center; }
  .end-emoji{ font-size:44px; line-height:1; margin-bottom:18px; }
  .end-title{ margin:0; font-size:34px; font-weight:750; letter-spacing:-.02em; }
  .end-sub{ margin:12px 0 0; font-size:17px; line-height:1.65; color:var(--text-2); }

  /* ---------- 바텀시트 ---------- */
  .scrim{
    position:fixed; inset:0; z-index:20;
    background:var(--scrim);
    opacity:0; pointer-events:none;
    transition:opacity .28s ease;
    touch-action:none;
  }
  .scrim.on{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:21;
    max-height:88vh; max-height:88dvh;
    display:flex; flex-direction:column;
    background:var(--sheet);
    border-radius:24px 24px 0 0;
    box-shadow:var(--shadow);
    transform:translateY(105%);
    visibility:hidden;
    transition:transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s linear .32s;
  }
  .sheet.on{
    transform:translateY(0); visibility:visible;
    transition:transform .36s cubic-bezier(.2,.8,.2,1), visibility 0s;
  }
  .sheet.dragging{ transition:none; }
  .sheet-head{
    flex:none; touch-action:none;
    padding:10px max(var(--pad), env(safe-area-inset-right)) 14px max(var(--pad), env(safe-area-inset-left));
    border-bottom:1px solid var(--line);
  }
  .handle{ width:40px; height:5px; border-radius:3px; background:var(--faint); opacity:.5; margin:0 auto 14px; }
  .sheet-ctx{ font-size:13px; color:var(--faint); }
  .sheet-title{ margin:4px 0 0; font-size:24px; line-height:1.3; font-weight:700; color:var(--accent); letter-spacing:-.01em; }
  .sheet-body{
    flex:1; min-height:0; overflow-y:auto;
    overscroll-behavior:contain;
    padding:6px max(var(--pad), env(safe-area-inset-right)) 8px max(var(--pad), env(safe-area-inset-left));
  }
  .sec-h{
    margin:20px 0 6px;
    font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--faint);
  }
  .sec-row{ display:flex; align-items:center; justify-content:space-between; margin:20px 0 6px; }
  .sec-row .sec-h{ margin:0; }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    height:36px; padding:0 14px 0 11px; border-radius:999px;
    font-size:14.5px; font-weight:600;
    color:var(--accent); background:var(--accent-soft);
  }
  .pill svg{ width:17px; height:17px; }
  .pill.playing svg{ animation:pulse 1s ease-in-out infinite; }
  .pill:active{ transform:scale(.96); }
  .ex{ list-style:none; margin:0; padding:0; counter-reset:ex; }
  .ex li{
    counter-increment:ex;
    position:relative; padding:12px 44px 12px 30px;
    border-bottom:1px solid var(--line);
  }
  .ex li:last-child{ border-bottom:0; }
  .ex li::before{
    content:counter(ex);
    position:absolute; left:0; top:14px;
    width:20px; height:20px; border-radius:50%;
    font-size:12px; font-weight:600; line-height:20px; text-align:center;
    color:var(--accent); background:var(--accent-soft);
  }
  .ex .spk{ position:absolute; right:0; top:10px; width:34px; height:34px; }
  .ex-en{ font-size:17px; line-height:1.5; }
  .ex-ko{ margin-top:3px; font-size:16px; line-height:1.55; color:var(--muted); }
  mark{
    color:inherit; font-weight:650;
    background:linear-gradient(transparent 58%, var(--mark) 58%);
    border-radius:2px; padding:0 1px;
  }
  .story{
    margin-top:6px; padding:16px 16px 14px;
    border-radius:18px; background:var(--bg-3);
  }
  .story-en{ margin:0; font-size:17.5px; line-height:1.7; }
  .story-ko{ margin:12px 0 0; padding-top:12px; border-top:1px solid var(--line); font-size:16px; line-height:1.65; color:var(--muted); }
  .sheet-foot{
    flex:none;
    padding:10px max(var(--pad), env(safe-area-inset-right)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(var(--pad), env(safe-area-inset-left));
    border-top:1px solid var(--line);
  }
  .sheet-close{ width:100%; }

  /* ---------- 설정 ---------- */
  .set-group{ padding:16px 0; border-bottom:1px solid var(--line); }
  .set-group:last-child{ border-bottom:0; }
  .set-label{ display:block; font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--faint); margin-bottom:9px; }
  .seg{ display:flex; gap:3px; padding:3px; border-radius:13px; background:var(--bg-2); border:1px solid var(--line); }
  .seg button{ flex:1; height:42px; border-radius:10px; font-size:15.5px; color:var(--muted); }
  .seg button[aria-pressed="true"]{ background:var(--bubble); color:var(--text); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .field{
    display:block; width:100%; height:48px; padding:0 14px;
    border-radius:12px; border:1px solid var(--line);
    background:var(--bg-2); color:var(--text);
    font:inherit; font-size:16px;
  }
  .field:focus{ outline:2px solid var(--accent-line); outline-offset:0; }
  .field + .field{ margin-top:8px; }
  .note{ margin:9px 2px 0; font-size:14px; line-height:1.6; color:var(--muted); }
  .el-only[hidden]{ display:none; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn-row .btn{ flex:1; height:46px; font-size:15.5px; min-width:140px; }

  /* ---------- 목록 ---------- */
  .prog{ padding:14px 0 16px; }
  .prog-text{ font-size:15.5px; color:var(--text-2); margin-bottom:9px; }
  .prog-text b{ color:var(--accent); }
  .bar{ height:6px; border-radius:3px; background:var(--bg-3); overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:3px; background:var(--accent); }
  /* 카테고리는 접어서(.toc-group) 보여 주고, 지금 보던 카드의 카테고리만 펼침(.open). 머리를 누르면 펼치기·접기, 위쪽 [전체 펼치기 / 전체 접기] */
  .toc-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:22px; }
  .toc-bar .set-label{ margin:0; }
  .toc-all{ height:34px; padding:0 14px; border-radius:999px; font-size:14px; font-weight:600; color:var(--accent); background:var(--accent-soft); }
  .toc-group{ margin-top:6px; border-bottom:1px solid var(--line); }
  .toc-head{ width:100%; display:flex; align-items:center; gap:11px; padding:10px 2px; text-align:left; }
  .toc-chev{ flex:none; width:22px; height:22px; color:var(--faint); transition:transform .2s ease; }
  .toc-chev svg{ width:22px; height:22px; }
  .toc-group.open .toc-chev{ transform:rotate(180deg); }
  .toc-group:not(.open) .toc{ display:none; }
  .toc-group.open .toc{ margin-bottom:12px; }
  .toc-emoji{
    flex:none; width:36px; height:36px; border-radius:11px;
    display:grid; place-items:center; font-size:19px; line-height:1;
    background:hsl(var(--h) 50% 55% / var(--tag-a));
  }
  .toc-cat{
    margin:0; flex:1;
    font-size:20px; font-weight:750; letter-spacing:-.015em;
    color:hsl(var(--h) 52% var(--tag-l));
  }
  .toc-cnt{ font-size:13.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .toc{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .toc-item{
    position:relative;
    width:100%; display:flex; align-items:center; gap:12px;
    padding:12px 12px 12px 14px; border-radius:12px;
    text-align:left; font-size:16.5px; line-height:1.4;
  }
  .toc-item:active{ background:var(--line); }
  .toc-n{
    flex:none; width:28px; height:28px; border-radius:50%;
    display:grid; place-items:center;
    font-size:13px; font-weight:600; color:var(--muted); background:var(--bg-2);
  }
  .toc-t{ flex:1; min-width:0; }
  .toc-check{
    flex:none; width:24px; height:24px; border-radius:50%;
    display:grid; place-items:center;
    border:1.5px solid var(--line);
  }
  .toc-check svg{ width:14px; height:14px; }
  .toc-item.seen .toc-check{ background:var(--accent); border-color:transparent; color:var(--on-accent); }
  .toc-item.current{ background:var(--accent-soft); }
  .toc-item.current::before{
    content:""; position:absolute; left:0; top:9px; bottom:9px;
    width:3.5px; border-radius:2px; background:var(--accent);
  }
  .toc-item.current .toc-t{ font-weight:650; }
  .toc-item.current .toc-n{ color:var(--accent); background:var(--bg-2); }

  /* ---------- 하단 탭 배지 ---------- */
  .tab-ico{ position:relative; display:block; width:23px; height:23px; }
  .badge{
    position:absolute; top:-5px; left:15px;
    min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    font-size:11px; font-weight:700; line-height:18px; text-align:center;
    color:#fff; background:#E5484D;
    box-shadow:0 0 0 2px var(--bg);
  }
  .badge[hidden]{ display:none; }

  /* ---------- 표현 탭 ---------- */
  /* ---------- 홈: 위 = 오늘의 질문(크게, 누르면 그 카드의 그 줄로), 아래 = 바로가기 2×2(엄지 자리) ---------- */
  .home{
    display:flex; flex-direction:column;
    overflow-y:auto; overflow-x:hidden; overscroll-behavior-y:contain;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) max(var(--pad), env(safe-area-inset-right)) 18px max(var(--pad), env(safe-area-inset-left));
  }
  .hq{ flex:1; display:flex; flex-direction:column; justify-content:center; min-height:240px; padding:18px 0 14px; }
  .hq-card{
    position:relative; width:100%; text-align:left;
    padding:22px 20px 20px; border-radius:24px;
    background:hsl(var(--h) 50% 55% / var(--tag-a)); border:1.5px solid hsl(var(--h) 52% var(--tag-l) / .35);
    transition:transform .12s ease;
  }
  .hq-card:active{ transform:scale(.985); }
  .hq-label{ display:block; font-size:13px; font-weight:700; letter-spacing:.04em; color:hsl(var(--h) 52% var(--tag-l)); }
  .hq-text{ display:block; margin-top:12px; font-size:24px; line-height:1.42; font-weight:700; letter-spacing:-.02em; color:var(--text); word-break:keep-all; }
  .hq-go{ display:flex; align-items:center; gap:4px; margin-top:16px; font-size:14px; font-weight:600; color:var(--muted); }
  .hq-go svg{ width:16px; height:16px; }
  .hq-meta{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
  .hq-src{ min-width:0; font-size:13.5px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hq-next{ flex:none; height:34px; padding:0 14px; border-radius:999px; font-size:14px; font-weight:600; color:var(--accent); background:var(--accent-soft); }
  .hq-empty{ font-size:15px; color:var(--muted); }
  .h-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:auto; }
  .h-go{
    display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-height:104px;
    padding:14px 14px 13px; border-radius:20px; text-align:left;
    background:var(--bg-2); border:1px solid var(--line);
    transition:transform .12s ease;
  }
  .h-go:active{ transform:scale(.97); }
  .h-go svg{ width:24px; height:24px; color:var(--accent); }
  .h-go b{ font-size:17px; font-weight:700; color:var(--text); }
  .h-go small{ font-size:13px; line-height:1.4; color:var(--muted); }
  /* 질문 카드에서 열린 내 대사 줄: 잠깐 강조(답을 떠올린 뒤 탭해서 영어로 확인) */
  .row.hook-hi .bubble{ animation:hookHi 1.1s ease 2; }
  @keyframes hookHi{ 0%,100%{ box-shadow:0 0 0 0 transparent; } 40%{ box-shadow:0 0 0 4px var(--accent); } }

  .xview{
    overflow-y:auto; overflow-x:hidden;
    overscroll-behavior-y:contain;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) max(var(--pad), env(safe-area-inset-right)) 40px max(var(--pad), env(safe-area-inset-left));
  }
  .rv-card{
    margin-top:18px; padding:16px 16px 14px; border-radius:20px;
    background:radial-gradient(120% 120% at 100% 0%, var(--accent-soft), transparent 70%), var(--bg-2);
    border:1px solid var(--line);
  }
  .rv-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .rv-title{ font-size:13px; font-weight:700; letter-spacing:.06em; color:var(--accent); }
  .rv-picks{ font-size:13px; color:var(--muted); }
  .rv-picks b{ color:var(--accent); }
  .rv-empty{ margin:10px 0 2px; font-size:15px; line-height:1.6; color:var(--text-2); }
  .rv-count{ margin-top:10px; font-size:18px; font-weight:650; }
  .rv-count b{ color:var(--accent); font-size:22px; }
  .rv-list{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .rv-item{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:12px; background:var(--bg); border:1px solid var(--line); text-align:left;
  }
  .rv-mean{ font-size:15.5px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rv-due{ flex:none; font-size:12.5px; color:var(--faint); }
  .rv-more{ margin:8px 2px 0; font-size:13px; color:var(--faint); }
  .rv-start{ width:100%; margin-top:12px; color:var(--on-accent); background:var(--accent); border-color:transparent; }

  .x-tools{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }
  .x-search{ height:46px; }
  .x-filter button{ font-size:14px; height:38px; }
  .x-items{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .x-item{
    width:100%; display:flex; align-items:center; gap:12px; text-align:left;
    padding:12px 12px 12px 14px; border-radius:14px;
    background:var(--bg-2); border:1px solid var(--line);
  }
  .x-item:active{ transform:scale(.99); }
  .x-item.extra{ border-style:dashed; background:transparent; }
  .x-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .x-phrase{ font-size:17px; font-weight:650; color:var(--accent); }
  .x-item.extra .x-phrase{ color:var(--text-2); }
  .x-mean{ font-size:15px; color:var(--text-2); }
  .x-src{ font-size:12.5px; color:var(--faint); }
  .x-tag{ display:inline-block; margin-right:6px; padding:0 6px; border-radius:6px; font-size:11.5px; font-weight:600; border:1px dashed var(--faint); }
  .x-extra-note{ margin:6px 0 0; font-size:13px; color:var(--faint); }

  .st{
    flex:none; display:inline-flex; align-items:center; gap:4px;
    height:26px; padding:0 10px; border-radius:999px;
    font-size:12.5px; font-weight:600; white-space:nowrap;
  }
  .st svg{ width:12px; height:12px; }
  .st-new{ color:var(--faint); border:1px solid var(--line); }
  .st-learning{ color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent-line); }
  .st-mastered{ color:var(--on-accent); background:var(--accent); }

  /* 상세: 학습하기 / 연습장 */
  .study-box{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:16px 0 4px; padding:12px 14px; border-radius:16px; background:var(--bg-2); }
  .study-box.col{ flex-direction:column; align-items:stretch; gap:0; }
  .study-box .note{ margin-top:8px; }
  .study-due{ flex:1; font-size:14px; color:var(--text-2); }
  .study-stop{ font-size:13.5px; font-weight:600; color:var(--muted); padding:6px 10px; border-radius:999px; border:1px solid var(--line); }
  .study-start{ width:100%; color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .study-start:disabled{ color:var(--muted); background:var(--bg-3); }
  .practice{ margin-top:26px; padding-top:6px; border-top:1px solid var(--line); }
  .practice .w-copy{ margin-top:8px; }
  .practice .w-label{ margin-top:18px; }
  .note-past{ margin-top:14px; }
  .note-past details{ border-bottom:1px solid var(--line); }
  .note-past summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:12px 2px; }
  .note-past summary::-webkit-details-marker{ display:none; }
  .note-past details[open] .h-chev{ transform:rotate(180deg); }
  .note-past .h-text{ margin-bottom:12px; }
  .go-card{ width:100%; margin-top:26px; }
  /* "이 표현 연습하기"(표현 상세·복습 화면): 시작 화면 없이 연습 모드로 */
  .pc-expr{ width:100%; margin-top:14px; gap:8px; color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  .pc-expr svg{ width:19px; height:19px; flex:none; }
  .pc-expr small{ font-size:12.5px; font-weight:500; color:var(--muted); }

  /* 복습 */
  .rv-cue{ margin-top:10px; padding:18px 16px; border-radius:18px; background:var(--bg-2); }
  .rv-cue-label{ font-size:12.5px; font-weight:700; letter-spacing:.06em; color:var(--accent); }
  .rv-cue-mean{ margin:8px 0 0; font-size:24px; font-weight:700; line-height:1.35; }
  .rv-cue-sit{ margin:10px 0 0; font-size:14.5px; line-height:1.6; color:var(--muted); }
  .rv-cue-line{ margin:10px 0 0; font-size:16px; line-height:1.6; color:var(--text-2); }
  .rv-reveal{
    width:100%; margin-top:14px; padding:26px 16px; border-radius:18px;
    font-size:16px; font-weight:600; color:var(--accent);
    border:1.5px dashed var(--accent-line); background:var(--accent-soft);
  }
  .rv-answer{ margin-top:14px; padding:16px; border-radius:18px; border:1px solid var(--accent-line); background:var(--accent-soft); animation:fadeIn .3s ease both; }
  .rv-phrase{ margin:0; font-size:24px; font-weight:750; color:var(--accent); }
  .rv-line{ margin:8px 0 0; font-size:16.5px; line-height:1.6; }
  .rv-more-sec{ margin-top:10px; border-bottom:1px solid var(--line); }
  .rv-more-sec > summary{ cursor:pointer; padding:12px 2px; font-size:15px; font-weight:600; color:var(--text-2); }
  .rv-btn-main{ width:100%; color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .grade-row .btn{ height:52px; font-size:16.5px; }
  .grade-no{ color:var(--text-2); }

  /* ---------- 드라이브 모드: 상황 카드 위쪽 버튼 → 전체 화면(시작 화면 → 재생 화면) ---------- */
  /* 드라이브·연습 버튼(상황 카드 위쪽, 나란히). 좁은 화면(360px)에선 아이콘만 */
  .drive-btn{
    display:flex; align-items:center; gap:3px; flex:none;
    height:34px; padding:0 8px 0 6px; margin-right:3px; border-radius:999px; white-space:nowrap;

  .drive{ position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; background:var(--bg); color:var(--text); }

  /* 시작 화면 */

  }

  .dv-sbody .seg2{ margin-top:6px; }   /* 내용: 두 번째 줄(대화 없이 — 예문만·썰만) */

  .dv-pre-msg b{ color:var(--accent); }
  .dv-bar{ height:8px; margin-top:12px; border-radius:4px; background:var(--bg-3); overflow:hidden; }
  .dv-bar i{ display:block; height:100%; width:0; border-radius:4px; background:var(--accent); transition:width .3s ease; }
  .dv-sfoot{
    flex:none; display:flex; flex-direction:column; gap:8px;
    padding:10px max(var(--pad), env(safe-area-inset-right)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(var(--pad), env(safe-area-inset-left));
    border-top:1px solid var(--line);
  }
  .dv-sum{ font-size:13.5px; color:var(--faint); text-align:center; font-variant-numeric:tabular-nums; }

  .dv-go .main small{ max-width:100%; padding:0 8px; font-size:12.5px; font-weight:500; opacity:.85; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dv-go .btn:disabled{ opacity:.4; }

  /* 재생 화면: 위 = 지금 위치, 가운데 = 지금 문장(크게, 노래방 채우기) + 앞뒤 문장(흐리게), 아래 = 큰 버튼 4개 */
  .dv-ptop{
    flex:none; display:flex; align-items:flex-start; gap:2px;
    padding:calc(env(safe-area-inset-top, 0px) + 8px) max(var(--pad), env(safe-area-inset-right)) 0 calc(max(var(--pad), env(safe-area-inset-left)) - 12px);
  }
  .dv-ptop .dv-x{ width:38px; height:38px; }
  .dv-loc{ flex:1; min-width:0; padding-top:2px; }

  .dv-loc1{ font-size:13.5px; color:var(--muted); }
  .dv-loc2{ margin-top:1px; font-size:15.5px; font-weight:650; color:var(--accent); }
  .dv-stage{
    flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:20px;
    padding:14px max(var(--pad), env(safe-area-inset-right)) 10px max(var(--pad), env(safe-area-inset-left));
  }
  .dv-prev, .dv-next{ flex:none; font-size:17px; line-height:1.45; color:var(--faint); }
  .dv-prev .dv-en, .dv-next .dv-en{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .dv-prev .dv-ko, .dv-next .dv-ko, .dv-prev .dv-who, .dv-next .dv-who{ display:none; }
  .dv-prev .sc.reading .w{ opacity:1; }   /* 방금 끝난 문장의 채우기 표시가 흐린 줄에서는 보이지 않게 */
  .dv-scroll{
    flex:0 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none;
    padding:8px 0 20px; margin:-8px 0 -20px;   /* 위아래 흐려지는 자리만큼 여백 (짧은 문장은 흐려지지 않게) */
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 8px, #000 calc(100% - 20px), transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0, #000 8px, #000 calc(100% - 20px), transparent 100%);
  }
  .dv-scroll::-webkit-scrollbar{ display:none; }
  .dv-cur .dv-line{ animation:dvIn .35s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes dvIn{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
  .dv-who{ margin-bottom:8px; font-size:13.5px; font-weight:700; letter-spacing:.02em; color:var(--faint); }
  .dv-line.me .dv-who{ color:var(--accent); }
  .dv-cur .dv-en{ font-size:29px; line-height:1.38; font-weight:600; letter-spacing:-.01em; }
  .dv-cur .dv-line.long .dv-en{ font-size:21px; line-height:1.6; font-weight:500; }
  .dv-cur .dv-line.k-phrase .dv-en{ font-size:32px; color:var(--accent); }
  .dv-cur .dv-ko{ margin-top:12px; font-size:16px; line-height:1.6; color:var(--muted); }
  .dv-en mark{ font-weight:inherit; }
  .dv-note{ flex:none; min-height:22px; text-align:center; font-size:14px; color:var(--faint); }
  .dv-echo{ display:flex; flex-direction:column; align-items:center; gap:7px; color:var(--accent); font-weight:600; }
  .dv-echo i{ display:block; width:140px; height:5px; border-radius:3px; background:var(--accent-soft); overflow:hidden; }
  .dv-echo b{ display:block; height:100%; width:100%; border-radius:3px; background:var(--accent); transform-origin:left; animation:dvEcho linear both; }
  @keyframes dvEcho{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
  .dv-ctl{
    flex:none; display:grid; grid-template-columns:1fr 1.45fr 1fr; gap:10px;
    padding:6px max(var(--pad), env(safe-area-inset-right)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(var(--pad), env(safe-area-inset-left));
  }
  .dv-b{
    height:86px; border-radius:22px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    font-size:13.5px; font-weight:600; color:var(--text);

  }

  .dv-b.main svg{ width:38px; height:38px; }

  /* ---------- 연습 모드(청크·연음·발음): 상황 카드 위쪽 [연습] → 시작 화면 → 연습 화면(한 문장씩) ----------
     시작 화면은 드라이브 모드 시작 화면과 같은 클래스(.dv-head·.dv-sbody·.dv-opt·.dv-sfoot …)를 그대로 씀.
     연습 화면: 위 = 작은 ✕ + 위치 두 줄("카페에서 주문하기 · 1/2" / "대화 2/6 · 청크 1/3"), 가운데 = 문장(청크 사이 슬래시, 지금 청크 강조,
     연음은 단어 사이 작은 호) + 괄호 속 한국어 뜻 + 한글 해석 + 발음 팁, 아래 = [이전] [한 번 더 듣기] [속도] [다음] (상황 카드 쉐도잉과 같은 버튼 모양) */
  .pc-mode{ position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; background:var(--bg); color:var(--text); }
  .pc-mode[hidden]{ display:none; }
  body.practicing .toast{ bottom:calc(env(safe-area-inset-bottom, 0px) + 120px); }
  .dv-opt.wide{ grid-column:1 / -1; }
  .dv-opt.wide small{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pc-loc2{ display:flex; gap:5px; }
  .pc-loc2 .lab{ min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .pc-loc2 .stp{ flex:none; }
  .pc-opt{   /* 연습 화면 오른쪽 위 [옵션] → 시작 화면(범위·내용·이어 하기). 위치 줄이 덜 잘리게 아이콘만 */
    flex:none; align-self:center; margin-left:6px; width:36px; height:36px; border-radius:50%;
    display:grid; place-items:center; color:var(--muted); background:var(--bg-2); border:1px solid var(--line);
  }
  .pc-opt svg{ width:19px; height:19px; }
  .pc-opt:active{ background:var(--line); }
  .pc-scroll{
    flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none;
    display:flex; flex-direction:column;
    padding:10px max(var(--pad), env(safe-area-inset-right)) 18px max(var(--pad), env(safe-area-inset-left));
  }
  .pc-scroll::-webkit-scrollbar{ display:none; }
  .pc-inner{ margin:auto 0; padding:6px 0; }   /* 짧으면 가운데, 길면 위에서부터 스크롤 */
  .pc-line{ animation:dvIn .35s cubic-bezier(.2,.8,.2,1) both; }
  .pc-steps{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px; }
  .pc-steps[hidden]{ display:none; }
  .pc-st{
    height:28px; min-width:28px; padding:0 9px; border-radius:999px;
    font-size:12.5px; font-weight:700; color:var(--faint); font-variant-numeric:tabular-nums;
    background:var(--bg-2); border:1px solid var(--line);
    transition:background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  .pc-st.done{ color:var(--accent); border-color:var(--accent-line); }
  .pc-st.now{ color:var(--on-accent); background:var(--accent); border-color:transparent; }
  .pc-who{ margin-bottom:8px; font-size:13.5px; font-weight:700; letter-spacing:.02em; color:var(--faint); }
  .pc-who.me{ color:var(--accent); }
  .pc-en{ font-size:28px; line-height:1.55; font-weight:600; letter-spacing:-.01em; -webkit-user-select:none; user-select:none; }
  .pc-en.long{ font-size:24px; }
  .pc-en .sc .w{ cursor:pointer; }
  /* 청크: 슬래시로 구분. 청크 단계에서는 지금 청크만 또렷하게(테두리), 나머지는 흐리게 */
  .ck{
    border-radius:10px; padding:1px 4px; margin:0 -4px;
    -webkit-box-decoration-break:clone; box-decoration-break:clone;
    transition:opacity .25s ease, background-color .25s ease, box-shadow .25s ease;

function esc(s) {

}
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function hueOf(category) {
  if (category in CATEGORY_HUE) return CATEGORY_HUE[category];
  let h = 0;
  for (const ch of String(category)) h = (h * 31 + ch.charCodeAt(0)) % 360;

/* 예문·썰에서 표현 부분을 형광펜으로 (밑줄과 같은 규칙으로 찾음) → 겹치지 않는 범위 [{ s, e, open, close }] */
function markRanges(text, ex) {
  const found = [];
  exprSources(ex).forEach(src => {
    const re = new RegExp(src, "gi");
    let m;
    while ((m = re.exec(text))) {
      if (!m[0].length) { re.lastIndex++; continue; }
      found.push([m.index, m.index + m[0].length]);
    }
  });
  found.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
  const out = [];
  let pos = 0;
  found.forEach(r => {
    if (r[0] < pos) return;
    out.push({ s: r[0], e: r[1], open: "<mark>", close: "</mark>" });
    pos = r[1];
  });
  return out;
}
/* 재생하지 않는 글(복습 답의 대사)용: 형광펜만 */
function decorate(text, ex) {
  let html = "", pos = 0;
  markRanges(text, ex).forEach(r => {
    html += esc(text.slice(pos, r.s)) + "<mark>" + esc(text.slice(r.s, r.e)) + "</mark>";
    pos = r.e;
  });
  return html + esc(text.slice(pos));
}

function buzz() {
  try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) { /* 지원 안 하면 무시 */ }
}

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2800);
}

/* ---------- 핵심 표현 찾기: phrase의 ~ 자리는 아무 단어, forms는 활용형(예: stayed in) ---------- */
function patternSource(p) {
  const parts = String(p).split("~")
    .map(s => s.trim().replace(/^[\s,.!?]+|[\s,.!?]+$/g, ""))
    .filter(Boolean);
  if (!parts.length) return null;
  let src = parts.map(reEsc).join(".{1,40}?");
  if (/^\w/.test(parts[0])) src = "\\b" + src;
  if (/\w$/.test(parts[parts.length - 1])) src += "\\b";
  return src;
}
function exprSources(e) {
  return [e.phrase].concat(e.forms || []).map(patternSource).filter(Boolean);
}
function exprFound(e, text) {
  return exprSources(e).some(src => new RegExp(src, "i").test(text));
}
/* 대사 안의 핵심 표현에 밑줄(누르면 예문·썰) */
/* 밑줄 규칙
   ① 한 카드 안에서 같은 표현은 처음 나온 대사에만 밑줄 (used: 이 카드에서 이미 그은 표현 번호)
   ② 앱 전체에서 같은 표현은 처음 나온 카드(id 순)에서만 밑줄 (EXPR_OWNER)
   ③ 한 대사 안에서 밑줄끼리 겹치거나 붙어 있으면 뒤의 것은 긋지 않음 */
function normPhrase(p) {
  return String(p).toLowerCase().replace(/[~.,!?'’]/g, "").replace(/\s+/g, " ").trim();
}
const EXPR_OWNER = {};
CARDS.forEach((c, ci) => (c.expressions || []).forEach(e => {
  const k = normPhrase(e.phrase);
  if (!(k in EXPR_OWNER)) EXPR_OWNER[k] = ci;
}));

function findRanges(text, card, ci, used) {
  const found = [];
  (card.expressions || []).forEach((e, ei) => {
    if (used && used.has(ei)) return;
    if (EXPR_OWNER[normPhrase(e.phrase)] !== ci) return;
    let best = null;
    exprSources(e).forEach(src => {
      const m = new RegExp(src, "i").exec(text);
      if (m && m[0].length && (!best || m.index < best.s)) best = { s: m.index, e: m.index + m[0].length, ei };
    });
    if (best) found.push(best);
  });
  found.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const out = [];
  let pos = 0;
  found.forEach(r => {
    if (r.s < pos) return;                                              // 겹침
    if (out.length && /^[\s,.!?'"“”’-]*$/.test(text.slice(pos, r.s))) return;   // 바로 붙어 있음
    out.push(r);
    pos = r.e;
  });
  return out;
}

/* 추가 표현(extraExpressions): 핵심 밑줄과 겹치지 않는 자리에, 카드 안에서 처음 나온 곳에만 연한 점선 밑줄 */
function extraRanges(text, card, taken, usedX) {
  const out = [];
  (card.extraExpressions || []).forEach((e, ei) => {
    if (usedX.has(ei)) return;
    for (const src of exprSources(e)) {
      const m = new RegExp(src, "i").exec(text);
      if (!m || !m[0].length) continue;
      const r = { s: m.index, e: m.index + m[0].length, ei, kind: "extra" };
      if (taken.concat(out).some(x => r.s < x.e && x.s < r.e)) continue;
      out.push(r);
      usedX.add(ei);
      break;
    }
  });
  return out;
}

/* ================= 인터랙티브 스크립트 ① 글 준비·그리기 (대화문·예문·썰 공통) =================
   getScript(text) → 문장 하나의 정보(같은 글은 한 번만 만듦, SCRIPTS[id]에 보관)
     { id, text: 화면에 보이는 글, speech: 음성으로 보낼 글(괄호 속 한국어 뜻 "(어색한)"은 뺌),
       words: [{ pieces: [[화면 시작, 끝]...], ss, se: speech 안의 시작·끝 }], wordAt(speech 위치) → 단어 번호 }
   scriptHtml(text, ranges) → <span class="sc" data-sc="id"> 안에 단어마다 <span class="w" data-w="번호">.
     밑줄·형광펜(ranges: [{ s, e, open, close }])은 단어 span 바깥에 씌움. 괄호 속 한국어는 <span class="gloss">(단어 아님)
     opts.links: 연음 표시할 공백 위치(Set) → <span class="lk">(줄바꿈 안 되는 공백 + 아래 작은 호, 연습 모드). 화면 표시만 바뀌고 읽을 글은 그대로 */
const SCRIPTS = [];
const SCRIPT_BY_TEXT = new Map();
const GLOSS_RE = /\s*\([^()]*[가-힣ㄱ-ㅎㅏ-ㅣ][^()]*\)/g;

function getScript(text) {
  text = String(text || "");
  if (SCRIPT_BY_TEXT.has(text)) return SCRIPT_BY_TEXT.get(text);
  const n = text.length;
  const gloss = new Uint8Array(n);
  GLOSS_RE.lastIndex = 0;
  let m;
  while ((m = GLOSS_RE.exec(text))) for (let i = m.index; i < m.index + m[0].length; i++) gloss[i] = 1;
  /* 화면 글자 → 읽을 글 위치 (괄호 속 한국어는 -1) */
  const d2s = new Int32Array(n);
  let speech = "";
  for (let i = 0; i < n; i++) {
    if (gloss[i]) { d2s[i] = -1; continue; }
    d2s[i] = speech.length;
    speech += text[i];
  }
  /* 단어 = 공백·괄호 뜻으로 끊긴 글자 덩어리. 글자·숫자가 없는 덩어리(“, — 등)는 앞 단어에 붙임 */
  const toks = [];
  let cur = null;
  for (let i = 0; i < n; i++) {
    if (gloss[i] || /\s/.test(text[i])) { cur = null; continue; }
    if (cur) cur.e = i + 1;
    else { cur = { s: i, e: i + 1 }; toks.push(cur); }
  }
  const words = [];
  let lead = [];                                     // 맨 앞의 글자 없는 덩어리는 다음 단어에 붙임
  toks.forEach(t => {
    const p = [t.s, t.e];
    if (/[A-Za-z0-9]/.test(text.slice(t.s, t.e))) { words.push({ pieces: lead.concat([p]) }); lead = []; }
    else if (words.length) words[words.length - 1].pieces.push(p);
    else lead.push(p);
  });
  if (lead.length) words.push({ pieces: lead });
  const wAt = new Int32Array(n).fill(-1);
  const sp2w = new Int32Array(speech.length).fill(-1);
  words.forEach((w, k) => {
    w.pieces.forEach(p => { for (let i = p[0]; i < p[1]; i++) { wAt[i] = k; if (d2s[i] >= 0) sp2w[d2s[i]] = k; } });
    w.ss = d2s[w.pieces[0][0]];
    w.se = d2s[w.pieces[w.pieces.length - 1][1] - 1] + 1;
  });
  for (let i = 1; i < sp2w.length; i++) if (sp2w[i] < 0) sp2w[i] = sp2w[i - 1];   // 공백은 앞 단어로
  const sc = {
    id: SCRIPTS.length, text, speech, words, wAt, gloss,
    wordAt: i => (i >= 0 && i < sp2w.length ? Math.max(0, sp2w[i]) : (i >= sp2w.length ? words.length - 1 : 0))
  };
  SCRIPTS.push(sc);
  SCRIPT_BY_TEXT.set(text, sc);
  return sc;
}

function scriptHtml(text, ranges, opts) {
  const sc = getScript(text);
  const t = sc.text, n = t.length;
  const links = opts && opts.links;
  const list = (ranges || []).slice().sort((a, b) => a.s - b.s);
  const rAt = new Int32Array(n).fill(-1);
  list.forEach((r, ri) => { for (let i = r.s; i < r.e && i < n; i++) if (rAt[i] < 0) rAt[i] = ri; });
  let html = '<span class="sc" data-sc="' + sc.id + '">';
  let curR = -1, curW = -1, curG = 0;
  const closeIn = () => { if (curW >= 0 || curG) html += "</span>"; curW = -1; curG = 0; };
  for (let i = 0; i < n; i++) {
    const r = rAt[i], w = sc.wAt[i], g = sc.gloss[i];
    if (r !== curR) {
      closeIn();
      if (curR >= 0) html += list[curR].close;
      if (r >= 0) html += list[r].open;
      curR = r;
    }
    if (w !== curW || g !== curG) {
      closeIn();
      if (g) { html += '<span class="gloss">'; curG = 1; }
      else if (w >= 0) { html += '<span class="w" data-w="' + w + '">'; curW = w; }
    }
    html += links && links.has(i) ? '<span class="lk">&nbsp;</span>' : esc(t[i]);
  }
  closeIn();
  if (curR >= 0) html += list[curR].close;
  return html + "</span>";
}

/* 대사의 밑줄 범위 → scriptHtml용 */
function xpRanges(ranges, ci) {
  return ranges.map(r => ({
    s: r.s, e: r.e, close: "</span>",
    open: '<span class="xp' + (r.kind === "extra" ? " xp-x" : "") + '" data-c="' + ci + '" data-e="' + r.ei + '" data-k="' + (r.kind || "core") + '">'
  }));
}

/* used / usedX: 이 카드에서 이미 밑줄 그은 핵심 / 추가 표현 번호 */
function markExpressions(text, card, ci, used, usedX) {
  const core = findRanges(text, card, ci, used);
  core.forEach(r => used.add(r.ei));
  return scriptHtml(text, xpRanges(core.concat(extraRanges(text, card, core, usedX)), ci));
}

/* ---------- 대사 한 줄 그리기 (세 모드 공통. 나중에 드라이브 모드·인터랙티브 스크립트도 이걸 씀) ----------
   말풍선 안: .en(영어 + 밑줄) / .kq(읽기 모드에서 아직 확인 안 한 내 대사의 한글)
   말풍선 아래: .ko(작은 한글 해석). 무엇을 보일지는 CSS 클래스가 정하므로, 모드가 바뀌어도 이 HTML은 그대로 */
function whoLabel(who) {
  return who === "me" ? "나" : (WHO_LABEL[who] || "상대");
}
function renderLine(line, li, enHtml, flags) {

  return '<div class="row ' + (me ? "me" : "them") + (flags.firstThem ? " first-them" : "") + '" data-l="' + li + '">' +
    '<span class="who">' + esc(whoLabel(line.who)) + '</span>' +
    '<div class="line">' +
      '<div class="bubble">' +
        '<span class="en" lang="en">' + enHtml + '</span>' +
        (me ? '<span class="kq">' + esc(line.ko || "") + '</span>' : "") +
      '</div>' +
      '<button class="spk" type="button" aria-label="이 줄 듣기">' + ICON_SPEAKER + '</button>' +
    '</div>' +
    (line.ko ? '<div class="ko">' + esc(line.ko) + '</div>' : "") +
    (flags.hint ? '<div class="hint">탭하면 영어로 바뀌어요</div>' : "") +
  '</div>';
}

/* 카드 하나의 대화 전체 (밑줄 규칙 때문에 위에서부터 차례로 그림). 모드와 상관없이 같은 HTML */
function chatHtml(card, ci) {
  const used = new Set(), usedX = new Set();
  let firstThem = true, firstMe = true;
  return (card.dialogue || []).map((line, li) => {
    const me = line.who === "me";
    const flags = { firstThem: !me && firstThem, hint: me && firstMe };
    if (me) firstMe = false; else firstThem = false;
    return renderLine(line, li, markExpressions(line.en || "", card, ci, used, usedX), flags);
  }).join("");
}
const CHAT_HTML = CARDS.map(chatHtml);

/* 카드의 상대 화자(카드마다 한 명) 이름표: WHO_LABEL에서. 없으면 "상대" */

  const line = (card.dialogue || []).find(l => l.who !== "me");
  return whoLabel(line ? line.who : "");
}

/* ---------- 듣기 모드의 두 사람 아이콘 (정답 확인 전에만 보임) ---------- */

/* ---------- 음성 캐시 (한 번 만든 ElevenLabs 음성은 폰에 저장해서 재사용) ---------- */
const AudioCache = (() => {
  const mem = new Map();
  let dbp = null;
  function db() {
    if (!dbp) {
      dbp = new Promise(res => {
        try {
          const r = indexedDB.open("engcards-tts", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("audio");
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(null);
        } catch (e) { res(null); }
      });
    }
    return dbp;
  }
  async function get(k) {
    if (mem.has(k)) return mem.get(k);
    const d = await db();
    if (!d) return null;
    return new Promise(res => {
      try {
        const q = d.transaction("audio").objectStore("audio").get(k);
        q.onsuccess = () => { const b = q.result || null; if (b) mem.set(k, b); res(b); };
        q.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  async function put(k, blob) {
    mem.set(k, blob);
    const d = await db();
    if (!d) return;
    try { d.transaction("audio", "readwrite").objectStore("audio").put(blob, k); } catch (e) {}
  }
  async function clear() {
    mem.clear();
    const d = await db();
    if (!d) return;
    try { d.transaction("audio", "readwrite").objectStore("audio").clear(); } catch (e) {}
  }
  /* 타임스탬프까지 있는 새 형식으로 저장돼 있는지만 확인 (메모리에 올려 두지 않음 — 드라이브 모드 '미리 받아두기' 개수 세기용) */
  async function has(k) {
    const m = mem.get(k);
    if (m) return m.audio instanceof Blob;
    const d = await db();
    if (!d) return false;
    return new Promise(res => {
      try {
        const q = d.transaction("audio").objectStore("audio").get(k);
        q.onsuccess = () => res(!!(q.result && q.result.audio instanceof Blob));
        q.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  }
  return { get, put, clear, has };
})();

/* ---------- 음성 재생 ---------- */
const Player = (() => {
  const audio = new Audio();
  let token = 0;
  let currentBtn = null;
  let queue = Promise.resolve();
  let deviceVoice = null;
  let warnedNoKey = false;

  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      const us = vs.filter(v => /en[-_]US/i.test(v.lang));
      deviceVoice = us.find(v => /google|samsung/i.test(v.name)) || us[0] || vs.find(v => /^en/i.test(v.lang)) || null;
    } catch (e) { deviceVoice = null; }
  }
  try {
    if ("speechSynthesis" in window) {
      pickVoice();
      speechSynthesis.addEventListener("voiceschanged", pickVoice);
    }
  } catch (e) {}

  function mark(btn, on) { if (btn) btn.classList.toggle("playing", on); }

  /* 재생 / 일시정지 / 정지가 바뀔 때 알림 (듣기 모드 버튼 모양 등) */
  const subs = [];
  function onChange(fn) { subs.push(fn); }
  function emit() { subs.forEach(fn => { try { fn(); } catch (e) {} }); }

  /* 일시정지 상태: 재생 중이던 줄을 멈춰 두고, resume()에서 이어서(내장 음성은 그 줄 처음부터) 재생 */
  let paused = false;
  let resumeFn = null;
  let audioCtl = null;    // 지금 재생 중인 mp3 { finish }
  let speechCtl = null;   // 지금 읽는 중인 내장 음성 { halt, restart, finish }
  let lastLen = 0;        // 바로 앞 문장을 끝까지 읽는 데 걸린 시간(초, 재생 속도 반영) — 드라이브 모드 '따라 말할 시간'
  let selfPause = false;  // 앱이 직접 audio.pause()를 부른 것(아래 'pause' 이벤트에서 끊김과 구분)

  function quietPause() {
    try { if (!audio.paused) { selfPause = true; audio.pause(); } } catch (e) {}
  }

  /* 앱이 멈춘 게 아닌데 소리가 끊김(전화·다른 앱 소리·백그라운드에서 재생 거부): 일시정지 상태로 바꾸고 알림.
     이어 듣기를 누르면 그 자리부터. 드라이브 모드는 onInterrupt를 받아 '그 문장 처음에서 일시정지'로 바꿈 */
  const intSubs = [];
  function onInterrupt(fn) { intSubs.push(fn); }
  function interrupted() {
    if (!paused) {
      paused = true;
      const ctl = audioCtl;
      resumeFn = ctl ? () => { const p = audio.play(); if (p && p.catch) p.catch(ctl.finish); } : (speechCtl ? speechCtl.restart : null);

  function stop() {

    resumeFn = null;

  function pause() {

  /* mp3 재생. o: { sc, times(단어별 {s,e} 초), track, startAt(초), startFrac(타이밍이 없을 때 0~1 비율),
       endAt(초) / endFrac(비율): 여기서 멈춤(구간 재생), fade(초): 구간 시작·끝에서 소리를 부드럽게 키우고 줄임, wordFrom·wordTo: 이 범위 밖 단어는 강조 안 함 }

      let endTimer = 0;

      const segEnd = () => {
        lastLen = Math.max(0, segB - segA) / (audio.playbackRate || rate);

      };
      /* 구간 끝 예약(화면 갱신이 느려져도 끝을 넘지 않게): 재생 시작·이어 듣기·속도 바뀜마다 남은 시간으로 다시 맞춤 */

  /* 내장 음성. 긴 글은 안드로이드에서 중간에 끊길 수 있어서 문장 단위로 나눠 읽음.

  /* ElevenLabs: 오디오 + 문자별 타임스탬프(/with-timestamps)를 함께 받아 AudioCache에 { audio, align }로 저장.

  const clipKey = (text, voice) => [settings.model, voice, text].join("|");

    const p = requestEleven(text, voice, key);

  async function requestEleven(text, voice, key) {

    const vs = { stability: 0.5, similarity_boost: 0.75 };

    try {
      res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + encodeURIComponent(voice) + "/with-timestamps?output_format=mp3_44100_128", {
        method: "POST",
        headers: { "xi-api-key": settings.apiKey, "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ text: text, model_id: settings.model, voice_settings: vs })
      });
    } catch (e) {
      throw new Error("ElevenLabs에 연결하지 못했어요");
    }
    if (!res.ok) {
      let code = "", msg = "";
      try { const j = await res.json(); code = (j.detail && (j.detail.status || j.detail.code)) || ""; msg = (j.detail && j.detail.message) || ""; } catch (e) {}
      if (res.status === 401 && /quota/i.test(code + msg)) throw new Error("ElevenLabs 크레딧이 부족해요");
      if (res.status === 401) throw new Error("API 키를 확인해 주세요");
      if (/voice/i.test(code + msg)) throw new Error("목소리 ID를 확인해 주세요");
      throw new Error("ElevenLabs 오류 (" + res.status + ")");
    }
    let j;
    try { j = await res.json(); } catch (e) { throw new Error("ElevenLabs 응답을 읽지 못했어요"); }
    if (!j || !j.audio_base64) throw new Error("ElevenLabs 응답에 음성이 없어요");
    const bin = atob(j.audio_base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const clip = { audio: new Blob([bytes], { type: "audio/mpeg" }), align: j.alignment || null };
    AudioCache.put(key, clip);
    return clip;
  }

  /* 구간 재생 ①(대신 쓰는 방식 — 기본은 아래 ② 잘라 낸 소리): 문장 전체 음성을 재생하다가 from~to 단어 구간에서 멈춤.
     앞뒤로 SEG_PAD만큼 여유를 두되 옆 단어 소리는 넘지 않고, 시작·끝은 SEG_FADE 동안 볼륨을 올리고 내림.

  /* ---- 구간 재생 ② 실제로 잘라 낸 소리 (연습 모드 청크의 기본 방식) ----
     재생 중에 멈추고(pause) 볼륨을 줄이는 ①방식은 폰의 소리 출력 지연(블루투스는 더 큼)만큼 늦게 적용돼서
     끝에 다음 단어 앞소리가 새어 나오고 시작은 잘렸음(2026-10-03 폰에서 확인). 그래서 재생 전에 소리 자체를 잘라 둠:
     문장 mp3를 OfflineAudioContext(44.1kHz)로 PCM으로 풀기만 하고(분석·자르기용, 소리를 내지 않고 출력 장치도 열지 않음),
     단어 경계 근처에서 실제로 소리가 끊긴 곳(쉼)을 찾아 자르고 짧은 페이드를 넣어 같은 44.1kHz·16비트 WAV로 만든 뒤
     상황 카드와 같은 audio 요소로 재생. 쉼이 없는 경계(이어 말하는 곳)는 소리가 가장 작은 지점에서 자름 → 그래도 어색하면 soloChunks */
  const HOP = 0.005;                        // 소리 크기를 재는 간격(초)
  const pcmOf = new WeakMap();              // mp3 Blob → Promise<{ rate, data(모노 Float32Array), env(HOP마다 크기), thr(쉼 기준) }>
  const cutOf = new WeakMap();              // mp3 Blob → Map("from-to" → Promise<{ blob, at }>)
  function decodePcm(blob) {

        const buf = await new OAC(1, 1, 44100).decodeAudioData(await blob.arrayBuffer());
        const n = buf.length, rate = buf.sampleRate, nc = buf.numberOfChannels, data = new Float32Array(n);
        for (let c = 0; c < nc; c++) { const ch = buf.getChannelData(c); for (let i = 0; i < n; i++) data[i] += ch[i] / nc; }
        const hop = Math.max(1, Math.round(rate * HOP)), env = new Float32Array(Math.ceil(n / hop));
        let peak = 0;
        for (let h = 0; h < env.length; h++) {                 // h*HOP초를 가운데로 10ms 창의 RMS
          let s = 0, m = 0;
          for (let i = Math.max(0, h * hop - hop); i < Math.min(n, h * hop + hop); i++) { s += data[i] * data[i]; m++; }
          env[h] = m ? Math.sqrt(s / m) : 0;

        return { rate, data, env, thr: Math.max(peak * 0.015, 1e-4) };  // 가장 큰 소리의 약 -36dB 아래 = 쉼(f·h·th 같은 약한 첫소리는 쉼으로 안 봄)
      })());

    return pcmOf.get(blob);
  }
  /* 단어 p와 p+1 사이에서 자를 곳 → { endL: 앞 청크 끝, startR: 뒤 청크 시작 }(초) */
  function cutPoint(P, times, p) {
    const A = times[p], B = times[p + 1], E = P.env, thr = P.thr;
    const lo = Math.max((A.s + A.e) / 2, Math.min(A.e, B.s) - 0.15);       // 정렬 시간이 조금 어긋나도 찾게 앞뒤로 넉넉히(단어 가운데는 안 넘음)
    const hi = Math.min((B.s + B.e) / 2, Math.max(A.e, B.s) + 0.15);
    const h0 = Math.max(0, Math.floor(lo / HOP)), h1 = Math.min(E.length - 1, Math.ceil(hi / HOP));
    let best = null;                                                         // 가장 긴 쉼
    for (let h = h0; h <= h1; h++) {
      if (E[h] >= thr) continue;
      let k = h;
      while (k + 1 <= h1 && E[k + 1] < thr) k++;

    if (best && (best[1] - best[0]) * HOP >= 0.03) {

      if (sB - sA < 0.08) { const mid = (sA + sB) / 2; return { endL: mid, startR: mid }; }
      return { endL: Math.min(sA + 0.1, sB - 0.03), startR: Math.max(sA + 0.02, sB - 0.06) };   // 앞 단어 끝 울림은 남기고, 뒤 단어 약한 첫소리(h·f)도 담음
    }

  /* PCM 구간 → 16비트 WAV(같은 샘플레이트). 시작·끝 페이드(초) */

    const fi = Math.max(1, Math.round(fin * P.rate)), fo = Math.max(1, Math.round(fout * P.rate));
    for (let i = 0; i < n; i++) {
      let x = s0 + i < P.data.length ? P.data[s0 + i] : 0;
      if (i < fi) x *= i / fi;
      if (n - 1 - i < fo) x *= (n - 1 - i) / fo;
      x = Math.max(-1, Math.min(1, x));
      v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
